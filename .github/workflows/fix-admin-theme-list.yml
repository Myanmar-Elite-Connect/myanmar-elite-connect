name: Fix MEC admin theme list
on:
  push:
    paths:
      - '.github/workflows/fix-admin-theme-list.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin theme choices and previews
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          old="""const UI_THEMES = [\n  ['royal-myanmar','Royal Myanmar','Navy + royal gold'],\n  ['burmese-lacquer','Burmese Lacquer','Lacquer black + gold'],\n  ['shwe-palace','Shwe Palace','Warm palace gold'],\n  ['yangon-heritage','Yangon Heritage','Classic heritage'],\n  ['inle-serenity','Inle Serenity','Calm lake tones'],\n  ['bagan-sunset','Bagan Sunset','Warm sunset mood'],\n  ['thanaka-classic','Thanaka Classic','Natural Myanmar feel'],\n  ['myanmar-silk','Myanmar Silk','Elegant silk tones'],\n  ['jade-myanmar','Jade Myanmar','Jade + gold'],\n  ['modern-myanmar','Modern Myanmar','Clean modern luxury']\n];"""
          new="""const UI_THEMES = [\n  ['original','Original','The original Myanmar Elite Connect UI'],\n  ['shwedagon','Shwedagon Gold','Shwedagon Pagoda + royal gold'],\n  ['kyaiktiyo','Kyaiktiyo Heritage','Kyaiktiyo Golden Rock'],\n  ['bagan','Bagan Heritage','Bagan temples + warm sand'],\n  ['inle','Inle Serenity','Inle Lake + calm blue'],\n  ['mandalay','Mandalay Palace','Mandalay royal heritage'],\n  ['lacquer','Myanmar Lacquer','Deep lacquer + gold'],\n  ['thanaka','Thanaka Heritage','Natural Myanmar warmth'],\n  ['textile','Myanmar Textile','Traditional-inspired elegance'],\n  ['goldenNight','Golden Pagoda Night','Pagoda night + gold glow'],\n  ['modern','Modern Myanmar','Modern Myanmar heritage']\n];"""
          if old in s:
              s=s.replace(old,new)
          marker=""".ui-theme-preview i{display:block;width:55%;height:9px;border-radius:99px;background:rgba(255,255,255,.75)}"""
          extra=""".ui-theme-preview{background-size:cover;background-position:center}.ui-theme-preview[data-preview=original]{background:linear-gradient(135deg,#071a34,#d7b55b)}.ui-theme-preview[data-preview=shwedagon]{background-image:linear-gradient(rgba(7,20,42,.38),rgba(7,20,42,.38)),url('https://commons.wikimedia.org/wiki/Special:FilePath/Shwedagon-Pagode.jpg?width=700')}.ui-theme-preview[data-preview=kyaiktiyo]{background-image:linear-gradient(rgba(7,18,36,.35),rgba(7,18,36,.35)),url('https://commons.wikimedia.org/wiki/Special:FilePath/Kyaiktiyo%20Pagoda.jpg?width=700')}.ui-theme-preview[data-preview=bagan]{background-image:linear-gradient(rgba(52,29,12,.30),rgba(52,29,12,.30)),url('https://commons.wikimedia.org/wiki/Special:FilePath/Bagan%20Temple.jpg?width=700')}.ui-theme-preview[data-preview=inle]{background-image:linear-gradient(rgba(5,34,48,.28),rgba(5,34,48,.28)),url('https://commons.wikimedia.org/wiki/Special:FilePath/Inle%20Lake%20%28Myanmar%29.jpg?width=700')}.ui-theme-preview[data-preview=mandalay]{background-image:linear-gradient(rgba(50,13,23,.32),rgba(50,13,23,.32)),url('https://commons.wikimedia.org/wiki/Special:FilePath/Mandalay%20Palace%2C%20Myanmar.jpg?width=700')}.ui-theme-preview[data-preview=lacquer]{background:linear-gradient(135deg,#080808,#2b2115)}.ui-theme-preview[data-preview=thanaka]{background-image:linear-gradient(rgba(82,61,35,.25),rgba(82,61,35,.25)),url('https://commons.wikimedia.org/wiki/Special:FilePath/Inle%20Lake%2C%20House%20and%20water%20plants%2C%20Myanmar.jpg?width=700')}.ui-theme-preview[data-preview=textile]{background:linear-gradient(135deg,#101c31,#d6b45e)}.ui-theme-preview[data-preview=goldenNight]{background-image:linear-gradient(rgba(3,12,28,.35),rgba(3,12,28,.35)),url('https://commons.wikimedia.org/wiki/Special:FilePath/Shwedagon%20Pagoda%2C%20Sunlight%2C%20Yangon%2C%20Myanmar.jpg?width=700')}.ui-theme-preview[data-preview=modern]{background-image:linear-gradient(rgba(7,26,52,.35),rgba(7,26,52,.35)),url('https://commons.wikimedia.org/wiki/Special:FilePath/Bagan%2C%20Myanmar%2C%20Htilominlo%20Temple%20and%20other%20Buddhist%20stupas%20in%20Bagan%20plain.jpg?width=700')}"""
          if marker in s and extra not in s:
              s=s.replace(marker,marker+extra)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove installer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "Add original and Myanmar culture themes to admin" || true
          git push
          rm -f .github/workflows/fix-admin-theme-list.yml
          git add .github/workflows/fix-admin-theme-list.yml
          git commit -m "Remove one-shot admin theme patch" || true
          git push

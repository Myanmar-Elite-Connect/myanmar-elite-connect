name: Install site-wide Myanmar UI theme
on:
  push:
    paths:
      - 'mec-theme.js'
      - '.github/workflows/install-mec-theme.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add theme script to every HTML page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          marker='<script src="./mec-theme.js"></script>'
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              if marker not in s and '</head>' in s.lower():
                  pos=s.lower().rfind('</head>')
                  s=s[:pos]+marker+'\n'+s[pos:]
                  p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove installer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Load Myanmar UI theme on all pages" || true
          git push
          rm -f .github/workflows/install-mec-theme.yml
          git add .github/workflows/install-mec-theme.yml
          git commit -m "Remove one-shot theme installer" || true
          git push

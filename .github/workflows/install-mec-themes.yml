name: Install MEC culture themes
on:
  push:
    paths:
      - '.github/workflows/install-mec-themes.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject theme loader into every HTML page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              tag='<script src="./mec-theme.js"></script>'
              if tag not in s and '</head>' in s.lower():
                  idx=s.lower().rfind('</head>')
                  s=s[:idx]+tag+'\n'+s[idx:]
                  p.write_text(s,encoding='utf-8')
                  print('patched',p)
          PY
      - name: Commit HTML theme wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Add site-wide Myanmar culture themes" || true
          git push
      - name: Remove one-shot workflow
        run: |
          rm -f .github/workflows/install-mec-themes.yml
          git add .github/workflows/install-mec-themes.yml
          git commit -m "Remove one-shot theme installer" || true
          git push

name: Standardize navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inject shared navigation loader into app pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              'index.html', 'general.html', 'add-listing.html', 'buy.html', 'sell.html',
              'listing.html', 'listing-detail.html', 'post.html', 'profile.html', 'chat.html',
              'car.html', 'gem.html', 'property.html', 'feedback.html', 'allmarket.html',
              'badge.html', 'kyc.html', 'MCP.html', 'MPC.html'
          ]
          tag = '<script src="./site-nav.js"></script>'

          for name in files:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              if tag not in text and '</head>' in text:
                  text = text.replace('</head>', '  ' + tag + '\n</head>', 1)
                  p.write_text(text, encoding='utf-8')
          PY

      - name: Commit navigation changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Navigation loader already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html general.html add-listing.html buy.html sell.html listing.html listing-detail.html post.html profile.html chat.html car.html gem.html property.html feedback.html allmarket.html badge.html kyc.html MCP.html MPC.html
          git commit -m "Apply shared bottom navigation to app pages"
          git push

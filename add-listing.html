<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Buy • Myanmar Elite Connect</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase.js"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    :root{
      --bg:#f5f7fb;
      --surface:#fff;
      --soft:#f8f9fc;
      --text:#10233f;
      --muted:#77849a;
      --border:rgba(16,35,63,.09);
      --gold:#d8b45c;
      --gold-light:#f4d98a;
      --navy:#071a34;
      --shadow:0 16px 45px rgba(13,35,64,.07);
    }

    body.dark{
      --bg:#071321;
      --surface:#0e1e32;
      --soft:#10243c;
      --text:#f3f6fa;
      --muted:#91a0b4;
      --border:rgba(255,255,255,.09);
      --navy:#f3f6fa;
      --shadow:0 18px 50px rgba(0,0,0,.28);
    }

    body{
      min-height:100vh;
      color:var(--text);
      background:var(--bg);
      font-family:
        Inter,
        "Noto Sans Myanmar",
        "Myanmar Text",
        system-ui,
        sans-serif;
      transition:.3s ease;
    }

    button,
    input,
    select{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    img{
      display:block;
      max-width:100%;
    }


    /* =====================================================
       HEADER
    ===================================================== */

    .topbar{
      position:sticky;
      top:0;
      z-index:100;
      height:70px;
      background:rgba(255,255,255,.88);
      backdrop-filter:blur(18px);
      border-bottom:1px solid var(--border);
    }

    body.dark .topbar{
      background:rgba(7,19,33,.9);
    }

    .topbar-inner{
      width:min(1180px,92%);
      height:100%;
      margin:auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:15px;
      font-weight:900;
      white-space:nowrap;
    }

    .brand img{
      width:38px;
      height:38px;
      object-fit:contain;
      border-radius:11px;
    }

    .brand span{
      color:var(--gold);
    }

    .nav{
      display:flex;
      align-items:center;
      gap:4px;
    }

    .nav a{
      padding:9px 12px;
      border-radius:10px;
      color:var(--muted);
      font-size:12px;
      font-weight:750;
    }

    .nav a:hover,
    .nav a.active{
      color:var(--text);
      background:var(--soft);
    }

    .actions{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .icon-btn{
      width:40px;
      height:40px;
      display:grid;
      place-items:center;
      border:1px solid var(--border);
      border-radius:12px;
      background:var(--surface);
      color:var(--text);
    }

    .profile{
      width:40px;
      height:40px;
      overflow:hidden;
      border-radius:12px;
      border:1px solid var(--border);
      background:var(--soft);
    }

    .profile img{
      width:100%;
      height:100%;
      object-fit:cover;
    }


    /* =====================================================
       PAGE
    ===================================================== */

    .container{
      width:min(1180px,92%);
      margin:auto;
      padding:28px 0 90px;
    }

    .page-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:20px;
      margin-bottom:22px;
    }

    .eyebrow{
      color:var(--gold);
      font-size:10px;
      font-weight:900;
      letter-spacing:1.7px;
    }

    h1{
      margin-top:6px;
      font-size:32px;
      letter-spacing:-.8px;
    }

    .page-head p{
      margin-top:7px;
      color:var(--muted);
      font-size:12px;
    }


    /* =====================================================
       SEARCH / FILTER
    ===================================================== */

    .filter-bar{
      display:grid;
      grid-template-columns:1fr 170px 170px auto;
      gap:9px;
      margin-bottom:24px;
    }

    .field{
      height:45px;
      display:flex;
      align-items:center;
      border:1px solid var(--border);
      border-radius:13px;
      background:var(--surface);
      overflow:hidden;
    }

    .field input,
    .field select{
      width:100%;
      height:100%;
      padding:0 13px;
      border:0;
      outline:0;
      color:var(--text);
      background:transparent;
      font-size:11px;
    }

    .field select{
      cursor:pointer;
    }

    .search-button{
      height:45px;
      padding:0 20px;
      border:0;
      border-radius:13px;
      color:#071a34;
      background:linear-gradient(
        135deg,
        var(--gold-light),
        var(--gold)
      );
      font-size:11px;
      font-weight:900;
    }


    /* =====================================================
       RESULT HEADER
    ===================================================== */

    .result-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:12px;
    }

    .result-count{
      color:var(--muted);
      font-size:11px;
    }

    .sort-select{
      height:34px;
      padding:0 9px;
      border:1px solid var(--border);
      border-radius:9px;
      color:var(--text);
      background:var(--surface);
      outline:0;
      font-size:10px;
    }


    /* =====================================================
       LISTING GRID
    ===================================================== */

    .listing-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:14px;
    }

    .listing-card{
      overflow:hidden;
      border:1px solid var(--border);
      border-radius:18px;
      background:var(--surface);
      box-shadow:var(--shadow);
      transition:
        transform .22s ease,
        box-shadow .22s ease,
        border-color .22s ease;
    }

    .listing-card:hover{
      transform:translateY(-5px);
      box-shadow:
        0 24px 55px rgba(13,35,64,.12);
      border-color:rgba(216,180,92,.38);
    }

    .image-wrap{
      position:relative;
      height:205px;
      background:
        linear-gradient(
          135deg,
          #dfe6ef,
          #b9c7d8
        );
      overflow:hidden;
    }

    .image-wrap img{
      width:100%;
      height:100%;
      object-fit:cover;
      transition:.4s ease;
    }

    .listing-card:hover
    .image-wrap img{
      transform:scale(1.04);
    }

    .condition{
      position:absolute;
      top:11px;
      left:11px;
      padding:5px 8px;
      border-radius:7px;
      color:#071a34;
      background:var(--gold);
      font-size:8px;
      font-weight:900;
    }

    .photo-count{
      position:absolute;
      right:10px;
      bottom:10px;
      padding:5px 8px;
      border-radius:7px;
      color:#fff;
      background:rgba(0,0,0,.58);
      backdrop-filter:blur(8px);
      font-size:9px;
      font-weight:800;
    }

    .card-body{
      padding:14px;
    }

    .category{
      color:var(--gold);
      font-size:8px;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.5px;
    }

    .title{
      margin-top:5px;
      font-size:14px;
      font-weight:900;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .price{
      margin-top:8px;
      font-size:16px;
      font-weight:950;
    }

    .location{
      display:flex;
      align-items:center;
      gap:4px;
      margin-top:6px;
      color:var(--muted);
      font-size:9px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .description{
      margin-top:9px;
      color:var(--muted);
      font-size:10px;
      line-height:1.55;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }

    .card-footer{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      margin-top:12px;
      padding-top:11px;
      border-top:1px solid var(--border);
    }

    .seller{
      color:var(--muted);
      font-size:9px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .detail-link{
      color:var(--gold);
      font-size:9px;
      font-weight:900;
      white-space:nowrap;
    }


    /* =====================================================
       EMPTY / LOADING
    ===================================================== */

    .state{
      grid-column:1/-1;
      min-height:220px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      border:1px dashed var(--border);
      border-radius:18px;
      color:var(--muted);
      background:var(--surface);
    }

    .state-icon{
      width:48px;
      height:48px;
      display:grid;
      place-items:center;
      margin-bottom:12px;
      border-radius:14px;
      color:var(--gold);
      background:var(--soft);
      font-size:20px;
    }

    .state strong{
      color:var(--text);
      font-size:13px;
    }

    .state span{
      margin-top:5px;
      font-size:10px;
    }


    /* =====================================================
       MOBILE NAV
    ===================================================== */

    .mobile-nav{
      display:none;
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:200;
      height:67px;
      background:rgba(255,255,255,.94);
      backdrop-filter:blur(18px);
      border-top:1px solid var(--border);
    }

    body.dark .mobile-nav{
      background:rgba(7,19,33,.95);
    }

    .mobile-nav-inner{
      height:100%;
      display:grid;
      grid-template-columns:repeat(5,1fr);
    }

    .mobile-nav a{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:4px;
      color:var(--muted);
      font-size:9px;
      font-weight:800;
    }

    .mobile-nav a.active{
      color:var(--gold);
    }

    .mobile-icon{
      font-size:17px;
    }


    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media(max-width:1000px){

      .nav{
        display:none;
      }

      .listing-grid{
        grid-template-columns:repeat(3,1fr);
      }

      .filter-bar{
        grid-template-columns:1fr 1fr;
      }

      .search-button{
        width:100%;
      }

      .mobile-nav{
        display:block;
      }

      .container{
        padding-bottom:95px;
      }
    }


    @media(max-width:700px){

      .page-head{
        display:block;
      }

      .filter-bar{
        grid-template-columns:1fr;
      }

      .listing-grid{
        grid-template-columns:repeat(2,1fr);
        gap:9px;
      }

      .image-wrap{
        height:155px;
      }

      .card-body{
        padding:11px;
      }

      .title{
        font-size:12px;
      }

      .price{
        font-size:14px;
      }

      .description{
        font-size:9px;
      }
    }


    @media(max-width:420px){

      .brand-name{
        display:none;
      }

      h1{
        font-size:27px;
      }

      .listing-grid{
        grid-template-columns:1fr 1fr;
      }

      .image-wrap{
        height:135px;
      }

      .location{
        font-size:8px;
      }

      .seller{
        display:none;
      }
    }

  </style>
</head>

  <script>

    /* =====================================================
       THEME
    ===================================================== */

    function applyTheme(theme){

      document.body.classList.toggle(
        "dark",
        theme === "dark"
      );

      document.getElementById(
        "themeButton"
      ).textContent =
        theme === "dark"
          ? "☀"
          : "☾";

      localStorage.setItem(
        "mec_theme",
        theme
      );
    }


    function toggleTheme(){

      const dark =
        document.body.classList.contains(
          "dark"
        );

      applyTheme(
        dark
          ? "light"
          : "dark"
      );

    }


    /* =====================================================
       SAFE HTML
    ===================================================== */

    function escapeHTML(value){

      return String(
        value ?? ""
      )
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");

    }


    /* =====================================================
       FORMAT PRICE
    ===================================================== */

    function formatPrice(price){

      if(
        price === null ||
        price === undefined ||
        price === ""
      ){

        return "Price on request";

      }

      const number =
        Number(price);

      if(
        Number.isNaN(number)
      ){

        return escapeHTML(
          price
        );

      }

      return (
        "MMK " +
        number.toLocaleString()
      );

    }


    /* =====================================================
       LOCATION
       Only region + township + nearby address
    ===================================================== */

    function formatLocation(item){

      const parts = [

        item.region ||
        item.state ||

        "",

        item.township ||
        "",

        item.nearby_address ||
        item.nearby ||
        ""

      ]
      .filter(Boolean);


      return parts.length
        ? parts.join(" · ")
        : "Myanmar";

    }


    /* =====================================================
       AUTH
    ===================================================== */

    async function checkAuth(){

      const {
        data
      } =
        await supabaseClient.auth.getUser();


      if(
        !data ||
        !data.user
      ){

        window.location.replace(
          "./auth.html?mode=login"
        );

        return null;

      }


      return data.user;

    }


    /* =====================================================
       LOAD PROFILE
    ===================================================== */

    async function loadProfile(user){

      const {
        data
      } =
        await supabaseClient
          .from("profiles")
          .select("avatar_url")
          .eq("id",user.id)
          .maybeSingle();


      if(
        data?.avatar_url
      ){

        document.getElementById(
          "avatar"
        ).src =
          data.avatar_url;

      }

    }


    /* =====================================================
       QUERY LISTINGS
    ===================================================== */

    let allListings = [];


    async function loadListings(){

      const {
        data,
        error
      } =
        await supabaseClient
          .from("listings")
          .select("*");


      if(error){

        console.error(
          "Listings error:",
          error
        );

        showState(
          "Unable to load listings",
          "Please check your Supabase listings table."
        );

        return;

      }


      allListings =
        data || [];


      applyFilters();

    }


    /* =====================================================
       FILTER
    ===================================================== */

    function applyFilters(){

      const search =
        document.getElementById(
          "search"
        )
        .value
        .trim()
        .toLowerCase();


      const category =
        document.getElementById(
          "categoryFilter"
        ).value;


      const region =
        document.getElementById(
          "regionFilter"
        ).value;


      let filtered =
        allListings.filter(
          item => {

            const title =
              String(
                item.title ||
                item.name ||
                ""
              ).toLowerCase();


            const description =
              String(
                item.description ||
                ""
              ).toLowerCase();


            const itemCategory =
              item.category ||
              item.type ||
              "";


            const itemRegion =
              item.region ||
              item.state ||
              "";


            const searchMatch =
              !search ||
              title.includes(search) ||
              description.includes(search);


            const categoryMatch =
              !category ||
              itemCategory === category;


            const regionMatch =
              !region ||
              itemRegion === region;


            return (
              searchMatch &&
              categoryMatch &&
              regionMatch
            );

          }
        );


      const sort =
        document.getElementById(
          "sortSelect"
        ).value;


      if(sort === "price_low"){

        filtered.sort(
          (a,b) =>
            Number(a.price || 0) -
            Number(b.price || 0)
        );

      }
      else if(sort === "price_high"){

        filtered.sort(
          (a,b) =>
            Number(b.price || 0) -
            Number(a.price || 0)
        );

      }
      else{

        filtered.sort(
          (a,b) =>
            new Date(
              b.created_at || 0
            ) -
            new Date(
              a.created_at || 0
            )
        );

      }


      renderListings(
        filtered
      );

    }


    /* =====================================================
       RENDER
    ===================================================== */

    function renderListings(
      listings
    ){

      const grid =
        document.getElementById(
          "listingGrid"
        );


      document.getElementById(
        "resultCount"
      ).textContent =
        `${listings.length} listing${
          listings.length === 1
            ? ""
            : "s"
        }`;


      if(!listings.length){

        showState(
          "No listings found",
          "Try another search or category."
        );

        return;

      }


      grid.innerHTML =
        listings
          .map(
            createCard
          )
          .join("");

    }


    /* =====================================================
       CARD
    ===================================================== */

    function createCard(item){

      const id =
        item.id;


      const showPhoto =
        item.show_photo_url ||
        item.cover_url ||
        item.image_url ||
        "";


      const detailPhotos =
        Array.isArray(
          item.detail_images
        )
          ? item.detail_images
          : [];


      const title =
        item.title ||
        item.name ||
        "Untitled Listing";


      const category =
        item.category ||
        item.type ||
        "Marketplace";


      const condition =
        item.condition ||
        "Available";


      const description =
        item.description ||
        "No description available.";


      const location =
        formatLocation(
          item
        );


      const seller =
        item.seller_name ||
        item.owner_name ||
        "Seller";


      return `

        <a
          class="listing-card"
          href="./listing-detail.html?id=${encodeURIComponent(id)}">

          <div class="image-wrap">

            ${
              showPhoto

              ?

              `<img
                src="${escapeHTML(showPhoto)}"
                alt="${escapeHTML(title)}"
                loading="lazy">`

              :

              ``
            }


            <div class="condition">
              ${escapeHTML(condition)}
            </div>


            ${
              detailPhotos.length > 0

              ?

              `<div class="photo-count">
                ${detailPhotos.length + 1} photos
              </div>`

              :

              ``
            }

          </div>


          <div class="card-body">

            <div class="category">
              ${escapeHTML(category)}
            </div>


            <div class="title">
              ${escapeHTML(title)}
            </div>


            <div class="price">
              ${formatPrice(item.price)}
            </div>


            <div class="location">
              <span>⌖</span>
              ${escapeHTML(location)}
            </div>


            <div class="description">
              ${escapeHTML(description)}
            </div>


            <div class="card-footer">

              <div class="seller">
                ${escapeHTML(seller)}
              </div>

              <div class="detail-link">
                View details →
              </div>

            </div>

          </div>

        </a>

      `;

    }


    /* =====================================================
       STATE
    ===================================================== */

    function showState(
      title,
      message
    ){

      document.getElementById(
        "listingGrid"
      ).innerHTML = `

        <div class="state">

          <div class="state-icon">
            ◌
          </div>

          <strong>
            ${escapeHTML(title)}
          </strong>

          <span>
            ${escapeHTML(message)}
          </span>

        </div>

      `;

    }


    /* =====================================================
       FILTER EVENTS
    ===================================================== */

    document.getElementById(
      "filterForm"
    ).addEventListener(
      "submit",
      event => {

        event.preventDefault();

        applyFilters();

      }
    );


    document.getElementById(
      "categoryFilter"
    ).addEventListener(
      "change",
      applyFilters
    );


    document.getElementById(
      "regionFilter"
    ).addEventListener(
      "change",
      applyFilters
    );


    document.getElementById(
      "sortSelect"
    ).addEventListener(
      "change",
      applyFilters
    );


    /* =====================================================
       URL SEARCH
    ===================================================== */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const initialSearch =
      params.get("search");


    if(initialSearch){

      document.getElementById(
        "search"
      ).value =
        initialSearch;

    }


    /* =====================================================
       INIT
    ===================================================== */

    async function init(){

      applyTheme(
        localStorage.getItem(
          "mec_theme"
        ) || "light"
      );


      const user =
        await checkAuth();


      if(!user){

        return;

      }


      await loadProfile(
        user
      );


      await loadListings();

    }


    init();

  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="my">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Myanmar Elite Connect - Add Listing</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="./supabase.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f6f9;
      color: #222;
      font-family:
        Arial,
        "Noto Sans Myanmar",
        sans-serif;
    }

    header {
      background: #071b3a;
      color: white;
      padding: 18px;
    }

    .header-inner {
      max-width: 800px;
      margin: auto;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 21px;
      font-weight: bold;
    }

    .home-link {
      color: white;
      text-decoration: none;
    }

    .container {
      max-width: 720px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 28px;

      box-shadow:
        0 5px 25px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
      color: #071b3a;
    }

    .subtitle {
      color: #666;
      line-height: 1.6;
    }

    label {
      display: block;

      margin-top: 18px;
      margin-bottom: 7px;

      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;

      padding: 13px;

      border: 1px solid #d7dce5;

      border-radius: 9px;

      font-size: 15px;

      font-family: inherit;

      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #071b3a;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    .price-row {
      display: flex;
      gap: 10px;
    }

    .currency {
      max-width: 100px;
      background: #f5f6f8;
    }

    .publish-btn {
      width: 100%;

      margin-top: 25px;

      padding: 15px;

      border: none;

      border-radius: 9px;

      background: #071b3a;

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;
    }

    .publish-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      display: none;

      margin: 18px 0;

      padding: 13px;

      border-radius: 9px;

      line-height: 1.6;

      word-break: break-word;
    }

    .success {
      display: block !important;

      background: #e9f8ef;

      color: #176b38;
    }

    .error {
      display: block !important;

      background: #fff0f0;

      color: #b42318;
    }

    .back {
      display: block;

      margin-top: 20px;

      text-align: center;

      color: #071b3a;

      text-decoration: none;

      font-weight: bold;
    }

    .login-box {
      text-align: center;
      padding: 25px 0;
    }

    .login-button {
      display: inline-block;

      margin-top: 15px;

      padding: 12px 25px;

      background: #071b3a;

      color: white;

      border-radius: 8px;

      text-decoration: none;
    }

    @media(max-width:600px) {

      .card {
        padding: 20px;
      }

      .price-row {
        flex-direction: column;
      }

      .currency {
        max-width: none;
      }

      .brand {
        font-size: 18px;
      }

    }

  </style>

</head>


<body>


<header>

  <div class="header-inner">

    <div class="brand">
      Myanmar Elite Connect
    </div>

    <a
      href="./index.html"
      class="home-link"
    >
      Home
    </a>

  </div>

</header>



<div class="container">

  <div class="card">

    <h1>
      Add New Listing
    </h1>

    <p class="subtitle">
      ကား၊ အိမ်ခြံမြေ၊ ကျောက်မျက်
      ရောင်းဝယ်ရေးအတွက် ကြော်ငြာတင်ပါ။
    </p>


    <div id="message"></div>


    <form id="listingForm">


      <!-- CATEGORY -->

      <label for="category">
        အမျိုးအစား / Category
      </label>

      <select
        id="category"
        required
      >

        <option value="">
          -- ရွေးချယ်ပါ --
        </option>

        <option value="car">
          🚗 ကား / Car
        </option>

        <option value="property">
          🏠 အိမ်ခြံမြေ / Property
        </option>

        <option value="gem">
          💎 ကျောက်မျက် / Gem
        </option>

      </select>



      <!-- TITLE -->

      <label for="title">
        ခေါင်းစဉ် / Title
      </label>

      <input
        id="title"
        type="text"
        placeholder="ဥပမာ - Toyota Alphard 2022"
        required
      >



      <!-- PRICE -->

      <label>
        ဈေးနှုန်း / Price
      </label>

      <div class="price-row">

        <input
          id="price"
          type="number"
          min="0"
          step="0.01"
          placeholder="ဥပမာ - 85000000"
        >

        <input
          class="currency"
          type="text"
          value="MMK"
          readonly
        >

      </div>



      <!-- LOCATION -->

      <label for="location">
        တည်နေရာ / Location
      </label>

      <input
        id="location"
        type="text"
        placeholder="ဥပမာ - Yangon"
      >



      <!-- PHONE -->

      <label for="phone">
        ဖုန်းနံပါတ် / Phone
      </label>

      <input
        id="phone"
        type="tel"
        placeholder="09xxxxxxxxx"
      >



      <!-- DESCRIPTION -->

      <label for="description">
        အသေးစိတ် / Description
      </label>

      <textarea
        id="description"
        placeholder="ပစ္စည်းအကြောင်း အသေးစိတ်ရေးပါ..."
      ></textarea>



      <!-- PUBLISH -->

      <button
        id="publishButton"
        class="publish-btn"
        type="submit"
      >
        Publish Listing
      </button>


    </form>


    <a
      href="./index.html"
      class="back"
    >
      ← Marketplace သို့ပြန်သွားရန်
    </a>


  </div>

</div>



<script>


/* ==========================================
   GET ELEMENTS
========================================== */

const form =
  document.getElementById(
    "listingForm"
  );

const message =
  document.getElementById(
    "message"
  );

const publishButton =
  document.getElementById(
    "publishButton"
  );


/* ==========================================
   MESSAGE
========================================== */

function showMessage(
  text,
  type
) {

  message.textContent = text;

  message.className =
    type;

}


function clearMessage() {

  message.textContent = "";

  message.className = "";

}


/* ==========================================
   GET CURRENT USER
========================================== */

async function getUser() {

  const {
    data,
    error
  } =
    await supabaseClient.auth.getSession();


  if (error) {

    throw error;

  }


  if (
    !data ||
    !data.session ||
    !data.session.user
  ) {

    return null;

  }


  return data.session.user;

}


/* ==========================================
   CHECK LOGIN
========================================== */

async function checkLogin() {

  try {

    const user =
      await getUser();


    if (!user) {

      form.innerHTML = `

        <div class="login-box">

          <h2>
            Login လိုအပ်ပါတယ်
          </h2>

          <p>
            Listing တင်ရန်
            အရင် Login ဝင်ပေးပါ။
          </p>

          <a
            href="./auth.html"
            class="login-button"
          >
            Login / Register
          </a>

        </div>

      `;

    }

  } catch (error) {

    showMessage(
      error.message,
      "error"
    );

  }

}


checkLogin();


/* ==========================================
   SUBMIT
========================================== */

form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    clearMessage();


    publishButton.disabled =
      true;

    publishButton.textContent =
      "Publishing...";


    try {


      /* ----------------------------
         USER
      ---------------------------- */

      const user =
        await getUser();


      if (!user) {

        throw new Error(
          "Login ဝင်ထားခြင်းမရှိပါ။"
        );

      }


      /* ----------------------------
         FORM VALUES
      ---------------------------- */

      const category =
        document
          .getElementById(
            "category"
          )
          .value;


      const title =
        document
          .getElementById(
            "title"
          )
          .value
          .trim();


      const priceInput =
        document
          .getElementById(
            "price"
          )
          .value
          .trim();


      const location =
        document
          .getElementById(
            "location"
          )
          .value
          .trim();


      const phone =
        document
          .getElementById(
            "phone"
          )
          .value
          .trim();


      const description =
        document
          .getElementById(
            "description"
          )
          .value
          .trim();


      /* ----------------------------
         VALIDATE
      ---------------------------- */

      if (!category) {

        throw new Error(
          "Category ရွေးပေးပါ။"
        );

      }


      if (!title) {

        throw new Error(
          "Title ထည့်ပေးပါ။"
        );

      }


      /* ----------------------------
         PRICE
      ---------------------------- */

      let price = null;


      if (priceInput !== "") {

        price =
          Number(priceInput);


        if (
          !Number.isFinite(price)
        ) {

          throw new Error(
            "Price မှားနေပါတယ်။"
          );

        }

      }


      /* =================================
         DATABASE DATA

         IMPORTANT:

         user_id
         seller_id
         listing_type
         category

         အားလုံး ထည့်ထားသည်။
      ================================= */

      const listingData = {

        user_id:
          user.id,

        seller_id:
          user.id,

        listing_type:
          category,

        category:
          category,

        title:
          title,

        description:
          description || null,

        price:
          price,

        currency:
          "MMK",

        location:
          location || null,

        phone:
          phone || null,

        status:
          "active"

      };


      console.log(
        "Current User:",
        user
      );


      console.log(
        "Listing Data:",
        listingData
      );


      /* =================================
         INSERT
      ================================= */

      const {
        data,
        error
      } =
        await supabaseClient
          .from("listings")
          .insert(
            listingData
          )
          .select()
          .single();


      /* =================================
         DATABASE ERROR
      ================================= */

      if (error) {

        console.error(
          "Supabase Error:",
          error
        );

        throw error;

      }


      /* =================================
         SUCCESS
      ================================= */

      console.log(
        "Created Listing:",
        data
      );


      showMessage(
        "✅ Listing အောင်မြင်စွာ တင်ပြီးပါပြီ။",
        "success"
      );


      form.reset();


      publishButton.textContent =
        "Published ✓";


      /* Go Home */

      setTimeout(
        function() {

          window.location.href =
            "./index.html";

        },
        1500
      );


    } catch (error) {

      console.error(
        "Listing Error:",
        error
      );


      showMessage(
        "❌ " +
        (
          error.message ||
          "Listing တင်မရပါ။"
        ),
        "error"
      );


    } finally {

      publishButton.disabled =
        false;

      if (
        publishButton.textContent !==
        "Published ✓"
      ) {

        publishButton.textContent =
          "Publish Listing";

      }

    }

  }
);


</script>


</body>

</html>

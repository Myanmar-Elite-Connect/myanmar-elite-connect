<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Listing Details • Myanmar Elite Connect</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase.js"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    :root{
      --bg:#f5f7fb;
      --surface:#fff;
      --soft:#f8f9fc;
      --text:#10233f;
      --muted:#77849a;
      --border:rgba(16,35,63,.09);
      --gold:#d8b45c;
      --gold-light:#f4d98a;
      --navy:#071a34;
      --green:#2d8a61;
      --red:#c94b4b;
      --shadow:0 18px 50px rgba(13,35,64,.07);
    }

    body.dark{
      --bg:#071321;
      --surface:#0e1e32;
      --soft:#10243c;
      --text:#f3f6fa;
      --muted:#91a0b4;
      --border:rgba(255,255,255,.09);
      --navy:#f3f6fa;
      --shadow:0 18px 50px rgba(0,0,0,.28);
    }

    body{
      min-height:100vh;
      color:var(--text);
      background:var(--bg);
      font-family:
        Inter,
        "Noto Sans Myanmar",
        "Myanmar Text",
        system-ui,
        sans-serif;
      transition:.3s ease;
    }

    button,
    input{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    img{
      display:block;
      max-width:100%;
    }


    /* =====================================================
       HEADER
    ===================================================== */

    .topbar{
      position:sticky;
      top:0;
      z-index:100;
      height:70px;
      background:rgba(255,255,255,.88);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      border-bottom:1px solid var(--border);
    }

    body.dark .topbar{
      background:rgba(7,19,33,.9);
    }

    .topbar-inner{
      width:min(1180px,92%);
      height:100%;
      margin:auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:15px;
      font-weight:900;
      white-space:nowrap;
    }

    .brand img{
      width:38px;
      height:38px;
      object-fit:contain;
      border-radius:11px;
    }

    .brand span{
      color:var(--gold);
    }

    .nav{
      display:flex;
      align-items:center;
      gap:4px;
    }

    .nav a{
      padding:9px 12px;
      border-radius:10px;
      color:var(--muted);
      font-size:12px;
      font-weight:750;
    }

    .nav a:hover{
      color:var(--text);
      background:var(--soft);
    }

    .actions{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .icon-btn{
      width:40px;
      height:40px;
      display:grid;
      place-items:center;
      border:1px solid var(--border);
      border-radius:12px;
      color:var(--text);
      background:var(--surface);
    }

    .profile{
      width:40px;
      height:40px;
      overflow:hidden;
      border-radius:12px;
      border:1px solid var(--border);
      background:var(--soft);
    }

    .profile img{
      width:100%;
      height:100%;
      object-fit:cover;
    }


    /* =====================================================
       PAGE
    ===================================================== */

    .container{
      width:min(1180px,92%);
      margin:auto;
      padding:25px 0 80px;
    }

    .back{
      display:inline-flex;
      align-items:center;
      gap:7px;
      margin-bottom:18px;
      color:var(--muted);
      font-size:11px;
      font-weight:800;
    }

    .back:hover{
      color:var(--gold);
    }


    /* =====================================================
       MAIN DETAIL LAYOUT
    ===================================================== */

    .detail-layout{
      display:grid;
      grid-template-columns:minmax(0,1.08fr) minmax(340px,.92fr);
      gap:25px;
      align-items:start;
    }


    /* =====================================================
       PHOTO SECTION
    ===================================================== */

    .photo-panel{
      position:sticky;
      top:92px;
    }

    .main-photo{
      position:relative;
      width:100%;
      height:460px;
      overflow:hidden;
      border-radius:22px;
      background:
        linear-gradient(
          135deg,
          #dfe6ef,
          #b9c7d8
        );
      border:1px solid var(--border);
      box-shadow:var(--shadow);
    }

    .main-photo img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .photo-label{
      position:absolute;
      top:14px;
      left:14px;
      padding:6px 9px;
      border-radius:8px;
      color:#071a34;
      background:var(--gold);
      font-size:8px;
      font-weight:950;
      z-index:2;
    }

    .photo-count{
      position:absolute;
      right:14px;
      bottom:14px;
      padding:6px 9px;
      border-radius:8px;
      color:#fff;
      background:rgba(0,0,0,.58);
      backdrop-filter:blur(8px);
      font-size:9px;
      font-weight:850;
      z-index:2;
    }


    /* =====================================================
       PHOTO GRID
    ===================================================== */

    .photo-grid-title{
      margin:17px 0 10px;
      font-size:12px;
      font-weight:900;
    }

    .photo-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
    }

    .detail-photo{
      position:relative;
      aspect-ratio:1/1;
      overflow:hidden;
      border-radius:14px;
      border:1px solid var(--border);
      background:var(--soft);
      cursor:pointer;
      transition:.2s ease;
    }

    .detail-photo:hover{
      transform:translateY(-2px);
      border-color:rgba(216,180,92,.5);
    }

    .detail-photo img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .detail-photo.active{
      border:2px solid var(--gold);
    }


    /* =====================================================
       INFO
    ===================================================== */

    .info-panel{
      min-width:0;
    }

    .category{
      display:inline-flex;
      padding:6px 9px;
      border-radius:8px;
      color:var(--gold);
      background:rgba(216,180,92,.12);
      font-size:9px;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.5px;
    }

    .title{
      margin-top:10px;
      font-size:clamp(25px,4vw,36px);
      line-height:1.16;
      letter-spacing:-.8px;
      font-weight:950;
    }

    .price{
      margin-top:12px;
      font-size:25px;
      font-weight:950;
    }

    .location{
      display:flex;
      align-items:flex-start;
      gap:8px;
      margin-top:11px;
      padding:11px 12px;
      border-radius:12px;
      color:var(--muted);
      background:var(--soft);
      font-size:10px;
      line-height:1.55;
    }

    .location-icon{
      color:var(--gold);
      font-size:14px;
      flex:none;
    }


    /* =====================================================
       ACTIONS
    ===================================================== */

    .actions-row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:9px;
      margin-top:17px;
    }

    .primary-button,
    .secondary-button{
      height:49px;
      border-radius:13px;
      font-size:11px;
      font-weight:900;
    }

    .primary-button{
      border:0;
      color:#071a34;
      background:
        linear-gradient(
          135deg,
          var(--gold-light),
          var(--gold)
        );
    }

    .secondary-button{
      border:1px solid var(--border);
      color:var(--text);
      background:var(--surface);
    }

    .secondary-button:hover{
      border-color:rgba(216,180,92,.5);
    }


    /* =====================================================
       DETAILS CARD
    ===================================================== */

    .info-card{
      margin-top:18px;
      padding:19px;
      border:1px solid var(--border);
      border-radius:18px;
      background:var(--surface);
      box-shadow:var(--shadow);
    }

    .card-title{
      font-size:14px;
      font-weight:900;
    }

    .info-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:0;
      margin-top:12px;
    }

    .info-item{
      padding:12px 8px;
      border-top:1px solid var(--border);
    }

    .info-label{
      color:var(--muted);
      font-size:9px;
    }

    .info-value{
      margin-top:4px;
      font-size:11px;
      font-weight:800;
    }


    /* =====================================================
       DESCRIPTION
    ===================================================== */

    .description{
      margin-top:18px;
      padding:20px;
      border:1px solid var(--border);
      border-radius:18px;
      background:var(--surface);
      box-shadow:var(--shadow);
    }

    .description-text{
      margin-top:12px;
      color:var(--muted);
      font-size:11px;
      line-height:1.8;
      white-space:pre-line;
    }


    /* =====================================================
       SELLER
    ===================================================== */

    .seller-card{
      display:flex;
      align-items:center;
      gap:12px;
      margin-top:18px;
      padding:16px;
      border:1px solid var(--border);
      border-radius:18px;
      background:var(--surface);
      box-shadow:var(--shadow);
    }

    .seller-avatar{
      width:48px;
      height:48px;
      flex:none;
      overflow:hidden;
      border-radius:14px;
      background:var(--soft);
    }

    .seller-avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .seller-info{
      min-width:0;
      flex:1;
    }

    .seller-name{
      font-size:12px;
      font-weight:900;
    }

    .seller-status{
      margin-top:4px;
      color:var(--green);
      font-size:9px;
      font-weight:800;
    }

    .seller-profile{
      padding:8px 10px;
      border:1px solid var(--border);
      border-radius:9px;
      font-size:9px;
      font-weight:850;
    }


    /* =====================================================
       REPORT
    ===================================================== */

    .report{
      display:block;
      margin-top:14px;
      text-align:center;
      color:var(--muted);
      font-size:9px;
      font-weight:700;
    }

    .report:hover{
      color:var(--red);
    }


    /* =====================================================
       LIGHTBOX
    ===================================================== */

    .lightbox{
      position:fixed;
      inset:0;
      z-index:500;
      display:none;
      place-items:center;
      padding:20px;
      background:rgba(0,0,0,.84);
      backdrop-filter:blur(8px);
    }

    .lightbox.open{
      display:grid;
    }

    .lightbox img{
      max-width:min(1000px,94vw);
      max-height:88vh;
      object-fit:contain;
      border-radius:12px;
    }

    .close-lightbox{
      position:fixed;
      top:20px;
      right:20px;
      width:43px;
      height:43px;
      border:1px solid rgba(255,255,255,.2);
      border-radius:12px;
      color:#fff;
      background:rgba(255,255,255,.1);
      font-size:18px;
    }


    /* =====================================================
       LOADING / ERROR
    ===================================================== */

    .state{
      min-height:65vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:var(--muted);
    }

    .state-icon{
      width:54px;
      height:54px;
      display:grid;
      place-items:center;
      margin-bottom:13px;
      border-radius:16px;
      color:var(--gold);
      background:var(--soft);
      font-size:22px;
    }

    .state strong{
      color:var(--text);
      font-size:14px;
    }

    .state span{
      margin-top:5px;
      font-size:10px;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    .mobile-nav{
      display:none;
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:200;
      height:67px;
      background:rgba(255,255,255,.94);
      backdrop-filter:blur(18px);
      border-top:1px solid var(--border);
    }

    body.dark .mobile-nav{
      background:rgba(7,19,33,.95);
    }

    .mobile-nav-inner{
      height:100%;
      display:grid;
      grid-template-columns:repeat(5,1fr);
    }

    .mobile-nav a{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:4px;
      color:var(--muted);
      font-size:9px;
      font-weight:800;
    }

    .mobile-nav a.active{
      color:var(--gold);
    }

    .mobile-icon{
      font-size:17px;
    }


    @media(max-width:1000px){

      .nav{
        display:none;
      }

      .mobile-nav{
        display:block;
      }

      .container{
        padding-bottom:95px;
      }

      .detail-layout{
        grid-template-columns:1fr;
      }

      .photo-panel{
        position:relative;
        top:auto;
      }

      .main-photo{
        height:min(65vw,520px);
      }

    }


    @media(max-width:600px){

      .container{
        width:94%;
        padding-top:18px;
      }

      .brand-name{
        display:none;
      }

      .main-photo{
        height:75vw;
        border-radius:17px;
      }

      .photo-grid{
        gap:8px;
      }

      .detail-photo{
        border-radius:11px;
      }

      .title{
        font-size:26px;
      }

      .price{
        font-size:22px;
      }

      .actions-row{
        grid-template-columns:1fr;
      }

      .info-grid{
        grid-template-columns:1fr 1fr;
      }

    }

  </style>
</head>


<body>

  <!-- =====================================================

  <script>

    /* =====================================================
       THEME
    ===================================================== */

    function applyTheme(theme){

      document.body.classList.toggle(
        "dark",
        theme === "dark"
      );

      document.getElementById(
        "themeButton"
      ).textContent =
        theme === "dark"
          ? "☀"
          : "☾";

      localStorage.setItem(
        "mec_theme",
        theme
      );
    }


    function toggleTheme(){

      const dark =
        document.body.classList.contains(
          "dark"
        );

      applyTheme(
        dark
          ? "light"
          : "dark"
      );

    }


    /* =====================================================
       SAFE HTML
    ===================================================== */

    function escapeHTML(value){

      return String(
        value ?? ""
      )
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");

    }


    /* =====================================================
       PRICE
    ===================================================== */

    function formatPrice(price){

      if(
        price === null ||
        price === undefined ||
        price === ""
      ){

        return "Price on request";

      }

      const n =
        Number(price);


      if(
        Number.isNaN(n)
      ){

        return escapeHTML(
          price
        );

      }


      return (
        "MMK " +
        n.toLocaleString()
      );

    }


    /* =====================================================
       LOCATION
       Region + Township + Nearby
    ===================================================== */

    function formatLocation(item){

      const parts = [

        item.region ||
        item.state ||
        "",

        item.township ||
        "",

        item.nearby_address ||
        item.nearby ||
        ""

      ]
      .filter(Boolean);


      return parts.length
        ? parts.join(" · ")
        : "Myanmar";

    }


    /* =====================================================
       AUTH
    ===================================================== */

    async function checkAuth(){

      const {
        data
      } =
        await supabaseClient.auth.getUser();


      if(
        !data?.user
      ){

        window.location.replace(
          "./auth.html?mode=login"
        );

        return null;

      }


      return data.user;

    }


    /* =====================================================
       PROFILE
    ===================================================== */

    async function loadProfile(user){

      const {
        data
      } =
        await supabaseClient
          .from("profiles")
          .select("avatar_url")
          .eq(
            "id",
            user.id
          )
          .maybeSingle();


      if(
        data?.avatar_url
      ){

        document.getElementById(
          "avatar"
        ).src =
          data.avatar_url;

      }

    }


    /* =====================================================
       GET LISTING ID
    ===================================================== */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const listingId =
      params.get("id");


    /* =====================================================
       LOAD LISTING
    ===================================================== */

    async function loadListing(){

      if(!listingId){

        showError(
          "Listing not found",
          "No listing ID was provided."
        );

        return;

      }


      const {
        data,
        error
      } =
        await supabaseClient
          .from("listings")
          .select("*")
          .eq(
            "id",
            listingId
          )
          .maybeSingle();


      if(error){

        console.error(
          error
        );

        showError(
          "Unable to load listing",
          error.message
        );

        return;

      }


      if(!data){

        showError(
          "Listing not found",
          "This listing may have been removed."
        );

        return;

      }


      renderListing(
        data
      );

    }


    /* =====================================================
       RENDER LISTING
    ===================================================== */

    function renderListing(item){

      const showPhoto =
        item.show_photo_url ||
        item.cover_url ||
        item.image_url ||
        "";


      let detailPhotos =
        Array.isArray(
          item.detail_images
        )
          ? item.detail_images
          : [];


      /*
       * Show photo ကို detail grid ထဲ
       * ထပ်မပြစေဘဲ detail photos သပ်သပ်ပြမယ်။
       */

      detailPhotos =
        detailPhotos.filter(
          photo =>
            photo &&
            photo !== showPhoto
        );


      const allPhotoCount =
        (showPhoto ? 1 : 0) +
        detailPhotos.length;


      const title =
        item.title ||
        item.name ||
        "Untitled Listing";


      const category =
        item.category ||
        item.type ||
        "Marketplace";


      const description =
        item.description ||
        "No description provided.";


      const condition =
        item.condition ||
        "Not specified";


      const sellerName =
        item.seller_name ||
        item.owner_name ||
        "Seller";


      const sellerAvatar =
        item.seller_avatar_url ||
        item.owner_avatar_url ||
        "";


      const location =
        formatLocation(
          item
        );


      const html = `

        <a
          href="./buy.html"
          class="back">

          ← Back to listings

        </a>


        <div class="detail-layout">


          <!-- =============================================
               PHOTOS
          ============================================== -->

          <section class="photo-panel">


            <div
              class="main-photo"
              onclick="openLightbox(
                '${escapeHTML(showPhoto)}'
              )">

              ${
                showPhoto

                ?

                `<img
                  id="mainImage"
                  src="${escapeHTML(showPhoto)}"
                  alt="${escapeHTML(title)}">`

                :

                ``
              }


              <div class="photo-label">
                SHOW PHOTO
              </div>


              ${
                allPhotoCount > 0

                ?

                `<div class="photo-count">
                  ${allPhotoCount} photos
                </div>`

                :

                ``
              }

            </div>


            ${
              detailPhotos.length

              ?

              `

              <div class="photo-grid-title">
                Detail Photos
              </div>


              <div class="photo-grid">

                ${

                  detailPhotos
                    .map(
                      (photo,index) => `

                        <div
                          class="detail-photo"
                          onclick="openLightbox(
                            '${escapeHTML(photo)}'
                          )">

                          <img
                            src="${escapeHTML(photo)}"
                            alt="Detail photo ${index + 1}"
                            loading="lazy">

                        </div>

                      `
                    )
                    .join("")

                }

              </div>

              `

              :

              ""

            }

          </section>


          <!-- =============================================
               INFORMATION
          ============================================== -->

          <section class="info-panel">


            <div class="category">
              ${escapeHTML(category)}
            </div>


            <h1 class="title">
              ${escapeHTML(title)}
            </h1>


            <div class="price">
              ${formatPrice(item.price)}
            </div>


            <div class="location">

              <div class="location-icon">
                ⌖
              </div>

              <div>
                ${escapeHTML(location)}
              </div>

            </div>


            <div class="actions-row">

              <button
                class="primary-button"
                onclick="contactSeller()">

                💬 Chat with Seller

              </button>


              <button
                class="secondary-button"
                onclick="shareListing()">

                ↗ Share Listing

              </button>

            </div>


            <!-- DETAILS -->

            <div class="info-card">

              <div class="card-title">
                Item Details
              </div>


              <div class="info-grid">


                <div class="info-item">

                  <div class="info-label">
                    Category
                  </div>

                  <div class="info-value">
                    ${escapeHTML(category)}
                  </div>

                </div>


                <div class="info-item">

                  <div class="info-label">
                    Condition
                  </div>

                  <div class="info-value">
                    ${escapeHTML(condition)}
                  </div>

                </div>


                <div class="info-item">

                  <div class="info-label">
                    Region / State
                  </div>

                  <div class="info-value">
                    ${escapeHTML(
                      item.region ||
                      item.state ||
                      "—"
                    )}
                  </div>

                </div>


                <div class="info-item">

                  <div class="info-label">
                    Township
                  </div>

                  <div class="info-value">
                    ${escapeHTML(
                      item.township ||
                      "—"
                    )}
                  </div>

                </div>


                <div class="info-item">

                  <div class="info-label">
                    Nearby Address
                  </div>

                  <div class="info-value">
                    ${escapeHTML(
                      item.nearby_address ||
                      item.nearby ||
                      "—"
                    )}
                  </div>

                </div>


                <div class="info-item">

                  <div class="info-label">
                    Listing Status
                  </div>

                  <div class="info-value">
                    ${escapeHTML(
                      item.status ||
                      "Available"
                    )}
                  </div>

                </div>


              </div>

            </div>


            <!-- DESCRIPTION -->

            <div class="description">

              <div class="card-title">
                Description
              </div>

              <div class="description-text">
                ${escapeHTML(description)}
              </div>

            </div>


            <!-- SELLER -->

            <div class="seller-card">


              <div class="seller-avatar">

                ${
                  sellerAvatar

                  ?

                  `<img
                    src="${escapeHTML(
                      sellerAvatar
                    )}"
                    alt="${escapeHTML(
                      sellerName
                    )}">`

                  :

                  ""

                }

              </div>


              <div class="seller-info">

                <div class="seller-name">
                  ${escapeHTML(sellerName)}
                </div>

                <div class="seller-status">
                  ● Seller
                </div>

              </div>


              <a
                href="./profile.html"
                class="seller-profile">

                Profile

              </a>

            </div>


            <a
              href="#"
              class="report"
              onclick="reportListing(event)">

              Report this listing

            </a>


          </section>

        </div>

      `;


      document.getElementById(
        "app"
      ).innerHTML =
        html;

    }


    /* =====================================================
       CHAT
    ===================================================== */

    function contactSeller(){

      /*
       * Chat system ပြီးသွားတဲ့အခါ
       * listing ID ကို chat URL ထဲ
       * အလိုအလျောက်ထည့်နိုင်အောင်
       * ဒီနေရာကို reserve လုပ်ထားတယ်။
       */

      window.location.href =
        "./chat.html?listing=" +
        encodeURIComponent(
          listingId
        );

    }


    /* =====================================================
       SHARE
    ===================================================== */

    async function shareListing(){

      const url =
        window.location.href;


      if(
        navigator.share
      ){

        try{

          await navigator.share({

            title:
              document.title,

            url

          });

        }
        catch(error){

          console.log(
            "Share cancelled"
          );

        }

        return;

      }


      try{

        await navigator.clipboard.writeText(
          url
        );

        alert(
          "Listing link copied."
        );

      }
      catch(error){

        alert(
          url
        );

      }

    }


    /* =====================================================
       REPORT
    ===================================================== */

    function reportListing(event){

      event.preventDefault();

      alert(
        "Report feature will connect to the Admin system."
      );

    }


    /* =====================================================
       LIGHTBOX
    ===================================================== */

    function openLightbox(
      image
    ){

      if(!image){

        return;

      }


      document.getElementById(
        "lightboxImage"
      ).src =
        image;


      document.getElementById(
        "lightbox"
      ).classList.add(
        "open"
      );

    }


    function closeLightbox(){

      document.getElementById(
        "lightbox"
      ).classList.remove(
        "open"
      );

    }


    document.getElementById(
      "lightbox"
    ).addEventListener(
      "click",
      function(event){

        if(
          event.target === this
        ){

          closeLightbox();

        }

      }
    );


    document.addEventListener(
      "keydown",
      function(event){

        if(
          event.key === "Escape"
        ){

          closeLightbox();

        }

      }
    );


    /* =====================================================
       ERROR
    ===================================================== */

    function showError(
      title,
      message
    ){

      document.getElementById(
        "app"
      ).innerHTML = `

        <div class="state">

          <div class="state-icon">
            !
          </div>

          <strong>
            ${escapeHTML(title)}
          </strong>

          <span>
            ${escapeHTML(message)}
          </span>

          <a
            href="./buy.html"
            style="
              margin-top:18px;
              color:var(--gold);
              font-size:11px;
              font-weight:900;
            ">

            ← Back to listings

          </a>

        </div>

      `;

    }


    /* =====================================================
       INIT
    ===================================================== */

    async function init(){

      applyTheme(
        localStorage.getItem(
          "mec_theme"
        ) || "light"
      );


      const user =
        await checkAuth();


      if(!user){

        return;

      }


      await loadProfile(
        user
      );


      await loadListing();

    }


    init();

  </script>

</body>
</html>

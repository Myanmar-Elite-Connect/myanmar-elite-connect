<!DOCTYPE html>
<html lang="my">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Add Listing | Myanmar Elite Connect
  </title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="./supabase.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f6f9;
      color: #222;
      font-family:
        Arial,
        "Noto Sans Myanmar",
        sans-serif;
    }

    /* HEADER */

    header {
      background: #071b3a;
      color: white;
      padding: 18px 20px;
    }

    .header-inner {
      max-width: 900px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .brand {
      font-size: 21px;
      font-weight: bold;
    }

    .back-top {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }


    /* CONTAINER */

    .container {
      width: 100%;
      max-width: 720px;
      margin: 30px auto;
      padding: 0 18px;
    }


    /* CARD */

    .card {
      background: white;
      border-radius: 18px;
      padding: 28px;
      box-shadow:
        0 5px 25px rgba(0, 0, 0, 0.08);
    }


    h1 {
      color: #071b3a;
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 25px;
    }

    .subtitle {
      color: #666;
      margin-top: 0;
      margin-bottom: 25px;
      line-height: 1.6;
    }


    /* MESSAGE */

    #message {
      display: none;
      padding: 13px;
      border-radius: 9px;
      margin-bottom: 18px;
      line-height: 1.6;
      word-break: break-word;
    }

    .success {
      display: block !important;
      background: #e8f7ee;
      color: #176b38;
    }

    .error {
      display: block !important;
      background: #fff0f0;
      color: #b42318;
    }


    /* FORM */

    label {
      display: block;
      margin-top: 17px;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;

      border: 1px solid #d9dde5;
      border-radius: 9px;

      background: white;

      font-family: inherit;
      font-size: 15px;

      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #071b3a;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }


    /* PRICE */

    .price-row {
      display: flex;
      gap: 10px;
    }

    .price-row input {
      flex: 1;
    }

    .currency {
      width: 100px;
      background: #f5f6f8;
    }


    /* BUTTON */

    .submit-btn {
      width: 100%;
      margin-top: 25px;

      padding: 15px;

      border: 0;
      border-radius: 9px;

      background: #071b3a;
      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    .submit-btn:hover {
      opacity: .92;
    }

    .submit-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }


    /* LOGIN NOTICE */

    .login-notice {
      text-align: center;
      padding: 20px;
    }

    .login-btn {
      display: inline-block;
      margin-top: 12px;

      padding: 12px 22px;

      background: #071b3a;
      color: white;

      text-decoration: none;

      border-radius: 8px;
      font-weight: bold;
    }


    /* BACK */

    .back {
      display: block;

      text-align: center;

      margin-top: 20px;

      color: #071b3a;

      text-decoration: none;

      font-weight: bold;
    }


    /* MOBILE */

    @media (max-width: 600px) {

      .card {
        padding: 21px;
      }

      .header-inner {
        align-items: flex-start;
      }

      .brand {
        font-size: 18px;
      }

      .price-row {
        flex-direction: column;
      }

      .currency {
        width: 100%;
      }

    }

  </style>

</head>


<body>


<header>

  <div class="header-inner">

    <div class="brand">
      Myanmar Elite Connect
    </div>

    <a
      href="./index.html"
      class="back-top"
    >
      Home
    </a>

  </div>

</header>



<div class="container">


  <div class="card">


    <h1>
      Add New Listing
    </h1>


    <p class="subtitle">
      ကား၊ အိမ်ခြံမြေ၊ ကျောက်မျက်
      ရောင်းရန် ကြော်ငြာတင်ပါ။
    </p>


    <!-- MESSAGE -->

    <div id="message"></div>


    <!-- FORM -->

    <form id="listingForm">


      <!-- CATEGORY -->

      <label for="category">
        Category / အမျိုးအစား
      </label>

      <select
        id="category"
        required
      >

        <option value="">
          -- Select Category --
        </option>

        <option value="car">
          🚗 Car / ကား
        </option>

        <option value="property">
          🏠 Property / အိမ်ခြံမြေ
        </option>

        <option value="gem">
          💎 Gem / ကျောက်မျက်
        </option>

      </select>



      <!-- TITLE -->

      <label for="title">
        Title / ခေါင်းစဉ်
      </label>

      <input
        id="title"
        type="text"
        placeholder="ဥပမာ - Toyota Alphard 2022"
        required
      >



      <!-- PRICE -->

      <label>
        Price / ဈေးနှုန်း
      </label>

      <div class="price-row">

        <input
          id="price"
          type="number"
          min="0"
          step="0.01"
          placeholder="ဥပမာ - 85000000"
        >

        <input
          class="currency"
          type="text"
          value="MMK"
          readonly
        >

      </div>



      <!-- LOCATION -->

      <label for="location">
        Location / တည်နေရာ
      </label>

      <input
        id="location"
        type="text"
        placeholder="ဥပမာ - Yangon, Myanmar"
      >



      <!-- PHONE -->

      <label for="phone">
        Phone / ဆက်သွယ်ရန်
      </label>

      <input
        id="phone"
        type="tel"
        placeholder="09xxxxxxxxx"
      >



      <!-- DESCRIPTION -->

      <label for="description">
        Description / အသေးစိတ်
      </label>

      <textarea
        id="description"
        placeholder="ပစ္စည်းအကြောင်း အသေးစိတ်ရေးပါ..."
      ></textarea>



      <!-- SUBMIT -->

      <button
        id="submitButton"
        class="submit-btn"
        type="submit"
      >
        Publish Listing
      </button>


    </form>


    <a
      href="./index.html"
      class="back"
    >
      ← Back to Marketplace
    </a>


  </div>

</div>



<script>


/* ==========================================
   ELEMENTS
========================================== */

const form =
  document.getElementById(
    "listingForm"
  );

const message =
  document.getElementById(
    "message"
  );

const submitButton =
  document.getElementById(
    "submitButton"
  );


/* ==========================================
   MESSAGE
========================================== */

function showMessage(
  text,
  type
) {

  message.textContent = text;

  message.className =
    type;

}


function clearMessage() {

  message.textContent = "";

  message.className = "";

}


/* ==========================================
   CHECK SUPABASE
========================================== */

if (
  typeof supabaseClient ===
  "undefined"
) {

  showMessage(
    "Supabase connection မတွေ့ပါ။ supabase.js ကို စစ်ပါ။",
    "error"
  );

}


/* ==========================================
   CHECK LOGIN
========================================== */

async function getCurrentUser() {

  const {
    data,
    error
  } =
    await supabaseClient.auth.getSession();


  if (error) {

    throw error;

  }


  if (
    !data ||
    !data.session ||
    !data.session.user
  ) {

    return null;

  }


  return data.session.user;

}


/* ==========================================
   PAGE LOAD
========================================== */

async function checkLogin() {

  try {

    const user =
      await getCurrentUser();


    if (!user) {

      form.innerHTML = `

        <div class="login-notice">

          <h2>
            Login Required
          </h2>

          <p>
            Listing တင်ရန်
            အရင် Login ဝင်ပေးပါ။
          </p>

          <a
            class="login-btn"
            href="./auth.html"
          >
            Login / Register
          </a>

        </div>

      `;

    }

  } catch (error) {

    showMessage(
      error.message,
      "error"
    );

  }

}


checkLogin();


/* ==========================================
   PUBLISH LISTING
========================================== */

form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    clearMessage();


    submitButton.disabled =
      true;

    submitButton.textContent =
      "Publishing...";


    try {


      /* ------------------------------
         GET LOGGED-IN USER
      ------------------------------ */

      const user =
        await getCurrentUser();


      if (!user) {

        throw new Error(
          "Listing တင်ရန် Login ဝင်ထားရပါမည်။"
        );

      }


      /* ------------------------------
         GET FORM VALUES
      ------------------------------ */

      const category =
        document
          .getElementById(
            "category"
          )
          .value;


      const title =
        document
          .getElementById(
            "title"
          )
          .value
          .trim();


      const priceText =
        document
          .getElementById(
            "price"
          )
          .value
          .trim();


      const location =
        document
          .getElementById(
            "location"
          )
          .value
          .trim();


      const phone =
        document
          .getElementById(
            "phone"
          )
          .value
          .trim();


      const description =
        document
          .getElementById(
            "description"
          )
          .value
          .trim();


      /* ------------------------------
         VALIDATION
      ------------------------------ */

      if (!category) {

        throw new Error(
          "Category ရွေးပေးပါ။"
        );

      }


      if (!title) {

        throw new Error(
          "Listing ခေါင်းစဉ် ထည့်ပေးပါ။"
        );

      }


      /* ------------------------------
         PRICE
      ------------------------------ */

      let price = null;


      if (priceText !== "") {

        price =
          Number(priceText);


        if (
          Number.isNaN(price)
        ) {

          throw new Error(
            "ဈေးနှုန်း မှားနေပါတယ်။"
          );

        }

      }


      /* ------------------------------
         DATABASE INSERT
      ------------------------------

         IMPORTANT:

         Existing database requires
         BOTH user_id and seller_id.

      ------------------------------ */

      const listingData = {

        user_id:
          user.id,

        seller_id:
          user.id,

        category:
          category,

        title:
          title,

        description:
          description || null,

        price:
          price,

        currency:
          "MMK",

        location:
          location || null,

        phone:
          phone || null,

        status:
          "active"

      };


      console.log(
        "LISTING DATA:",
        listingData
      );


      /* ------------------------------
         INSERT
      ------------------------------ */

      const {
        data,
        error
      } =
        await supabaseClient
          .from("listings")
          .insert(
            listingData
          )
          .select()
          .single();


      /* ------------------------------
         ERROR
      ------------------------------ */

      if (error) {

        console.error(
          "SUPABASE LISTING ERROR:",
          error
        );

        throw error;

      }


      /* ------------------------------
         SUCCESS
      ------------------------------ */

      console.log(
        "LISTING CREATED:",
        data
      );


      showMessage(
        "✅ Listing အောင်မြင်စွာ တင်ပြီးပါပြီ။",
        "success"
      );


      form.reset();


      /*
        Redirect after 1.5 seconds
      */

      setTimeout(
        function() {

          window.location.href =
            "./index.html";

        },
        1500
      );


    } catch (error) {


      console.error(
        "LISTING ERROR:",
        error
      );


      showMessage(
        "❌ " +
        (
          error.message ||
          "Listing တင်မရပါ။"
        ),
        "error"
      );


    } finally {

      submitButton.disabled =
        false;

      submitButton.textContent =
        "Publish Listing";

    }

  }
);


</script>


</body>

</html>

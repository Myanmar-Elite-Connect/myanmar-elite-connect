<!DOCTYPE html>
<html lang="my">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Myanmar Elite Connect - Add Listing
  </title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="./supabase.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      background: #f4f6f9;

      color: #222;

      font-family:
        Arial,
        "Noto Sans Myanmar",
        sans-serif;
    }


    /* HEADER */

    header {
      background: #071b3a;

      color: white;

      padding: 18px;
    }

    .header-inner {
      max-width: 800px;

      margin: auto;

      display: flex;

      justify-content: space-between;

      align-items: center;
    }

    .brand {
      font-size: 21px;

      font-weight: bold;
    }

    .home-link {
      color: white;

      text-decoration: none;
    }


    /* CONTAINER */

    .container {
      width: 100%;

      max-width: 720px;

      margin: 30px auto;

      padding: 0 18px;
    }


    /* CARD */

    .card {
      background: white;

      border-radius: 18px;

      padding: 28px;

      box-shadow:
        0 5px 25px
        rgba(0,0,0,.08);
    }


    h1 {
      margin-top: 0;

      color: #071b3a;

      font-size: 26px;
    }

    .subtitle {
      color: #666;

      line-height: 1.7;

      margin-bottom: 25px;
    }


    /* MESSAGE */

    #message {
      display: none;

      padding: 14px;

      margin-bottom: 18px;

      border-radius: 9px;

      line-height: 1.7;

      word-break: break-word;
    }

    #message.success {
      display: block;

      background: #e9f8ef;

      color: #176b38;
    }

    #message.error {
      display: block;

      background: #fff0f0;

      color: #b42318;
    }


    /* FORM */

    label {
      display: block;

      margin-top: 18px;

      margin-bottom: 7px;

      font-size: 14px;

      font-weight: bold;
    }


    input,
    select,
    textarea {

      width: 100%;

      padding: 13px;

      border: 1px solid #d7dce5;

      border-radius: 9px;

      background: white;

      color: #222;

      font-family: inherit;

      font-size: 15px;

      outline: none;

    }


    input:focus,
    select:focus,
    textarea:focus {

      border-color: #071b3a;

    }


    textarea {

      min-height: 140px;

      resize: vertical;

    }


    /* PRICE */

    .price-row {

      display: flex;

      gap: 10px;

    }

    .price-input {

      flex: 1;

    }

    .currency {

      width: 100px;

      background: #f1f3f6;

      text-align: center;

      font-weight: bold;

    }


    /* BUTTON */

    .publish-btn {

      width: 100%;

      margin-top: 25px;

      padding: 15px;

      border: none;

      border-radius: 9px;

      background: #071b3a;

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

    }


    .publish-btn:disabled {

      opacity: .6;

      cursor: not-allowed;

    }


    /* BACK */

    .back {

      display: block;

      margin-top: 20px;

      text-align: center;

      color: #071b3a;

      text-decoration: none;

      font-weight: bold;

    }


    /* LOGIN */

    .login-box {

      text-align: center;

      padding: 25px 5px;

    }

    .login-button {

      display: inline-block;

      margin-top: 15px;

      padding: 12px 25px;

      background: #071b3a;

      color: white;

      text-decoration: none;

      border-radius: 8px;

      font-weight: bold;

    }


    /* MOBILE */

    @media (max-width: 600px) {

      .card {

        padding: 20px;

      }

      .price-row {

        flex-direction: column;

      }

      .currency {

        width: 100%;

      }

      .brand {

        font-size: 18px;

      }

    }

  </style>

</head>


<body>


<header>

  <div class="header-inner">

    <div class="brand">

      Myanmar Elite Connect

    </div>


    <a
      href="./index.html"
      class="home-link"
    >

      Home

    </a>

  </div>

</header>



<div class="container">


  <div class="card">


    <h1>

      Add New Listing

    </h1>


    <p class="subtitle">

      🚗 ကား · 🏠 အိမ်ခြံမြေ · 💎 ကျောက်မျက်

      <br>

      ရောင်းရန် ကြော်ငြာတင်ပါ။

    </p>


    <div id="message"></div>



    <form id="listingForm">


      <!-- CATEGORY -->

      <label for="category">

        အမျိုးအစား / Category

      </label>


      <select
        id="category"
        required
      >

        <option value="">

          -- အမျိုးအစားရွေးပါ --

        </option>


        <option value="car">

          🚗 Car / ကား

        </option>


        <option value="property">

          🏠 Property / အိမ်ခြံမြေ

        </option>


        <option value="gem">

          💎 Gem / ကျောက်မျက်

        </option>

      </select>



      <!-- TITLE -->

      <label for="title">

        ခေါင်းစဉ် / Title

      </label>


      <input
        id="title"
        type="text"
        placeholder="ဥပမာ - Toyota Alphard 2022"
        required
      >



      <!-- PRICE -->

      <label>

        ဈေးနှုန်း / Price

      </label>


      <div class="price-row">


        <input
          id="price"
          class="price-input"
          type="number"
          min="0"
          step="0.01"
          placeholder="ဥပမာ - 85000000"
        >


        <input
          class="currency"
          type="text"
          value="MMK"
          readonly
        >

      </div>



      <!-- LOCATION -->

      <label for="location">

        တည်နေရာ / Location

      </label>


      <input
        id="location"
        type="text"
        placeholder="ဥပမာ - Yangon"
      >



      <!-- PHONE -->

      <label for="phone">

        ဆက်သွယ်ရန် / Phone

      </label>


      <input
        id="phone"
        type="tel"
        placeholder="09xxxxxxxxx"
      >



      <!-- DESCRIPTION -->

      <label for="description">

        အသေးစိတ် / Description

      </label>


      <textarea
        id="description"
        placeholder="ပစ္စည်းအကြောင်း အသေးစိတ်ရေးပါ..."
      ></textarea>



      <!-- SUBMIT -->

      <button
        id="publishButton"
        class="publish-btn"
        type="submit"
      >

        Publish Listing

      </button>


    </form>


    <a
      href="./index.html"
      class="back"
    >

      ← Marketplace သို့ပြန်သွားရန်

    </a>


  </div>

</div>



<script>


/* =========================================
   MESSAGE
========================================= */

const message =
  document.getElementById(
    "message"
  );


function showMessage(
  text,
  type
) {

  message.textContent = text;

  message.className = type;

}


function clearMessage() {

  message.textContent = "";

  message.className = "";

}


/* =========================================
   GET USER
========================================= */

async function getCurrentUser() {

  const {
    data,
    error
  } =
    await supabaseClient.auth.getSession();


  if (error) {

    throw error;

  }


  if (
    !data ||
    !data.session ||
    !data.session.user
  ) {

    return null;

  }


  return data.session.user;

}


/* =========================================
   CHECK LOGIN
========================================= */

async function checkLogin() {

  try {

    const user =
      await getCurrentUser();


    if (!user) {

      document
        .getElementById(
          "listingForm"
        )
        .innerHTML = `

          <div class="login-box">

            <h2>
              Login လိုအပ်ပါတယ်
            </h2>

            <p>
              Listing တင်ရန်
              အရင် Login ဝင်ပေးပါ။
            </p>

            <a
              href="./auth.html"
              class="login-button"
            >
              Login / Register
            </a>

          </div>

        `;

    }

  }

  catch (error) {

    showMessage(
      error.message,
      "error"
    );

  }

}


checkLogin();


/* =========================================
   SUBMIT LISTING
========================================= */

document
  .getElementById(
    "listingForm"
  )
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      clearMessage();


      const button =
        document.getElementById(
          "publishButton"
        );


      button.disabled = true;

      button.textContent =
        "Publishing...";


      try {


        /* USER */

        const user =
          await getCurrentUser();


        if (!user) {

          throw new Error(
            "Listing တင်ရန် Login ဝင်ထားရပါမည်။"
          );

        }


        /* FORM */

        const category =
          document
            .getElementById(
              "category"
            )
            .value;


        const title =
          document
            .getElementById(
              "title"
            )
            .value
            .trim();


        const priceText =
          document
            .getElementById(
              "price"
            )
            .value
            .trim();


        const location =
          document
            .getElementById(
              "location"
            )
            .value
            .trim();


        const phone =
          document
            .getElementById(
              "phone"
            )
            .value
            .trim();


        const description =
          document
            .getElementById(
              "description"
            )
            .value
            .trim();


        /* VALIDATION */

        if (!category) {

          throw new Error(
            "Category ရွေးပေးပါ။"
          );

        }


        if (!title) {

          throw new Error(
            "Title ထည့်ပေးပါ။"
          );

        }


        /* PRICE */

        let price = null;


        if (priceText !== "") {

          price =
            Number(priceText);


          if (
            !Number.isFinite(
              price
            )
          ) {

            throw new Error(
              "Price မှားနေပါတယ်။"
            );

          }

        }


        /* =================================
           FINAL DATABASE OBJECT

           IMPORTANT:

           listing_type = SALE

           Database check constraint:
           sale OR rent
        ================================= */

        const listingData = {

          user_id:
            user.id,

          seller_id:
            user.id,

          listing_type:
            "sale",

          category:
            category,

          title:
            title,

          description:
            description ||
            null,

          price:
            price,

          currency:
            "MMK",

          location:
            location ||
            null,

          phone:
            phone ||
            null,

          status:
            "active"

        };


        console.log(
          "USER:",
          user.id
        );


        console.log(
          "LISTING DATA:",
          listingData
        );


        /* =================================
           INSERT
        ================================= */

        const {
          data,
          error
        } =
          await supabaseClient
            .from("listings")
            .insert(
              listingData
            )
            .select()
            .single();


        /* ERROR */

        if (error) {

          console.error(
            "SUPABASE ERROR:",
            error
          );

          throw error;

        }


        /* SUCCESS */

        console.log(
          "LISTING CREATED:",
          data
        );


        showMessage(
          "✅ Listing အောင်မြင်စွာ တင်ပြီးပါပြီ။",
          "success"
        );


        document
          .getElementById(
            "listingForm"
          )
          .reset();


        button.textContent =
          "Published ✓";


        /* HOME */

        setTimeout(
          function() {

            window.location.href =
              "./index.html";

          },
          1500
        );


      }

      catch (error) {

        console.error(
          "LISTING ERROR:",
          error
        );


        showMessage(
          "❌ " +
          (
            error.message ||
            "Listing တင်မရပါ။"
          ),
          "error"
        );


        button.disabled =
          false;

        button.textContent =
          "Publish Listing";

      }

    }
  );


</script>


</body>

</html>

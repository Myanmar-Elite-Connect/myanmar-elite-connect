<!DOCTYPE html>
<html lang="my">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login | Myanmar Elite Connect</title>

  <!-- Supabase Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Our Supabase Connection -->
  <script src="./supabase.js"></script>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        Arial,
        "Noto Sans Myanmar",
        sans-serif;

      min-height: 100vh;

      background: #071b3a;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .brand {
      text-align: center;
      color: white;
      margin-bottom: 25px;
    }

    .brand h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .brand p {
      opacity: .8;
      font-size: 14px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 30px;

      box-shadow:
        0 20px 50px rgba(0,0,0,.25);
    }

    .tabs {
      display: flex;
      gap: 5px;

      background: #f1f4f8;

      padding: 5px;

      border-radius: 10px;

      margin-bottom: 25px;
    }

    .tab {
      flex: 1;

      border: none;

      padding: 12px;

      border-radius: 8px;

      background: transparent;

      cursor: pointer;

      font-weight: 700;

      color: #667085;
    }

    .tab.active {
      background: #071b3a;
      color: white;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      font-size: 14px;

      font-weight: 700;

      color: #172033;
    }

    input {
      width: 100%;

      padding: 13px;

      border: 1px solid #d9dee8;

      border-radius: 9px;

      outline: none;

      font-size: 15px;
    }

    input:focus {
      border-color: #071b3a;
    }

    .submit-btn {
      width: 100%;

      border: none;

      background: #071b3a;

      color: white;

      padding: 14px;

      border-radius: 10px;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;
    }

    .submit-btn:disabled {
      opacity: .6;
    }

    .message {
      display: none;

      padding: 12px;

      border-radius: 9px;

      margin-bottom: 18px;

      font-size: 14px;

      line-height: 1.7;
    }

    .message.success {
      display: block;

      background: #e9f8ef;

      color: #176b38;
    }

    .message.error {
      display: block;

      background: #fff0f0;

      color: #b42318;
    }

    .back {
      display: block;

      text-align: center;

      margin-top: 20px;

      color: #071b3a;

      text-decoration: none;

      font-size: 14px;

      font-weight: 700;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 480px) {

      .card {
        padding: 23px;
      }

      .brand h1 {
        font-size: 24px;
      }

    }

  </style>

</head>


<body>


  <div class="container">


    <div class="brand">

      <h1>
        Myanmar Elite Connect
      </h1>

      <p>
        Find. Connect. Trade.
      </p>

    </div>


    <div class="card">


      <!-- TABS -->

      <div class="tabs">

        <button
          type="button"
          id="loginTab"
          class="tab active"
          onclick="showLogin()"
        >
          Login
        </button>

        <button
          type="button"
          id="registerTab"
          class="tab"
          onclick="showRegister()"
        >
          Register
        </button>

      </div>


      <!-- MESSAGE -->

      <div
        id="message"
        class="message"
      ></div>


      <!-- LOGIN -->

      <form
        id="loginForm"
      >

        <div class="form-group">

          <label>
            Email
          </label>

          <input
            type="email"
            id="loginEmail"
            placeholder="example@email.com"
            required
          >

        </div>


        <div class="form-group">

          <label>
            Password
          </label>

          <input
            type="password"
            id="loginPassword"
            placeholder="Password"
            required
          >

        </div>


        <button
          type="submit"
          class="submit-btn"
          id="loginButton"
        >
          Login
        </button>

      </form>


      <!-- REGISTER -->

      <form
        id="registerForm"
        class="hidden"
      >

        <div class="form-group">

          <label>
            Full Name
          </label>

          <input
            type="text"
            id="registerName"
            placeholder="Your Name"
            required
          >

        </div>


        <div class="form-group">

          <label>
            Email
          </label>

          <input
            type="email"
            id="registerEmail"
            placeholder="example@email.com"
            required
          >

        </div>


        <div class="form-group">

          <label>
            Password
          </label>

          <input
            type="password"
            id="registerPassword"
            placeholder="At least 6 characters"
            minlength="6"
            required
          >

        </div>


        <div class="form-group">

          <label>
            Phone Number
          </label>

          <input
            type="tel"
            id="registerPhone"
            placeholder="09xxxxxxxxx"
          >

        </div>


        <button
          type="submit"
          class="submit-btn"
          id="registerButton"
        >
          Create Account
        </button>

      </form>


      <a
        href="./index.html"
        class="back"
      >
        ← Back to Marketplace
      </a>


    </div>

  </div>


  <script>


    /* =========================
       CHECK SUPABASE
    ========================= */

    if (
      typeof supabaseClient === "undefined"
    ) {

      console.error(
        "Supabase client is not available."
      );

    }


    /* =========================
       ELEMENTS
    ========================= */

    const loginForm =
      document.getElementById(
        "loginForm"
      );

    const registerForm =
      document.getElementById(
        "registerForm"
      );

    const message =
      document.getElementById(
        "message"
      );


    /* =========================
       MESSAGE
    ========================= */

    function showMessage(
      text,
      type
    ) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    function clearMessage() {

      message.textContent = "";

      message.className =
        "message";

    }


    /* =========================
       SHOW LOGIN
    ========================= */

    function showLogin() {

      loginForm.classList.remove(
        "hidden"
      );

      registerForm.classList.add(
        "hidden"
      );

      document
        .getElementById("loginTab")
        .classList.add("active");

      document
        .getElementById("registerTab")
        .classList.remove("active");

      clearMessage();

    }


    /* =========================
       SHOW REGISTER
    ========================= */

    function showRegister() {

      loginForm.classList.add(
        "hidden"
      );

      registerForm.classList.remove(
        "hidden"
      );

      document
        .getElementById("loginTab")
        .classList.remove("active");

      document
        .getElementById("registerTab")
        .classList.add("active");

      clearMessage();

    }


    /* =========================
       REGISTER
    ========================= */

    registerForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        clearMessage();


        if (
          typeof supabaseClient === "undefined"
        ) {

          showMessage(
            "Supabase connection မရပါ။ supabase.js ကို ပြန်စစ်ပေးပါ။",
            "error"
          );

          return;

        }


        const name =
          document
            .getElementById(
              "registerName"
            )
            .value
            .trim();


        const email =
          document
            .getElementById(
              "registerEmail"
            )
            .value
            .trim();


        const password =
          document
            .getElementById(
              "registerPassword"
            )
            .value;


        const phone =
          document
            .getElementById(
              "registerPhone"
            )
            .value
            .trim();


        const button =
          document.getElementById(
            "registerButton"
          );


        button.disabled = true;

        button.textContent =
          "Creating Account...";


        try {

          const result =
            await supabaseClient.auth.signUp({

              email: email,

              password: password,

              options: {

                data: {

                  full_name: name,

                  phone: phone

                }

              }

            });


          if (result.error) {

            throw result.error;

          }


          /*
             IMPORTANT:

             We don't insert into profiles
             yet.

             We will create the profile system
             properly in the next step.
          */


          if (result.data.session) {

            showMessage(
              "Account ဖန်တီးပြီးပါပြီ။ Login ဝင်နေပါသည်...",
              "success"
            );


            setTimeout(
              function() {

                window.location.href =
                  "./index.html";

              },
              1200
            );

          } else {

            showMessage(
              "Account ဖန်တီးပြီးပါပြီ။ Email ထဲကိုဝင်ပြီး Confirmation Link ကိုနှိပ်ပါ။ ပြီးရင် Login ပြန်ဝင်နိုင်ပါပြီ။",
              "success"
            );

          }


        } catch (error) {

          console.error(
            "SIGN UP ERROR:",
            error
          );


          showMessage(
            error.message ||
            "Sign Up မအောင်မြင်ပါ။",
            "error"
          );


        } finally {

          button.disabled = false;

          button.textContent =
            "Create Account";

        }

      }
    );


    /* =========================
       LOGIN
    ========================= */

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        clearMessage();


        if (
          typeof supabaseClient === "undefined"
        ) {

          showMessage(
            "Supabase connection မရပါ။ supabase.js ကို ပြန်စစ်ပေးပါ။",
            "error"
          );

          return;

        }


        const email =
          document
            .getElementById(
              "loginEmail"
            )
            .value
            .trim();


        const password =
          document
            .getElementById(
              "loginPassword"
            )
            .value;


        const button =
          document.getElementById(
            "loginButton"
          );


        button.disabled = true;

        button.textContent =
          "Logging in...";


        try {

          const result =
            await supabaseClient.auth
              .signInWithPassword({

                email: email,

                password: password

              });


          if (result.error) {

            throw result.error;

          }


          showMessage(
            "Login အောင်မြင်ပါသည်။ Marketplace သို့ ဝင်နေပါသည်...",
            "success"
          );


          setTimeout(
            function() {

              window.location.href =
                "./index.html";

            },
            1000
          );


        } catch (error) {

          console.error(
            "LOGIN ERROR:",
            error
          );


          showMessage(
            error.message ||
            "Login မအောင်မြင်ပါ။",
            "error"
          );


        } finally {

          button.disabled = false;

          button.textContent =
            "Login";

        }

      }
    );


  </script>


</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login • Myanmar Elite Connect</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #f7f9fc;
      --card: rgba(255,255,255,.82);
      --solid: #fff;
      --text: #10233f;
      --muted: #718097;
      --border: rgba(16,35,63,.10);
      --gold: #d8b45c;
      --gold-light: #f4d98a;
      --navy: #071a34;
      --danger: #d9534f;
      --success: #228b5a;
      --shadow: 0 30px 80px rgba(13,35,64,.12);
    }

    body.dark {
      --bg: #071321;
      --card: rgba(14,30,50,.86);
      --solid: #0e1e32;
      --text: #f3f6fa;
      --muted: #91a0b4;
      --border: rgba(255,255,255,.10);
      --navy: #f4f6f9;
      --shadow: 0 30px 80px rgba(0,0,0,.38);
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family:
        Inter,
        "Noto Sans Myanmar",
        "Myanmar Text",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);
      background: var(--bg);

      transition:
        background .3s ease,
        color .3s ease;
    }

    button,
    input {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    a {
      text-decoration: none;
    }

    /* ================================
       BACKGROUND
    ================================= */

    .page {
      position: relative;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 90px 20px 35px;

      overflow: hidden;
    }

    .glow {
      position: fixed;

      width: 520px;
      height: 520px;

      border-radius: 50%;

      pointer-events: none;

      background:
        radial-gradient(
          circle,
          rgba(216,180,92,.15),
          transparent 70%
        );
    }

    .glow.one {
      top: -260px;
      left: -230px;
    }

    .glow.two {
      right: -280px;
      bottom: -280px;
    }

    /* ================================
       TOP BAR
    ================================= */

    .topbar {
      position: fixed;

      top: 22px;
      left: 22px;
      right: 22px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      z-index: 20;
    }

    .back-button {
      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      color: var(--text);
      background: var(--card);

      border: 1px solid var(--border);

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      box-shadow: 0 8px 25px rgba(0,0,0,.04);

      transition: .25s ease;
    }

    .back-button:hover {
      transform: translateX(-3px);
      border-color: rgba(216,180,92,.5);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .language {
      height: 40px;

      display: flex;
      align-items: center;

      padding: 4px;

      border-radius: 999px;

      background: var(--card);
      border: 1px solid var(--border);

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    .language button {
      height: 30px;
      min-width: 43px;

      border: 0;
      border-radius: 999px;

      background: transparent;
      color: var(--muted);

      font-size: 11px;
      font-weight: 800;

      cursor: pointer;
    }

    .language button.active {
      background: var(--gold);
      color: #071a34;
    }

    .theme {
      width: 40px;
      height: 40px;

      border: 1px solid var(--border);
      border-radius: 50%;

      background: var(--card);
      color: var(--text);

      cursor: pointer;

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      transition: .25s ease;
    }

    .theme:hover {
      transform: rotate(12deg);
    }

    /* ================================
       AUTH CARD
    ================================= */

    .auth-card {
      position: relative;
      z-index: 2;

      width: min(440px, 100%);

      padding: 38px;

      border-radius: 30px;

      background: var(--card);
      border: 1px solid var(--border);

      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);

      box-shadow: var(--shadow);

      animation: cardIn .55s ease both;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ================================
       BRAND
    ================================= */

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;

      margin-bottom: 27px;
    }

    .logo {
      width: 76px;
      height: 76px;

      display: grid;
      place-items: center;

      border-radius: 22px;

      background: var(--solid);
      border: 1px solid var(--border);

      overflow: hidden;

      margin-bottom: 17px;
    }

    .logo img {
      width: 82%;
      height: 82%;

      object-fit: contain;
    }

    .brand-name {
      font-size: 19px;
      font-weight: 850;
      letter-spacing: -.4px;
    }

    .brand-name span {
      color: var(--gold);
    }

    /* ================================
       HEADING
    ================================= */

    .heading {
      text-align: center;
      margin-bottom: 23px;
    }

    .heading h1 {
      font-size: 26px;
      line-height: 1.2;
      letter-spacing: -.6px;
      margin-bottom: 7px;
    }

    .heading p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    /* ================================
       MODE SWITCH
    ================================= */

    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;

      padding: 4px;

      margin-bottom: 23px;

      border-radius: 14px;

      background: rgba(127,127,127,.08);
      border: 1px solid var(--border);
    }

    .mode-switch button {
      height: 42px;

      border: 0;
      border-radius: 10px;

      color: var(--muted);
      background: transparent;

      font-size: 13px;
      font-weight: 800;

      cursor: pointer;

      transition: .25s ease;
    }

    .mode-switch button.active {
      color: var(--text);
      background: var(--solid);

      box-shadow: 0 6px 18px rgba(0,0,0,.06);
    }

    /* ================================
       FORM
    ================================= */

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;

      margin-bottom: 7px;

      color: var(--text);

      font-size: 12px;
      font-weight: 750;
    }

    .input-wrap {
      position: relative;
    }

    .input {
      width: 100%;
      height: 51px;

      padding: 0 15px;

      color: var(--text);
      background: var(--solid);

      border: 1px solid var(--border);
      border-radius: 13px;

      outline: none;

      transition:
        border-color .2s ease,
        box-shadow .2s ease;
    }

    .input:focus {
      border-color: rgba(216,180,92,.75);

      box-shadow:
        0 0 0 4px rgba(216,180,92,.10);
    }

    .input::placeholder {
      color: var(--muted);
    }

    .password-input {
      padding-right: 52px;
    }

    .show-password {
      position: absolute;

      top: 50%;
      right: 9px;

      width: 38px;
      height: 38px;

      transform: translateY(-50%);

      border: 0;
      border-radius: 10px;

      background: transparent;
      color: var(--muted);

      cursor: pointer;
    }

    .show-password:hover {
      background: rgba(127,127,127,.08);
    }

    /* ================================
       OPTIONS
    ================================= */

    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin: 2px 0 20px;

      font-size: 11px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 7px;

      color: var(--muted);
    }

    .remember input {
      accent-color: var(--gold);
    }

    .forgot {
      color: var(--gold);
      font-weight: 750;
    }

    /* ================================
       MAIN BUTTON
    ================================= */

    .submit {
      width: 100%;
      height: 52px;

      border: 0;
      border-radius: 14px;

      color: #071a34;

      background:
        linear-gradient(
          135deg,
          var(--gold-light),
          var(--gold)
        );

      font-size: 14px;
      font-weight: 850;

      cursor: pointer;

      box-shadow:
        0 13px 30px rgba(16,35,63,.13);

      transition: .25s ease;
    }

    .submit:hover {
      transform: translateY(-2px);

      box-shadow:
        0 18px 38px rgba(16,35,63,.18);
    }

    .submit:active {
      transform: translateY(0);
    }

    .submit.loading {
      opacity: .65;
      pointer-events: none;
    }

    /* ================================
       MESSAGE
    ================================= */

    .message {
      display: none;

      margin-top: 15px;
      padding: 12px 13px;

      border-radius: 11px;

      font-size: 12px;
      line-height: 1.5;

      text-align: center;
    }

    .message.show {
      display: block;
    }

    .message.error {
      color: var(--danger);
      background: rgba(217,83,79,.08);
      border: 1px solid rgba(217,83,79,.15);
    }

    .message.success {
      color: var(--success);
      background: rgba(34,139,90,.08);
      border: 1px solid rgba(34,139,90,.15);
    }

    /* ================================
       TERMS
    ================================= */

    .terms {
      color: var(--muted);

      text-align: center;

      font-size: 10px;
      line-height: 1.7;

      margin-top: 19px;
    }

    .terms a {
      color: var(--gold);
    }

    /* ================================
       MOBILE
    ================================= */

    @media (max-width: 520px) {

      .page {
        padding: 80px 15px 20px;
      }

      .topbar {
        top: 15px;
        left: 15px;
        right: 15px;
      }

      .auth-card {
        padding: 29px 21px 25px;
        border-radius: 25px;
      }

      .logo {
        width: 68px;
        height: 68px;
      }

      .heading h1 {
        font-size: 24px;
      }
    }

    @media (max-width: 360px) {

      .auth-card {
        padding-left: 17px;
        padding-right: 17px;
      }

      .topbar {
        left: 11px;
        right: 11px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="glow one"></div>
    <div class="glow two"></div>


    <!-- TOP CONTROLS -->

    <header class="topbar">

      <a
        href="./index.html"
        class="back-button"
        aria-label="Back">
        ←
      </a>

      <div class="controls">

        <div class="language">

          <button
            id="mmButton"
            type="button"
            onclick="setLanguage('mm')">
            မြန်မာ
          </button>

          <button
            id="enButton"
            type="button"
            onclick="setLanguage('en')">
            EN
          </button>

        </div>

        <button
          class="theme"
          id="themeButton"
          type="button"
          onclick="toggleTheme()">
          ☾
        </button>

      </div>

    </header>


    <!-- AUTH -->

    <main class="auth-card">


      <!-- BRAND -->

      <div class="brand">

        <div class="logo">

          <img
            src="https://lh3.googleusercontent.com/d/1HsT_aztGJlUobEoi_sPnuUilYN9orGn7"
        alt="Myanmar Elite Connect">

        </div>

        <div class="brand-name">
          Myanmar <span>Elite</span> Connect
        </div>

      </div>


      <!-- HEADING -->

      <div class="heading">

        <h1 id="headingTitle">
          Welcome back
        </h1>

        <p id="headingText">
          Sign in to continue to your account.
        </p>

      </div>


      <!-- LOGIN / SIGNUP SWITCH -->

      <div class="mode-switch">

        <button
          id="loginMode"
          type="button"
          onclick="setMode('login')">
          Log In
        </button>

        <button
          id="signupMode"
          type="button"
          onclick="setMode('signup')">
          Sign Up
        </button>

      </div>


      <!-- FORM -->

      <form
        id="authForm"
        onsubmit="handleAuth(event)">


        <!-- NAME -->

        <div
          class="field"
          id="nameField"
          style="display:none;">

          <label id="nameLabel">
            Full Name
          </label>

          <input
            id="nameInput"
            class="input"
            type="text"
            autocomplete="name"
            placeholder="Enter your full name">

        </div>


        <!-- EMAIL -->

        <div class="field">

          <label id="emailLabel">
            Email
          </label>

          <input
            id="emailInput"
            class="input"
            type="email"
            autocomplete="email"
            placeholder="Enter your email"
            required>

        </div>


        <!-- PASSWORD -->

        <div class="field">

          <label id="passwordLabel">
            Password
          </label>

          <div class="input-wrap">

            <input
              id="passwordInput"
              class="input password-input"
              type="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              minlength="6"
              required>

            <button
              class="show-password"
              id="showPassword"
              type="button"
              onclick="togglePassword()">
              ◉
            </button>

          </div>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div
          class="field"
          id="confirmField"
          style="display:none;">

          <label id="confirmLabel">
            Confirm Password
          </label>

          <input
            id="confirmInput"
            class="input"
            type="password"
            autocomplete="new-password"
            placeholder="Re-enter your password"
            minlength="6">

        </div>


        <!-- LOGIN OPTIONS -->

        <div
          class="options"
          id="loginOptions">

          <label class="remember">

            <input
              type="checkbox"
              id="remember">

            <span id="rememberText">
              Remember me
            </span>

          </label>

          <a
            href="#"
            class="forgot"
            onclick="forgotPassword(event)"
            id="forgotText">
            Forgot password?
          </a>

        </div>


        <!-- SUBMIT -->

        <button
          class="submit"
          id="submitButton"
          type="submit">
          Log In
        </button>

      </form>


      <!-- MESSAGE -->

      <div
        class="message"
        id="message">
      </div>


      <!-- TERMS -->

      <div
        class="terms"
        id="termsText">

        By continuing, you agree to our
        <a href="#">Terms</a>
        and
        <a href="#">Privacy Policy</a>.

      </div>

    </main>

  </div>


  <script>

    /* =========================================================
       STATE
    ========================================================= */

    let currentMode = 'login';

    const translations = {

      en: {

        loginTitle: 'Welcome back',
        loginText:
          'Sign in to continue to your account.',

        signupTitle: 'Create your account',
        signupText:
          'Join Myanmar Elite Connect and get started.',

        name: 'Full Name',
        namePlaceholder:
          'Enter your full name',

        email: 'Email',
        emailPlaceholder:
          'Enter your email',

        password: 'Password',
        passwordPlaceholder:
          'Enter your password',

        confirm: 'Confirm Password',
        confirmPlaceholder:
          'Re-enter your password',

        login: 'Log In',
        signup: 'Sign Up',

        remember: 'Remember me',
        forgot: 'Forgot password?',

        terms:
          'By continuing, you agree to our',

        errorEmail:
          'Please enter a valid email address.',

        errorPassword:
          'Password must be at least 6 characters.',

        errorConfirm:
          'Passwords do not match.',

        successLogin:
          'Login information is ready. Connect Supabase authentication to complete sign in.',

        successSignup:
          'Account information is ready. Connect Supabase authentication to complete sign up.',

        forgotMessage:
          'Password reset will be available after Supabase authentication is connected.'

      },

      mm: {

        loginTitle:
          'ပြန်လည်ဝင်ရောက်မည်',

        loginText:
          'သင့်အကောင့်သို့ ဆက်လက်ဝင်ရောက်ပါ။',

        signupTitle:
          'အကောင့်အသစ်ဖွင့်မည်',

        signupText:
          'Myanmar Elite Connect တွင် စတင်အသုံးပြုလိုက်ပါ။',

        name:
          'အမည်အပြည့်အစုံ',

        namePlaceholder:
          'အမည်အပြည့်အစုံ ရိုက်ထည့်ပါ',

        email:
          'အီးမေးလ်',

        emailPlaceholder:
          'အီးမေးလ် ရိုက်ထည့်ပါ',

        password:
          'စကားဝှက်',

        passwordPlaceholder:
          'စကားဝှက် ရိုက်ထည့်ပါ',

        confirm:
          'စကားဝှက်အတည်ပြုရန်',

        confirmPlaceholder:
          'စကားဝှက်ကို ပြန်ရိုက်ထည့်ပါ',

        login:
          'ဝင်ရောက်မည်',

        signup:
          'အကောင့်ဖွင့်မည်',

        remember:
          'မှတ်ထားမည်',

        forgot:
          'စကားဝှက်မေ့နေပါသလား?',

        terms:
          'ဆက်လက်လုပ်ဆောင်ခြင်းဖြင့် ကျွန်ုပ်တို့၏',

        errorEmail:
          'မှန်ကန်သော အီးမေးလ်တစ်ခု ထည့်ပေးပါ။',

        errorPassword:
          'စကားဝှက်သည် အနည်းဆုံး ၆ လုံး ရှိရပါမည်။',

        errorConfirm:
          'စကားဝှက်နှစ်ခု မတူညီပါ။',

        successLogin:
          'Login အချက်အလက် အဆင်သင့်ဖြစ်ပါပြီ။ Supabase Authentication ချိတ်ဆက်ပြီးပါက အမှန်တကယ် ဝင်ရောက်နိုင်ပါမည်။',

        successSignup:
          'အကောင့်အချက်အလက် အဆင်သင့်ဖြစ်ပါပြီ။ Supabase Authentication ချိတ်ဆက်ပြီးပါက အကောင့်ဖွင့်နိုင်ပါမည်။',

        forgotMessage:
          'Supabase Authentication ချိတ်ဆက်ပြီးပါက Password Reset ကို အသုံးပြုနိုင်ပါမည်။'

      }

    };


    /* =========================================================
       LANGUAGE
    ========================================================= */

    function setLanguage(language) {

      localStorage.setItem(
        'mec_language',
        language
      );

      const t =
        translations[language];

      document.documentElement.lang =
        language === 'mm'
          ? 'my'
          : 'en';

      document.getElementById(
        'headingTitle'
      ).textContent =
        currentMode === 'login'
          ? t.loginTitle
          : t.signupTitle;

      document.getElementById(
        'headingText'
      ).textContent =
        currentMode === 'login'
          ? t.loginText
          : t.signupText;

      document.getElementById(
        'nameLabel'
      ).textContent =
        t.name;

      document.getElementById(
        'nameInput'
      ).placeholder =
        t.namePlaceholder;

      document.getElementById(
        'emailLabel'
      ).textContent =
        t.email;

      document.getElementById(
        'emailInput'
      ).placeholder =
        t.emailPlaceholder;

      document.getElementById(
        'passwordLabel'
      ).textContent =
        t.password;

      document.getElementById(
        'passwordInput'
      ).placeholder =
        t.passwordPlaceholder;

      document.getElementById(
        'confirmLabel'
      ).textContent =
        t.confirm;

      document.getElementById(
        'confirmInput'
      ).placeholder =
        t.confirmPlaceholder;

      document.getElementById(
        'submitButton'
      ).textContent =
        currentMode === 'login'
          ? t.login
          : t.signup;

      document.getElementById(
        'rememberText'
      ).textContent =
        t.remember;

      document.getElementById(
        'forgotText'
      ).textContent =
        t.forgot;

      document.getElementById(
        'mmButton'
      ).classList.toggle(
        'active',
        language === 'mm'
      );

      document.getElementById(
        'enButton'
      ).classList.toggle(
        'active',
        language === 'en'
      );
    }


    /* =========================================================
       MODE
    ========================================================= */

    function setMode(mode) {

      currentMode = mode;

      const isSignup =
        mode === 'signup';

      document.getElementById(
        'nameField'
      ).style.display =
        isSignup
          ? 'block'
          : 'none';

      document.getElementById(
        'confirmField'
      ).style.display =
        isSignup
          ? 'block'
          : 'none';

      document.getElementById(
        'loginOptions'
      ).style.display =
        isSignup
          ? 'none'
          : 'flex';

      document.getElementById(
        'loginMode'
      ).classList.toggle(
        'active',
        !isSignup
      );

      document.getElementById(
        'signupMode'
      ).classList.toggle(
        'active',
        isSignup
      );

      const language =
        localStorage.getItem(
          'mec_language'
        ) || 'en';

      setLanguage(language);

      clearMessage();

      document.getElementById(
        'passwordInput'
      ).value = '';

      document.getElementById(
        'confirmInput'
      ).value = '';
    }


    /* =========================================================
       PASSWORD
    ========================================================= */

    function togglePassword() {

      const input =
        document.getElementById(
          'passwordInput'
        );

      const button =
        document.getElementById(
          'showPassword'
        );

      if (input.type === 'password') {

        input.type = 'text';

        button.textContent = '○';

      } else {

        input.type = 'password';

        button.textContent = '◉';
      }
    }


    /* =========================================================
       AUTH FORM
    ========================================================= */

    function handleAuth(event) {

      event.preventDefault();

      clearMessage();

      const language =
        localStorage.getItem(
          'mec_language'
        ) || 'en';

      const t =
        translations[language];

      const email =
        document.getElementById(
          'emailInput'
        ).value.trim();

      const password =
        document.getElementById(
          'passwordInput'
        ).value;

      const name =
        document.getElementById(
          'nameInput'
        ).value.trim();

      const confirm =
        document.getElementById(
          'confirmInput'
        ).value;

      /* EMAIL */

      if (
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
          .test(email)
      ) {

        showMessage(
          t.errorEmail,
          'error'
        );

        return;
      }


      /* PASSWORD */

      if (password.length < 6) {

        showMessage(
          t.errorPassword,
          'error'
        );

        return;
      }


      /* SIGN UP */

      if (currentMode === 'signup') {

        if (!name) {

          showMessage(
            language === 'mm'
              ? 'အမည်ထည့်ပေးပါ။'
              : 'Please enter your full name.',
            'error'
          );

          return;
        }

        if (password !== confirm) {

          showMessage(
            t.errorConfirm,
            'error'
          );

          return;
        }

        showMessage(
          t.successSignup,
          'success'
        );

        return;
      }


      /* LOGIN */

      showMessage(
        t.successLogin,
        'success'
      );
    }


    /* =========================================================
       FORGOT PASSWORD
    ========================================================= */

    function forgotPassword(event) {

      event.preventDefault();

      const language =
        localStorage.getItem(
          'mec_language'
        ) || 'en';

      showMessage(
        translations[language]
          .forgotMessage,
        'success'
      );
    }


    /* =========================================================
       MESSAGE
    ========================================================= */

    function showMessage(
      text,
      type
    ) {

      const box =
        document.getElementById(
          'message'
        );

      box.textContent = text;

      box.className =
        'message show ' + type;
    }


    function clearMessage() {

      const box =
        document.getElementById(
          'message'
        );

      box.textContent = '';

      box.className =
        'message';
    }


    /* =========================================================
       THEME
    ========================================================= */

    function applyTheme(theme) {

      document.body.classList.toggle(
        'dark',
        theme === 'dark'
      );

      document.getElementById(
        'themeButton'
      ).textContent =
        theme === 'dark'
          ? '☀'
          : '☾';

      localStorage.setItem(
        'mec_theme',
        theme
      );
    }


    function toggleTheme() {

      const dark =
        document.body.classList.contains(
          'dark'
        );

      applyTheme(
        dark
          ? 'light'
          : 'dark'
      );
    }


    /* =========================================================
       INITIALIZE
    ========================================================= */

    const urlParams =
      new URLSearchParams(
        window.location.search
      );

    const requestedMode =
      urlParams.get('mode');

    const savedLanguage =
      localStorage.getItem(
        'mec_language'
      ) || 'en';

    const savedTheme =
      localStorage.getItem(
        'mec_theme'
      ) || 'light';


    applyTheme(savedTheme);

    setMode(
      requestedMode === 'signup'
        ? 'signup'
        : 'login'
    );

    setLanguage(savedLanguage);

  </script>

</body>
</html>

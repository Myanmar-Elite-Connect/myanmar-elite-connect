<!DOCTYPE html>
<html lang="my">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Myanmar Elite Connect</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase.js"></script>

  <style>

    body {
      margin: 0;
      min-height: 100vh;
      background: #071b3a;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 20px;
    }

    h1 {
      text-align: center;
      color: #071b3a;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 7px 0 15px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #071b3a;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      line-height: 1.6;
      word-break: break-word;
    }

  </style>
</head>


<body>

<div class="card">

  <h1>Myanmar Elite Connect</h1>

  <p>
    Create your account
  </p>


  <label>Full Name</label>

  <input
    id="name"
    type="text"
    placeholder="Your Name"
  >


  <label>Email</label>

  <input
    id="email"
    type="email"
    placeholder="your@email.com"
  >


  <label>Password</label>

  <input
    id="password"
    type="password"
    placeholder="At least 6 characters"
  >


  <label>Phone</label>

  <input
    id="phone"
    type="tel"
    placeholder="09xxxxxxxxx"
  >


  <button id="signup">
    Create Account
  </button>


  <div id="result"></div>

</div>


<script>

const result =
  document.getElementById("result");


document
  .getElementById("signup")
  .addEventListener(
    "click",
    async function () {

      result.textContent =
        "Creating Account...";


      try {

        const name =
          document
            .getElementById("name")
            .value
            .trim();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        const phone =
          document
            .getElementById("phone")
            .value
            .trim();


        if (!name) {

          throw new Error(
            "Name ထည့်ပါ။"
          );

        }


        if (!email) {

          throw new Error(
            "Email ထည့်ပါ။"
          );

        }


        if (password.length < 6) {

          throw new Error(
            "Password အနည်းဆုံး 6 လုံး ထည့်ပါ။"
          );

        }


        if (
          typeof supabaseClient ===
          "undefined"
        ) {

          throw new Error(
            "Supabase client မတွေ့ပါ။"
          );

        }


        const {
          data,
          error
        } =
          await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

              data: {

                full_name: name,

                phone: phone

              }

            }

          });


        if (error) {

          throw error;

        }


        result.textContent =
          "✅ Account ဖန်တီးပြီးပါပြီ။";


        console.log(
          "SIGNUP SUCCESS:",
          data
        );


      } catch (error) {

        console.error(
          "SIGNUP ERROR:",
          error
        );


        result.textContent =
          "❌ " +
          error.message;

      }

    }
  );

</script>

</body>

</html>

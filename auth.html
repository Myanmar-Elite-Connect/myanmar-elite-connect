<!DOCTYPE html>
<html lang="my">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login - Myanmar Elite Connect</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase.js"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        Arial,
        "Noto Sans Myanmar",
        sans-serif;

      min-height: 100vh;

      background: #071b3a;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .brand {
      text-align: center;
      color: white;
      margin-bottom: 25px;
    }

    .brand h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .brand p {
      opacity: 0.8;
      font-size: 14px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow:
        0 20px 50px rgba(0,0,0,0.25);
    }

    .tabs {
      display: flex;
      background: #f1f4f8;
      padding: 5px;
      border-radius: 10px;
      margin-bottom: 25px;
    }

    .tabs button {
      width: 50%;
      border: none;
      padding: 12px;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      font-weight: 700;
      color: #667085;
    }

    .tabs button.active {
      background: #071b3a;
      color: white;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 7px;
      color: #172033;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d9dee8;
      border-radius: 9px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #071b3a;
    }

    .submit-btn {
      width: 100%;
      border: none;
      background: #071b3a;
      color: white;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 5px;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 9px;
      margin-bottom: 18px;
      font-size: 14px;
      line-height: 1.6;
    }

    .message.success {
      display: block;
      background: #e9f8ef;
      color: #176b38;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #b42318;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #071b3a;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 480px) {

      .card {
        padding: 23px;
      }

      .brand h1 {
        font-size: 24px;
      }

    }

  </style>

</head>

<body>

  <div class="container">

    <div class="brand">

      <h1>
        Myanmar Elite Connect
      </h1>

      <p>
        Find. Connect. Trade.
      </p>

    </div>


    <div class="card">


      <!-- TABS -->

      <div class="tabs">

        <button
          id="loginTab"
          class="active"
          onclick="showLogin()"
        >
          Login
        </button>

        <button
          id="registerTab"
          onclick="showRegister()"
        >
          Register
        </button>

      </div>


      <!-- MESSAGE -->

      <div
        id="message"
        class="message"
      ></div>


      <!-- LOGIN FORM -->

      <form
        id="loginForm"
        onsubmit="loginUser(event)"
      >

        <div class="form-group">

          <label>
            Email
          </label>

          <input
            type="email"
            id="loginEmail"
            placeholder="example@email.com"
            required
          >

        </div>


        <div class="form-group">

          <label>
            Password
          </label>

          <input
            type="password"
            id="loginPassword"
            placeholder="Password"
            required
          >

        </div>


        <button
          type="submit"
          class="submit-btn"
          id="loginButton"
        >
          Login
        </button>

      </form>


      <!-- REGISTER FORM -->

      <form
        id="registerForm"
        class="hidden"
        onsubmit="registerUser(event)"
      >

        <div class="form-group">

          <label>
            Full Name
          </label>

          <input
            type="text"
            id="registerName"
            placeholder="Your Name"
            required
          >

        </div>


        <div class="form-group">

          <label>
            Email
          </label>

          <input
            type="email"
            id="registerEmail"
            placeholder="example@email.com"
            required
          >

        </div>


        <div class="form-group">

          <label>
            Password
          </label>

          <input
            type="password"
            id="registerPassword"
            placeholder="At least 6 characters"
            minlength="6"
            required
          >

        </div>


        <div class="form-group">

          <label>
            Phone Number
          </label>

          <input
            type="tel"
            id="registerPhone"
            placeholder="09xxxxxxxxx"
          >

        </div>


        <button
          type="submit"
          class="submit-btn"
          id="registerButton"
        >
          Create Account
        </button>

      </form>


      <a
        href="./index.html"
        class="back"
      >
        ← Back to Marketplace
      </a>

    </div>

  </div>


  <script>


    /* =========================
       TAB SWITCH
    ========================= */

    function showLogin() {

      document
        .getElementById("loginForm")
        .classList.remove("hidden");

      document
        .getElementById("registerForm")
        .classList.add("hidden");

      document
        .getElementById("loginTab")
        .classList.add("active");

      document
        .getElementById("registerTab")
        .classList.remove("active");

      clearMessage();

    }


    function showRegister() {

      document
        .getElementById("loginForm")
        .classList.add("hidden");

      document
        .getElementById("registerForm")
        .classList.remove("hidden");

      document
        .getElementById("loginTab")
        .classList.remove("active");

      document
        .getElementById("registerTab")
        .classList.add("active");

      clearMessage();

    }


    /* =========================
       MESSAGE
    ========================= */

    function showMessage(
      text,
      type
    ) {

      const message =
        document.getElementById(
          "message"
        );

      message.textContent = text;

      message.className =
        "message " + type;

    }


    function clearMessage() {

      const message =
        document.getElementById(
          "message"
        );

      message.textContent = "";

      message.className =
        "message";

    }


    /* =========================
       REGISTER
    ========================= */

    async function registerUser(event) {

      event.preventDefault();


      const button =
        document.getElementById(
          "registerButton"
        );


      const name =
        document.getElementById(
          "registerName"
        ).value.trim();


      const email =
        document.getElementById(
          "registerEmail"
        ).value.trim();


      const password =
        document.getElementById(
          "registerPassword"
        ).value;


      const phone =
        document.getElementById(
          "registerPhone"
        ).value.trim();


      button.disabled = true;

      button.textContent =
        "Creating Account...";


      clearMessage();


      try {

        const {
          data,
          error
        } = await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options: {

            data: {

              full_name: name,

              phone: phone

            }

          }

        });


        if (error) {

          throw error;

        }


        /*
          Create profile after signup
          when session is available.
        */

        if (data.user && data.session) {

          const {
            error: profileError
          } = await supabaseClient
            .from("profiles")
            .upsert({

              id: data.user.id,

              full_name: name,

              phone: phone

            });


          if (profileError) {

            console.error(
              profileError
            );

          }

        }


        if (data.session) {

          showMessage(
            "Account ဖန်တီးပြီးပါပြီ။ Marketplace သို့ ဝင်ရောက်နေပါသည်...",
            "success"
          );


          setTimeout(() => {

            window.location.href =
              "./index.html";

          }, 1200);

        } else {

          showMessage(
            "Account ဖန်တီးပြီးပါပြီ။ သင့် Email ကိုစစ်ပြီး Confirmation Link ကိုနှိပ်ပါ။",
            "success"
          );

        }


      } catch (error) {

        console.error(error);

        showMessage(
          error.message ||
          "Account ဖန်တီးရာတွင် အမှားတစ်ခု ဖြစ်ပေါ်ခဲ့ပါသည်။",
          "error"
        );

      } finally {

        button.disabled = false;

        button.textContent =
          "Create Account";

      }

    }


    /* =========================
       LOGIN
    ========================= */

    async function loginUser(event) {

      event.preventDefault();


      const button =
        document.getElementById(
          "loginButton"
        );


      const email =
        document.getElementById(
          "loginEmail"
        ).value.trim();


      const password =
        document.getElementById(
          "loginPassword"
        ).value;


      button.disabled = true;

      button.textContent =
        "Logging in...";


      clearMessage();


      try {

        const {
          data,
          error
        } = await supabaseClient.auth
          .signInWithPassword({

            email: email,

            password: password

          });


        if (error) {

          throw error;

        }


        showMessage(
          "Login အောင်မြင်ပါသည်။ Marketplace သို့ ဝင်ရောက်နေပါသည်...",
          "success"
        );


        setTimeout(() => {

          window.location.href =
            "./index.html";

        }, 1000);


      } catch (error) {

        console.error(error);

        showMessage(
          error.message ||
          "Login မအောင်မြင်ပါ။ Email နှင့် Password ကို ပြန်စစ်ပါ။",
          "error"
        );

      } finally {

        button.disabled = false;

        button.textContent =
          "Login";

      }

    }


    /* =========================
       CHECK CURRENT SESSION
    ========================= */

    async function checkSession() {

      try {

        const {
          data
        } =
          await supabaseClient.auth
            .getSession();


        if (data.session) {

          console.log(
            "User already logged in."
          );

        }

      } catch (error) {

        console.error(error);

      }

    }


    checkSession();


  </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login — Myanmar Elite Connect</title>

  <link rel="stylesheet" href="./style.css">

</head>

<body>

  <div class="auth-page">

    <div class="auth-card">

      <a
        href="./index.html"
        class="auth-logo"
      >
        ME
      </a>


      <div class="auth-heading">

        <span id="authEyebrow">
          WELCOME BACK
        </span>

        <h1 id="authTitle">
          Sign in
        </h1>

        <p id="authDescription">
          Sign in to continue to Myanmar Elite Connect.
        </p>

      </div>


      <!-- ERROR -->

      <div
        id="authError"
        class="auth-message error"
        style="display:none;"
      ></div>


      <!-- SUCCESS -->

      <div
        id="authSuccess"
        class="auth-message success"
        style="display:none;"
      ></div>


      <!-- AUTH FORM -->

      <form id="authForm">


        <!-- NAME -->

        <div
          class="form-group"
          id="nameGroup"
          style="display:none;"
        >

          <label for="name">
            Full Name
          </label>

          <input
            id="name"
            type="text"
            placeholder="Your full name"
            autocomplete="name"
          >

        </div>


        <!-- EMAIL -->

        <div class="form-group">

          <label for="email">
            Email
          </label>

          <input
            id="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            id="password"
            type="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          >

        </div>


        <!-- CONFIRM PASSWORD -->

        <div
          class="form-group"
          id="confirmGroup"
          style="display:none;"
        >

          <label for="confirmPassword">
            Confirm Password
          </label>

          <input
            id="confirmPassword"
            type="password"
            placeholder="••••••••"
            autocomplete="new-password"
          >

        </div>


        <button
          type="submit"
          class="auth-submit"
          id="authSubmit"
        >
          Sign In
        </button>

      </form>


      <!-- SWITCH -->

      <div class="auth-switch">

        <span id="switchText">
          Don't have an account?
        </span>

        <button
          type="button"
          id="switchMode"
        >
          Create account
        </button>

      </div>


      <a
        href="./index.html"
        class="back-home"
      >
        ← Back to website
      </a>

    </div>

  </div>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background:
        radial-gradient(circle at top right, rgba(30,111,255,.18), transparent 35%),
        radial-gradient(circle at bottom left, rgba(20,180,120,.10), transparent 35%),
        #061630;
    }

    .auth-card {
      width: 100%;
      max-width: 460px;
      padding: 38px;
      border-radius: 28px;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.11);
      box-shadow: 0 30px 90px rgba(0,0,0,.35);
      backdrop-filter: blur(20px);
      color: white;
    }

    .auth-logo {
      width: 64px;
      height: 64px;
      border-radius: 19px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #061630;
      font-size: 20px;
      font-weight: 900;
      background: linear-gradient(135deg,#d9b65b,#fff0a8);
    }

    .auth-heading span {
      color: #d9b65b;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    .auth-heading h1 {
      margin: 8px 0;
      font-size: 38px;
    }

    .auth-heading p {
      margin: 0 0 28px;
      color: #96a5bb;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #cbd5e4;
      font-size: 13px;
      font-weight: 700;
    }

    .form-group input {
      width: 100%;
      padding: 14px 15px;
      border-radius: 13px;
      outline: none;
      color: white;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
    }

    .form-group input:focus {
      border-color: #d9b65b;
      box-shadow: 0 0 0 3px rgba(217,182,91,.10);
    }

    .auth-submit {
      width: 100%;
      margin-top: 8px;
      padding: 15px;
      border: 0;
      border-radius: 14px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 900;
      color: #061630;
      background: linear-gradient(135deg,#d9b65b,#fff0a8);
    }

    .auth-switch {
      margin-top: 23px;
      text-align: center;
      color: #8797af;
      font-size: 14px;
    }

    .auth-switch button {
      border: 0;
      background: transparent;
      color: #d9b65b;
      cursor: pointer;
      font-weight: 800;
    }

    .back-home {
      display: block;
      margin-top: 24px;
      text-align: center;
      color: #7f91aa;
      text-decoration: none;
      font-size: 13px;
    }

    .auth-message {
      padding: 12px 14px;
      margin-bottom: 18px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
    }

    .auth-message.error {
      color: #ffd6d6;
      background: rgba(220,50,50,.13);
      border: 1px solid rgba(220,50,50,.25);
    }

    .auth-message.success {
      color: #d4ffe7;
      background: rgba(20,180,120,.12);
      border: 1px solid rgba(20,180,120,.25);
    }

    @media(max-width:520px) {

      .auth-page {
        padding: 15px;
      }

      .auth-card {
        padding: 25px 20px;
        border-radius: 22px;
      }

      .auth-heading h1 {
        font-size: 32px;
      }

    }

  </style>


  <script src="./supabase.js"></script>


  <script>

    let mode = "login";


    const authForm =
      document.getElementById("authForm");

    const authTitle =
      document.getElementById("authTitle");

    const authEyebrow =
      document.getElementById("authEyebrow");

    const authDescription =
      document.getElementById("authDescription");

    const authSubmit =
      document.getElementById("authSubmit");

    const switchMode =
      document.getElementById("switchMode");

    const switchText =
      document.getElementById("switchText");

    const nameGroup =
      document.getElementById("nameGroup");

    const confirmGroup =
      document.getElementById("confirmGroup");

    const nameInput =
      document.getElementById("name");

    const confirmInput =
      document.getElementById("confirmPassword");

    const errorBox =
      document.getElementById("authError");

    const successBox =
      document.getElementById("authSuccess");


    /* -----------------------------------
       URL MODE
    ----------------------------------- */

    const params =
      new URLSearchParams(
        window.location.search
      );

    if(params.get("mode") === "signup"){
      mode = "signup";
    }


    function updateMode(){

      const signup =
        mode === "signup";


      authTitle.textContent =
        signup
          ? "Create account"
          : "Sign in";


      authEyebrow.textContent =
        signup
          ? "JOIN THE MARKETPLACE"
          : "WELCOME BACK";


      authDescription.textContent =
        signup
          ? "Create your account to access the marketplace."
          : "Sign in to continue to Myanmar Elite Connect.";


      authSubmit.textContent =
        signup
          ? "Create Account"
          : "Sign In";


      switchText.textContent =
        signup
          ? "Already have an account?"
          : "Don't have an account?";


      switchMode.textContent =
        signup
          ? "Sign in"
          : "Create account";


      nameGroup.style.display =
        signup ? "block" : "none";


      confirmGroup.style.display =
        signup ? "block" : "none";


      nameInput.required =
        signup;


      confirmInput.required =
        signup;

    }


    updateMode();


    switchMode.addEventListener(
      "click",
      () => {

        mode =
          mode === "login"
            ? "signup"
            : "login";

        hideMessages();

        updateMode();

      }
    );


    function showError(message){

      errorBox.textContent =
        message;

      errorBox.style.display =
        "block";

      successBox.style.display =
        "none";

    }


    function showSuccess(message){

      successBox.textContent =
        message;

      successBox.style.display =
        "block";

      errorBox.style.display =
        "none";

    }


    function hideMessages(){

      errorBox.style.display =
        "none";

      successBox.style.display =
        "none";

    }


    /* -----------------------------------
       SUPABASE CLIENT
    ----------------------------------- */

    function getSupabaseClient(){

      if(window.supabaseClient){
        return window.supabaseClient;
      }

      if(window.supabase){
        return window.supabase;
      }

      return null;

    }


    /* -----------------------------------
       SUBMIT
    ----------------------------------- */

    authForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        hideMessages();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        const client =
          getSupabaseClient();


        if(!client){

          showError(
            "Supabase connection is not available. Please check supabase.js."
          );

          return;

        }


        authSubmit.disabled =
          true;


        authSubmit.textContent =
          mode === "login"
            ? "Signing in..."
            : "Creating account...";


        try{


          /* LOGIN */

          if(mode === "login"){

            const result =
              await client.auth.signInWithPassword({
                email,
                password
              });


            if(result.error){

              throw result.error;

            }


            window.location.href =
              "./general.html";

            return;

          }


          /* SIGN UP */

          const fullName =
            nameInput.value.trim();


          if(password.length < 6){

            throw new Error(
              "Password must contain at least 6 characters."
            );

          }


          if(
            password !==
            confirmInput.value
          ){

            throw new Error(
              "Passwords do not match."
            );

          }


          const result =
            await client.auth.signUp({

              email,

              password,

              options: {
                data: {
                  full_name: fullName
                }
              }

            });


          if(result.error){

            throw result.error;

          }


          /*
             If email confirmation is disabled,
             session exists and user can go directly
             to General.

             If confirmation is enabled,
             show the confirmation message.
          */

          if(result.data.session){

            window.location.href =
              "./general.html";

          } else {

            showSuccess(
              "Account created successfully. Please check your email to verify your account."
            );

          }


        }catch(error){

          console.error(error);

          showError(
            error.message ||
            "Authentication failed."
          );


        }finally{

          authSubmit.disabled =
            false;

          authSubmit.textContent =
            mode === "login"
              ? "Sign In"
              : "Create Account";

        }

      }
    );

  </script>

</body>
</html>

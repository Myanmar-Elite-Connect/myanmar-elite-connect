<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buy • Myanmar Elite Connect</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --soft: #f7f9fc;
      --text: #10233f;
      --muted: #718096;
      --border: rgba(16, 35, 63, .10);
      --gold: #d8b45c;
      --gold-light: #f4d98a;
      --navy: #071a34;
      --green: #2d8a61;
      --danger: #c94b4b;
      --shadow: 0 12px 35px rgba(13, 35, 64, .07);
    }

    body.dark {
      --bg: #071321;
      --surface: #0e1e32;
      --soft: #10243c;
      --text: #f3f6fa;
      --muted: #91a0b4;
      --border: rgba(255, 255, 255, .10);
      --navy: #f3f6fa;
      --shadow: 0 12px 35px rgba(0, 0, 0, .28);
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        "Noto Sans Myanmar",
        "Myanmar Text",
        system-ui,
        sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button,
    select {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      max-width: 100%;
    }

    /* =========================
       HEADER
    ========================= */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 68px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    body.dark .topbar {
      background: rgba(7,19,33,.94);
    }

    .topbar-inner {
      width: min(1200px, 94%);
      height: 100%;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .brand img {
      width: 39px;
      height: 39px;
      object-fit: contain;
      border-radius: 11px;
      background: var(--surface);
    }

    .brand-name {
      font-size: 14px;
      font-weight: 950;
      white-space: nowrap;
    }

    .brand-name span {
      color: var(--gold);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .nav a {
      padding: 9px 12px;
      border-radius: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
    }

    .nav a:hover,
    .nav a.active {
      background: var(--soft);
      color: var(--text);
    }

    .nav a.active {
      color: var(--gold);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .icon-btn,
    .profile {
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
    }

    .icon-btn {
      display: grid;
      place-items: center;
      color: var(--text);
    }

    .profile {
      overflow: hidden;
      display: block;
      background: var(--soft);
    }

    .profile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* =========================
       PAGE
    ========================= */

    .container {
      width: min(1200px, 94%);
      margin: auto;
      padding: 26px 0 95px;
    }

    .page-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .eyebrow {
      color: var(--gold);
      font-size: 9px;
      font-weight: 950;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .page-title {
      margin-top: 5px;
      font-size: clamp(26px, 4vw, 36px);
      line-height: 1.1;
      font-weight: 950;
      letter-spacing: -.8px;
    }

    .page-subtitle {
      margin-top: 7px;
      color: var(--muted);
      font-size: 11px;
    }

    .result-count {
      color: var(--muted);
      font-size: 10px;
      font-weight: 850;
      white-space: nowrap;
    }

    /* =========================
       FILTER
    ========================= */

    .filter-panel {
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .category-tabs {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .category-tabs::-webkit-scrollbar {
      display: none;
    }

    .category-tab {
      flex: 0 0 auto;
      height: 38px;
      min-width: 82px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--soft);
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
    }

    .category-tab.active {
      border-color: transparent;
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      color: #071a34;
    }

    .filter-row {
      display: grid;
      grid-template-columns:
        minmax(190px, 1.8fr)
        minmax(160px, 1fr)
        minmax(160px, 1fr)
        minmax(150px, 1fr)
        auto;
      gap: 8px;
      margin-top: 10px;
    }

    .field {
      width: 100%;
      height: 43px;
      min-width: 0;
      outline: none;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--soft);
      color: var(--text);
    }

    input.field {
      padding: 0 12px;
    }

    select.field {
      padding: 0 10px;
    }

    .field:focus {
      border-color: rgba(216,180,92,.75);
    }

    .reset-btn {
      height: 43px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--surface);
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
    }

    .reset-btn:hover {
      color: var(--text);
      border-color: rgba(216,180,92,.6);
    }

    /* =========================
       LISTINGS HEADER
    ========================= */

    .listings-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 23px 1px 11px;
    }

    .listings-head strong {
      font-size: 14px;
      font-weight: 950;
    }

    .sort-select {
      height: 34px;
      padding: 0 9px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface);
      color: var(--text);
      font-size: 10px;
      font-weight: 800;
      outline: none;
    }

    /* =========================
       GRID
    ========================= */

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 15px;
    }

    /* =========================
       CARD
    ========================= */

    .listing-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
      transition:
        transform .2s ease,
        box-shadow .2s ease,
        border-color .2s ease;
    }

    .listing-card:hover {
      transform: translateY(-3px);
      border-color: rgba(216,180,92,.42);
      box-shadow: 0 20px 48px rgba(13,35,64,.11);
    }

    .listing-image {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: var(--soft);
    }

    .listing-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .35s ease;
    }

    .listing-card:hover .listing-image img {
      transform: scale(1.035);
    }

    .no-image {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .category-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 6px 8px;
      border-radius: 7px;
      background: var(--gold);
      color: #071a34;
      font-size: 8px;
      font-weight: 950;
    }

    .featured-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 6px 8px;
      border-radius: 7px;
      background: rgba(7,26,52,.78);
      color: white;
      font-size: 8px;
      font-weight: 900;
      backdrop-filter: blur(8px);
    }

    .photo-count {
      position: absolute;
      right: 10px;
      bottom: 10px;
      padding: 5px 7px;
      border-radius: 7px;
      background: rgba(0,0,0,.58);
      color: white;
      font-size: 8px;
      font-weight: 850;
    }

    .listing-content {
      padding: 13px;
    }

    .listing-title {
      min-height: 34px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 950;
    }

    .price {
      margin-top: 7px;
      font-size: 15px;
      font-weight: 950;
    }

    .location {
      display: flex;
      align-items: flex-start;
      gap: 5px;
      margin-top: 7px;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.45;
    }

    .location-icon {
      flex: none;
      color: var(--gold);
    }

    .listing-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
      margin-top: 11px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .listing-type {
      color: var(--green);
      font-size: 8px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .date {
      color: var(--muted);
      font-size: 8px;
    }

    /* =========================
       STATES
    ========================= */

    .state {
      min-height: 42vh;
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--muted);
    }

    .state-icon {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      margin-bottom: 12px;
      border-radius: 17px;
      background: var(--soft);
      color: var(--gold);
      font-size: 22px;
    }

    .state strong {
      color: var(--text);
      font-size: 15px;
    }

    .state span {
      max-width: 410px;
      margin-top: 5px;
      font-size: 10px;
      line-height: 1.6;
    }

    .retry-btn {
      height: 38px;
      margin-top: 15px;
      padding: 0 15px;
      border: 0;
      border-radius: 10px;
      background: var(--gold);
      color: #071a34;
      font-size: 10px;
      font-weight: 900;
    }

    /* =========================
       MOBILE NAV
    ========================= */

    .mobile-nav {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 200;
      height: 67px;
      border-top: 1px solid var(--border);
      background: rgba(255,255,255,.95);
      backdrop-filter: blur(18px);
    }

    body.dark .mobile-nav {
      background: rgba(7,19,33,.96);
    }

    .mobile-nav-inner {
      height: 100%;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
    }

    .mobile-nav a {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
    }

    .mobile-nav a.active {
      color: var(--gold);
    }

    .mobile-icon {
      font-size: 17px;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 1050px) {
      .nav {
        display: none;
      }

      .mobile-nav {
        display: block;
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .filter-row {
        grid-template-columns: 1fr 1fr;
      }

      .search-field {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 620px) {
      .topbar {
        height: 62px;
      }

      .brand-name {
        display: none;
      }

      .icon-btn,
      .profile {
        width: 37px;
        height: 37px;
      }

      .container {
        width: 94%;
        padding-top: 18px;
      }

      .page-heading {
        align-items: flex-start;
        flex-direction: column;
        gap: 7px;
      }

      .filter-panel {
        padding: 10px;
        border-radius: 15px;
      }

      .filter-row {
        grid-template-columns: 1fr;
      }

      .search-field {
        grid-column: auto;
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
      }

      .listing-card {
        border-radius: 14px;
      }

      .listing-content {
        padding: 10px;
      }

      .listing-title {
        min-height: 30px;
        font-size: 11px;
      }

      .price {
        font-size: 12px;
      }

      .location {
        font-size: 8px;
      }

      .date {
        display: none;
      }
    }

    @media (max-width: 390px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .listing-image {
        aspect-ratio: 16 / 10;
      }
    }
  </style>
<script src="./mec-theme.js"></script>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">

    <a href="./general.html" class="brand">
      <img
        src="https://lh3.googleusercontent.com/d/1fR8TnvOjrzVbKuro9Ths1_Jt0PAxSmGd"
        alt="Myanmar Elite Connect">
      <div class="brand-name">
        Myanmar <span>Elite</span> Connect
      </div>
    </a>

    <nav class="nav">
      <a href="./general.html">Home</a>
      <a href="./buy.html" class="active">Buy</a>
      <a href="./sell.html">Sell</a>
      <a href="./car.html">Cars</a>

    </nav>

    <div class="header-actions">

      <button
        id="themeButton"
        class="icon-btn"
        type="button"
        aria-label="Toggle theme">
        ☾
      </button>

      <a
        href="./profile.html"
        class="profile"
        aria-label="Profile">
        <img id="avatar" src="" alt="Profile">
      </a>

    </div>

  </div>
</header>


<main class="container">

  <section class="page-heading">

    <div>
      <div class="eyebrow">Myanmar Elite Connect</div>

      <h1 class="page-title">Buy</h1>

      <p class="page-subtitle">
        Find approved cars, properties and gems for sale.
      </p>
    </div>

    <div id="resultCount" class="result-count">
      Loading...
    </div>

  </section>


  <section class="filter-panel">

    <div class="category-tabs">

      <button
        class="category-tab active"
        data-category="all"
        type="button">
        All
      </button>

      <button
        class="category-tab"

      </button>

      <button
        class="category-tab"
        data-category="property"
        type="button">
        🏠 Property
      </button>

      <button
        class="category-tab"
        data-category="gem"
        type="button">
        💎 Gems
      </button>

    </div>


    <div class="filter-row">

      <input
        id="searchInput"
        class="field search-field"

        placeholder="Search cars, property or gems...">

      <select id="regionFilter" class="field">
        <option value="">All Regions / States</option>
      </select>

      <select id="townshipFilter" class="field">
        <option value="">All Townships</option>
      </select>

      <select id="priceFilter" class="field">
        <option value="">Any Price</option>
        <option value="0-50000000">Under 50M MMK</option>
        <option value="50000000-100000000">50M – 100M MMK</option>
        <option value="100000000-500000000">100M – 500M MMK</option>
        <option value="500000000+">500M+ MMK</option>
      </select>

      <button
        id="resetButton"
        class="reset-btn"
        type="button">
        Reset
      </button>

    </div>

  </section>


  <div class="listings-head">

    <strong>Latest Listings</strong>

    <select id="sortSelect" class="sort-select">
      <option value="newest">Newest</option>
      <option value="oldest">Oldest</option>
      <option value="price-low">Price: Low to High</option>
      <option value="price-high">Price: High to Low</option>
    </select>

  </div>


  <section id="listingGrid" class="grid"></section>

</main>


<nav class="mobile-nav">

  <div class="mobile-nav-inner">

    <a href="./general.html">
      <div class="mobile-icon">⌂</div>
      Home
    </a>

    <a href="./buy.html" class="active">
      <div class="mobile-icon">◈</div>
      Buy
    </a>

    <a href="./add-listing.html">
      <div class="mobile-icon">＋</div>
      Sell
    </a>

    <a href="./chat.html">
      <div class="mobile-icon">◌</div>
      Chat
    </a>

    <a href="./profile.html">
      <div class="mobile-icon">♙</div>
      Profile
    </a>

  </div>

</nav>


<script>
  /* =====================================================
     CONFIG
  ===================================================== */

  const ALLOWED_CATEGORIES = ["car", "property", "gem"];

  /*
   * Myanmar's 7 Regions + 7 States + Naypyidaw
   */
  const MYANMAR_LOCATIONS = [
    {
      value: "Ayeyarwady",
      label: "Ayeyarwady Region"
    },
    {
      value: "Bago",
      label: "Bago Region"
    },
    {
      value: "Magway",
      label: "Magway Region"
    },
    {
      value: "Mandalay",
      label: "Mandalay Region"
    },
    {
      value: "Sagaing",
      label: "Sagaing Region"
    },
    {
      value: "Tanintharyi",
      label: "Tanintharyi Region"
    },
    {
      value: "Yangon",
      label: "Yangon Region"
    },
    {
      value: "Chin",
      label: "Chin State"
    },
    {
      value: "Kachin",
      label: "Kachin State"
    },
    {
      value: "Kayah",
      label: "Kayah State"
    },
    {
      value: "Kayin",
      label: "Kayin State"
    },
    {
      value: "Mon",
      label: "Mon State"
    },
    {
      value: "Rakhine",
      label: "Rakhine State"
    },
    {
      value: "Shan",
      label: "Shan State"
    },
    {
      value: "Naypyidaw",
      label: "Naypyidaw Union Territory"
    }
  ];


  /* =====================================================
     STATE
  ===================================================== */

  let allListings = [];
  let activeCategory = "all";


  /* =====================================================
     DOM
  ===================================================== */

  const listingGrid =
    document.getElementById("listingGrid");

  const resultCount =
    document.getElementById("resultCount");

  const searchInput =
    document.getElementById("searchInput");

  const regionFilter =
    document.getElementById("regionFilter");

  const townshipFilter =
    document.getElementById("townshipFilter");

  const priceFilter =
    document.getElementById("priceFilter");

  const sortSelect =
    document.getElementById("sortSelect");

  const resetButton =
    document.getElementById("resetButton");

  const themeButton =
    document.getElementById("themeButton");

  const avatar =
    document.getElementById("avatar");


  /* =====================================================
     HELPERS
  ===================================================== */

  function normalize(value) {
    return String(value ?? "")
      .trim()
      .toLowerCase();
  }


  function escapeHTML(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function categoryLabel(category) {
    const value = normalize(category);

    if (value === "car") return "CAR";
    if (value === "property") return "PROPERTY";
    if (value === "gem") return "GEM";

    return "";
  }


  function numericPrice(item) {
    const value = Number(item?.price);
    return Number.isFinite(value) ? value : 0;
  }


  function formatPrice(item) {
    const price = numericPrice(item);

    if (price <= 0) {
      return "Price on request";
    }

    const currency =
      String(item?.currency || "MMK");

    return `${escapeHTML(currency)} ${price.toLocaleString()}`;
  }


  function getImages(item) {
    if (!Array.isArray(item?.images)) {
      return [];
    }

    return item.images.filter(
      image =>
        typeof image === "string" &&
        image.trim() !== ""
    );
  }


  function formatDate(value) {
    if (!value) return "";

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
      return "";
    }

    return date.toLocaleDateString("en-GB", {
      day: "2-digit",
      month: "short",
      year: "numeric"
    });
  }


  /* =====================================================
     LOCATION
  ===================================================== */

  function normalizeRegion(value) {
    const text = normalize(value);

    if (!text) return "";

    const aliases = {
      "ayeyarwady region": "ayeyarwady",
      "ayeyarwady": "ayeyarwady",

      "bago region": "bago",
      "bago": "bago",

      "magway region": "magway",
      "magway": "magway",

      "mandalay region": "mandalay",
      "mandalay": "mandalay",

      "sagaing region": "sagaing",
      "sagaing": "sagaing",

      "tanintharyi region": "tanintharyi",
      "tanintharyi": "tanintharyi",

      "yangon region": "yangon",
      "yangon": "yangon",

      "chin state": "chin",
      "chin": "chin",

      "kachin state": "kachin",
      "kachin": "kachin",

      "kayah state": "kayah",
      "kayah": "kayah",

      "kayin state": "kayin",
      "kayin": "kayin",

      "mon state": "mon",
      "mon": "mon",

      "rakhine state": "rakhine",
      "rakhine": "rakhine",

      "shan state": "shan",
      "shan": "shan",

      "naypyidaw union territory": "naypyidaw",
      "naypyidaw": "naypyidaw",
      "nay pyi taw": "naypyidaw",
      "naypyitaw": "naypyidaw"
    };

    return aliases[text] || text;
  }


  function getItemRegion(item) {
    return normalizeRegion(item?.city);
  }


  function formatLocation(item) {
    const parts = [
      item?.city,
      item?.township,
      item?.address
    ]
      .map(value => String(value ?? "").trim())
      .filter(Boolean);

    const unique = [];

    for (const part of parts) {
      if (
        !unique.some(
          existing =>
            normalize(existing) === normalize(part)
        )
      ) {
        unique.push(part);
      }
    }

    return unique.length
      ? unique.join(" · ")
      : "Myanmar";
  }


  /* =====================================================
     THEME
  ===================================================== */

  function applyTheme(theme) {
    const isDark = theme === "dark";

    document.body.classList.toggle(
      "dark",
      isDark
    );

    themeButton.textContent =
      isDark ? "☀" : "☾";

    localStorage.setItem(
      "mec_theme",
      theme
    );
  }


  function toggleTheme() {
    const isDark =
      document.body.classList.contains("dark");

    applyTheme(
      isDark ? "light" : "dark"
    );
  }


  themeButton.addEventListener(
    "click",
    toggleTheme
  );


  /* =====================================================
     REGIONS
  ===================================================== */

  function populateRegions() {
    regionFilter.innerHTML = `
      <option value="">
        All Regions / States
      </option>

      ${MYANMAR_LOCATIONS.map(
        location => `
          <option value="${escapeHTML(location.value)}">
            ${escapeHTML(location.label)}
          </option>
        `
      ).join("")}
    `;
  }


  /* =====================================================
     TOWNSHIPS
  ===================================================== */

  function populateTownships() {
    const selectedRegion =
      normalizeRegion(regionFilter.value);

    let source = allListings;

    if (selectedRegion) {
      source = source.filter(
        item =>
          getItemRegion(item) === selectedRegion
      );
    }

    const townships = [
      ...new Set(
        source
          .map(item =>
            String(item?.township || "").trim()
          )
          .filter(Boolean)
      )
    ].sort((a, b) =>
      a.localeCompare(b)
    );

    townshipFilter.innerHTML = `
      <option value="">
        All Townships
      </option>

      ${townships.map(
        township => `
          <option value="${escapeHTML(township)}">
            ${escapeHTML(township)}
          </option>
        `
      ).join("")}
    `;
  }


  /* =====================================================
     PROFILE
  ===================================================== */

  async function loadProfile(user) {
    if (!user) return;

    try {
      const {
        data,
        error
      } = await supabaseClient
        .from("profiles")
        .select("avatar_url")
        .eq("id", user.id)
        .maybeSingle();

      if (
        !error &&
        data?.avatar_url
      ) {
        avatar.src = data.avatar_url;
      }
    } catch (error) {
      console.log(
        "Profile avatar unavailable."
      );
    }
  }


  /* =====================================================
     LOAD LISTINGS
  ===================================================== */

  async function loadListings() {
    showLoading();

    const {
      data,
      error
    } = await supabaseClient
      .from("listings")
      .select(`
        id,
        user_id,
        category,
        listing_type,
        title,
        description,
        price,
        currency,
        city,
        township,
        address,
        status,
        featured,
        created_at,
        updated_at,
        location,
        phone,
        images,
        seller_id,
        post_role
      `)
      .eq("status", "approved")
      .eq("listing_type", "sale")
      .in("category", ALLOWED_CATEGORIES)
      .order("featured", {
        ascending: false
      })
      .order("created_at", {
        ascending: false
      });

    if (error) {
      console.error(
        "Listings error:",
        error
      );

      showError(
        "Listings could not be loaded",
        error.message
      );

      return;
    }

    allListings =
      Array.isArray(data)
        ? data.filter(item =>
            ALLOWED_CATEGORIES.includes(
              normalize(item.category)
            )
          )
        : [];

    populateTownships();
    applyFilters();
  }


  /* =====================================================
     FILTER
  ===================================================== */

  function applyFilters() {
    const search =
      normalize(searchInput.value);

    const selectedRegion =
      normalizeRegion(regionFilter.value);

    const selectedTownship =
      normalize(townshipFilter.value);

    const selectedPrice =
      priceFilter.value;

    let filtered =
      allListings.filter(item => {

        const category =
          normalize(item.category);

        if (
          activeCategory !== "all" &&
          category !== activeCategory
        ) {
          return false;
        }

        if (search) {
          const searchable = [
            item.title,
            item.description,
            item.category,
            item.city,
            item.township,
            item.address,
            item.location
          ]
            .map(normalize)
            .join(" ");

          if (
            !searchable.includes(search)
          ) {
            return false;
          }
        }

        if (selectedRegion) {
          if (
            getItemRegion(item) !==
            selectedRegion
          ) {
            return false;
          }
        }

        if (selectedTownship) {
          if (
            normalize(item.township) !==
            selectedTownship
          ) {
            return false;
          }
        }

        if (
          !matchesPrice(
            numericPrice(item),
            selectedPrice
          )
        ) {
          return false;
        }

        return true;
      });

    sortListings(filtered);
    renderListings(filtered);
  }


  /* =====================================================
     PRICE
  ===================================================== */

  function matchesPrice(price, range) {
    if (!range) {
      return true;
    }

    if (range === "500000000+") {
      return price >= 500000000;
    }

    const [
      min,
      max
    ] = range
      .split("-")
      .map(Number);

    return (
      price >= min &&
      price < max
    );
  }


  /* =====================================================
     SORT
  ===================================================== */

  function sortListings(listings) {
    const sort =
      sortSelect.value;

    if (sort === "newest") {
      listings.sort(
        (a, b) =>
          new Date(b.created_at) -
          new Date(a.created_at)
      );
    }

    if (sort === "oldest") {
      listings.sort(
        (a, b) =>
          new Date(a.created_at) -
          new Date(b.created_at)
      );
    }

    if (sort === "price-low") {
      listings.sort(
        (a, b) =>
          numericPrice(a) -
          numericPrice(b)
      );
    }

    if (sort === "price-high") {
      listings.sort(
        (a, b) =>
          numericPrice(b) -
          numericPrice(a)
      );
    }
  }


  /* =====================================================
     RENDER
  ===================================================== */

  function renderListings(listings) {
    resultCount.textContent =
      `${listings.length} listing${
        listings.length === 1
          ? ""
          : "s"
      }`;

    if (!listings.length) {
      listingGrid.innerHTML = `
        <div class="state">

          <div class="state-icon">
            ⌕
          </div>

          <strong>
            No listings found
          </strong>

          <span>
            Try another category, location,
            township, search term or price range.
          </span>

        </div>
      `;

      return;
    }

    listingGrid.innerHTML =
      listings
        .map(listingCard)
        .join("");
  }


  /* =====================================================
     CARD
  ===================================================== */

  function listingCard(item) {
    const images =
      getImages(item);

    const cover =
      images[0] || "";

    const category =
      categoryLabel(item.category);

    const title =
      String(
        item.title ||
        "Untitled Listing"
      );

    const location =
      formatLocation(item);

    const price =
      formatPrice(item);

    const featured =
      item.featured === true;

    return `
      <a
        class="listing-card"
        href="./listing-detail.html?id=${encodeURIComponent(item.id)}">

        <div class="listing-image">

          ${
            cover
              ? `
                <img
                  src="${escapeHTML(cover)}"
                  alt="${escapeHTML(title)}"
                  loading="lazy"
                  onerror="
                    this.style.display='none';
                    this.parentElement
                      .querySelector('.no-image')
                      .style.display='grid';
                  ">
              `
              : ""
          }

          <div
            class="no-image"
            style="display:${cover ? "none" : "grid"}">
            No image
          </div>

          <div class="category-badge">
            ${escapeHTML(category)}
          </div>

          ${
            featured
              ? `
                <div class="featured-badge">
                  ★ FEATURED
                </div>
              `
              : ""
          }

          ${
            images.length > 1
              ? `
                <div class="photo-count">
                  ▣ ${images.length}
                </div>
              `
              : ""
          }

        </div>


        <div class="listing-content">

          <div class="listing-title">
            ${escapeHTML(title)}
          </div>

          <div class="price">
            ${price}
          </div>

          <div class="location">
            <span class="location-icon">⌖</span>
            <span>
              ${escapeHTML(location)}
            </span>
          </div>

          <div class="listing-meta">

            <span class="listing-type">
              SALE
            </span>

            <span class="date">
              ${escapeHTML(
                formatDate(
                  item.created_at
                )
              )}
            </span>

          </div>

        </div>

      </a>
    `;
  }


  /* =====================================================
     LOADING / ERROR
  ===================================================== */

  function showLoading() {
    resultCount.textContent =
      "Loading...";

    listingGrid.innerHTML = `
      <div class="state">

        <div class="state-icon">
          ◌
        </div>

        <strong>
          Loading listings
        </strong>

        <span>
          Finding approved cars, properties and gems...
        </span>

      </div>
    `;
  }


  function showError(title, message) {
    resultCount.textContent =
      "Error";

    listingGrid.innerHTML = `
      <div class="state">

        <div class="state-icon">
          !
        </div>

        <strong>
          ${escapeHTML(title)}
        </strong>

        <span>
          ${escapeHTML(message)}
        </span>

        <button
          class="retry-btn"
          type="button"
          onclick="loadListings()">
          Try Again
        </button>

      </div>
    `;
  }


  /* =====================================================
     CATEGORY EVENTS
  ===================================================== */

  document
    .querySelectorAll(".category-tab")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(
              ".category-tab"
            )
            .forEach(tab =>
              tab.classList.remove(
                "active"
              )
            );

          button.classList.add(
            "active"
          );

          activeCategory =
            button.dataset.category;

          applyFilters();
        }
      );

    });


  /* =====================================================
     SEARCH / FILTER EVENTS
  ===================================================== */

  searchInput.addEventListener(
    "input",
    applyFilters
  );


  regionFilter.addEventListener(
    "change",
    () => {

      populateTownships();

      townshipFilter.value = "";

      applyFilters();

    }
  );


  townshipFilter.addEventListener(
    "change",
    applyFilters
  );


  priceFilter.addEventListener(
    "change",
    applyFilters
  );


  sortSelect.addEventListener(
    "change",
    applyFilters
  );


  /* =====================================================
     RESET
  ===================================================== */

  resetButton.addEventListener(
    "click",
    () => {

      activeCategory = "all";

      document
        .querySelectorAll(
          ".category-tab"
        )
        .forEach(tab =>
          tab.classList.toggle(
            "active",
            tab.dataset.category === "all"
          )
        );

      searchInput.value = "";

      regionFilter.value = "";

      populateTownships();

      townshipFilter.value = "";

      priceFilter.value = "";

      sortSelect.value = "newest";

      applyFilters();

    }
  );


  /* =====================================================
     INIT
  ===================================================== */

  async function init() {

    applyTheme(
      localStorage.getItem(
        "mec_theme"
      ) || "light"
    );

    populateRegions();

    try {
      const {
        data,
        error
      } =
        await supabaseClient.auth.getUser();

      if (!error && data?.user) {
        await loadProfile(
          data.user
        );
      }
    } catch (error) {
      console.log(
        "User session unavailable."
      );
    }

    await loadListings();
  }


  init();
</script>

</body>
</html>

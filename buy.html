<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Buy • Myanmar Elite Connect</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase.js"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    :root{
      --bg:#f5f7fb;
      --surface:#ffffff;
      --soft:#f7f9fc;
      --text:#10233f;
      --muted:#77849a;
      --border:rgba(16,35,63,.09);
      --gold:#d8b45c;
      --gold-light:#f4d98a;
      --navy:#071a34;
      --green:#2d8a61;
      --red:#c94b4b;
      --shadow:0 16px 45px rgba(13,35,64,.07);
    }

    body.dark{
      --bg:#071321;
      --surface:#0e1e32;
      --soft:#10243c;
      --text:#f3f6fa;
      --muted:#91a0b4;
      --border:rgba(255,255,255,.09);
      --navy:#f3f6fa;
      --shadow:0 16px 45px rgba(0,0,0,.28);
    }

    body{
      min-height:100vh;
      color:var(--text);
      background:var(--bg);
      font-family:
        Inter,
        "Noto Sans Myanmar",
        "Myanmar Text",
        system-ui,
        sans-serif;
      transition:.3s ease;
    }

    button,
    input,
    select{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    img{
      display:block;
      max-width:100%;
    }

    /* ================= HEADER ================= */

    .topbar{
      position:sticky;
      top:0;
      z-index:100;
      height:70px;
      background:rgba(255,255,255,.9);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      border-bottom:1px solid var(--border);
    }

    body.dark .topbar{
      background:rgba(7,19,33,.92);
    }

    .topbar-inner{
      width:min(1180px,92%);
      height:100%;
      margin:auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:15px;
      font-weight:900;
      white-space:nowrap;
    }

    .brand img{
      width:38px;
      height:38px;
      border-radius:11px;
      object-fit:contain;
    }

    .brand span{
      color:var(--gold);
    }

    .nav{
      display:flex;
      align-items:center;
      gap:4px;
    }

    .nav a{
      padding:9px 12px;
      border-radius:10px;
      color:var(--muted);
      font-size:12px;
      font-weight:800;
    }

    .nav a:hover,
    .nav a.active{
      color:var(--text);
      background:var(--soft);
    }

    .actions{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .icon-btn{
      width:40px;
      height:40px;
      display:grid;
      place-items:center;
      border:1px solid var(--border);
      border-radius:12px;
      color:var(--text);
      background:var(--surface);
    }

    .profile{
      width:40px;
      height:40px;
      overflow:hidden;
      border-radius:12px;
      border:1px solid var(--border);
      background:var(--soft);
    }

    .profile img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    /* ================= PAGE ================= */

    .container{
      width:min(1180px,92%);
      margin:auto;
      padding:28px 0 90px;
    }

    .page-heading{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:20px;
      margin-bottom:20px;
    }

    .heading-title{
      font-size:clamp(27px,4vw,38px);
      font-weight:950;
      letter-spacing:-1px;
    }

    .heading-title span{
      color:var(--gold);
    }

    .heading-subtitle{
      margin-top:7px;
      color:var(--muted);
      font-size:11px;
      line-height:1.6;
    }

    .sell-button{
      flex:none;
      height:44px;
      padding:0 17px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:12px;
      color:#071a34;
      background:linear-gradient(
        135deg,
        var(--gold-light),
        var(--gold)
      );
      font-size:11px;
      font-weight:900;
      box-shadow:0 10px 25px rgba(16,35,63,.12);
    }

    /* ================= FILTER ================= */

    .filter-panel{
      padding:15px;
      margin-bottom:22px;
      border:1px solid var(--border);
      border-radius:18px;
      background:var(--surface);
      box-shadow:var(--shadow);
    }

    .filter-row{
      display:grid;
      grid-template-columns:1.5fr 1fr 1fr 1fr auto;
      gap:9px;
    }

    .search-box,
    .filter-select{
      width:100%;
      height:44px;
      padding:0 12px;
      border:1px solid var(--border);
      border-radius:11px;
      outline:none;
      color:var(--text);
      background:var(--soft);
      font-size:11px;
    }

    .search-box:focus,
    .filter-select:focus{
      border-color:rgba(216,180,92,.7);
    }

    .reset-button{
      height:44px;
      padding:0 14px;
      border:1px solid var(--border);
      border-radius:11px;
      color:var(--text);
      background:var(--surface);
      font-size:10px;
      font-weight:850;
    }

    .reset-button:hover{
      border-color:rgba(216,180,92,.55);
    }

    .filter-info{
      display:flex;
      justify-content:space-between;
      gap:10px;
      margin-top:11px;
      color:var(--muted);
      font-size:9px;
    }

    /* ================= LISTINGS ================= */

    .listing-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:12px;
    }

    .listing-heading{
      font-size:14px;
      font-weight:950;
    }

    .listing-count{
      color:var(--muted);
      font-size:9px;
    }

    .listing-grid{
      display:grid;
      grid-template-columns:
        repeat(3,minmax(0,1fr));
      gap:15px;
    }

    .listing-card{
      min-width:0;
      overflow:hidden;
      border:1px solid var(--border);
      border-radius:17px;
      background:var(--surface);
      box-shadow:var(--shadow);
      transition:.22s ease;
    }

    .listing-card:hover{
      transform:translateY(-4px);
      border-color:rgba(216,180,92,.45);
    }

    .listing-image{
      position:relative;
      aspect-ratio:4/3;
      overflow:hidden;
      background:var(--soft);
    }

    .listing-image img{
      width:100%;
      height:100%;
      object-fit:cover;
      transition:.3s ease;
    }

    .listing-card:hover .listing-image img{
      transform:scale(1.035);
    }

    .category-badge{
      position:absolute;
      top:10px;
      left:10px;
      padding:6px 8px;
      border-radius:8px;
      color:#071a34;
      background:var(--gold);
      font-size:8px;
      font-weight:950;
      text-transform:uppercase;
      letter-spacing:.4px;
    }

    .featured-badge{
      position:absolute;
      top:10px;
      right:10px;
      padding:6px 8px;
      border-radius:8px;
      color:#fff;
      background:rgba(7,26,52,.75);
      font-size:8px;
      font-weight:900;
    }

    .listing-content{
      padding:14px;
    }

    .listing-title{
      font-size:14px;
      font-weight:900;
      line-height:1.35;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }

    .listing-price{
      margin-top:8px;
      font-size:17px;
      font-weight:950;
    }

    .listing-location{
      display:flex;
      gap:5px;
      margin-top:8px;
      color:var(--muted);
      font-size:9px;
      line-height:1.45;
    }

    .listing-description{
      margin-top:9px;
      color:var(--muted);
      font-size:9px;
      line-height:1.55;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }

    .listing-footer{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      margin-top:13px;
      padding-top:11px;
      border-top:1px solid var(--border);
    }

    .listing-date{
      color:var(--muted);
      font-size:8px;
    }

    .view-button{
      padding:7px 10px;
      border:1px solid var(--border);
      border-radius:9px;
      color:var(--text);
      background:var(--surface);
      font-size:8px;
      font-weight:900;
    }

    .view-button:hover{
      border-color:rgba(216,180,92,.6);
    }

    /* ================= EMPTY / LOADING ================= */

    .state{
      min-height:42vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:var(--muted);
    }

    .state-icon{
      width:55px;
      height:55px;
      display:grid;
      place-items:center;
      margin-bottom:13px;
      border-radius:16px;
      background:var(--soft);
      color:var(--gold);
      font-size:21px;
    }

    .state strong{
      color:var(--text);
      font-size:14px;
    }

    .state span{
      margin-top:6px;
      font-size:10px;
    }

    .retry{
      margin-top:14px;
      padding:9px 13px;
      border:1px solid var(--border);
      border-radius:9px;
      color:var(--text);
      background:var(--surface);
      font-size:10px;
      font-weight:850;
    }

    /* ================= MOBILE ================= */

    .mobile-nav{
      display:none;
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:200;
      height:67px;
      background:rgba(255,255,255,.95);
      backdrop-filter:blur(18px);
      border-top:1px solid var(--border);
    }

    body.dark .mobile-nav{
      background:rgba(7,19,33,.96);
    }

    .mobile-nav-inner{
      height:100%;
      display:grid;
      grid-template-columns:repeat(5,1fr);
    }

    .mobile-nav a{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:4px;
      color:var(--muted);
      font-size:9px;
      font-weight:800;
    }

    .mobile-nav a.active{
      color:var(--gold);
    }

    .mobile-icon{
      font-size:17px;
    }

    @media(max-width:1050px){

      .filter-row{
        grid-template-columns:
          1fr 1fr 1fr;
      }

      .reset-button{
        width:100%;
      }

      .listing-grid{
        grid-template-columns:
          repeat(2,minmax(0,1fr));
      }
    }

    @media(max-width:800px){

      .nav{
        display:none;
      }

      .mobile-nav{
        display:block;
      }

      .container{
        padding-bottom:95px;
      }

      .page-heading{
        align-items:stretch;
        flex-direction:column;
      }

      .sell-button{
        width:100%;
      }

      .filter-row{
        grid-template-columns:1fr 1fr;
      }
    }

    @media(max-width:560px){

      .container{
        width:94%;
        padding-top:20px;
      }

      .brand-name{
        display:none;
      }

      .filter-row{
        grid-template-columns:1fr;
      }

      .listing-grid{
        grid-template-columns:1fr;
        gap:12px;
      }

      .listing-image{
        aspect-ratio:16/10;
      }

      .heading-title{
        font-size:28px;
      }
    }
  </style>
</head>

<script>

  /* =====================================================
     THEME
  ===================================================== */

  function applyTheme(theme){

    document.body.classList.toggle(
      "dark",
      theme === "dark"
    );

    document.getElementById(
      "themeButton"
    ).textContent =
      theme === "dark"
        ? "☀"
        : "☾";

    localStorage.setItem(
      "mec_theme",
      theme
    );
  }


  function toggleTheme(){

    const isDark =
      document.body.classList.contains("dark");

    applyTheme(
      isDark
        ? "light"
        : "dark"
    );
  }


  /* =====================================================
     SAFE HTML
  ===================================================== */

  function escapeHTML(value){

    return String(value ?? "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");
  }


  /* =====================================================
     IMAGE
  ===================================================== */

  function getFirstImage(item){

    if(
      Array.isArray(item.images) &&
      item.images.length
    ){

      return item.images[0];

    }

    return "";
  }


  function imageHTML(item){

    const image =
      getFirstImage(item);

    if(image){

      return `
        <img
          src="${escapeHTML(image)}"
          alt="${escapeHTML(item.title || "Listing")}"
          loading="lazy"
          onerror="this.style.display='none';">
      `;

    }

    return `
      <div style="
        width:100%;
        height:100%;
        display:grid;
        place-items:center;
        color:var(--muted);
        font-size:11px;
        font-weight:800;
      ">
        No Photo
      </div>
    `;
  }


  /* =====================================================
     PRICE
  ===================================================== */

  function formatPrice(item){

    if(
      item.price === null ||
      item.price === undefined ||
      item.price === ""
    ){

      return "Price on request";

    }

    const number =
      Number(item.price);

    if(
      Number.isNaN(number)
    ){

      return escapeHTML(
        item.price
      );

    }

    const currency =
      item.currency ||
      "MMK";

    return (
      escapeHTML(currency) +
      " " +
      number.toLocaleString()
    );
  }


  /* =====================================================
     LOCATION
     Region + Township + Nearby Address
  ===================================================== */

  function formatLocation(item){

    const parts = [

      item.city || "",

      item.township || "",

      item.address || ""

    ]
    .map(
      value =>
        String(value).trim()
    )
    .filter(Boolean);


    /*
     * ထပ်ခါထပ်ခါ address မပြဘဲ
     * unique value တွေကိုပဲ ပြမယ်။
     */

    const unique = [];

    parts.forEach(
      value => {

        if(
          !unique.some(
            existing =>
              existing.toLowerCase() ===
              value.toLowerCase()
          )
        ){

          unique.push(value);

        }

      }
    );


    return unique.length
      ? unique.join(" · ")
      : "Myanmar";
  }


  /* =====================================================
     CATEGORY
  ===================================================== */

  function normalizeCategory(category){

    const value =
      String(category || "")
        .toLowerCase()
        .trim();


    if(value === "car" ||
       value === "cars"){

      return "car";

    }


    if(value === "property" ||
       value === "real_estate" ||
       value === "real-estate"){

      return "property";

    }


    if(value === "gem" ||
       value === "gems"){

      return "gem";

    }


    return "";
  }


  function categoryName(category){

    if(category === "car"){
      return "Cars";
    }

    if(category === "property"){
      return "Property";
    }

    if(category === "gem"){
      return "Gems";
    }

    return "Other";
  }


  /* =====================================================
     DATA
  ===================================================== */

  let allListings = [];


  /* =====================================================
     REGIONS / STATES
  ===================================================== */

  const regionsAndStates = [

    "Ayeyarwady",
    "Bago",
    "Chin",
    "Kachin",
    "Kayah",
    "Kayin",
    "Magway",
    "Mandalay",
    "Mon",
    "Naypyidaw",
    "Rakhine",
    "Sagaing",
    "Shan",
    "Tanintharyi",
    "Yangon"

  ];


  /*
   * Myanmar မှာ 14 ပြည်နယ်/တိုင်း + Naypyidaw
   * ကို data ထဲမှာ အသုံးပြုနိုင်အောင်
   * စာရင်းပြထားပါတယ်။
   */


  function loadRegionFilter(){

    const select =
      document.getElementById(
        "cityFilter"
      );


    regionsAndStates.forEach(
      region => {

        const option =
          document.createElement(
            "option"
          );

        option.value =
          region;

        option.textContent =
          region;

        select.appendChild(
          option
        );

      }
    );

  }


  /* =====================================================
     LOAD PROFILE
  ===================================================== */

  async function loadProfile(user){

    try{

      const {
        data
      } =
        await supabaseClient
          .from("profiles")
          .select("avatar_url")
          .eq(
            "id",
            user.id
          )
          .maybeSingle();


      if(data?.avatar_url){

        document.getElementById(
          "avatar"
        ).src =
          data.avatar_url;

      }

    }
    catch(error){

      console.warn(
        "Profile loading skipped:",
        error
      );

    }

  }


  /* =====================================================
     LOAD LISTINGS
  ===================================================== */

  async function loadListings(){

    setStatus(
      "Loading listings..."
    );


    const {
      data,
      error
    } =
      await supabaseClient
        .from("listings")
        .select(`
          id,
          user_id,
          category,
          listing_type,
          title,
          description,
          price,
          currency,
          city,
          township,
          address,
          status,
          featured,
          created_at,
          updated_at,
          location,
          phone,
          images,
          seller_id,
          post_role
        `)
        .eq(
          "status",
          "approved"
        )
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(error){

      console.error(
        error
      );

      showError(
        error.message
      );

      return;

    }


    allListings =
      (data || [])
        .filter(
          item =>
            normalizeCategory(
              item.category
            )
        );


    loadRegionFilter();

    populateDynamicRegions();

    renderListings(
      allListings
    );

  }


  /* =====================================================
     DYNAMIC REGION FILTER
  ===================================================== */

  function populateDynamicRegions(){

    const select =
      document.getElementById(
        "cityFilter"
      );


    /*
     * DB ထဲက city တွေက
     * predefined list မပါရင်လည်း
     * filter မှာပေါ်အောင် ထည့်မယ်။
     */

    const existing =
      new Set(
        regionsAndStates.map(
          item =>
            item.toLowerCase()
        )
      );


    allListings.forEach(
      item => {

        const city =
          String(
            item.city || ""
          ).trim();


        if(
          city &&
          !existing.has(
            city.toLowerCase()
          )
        ){

          const option =
            document.createElement(
              "option"
            );

          option.value =
            city;

          option.textContent =
            city;

          select.appendChild(
            option
          );

          existing.add(
            city.toLowerCase()
          );

        }

      }
    );

  }


  /* =====================================================
     FILTER
  ===================================================== */

  function applyFilters(){

    const search =
      document.getElementById(
        "searchInput"
      ).value
      .toLowerCase()
      .trim();


    const category =
      document.getElementById(
        "categoryFilter"
      ).value;


    const city =
      document.getElementById(
        "cityFilter"
      ).value;


    const sort =
      document.getElementById(
        "sortFilter"
      ).value;


    let filtered =
      allListings.filter(
        item => {

          const normalized =
            normalizeCategory(
              item.category
            );


          if(
            category !== "all" &&
            normalized !== category
          ){

            return false;

          }


          if(
            city !== "all" &&
            String(
              item.city || ""
            ).toLowerCase() !==
            city.toLowerCase()
          ){

            return false;

          }


          if(search){

            const text = [

              item.title,
              item.description,
              item.category,
              item.city,
              item.township,
              item.address

            ]
            .join(" ")
            .toLowerCase();


            if(
              !text.includes(search)
            ){

              return false;

            }

          }


          return true;

        }
      );


    filtered.sort(
      (a,b) => {

        if(sort === "oldest"){

          return (
            new Date(a.created_at) -
            new Date(b.created_at)
          );

        }


        if(sort === "price_low"){

          return (
            Number(a.price || 0) -
            Number(b.price || 0)
          );

        }


        if(sort === "price_high"){

          return (
            Number(b.price || 0) -
            Number(a.price || 0)
          );

        }


        return (
          new Date(b.created_at) -
          new Date(a.created_at)
        );

      }
    );


    renderListings(
      filtered
    );

  }


  /* =====================================================
     RENDER
  ===================================================== */

  function renderListings(listings){

    const grid =
      document.getElementById(
        "listingGrid"
      );


    document.getElementById(
      "listingCount"
    ).textContent =
      `${listings.length} ${
        listings.length === 1
          ? "listing"
          : "listings"
      }`;


    setStatus(
      listings.length
        ? "Showing approved listings"
        : "No matching listings"
    );


    if(!listings.length){

      grid.innerHTML = `

        <div
          class="state"
          style="grid-column:1/-1;">

          <div class="state-icon">
            ⌕
          </div>

          <strong>
            No listings found
          </strong>

          <span>
            Try another category, location or search.
          </span>

        </div>

      `;

      return;

    }


    grid.innerHTML =
      listings
        .map(
          item =>
            listingCard(item)
        )
        .join("");

  }


  /* =====================================================
     CARD
  ===================================================== */

  function listingCard(item){

    const category =
      normalizeCategory(
        item.category
      );


    const location =
      formatLocation(
        item
      );


    const title =
      item.title ||
      "Untitled Listing";


    const description =
      item.description ||
      "No description provided.";


    const created =
      item.created_at
        ? new Date(
            item.created_at
          ).toLocaleDateString(
            "en-GB",
            {
              day:"2-digit",
              month:"short",
              year:"numeric"
            }
          )
        : "";


    return `

      <article
        class="listing-card">


        <a
          href="./listing-details.html?id=${encodeURIComponent(
            item.id
          )}">


          <div class="listing-image">

            ${imageHTML(item)}


            <div class="category-badge">
              ${escapeHTML(
                categoryName(category)
              )}
            </div>


            ${
              item.featured
              ?

              `
              <div class="featured-badge">
                FEATURED
              </div>
              `

              :

              ""
            }

          </div>


          <div class="listing-content">


            <div class="listing-title">
              ${escapeHTML(title)}
            </div>


            <div class="listing-price">
              ${formatPrice(item)}
            </div>


            <div class="listing-location">

              <span>
                ⌖
              </span>

              <span>
                ${escapeHTML(location)}
              </span>

            </div>


            <div class="listing-description">
              ${escapeHTML(description)}
            </div>


            <div class="listing-footer">

              <span class="listing-date">
                ${escapeHTML(created)}
              </span>


              <span class="view-button">
                View Details →
              </span>

            </div>


          </div>

        </a>

      </article>

    `;

  }


  /* =====================================================
     STATUS
  ===================================================== */

  function setStatus(text){

    document.getElementById(
      "filterStatus"
    ).textContent =
      text;

  }


  function showError(message){

    const grid =
      document.getElementById(
        "listingGrid"
      );


    document.getElementById(
      "listingCount"
    ).textContent =
      "Error";


    setStatus(
      "Could not load listings"
    );


    grid.innerHTML = `

      <div
        class="state"
        style="grid-column:1/-1;">

        <div class="state-icon">
          !
        </div>

        <strong>
          Could not load listings
        </strong>

        <span>
          ${escapeHTML(message)}
        </span>

        <button
          class="retry"
          onclick="loadListings()">

          Try Again

        </button>

      </div>

    `;

  }


  /* =====================================================
     RESET
  ===================================================== */

  function resetFilters(){

    document.getElementById(
      "searchInput"
    ).value = "";


    document.getElementById(
      "categoryFilter"
    ).value = "all";


    document.getElementById(
      "cityFilter"
    ).value = "all";


    document.getElementById(
      "sortFilter"
    ).value = "newest";


    renderListings(
      allListings
    );

  }


  /* =====================================================
     EVENTS
  ===================================================== */

  document
    .getElementById(
      "searchInput"
    )
    .addEventListener(
      "input",
      applyFilters
    );


  document
    .getElementById(
      "categoryFilter"
    )
    .addEventListener(
      "change",
      applyFilters
    );


  document
    .getElementById(
      "cityFilter"
    )
    .addEventListener(
      "change",
      applyFilters
    );


  document
    .getElementById(
      "sortFilter"
    )
    .addEventListener(
      "change",
      applyFilters
    );


  /* =====================================================
     INIT
  ===================================================== */

  async function init(){

    applyTheme(
      localStorage.getItem(
        "mec_theme"
      ) || "light"
    );


    try{

      const {
        data
      } =
        await supabaseClient.auth.getUser();


      if(data?.user){

        await loadProfile(
          data.user
        );

      }

    }
    catch(error){

      console.warn(
        "Auth/profile skipped:",
        error
      );

    }


    await loadListings();

  }


  init();

</script>

</body>

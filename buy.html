<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Buy • Myanmar Elite Connect</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase.js"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    :root{
      --bg:#f5f7fb;
      --surface:#fff;
      --soft:#f7f9fc;
      --text:#10233f;
      --muted:#748197;
      --border:rgba(16,35,63,.09);
      --gold:#d8b45c;
      --gold-light:#f4d98a;
      --navy:#071a34;
      --green:#2d8a61;
      --red:#c94b4b;
      --shadow:0 16px 45px rgba(13,35,64,.07);
    }

    body.dark{
      --bg:#071321;
      --surface:#0e1e32;
      --soft:#10243c;
      --text:#f3f6fa;
      --muted:#91a0b4;
      --border:rgba(255,255,255,.09);
      --navy:#f3f6fa;
      --shadow:0 16px 45px rgba(0,0,0,.28);
    }

    body{
      min-height:100vh;
      color:var(--text);
      background:var(--bg);
      font-family:
        Inter,
        "Noto Sans Myanmar",
        "Myanmar Text",
        system-ui,
        sans-serif;
      transition:.25s ease;
    }

    button,
    input,
    select{
      font:inherit;
    }

    button,
    select{
      cursor:pointer;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    img{
      display:block;
      max-width:100%;
    }


    /* =========================
       HEADER
    ========================= */

    .topbar{
      position:sticky;
      top:0;
      z-index:100;
      height:70px;
      border-bottom:1px solid var(--border);
      background:rgba(255,255,255,.9);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
    }

    body.dark .topbar{
      background:rgba(7,19,33,.92);
    }

    .topbar-inner{
      width:min(1200px,94%);
      height:100%;
      margin:auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      flex:none;
    }

    .brand img{
      width:39px;
      height:39px;
      border-radius:11px;
      object-fit:contain;
      background:var(--surface);
    }

    .brand-name{
      font-size:14px;
      font-weight:950;
      white-space:nowrap;
    }

    .brand-name span{
      color:var(--gold);
    }

    .nav{
      display:flex;
      align-items:center;
      gap:3px;
    }

    .nav a{
      padding:9px 12px;
      border-radius:10px;
      color:var(--muted);
      font-size:12px;
      font-weight:800;
    }

    .nav a:hover,
    .nav a.active{
      color:var(--text);
      background:var(--soft);
    }

    .nav a.active{
      color:var(--gold);
    }

    .header-actions{
      display:flex;
      align-items:center;
      gap:7px;
    }

    .icon-btn{
      width:40px;
      height:40px;
      display:grid;
      place-items:center;
      border:1px solid var(--border);
      border-radius:12px;
      color:var(--text);
      background:var(--surface);
    }

    .profile{
      width:40px;
      height:40px;
      overflow:hidden;
      border:1px solid var(--border);
      border-radius:12px;
      background:var(--soft);
    }

    .profile img{
      width:100%;
      height:100%;
      object-fit:cover;
    }


    /* =========================
       PAGE
    ========================= */

    .container{
      width:min(1200px,94%);
      margin:auto;
      padding:25px 0 95px;
    }

    .page-heading{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:15px;
      margin-bottom:18px;
    }

    .eyebrow{
      color:var(--gold);
      font-size:9px;
      font-weight:950;
      letter-spacing:1.2px;
      text-transform:uppercase;
    }

    .page-title{
      margin-top:5px;
      font-size:clamp(25px,4vw,34px);
      font-weight:950;
      letter-spacing:-.8px;
    }

    .page-subtitle{
      margin-top:5px;
      color:var(--muted);
      font-size:11px;
    }

    .result-count{
      color:var(--muted);
      font-size:10px;
      font-weight:800;
      white-space:nowrap;
    }


    /* =========================
       FILTER BAR
    ========================= */

    .filter-panel{
      padding:14px;
      border:1px solid var(--border);
      border-radius:18px;
      background:var(--surface);
      box-shadow:var(--shadow);
    }

    .category-tabs{
      display:flex;
      gap:7px;
      overflow-x:auto;
      padding-bottom:2px;
      scrollbar-width:none;
    }

    .category-tabs::-webkit-scrollbar{
      display:none;
    }

    .category-tab{
      flex:none;
      min-width:78px;
      height:38px;
      padding:0 13px;
      border:1px solid var(--border);
      border-radius:10px;
      color:var(--muted);
      background:var(--soft);
      font-size:10px;
      font-weight:900;
    }

    .category-tab.active{
      color:#071a34;
      border-color:transparent;
      background:linear-gradient(
        135deg,
        var(--gold-light),
        var(--gold)
      );
    }

    .filter-row{
      display:grid;
      grid-template-columns:minmax(180px,1.8fr) minmax(150px,1fr) minmax(150px,1fr) minmax(150px,1fr) auto;
      gap:8px;
      margin-top:10px;
    }

    .field{
      min-width:0;
      height:43px;
      border:1px solid var(--border);
      border-radius:11px;
      color:var(--text);
      background:var(--soft);
      outline:none;
    }

    input.field{
      padding:0 12px;
    }

    select.field{
      padding:0 10px;
    }

    .field:focus{
      border-color:rgba(216,180,92,.65);
    }

    .reset-btn{
      height:43px;
      padding:0 13px;
      border:1px solid var(--border);
      border-radius:11px;
      color:var(--muted);
      background:var(--surface);
      font-size:10px;
      font-weight:900;
    }

    .reset-btn:hover{
      color:var(--text);
      border-color:rgba(216,180,92,.55);
    }


    /* =========================
       LISTINGS
    ========================= */

    .listings-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin:23px 1px 11px;
    }

    .listings-head strong{
      font-size:14px;
      font-weight:950;
    }

    .sort-select{
      height:34px;
      padding:0 8px;
      border:1px solid var(--border);
      border-radius:9px;
      color:var(--text);
      background:var(--surface);
      font-size:10px;
      font-weight:800;
      outline:none;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:15px;
    }


    /* =========================
       LISTING CARD
    ========================= */

    .listing-card{
      position:relative;
      min-width:0;
      overflow:hidden;
      border:1px solid var(--border);
      border-radius:18px;
      background:var(--surface);
      box-shadow:var(--shadow);
      transition:
        transform .2s ease,
        box-shadow .2s ease,
        border-color .2s ease;
    }

    .listing-card:hover{
      transform:translateY(-3px);
      border-color:rgba(216,180,92,.38);
      box-shadow:0 22px 55px rgba(13,35,64,.11);
    }

    .listing-image{
      position:relative;
      width:100%;
      aspect-ratio:4/3;
      overflow:hidden;
      background:
        linear-gradient(
          135deg,
          #e2e8f0,
          #c5d0de
        );
    }

    .listing-image img{
      width:100%;
      height:100%;
      object-fit:cover;
      transition:transform .35s ease;
    }

    .listing-card:hover .listing-image img{
      transform:scale(1.035);
    }

    .category-badge{
      position:absolute;
      top:10px;
      left:10px;
      padding:6px 8px;
      border-radius:7px;
      color:#071a34;
      background:var(--gold);
      font-size:8px;
      font-weight:950;
      letter-spacing:.3px;
    }

    .featured-badge{
      position:absolute;
      top:10px;
      right:10px;
      padding:6px 8px;
      border-radius:7px;
      color:#fff;
      background:rgba(7,26,52,.76);
      font-size:8px;
      font-weight:900;
      backdrop-filter:blur(8px);
    }

    .photo-count{
      position:absolute;
      bottom:10px;
      right:10px;
      padding:5px 7px;
      border-radius:7px;
      color:#fff;
      background:rgba(0,0,0,.56);
      font-size:8px;
      font-weight:850;
    }

    .listing-content{
      padding:13px;
    }

    .listing-title{
      overflow:hidden;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      min-height:33px;
      font-size:13px;
      line-height:1.35;
      font-weight:950;
    }

    .price{
      margin-top:7px;
      font-size:15px;
      font-weight:950;
    }

    .location{
      display:flex;
      align-items:flex-start;
      gap:5px;
      margin-top:7px;
      color:var(--muted);
      font-size:9px;
      line-height:1.45;
    }

    .location-icon{
      color:var(--gold);
      flex:none;
    }

    .listing-meta{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:7px;
      margin-top:11px;
      padding-top:10px;
      border-top:1px solid var(--border);
    }

    .listing-type{
      color:var(--green);
      font-size:8px;
      font-weight:900;
      text-transform:uppercase;
    }

    .date{
      color:var(--muted);
      font-size:8px;
    }


    /* =========================
       EMPTY / ERROR / LOADING
    ========================= */

    .state{
      min-height:45vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:var(--muted);
    }

    .state-icon{
      width:58px;
      height:58px;
      display:grid;
      place-items:center;
      margin-bottom:12px;
      border-radius:17px;
      color:var(--gold);
      background:var(--soft);
      font-size:22px;
    }

    .state strong{
      color:var(--text);
      font-size:15px;
    }

    .state span{
      max-width:390px;
      margin-top:5px;
      font-size:10px;
      line-height:1.6;
    }

    .retry-btn{
      height:38px;
      margin-top:15px;
      padding:0 15px;
      border:0;
      border-radius:10px;
      color:#071a34;
      background:var(--gold);
      font-size:10px;
      font-weight:900;
    }


    /* =========================
       MOBILE NAV
    ========================= */

    .mobile-nav{
      display:none;
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:200;
      height:67px;
      border-top:1px solid var(--border);
      background:rgba(255,255,255,.94);
      backdrop-filter:blur(18px);
    }

    body.dark .mobile-nav{
      background:rgba(7,19,33,.95);
    }

    .mobile-nav-inner{
      height:100%;
      display:grid;
      grid-template-columns:repeat(5,1fr);
    }

    .mobile-nav a{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:4px;
      color:var(--muted);
      font-size:9px;
      font-weight:800;
    }

    .mobile-nav a.active{
      color:var(--gold);
    }

    .mobile-icon{
      font-size:17px;
    }


    /* =========================
       RESPONSIVE
    ========================= */

    @media(max-width:1050px){

      .nav{
        display:none;
      }

      .mobile-nav{
        display:block;
      }

      .container{
        padding-bottom:92px;
      }

      .grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }

      .filter-row{
        grid-template-columns:1fr 1fr;
      }

      .search-field{
        grid-column:1/-1;
      }

    }

    @media(max-width:620px){

      .topbar{
        height:62px;
      }

      .topbar-inner{
        width:94%;
      }

      .brand-name{
        display:none;
      }

      .header-actions{
        gap:5px;
      }

      .icon-btn,
      .profile{
        width:37px;
        height:37px;
      }

      .container{
        width:94%;
        padding-top:18px;
      }

      .page-heading{
        align-items:flex-start;
        flex-direction:column;
        gap:7px;
      }

      .filter-panel{
        padding:10px;
        border-radius:15px;
      }

      .filter-row{
        grid-template-columns:1fr;
      }

      .search-field{
        grid-column:auto;
      }

      .grid{
        grid-template-columns:1fr 1fr;
        gap:9px;
      }

      .listing-card{
        border-radius:14px;
      }

      .listing-content{
        padding:10px;
      }

      .listing-title{
        font-size:11px;
        min-height:30px;
      }

      .price{
        font-size:12px;
      }

      .location{
        font-size:8px;
      }

      .listing-meta{
        margin-top:8px;
        padding-top:8px;
      }

      .date{
        display:none;
      }

      .sort-select{
        max-width:130px;
      }
    }

    @media(max-width:390px){

      .grid{
        grid-template-columns:1fr;
      }

      .listing-image{
        aspect-ratio:16/10;
      }

    }
  </style>
</head>

<body>

  <script>

    /* =====================================================
       STATE
    ===================================================== */

    let allListings = [];

    let activeCategory = "all";


    /*
     * Myanmar Regions / States
     * 14 administrative regions/states.
     */

    const MYANMAR_REGIONS = [

      "Ayeyarwady Region",
      "Bago Region",
      "Chin State",
      "Kachin State",
      "Kayah State",
      "Kayin State",
      "Magway Region",
      "Mandalay Region",
      "Mon State",
      "Naypyidaw Union Territory",
      "Rakhine State",
      "Sagaing Region",
      "Shan State",
      "Tanintharyi Region"

    ];


    /* =====================================================
       THEME
    ===================================================== */

    function applyTheme(theme){

      document.body.classList.toggle(
        "dark",
        theme === "dark"
      );

      document.getElementById(
        "themeButton"
      ).textContent =
        theme === "dark"
          ? "☀"
          : "☾";

      localStorage.setItem(
        "mec_theme",
        theme
      );

    }


    function toggleTheme(){

      const dark =
        document.body.classList.contains("dark");

      applyTheme(
        dark
          ? "light"
          : "dark"
      );

    }


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHTML(value){

      return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

    }


    /* =====================================================
       IMAGE
    ===================================================== */

    function getImages(item){

      if(!Array.isArray(item.images)){
        return [];
      }

      return item.images.filter(
        image =>
          typeof image === "string" &&
          image.trim() !== ""
      );

    }


    function getCoverImage(item){

      const images =
        getImages(item);

      return images[0] || "";

    }


    /* =====================================================
       CATEGORY
    ===================================================== */

    function normalizeCategory(value){

      return String(
        value || ""
      )
      .trim()
      .toLowerCase();

    }


    function categoryLabel(category){

      switch(
        normalizeCategory(category)
      ){

        case "car":
          return "CAR";

        case "property":
          return "PROPERTY";

        case "gem":
          return "GEM";

        default:
          return "OTHER";

      }

    }


    /* =====================================================
       PRICE
    ===================================================== */

    function numericPrice(item){

      const price =
        Number(item.price);

      return Number.isFinite(price)
        ? price
        : 0;

    }


    function formatPrice(item){

      const price =
        numericPrice(item);

      if(
        !Number.isFinite(price) ||
        price <= 0
      ){

        return "Price on request";

      }

      const currency =
        item.currency ||
        "MMK";

      return (
        escapeHTML(currency) +
        " " +
        price.toLocaleString()
      );

    }


    /* =====================================================
       LOCATION
    ===================================================== */

    function formatLocation(item){

      /*
       * Address ကို ထပ်ခါထပ်ခါ မပြဘဲ
       * Region/State + Township + Address
       * အတိုချုံးပဲပြမယ်။
       */

      const parts = [

        item.city ||
        "",

        item.township ||
        "",

        item.address ||
        ""

      ]
      .map(
        value =>
          String(value).trim()
      )
      .filter(Boolean);


      const unique = [];

      for(
        const part of parts
      ){

        if(
          !unique.some(
            existing =>
              existing.toLowerCase() ===
              part.toLowerCase()
          )
        ){

          unique.push(part);

        }

      }


      return unique.length
        ? unique.join(" · ")
        : "Myanmar";

    }


    /* =====================================================
       DATE
    ===================================================== */

    function formatDate(value){

      if(!value){
        return "";
      }

      const date =
        new Date(value);

      if(
        Number.isNaN(
          date.getTime()
        )
      ){

        return "";

      }

      return date.toLocaleDateString(
        "en-GB",
        {
          day:"2-digit",
          month:"short",
          year:"numeric"
        }
      );

    }


    /* =====================================================
       AUTH
    ===================================================== */

    async function checkAuth(){

      const {
        data,
        error
      } =
        await supabaseClient.auth.getUser();


      if(error){

        console.error(error);

        return null;

      }


      return data?.user || null;

    }


    /* =====================================================
       PROFILE
    ===================================================== */

    async function loadProfile(user){

      if(!user){
        return;
      }

      try{

        const {
          data,
          error
        } =
          await supabaseClient
            .from("profiles")
            .select("avatar_url")
            .eq(
              "id",
              user.id
            )
            .maybeSingle();


        if(
          !error &&
          data?.avatar_url
        ){

          document.getElementById(
            "avatar"
          ).src =
            data.avatar_url;

        }

      }
      catch(error){

        console.log(
          "Profile avatar unavailable."
        );

      }

    }


    /* =====================================================
       REGION FILTER
    ===================================================== */

    function populateRegions(){

      const select =
        document.getElementById(
          "regionFilter"
        );


      select.innerHTML = `

        <option value="">
          All Regions / States
        </option>

        ${
          MYANMAR_REGIONS
            .map(
              region => `

                <option
                  value="${escapeHTML(region)}">

                  ${escapeHTML(region)}

                </option>

              `
            )
            .join("")
        }

      `;

    }


    /* =====================================================
       TOWNSHIP FILTER
    ===================================================== */

    function populateTownships(){

      const region =
        document.getElementById(
          "regionFilter"
        ).value;


      const select =
        document.getElementById(
          "townshipFilter"
        );


      const source =
        allListings.filter(
          item => {

            if(!region){
              return true;
            }

            return normalizeText(
              item.city
            ) ===
            normalizeText(
              region
            );

          }
        );


      const townships = [
        ...new Set(
          source
            .map(
              item =>
                String(
                  item.township || ""
                ).trim()
            )
            .filter(Boolean)
        )
      ]
      .sort(
        (a,b) =>
          a.localeCompare(
            b
          )
      );


      select.innerHTML = `

        <option value="">
          All Townships
        </option>

        ${
          townships
            .map(
              township => `

                <option
                  value="${escapeHTML(township)}">

                  ${escapeHTML(township)}

                </option>

              `
            )
            .join("")
        }

      `;

    }


    /* =====================================================
       TEXT NORMALIZER
    ===================================================== */

    function normalizeText(value){

      return String(
        value || ""
      )
      .trim()
      .toLowerCase();

    }


    /* =====================================================
       LOAD LISTINGS
    ===================================================== */

    async function loadListings(){

      showLoading();


      const {
        data,
        error
      } =
        await supabaseClient
          .from("listings")
          .select(
            [
              "id",
              "user_id",
              "category",
              "listing_type",
              "title",
              "description",
              "price",
              "currency",
              "city",
              "township",
              "address",
              "status",
              "featured",
              "created_at",
              "updated_at",
              "location",
              "phone",
              "images",
              "seller_id",
              "post_role"
            ].join(",")
          )
          .eq(
            "status",
            "approved"
          )
          .in(
            "category",
            [
              "car",
              "property",
              "gem"
            ]
          )
          .eq(
            "listing_type",
            "sale"
          )
          .order(
            "featured",
            {
              ascending:false
            }
          )
          .order(
            "created_at",
            {
              ascending:false
            }
          );


      if(error){

        console.error(
          "Listings error:",
          error
        );

        showError(
          "Listings could not be loaded",
          error.message
        );

        return;

      }


      allListings =
        Array.isArray(data)
          ? data
          : [];


      populateTownships();

      applyFilters();

    }


    /* =====================================================
       FILTER
    ===================================================== */

    function applyFilters(){

      const search =
        normalizeText(
          document.getElementById(
            "searchInput"
          ).value
        );


      const region =
        normalizeText(
          document.getElementById(
            "regionFilter"
          ).value
        );


      const township =
        normalizeText(
          document.getElementById(
            "townshipFilter"
          ).value
        );


      const priceRange =
        document.getElementById(
          "priceFilter"
        ).value;


      const filtered =
        allListings.filter(
          item => {

            const category =
              normalizeCategory(
                item.category
              );


            if(
              activeCategory !== "all" &&
              category !== activeCategory
            ){

              return false;

            }


            if(search){

              const searchable = [

                item.title,
                item.description,
                item.category,
                item.city,
                item.township,
                item.address,
                item.location

              ]
              .map(
                value =>
                  normalizeText(value)
              )
              .join(" ");


              if(
                !searchable.includes(
                  search
                )
              ){

                return false;

              }

            }


            if(region){

              const itemRegion =
                normalizeText(
                  item.city
                );


              if(
                itemRegion !== region
              ){

                return false;

              }

            }


            if(township){

              if(
                normalizeText(
                  item.township
                ) !== township
              ){

                return false;

              }

            }


            if(
              !matchesPrice(
                numericPrice(item),
                priceRange
              )
            ){

              return false;

            }


            return true;

          }
        );


      sortListings(
        filtered
      );


      renderListings(
        filtered
      );

    }


    /* =====================================================
       PRICE RANGE
    ===================================================== */

    function matchesPrice(
      price,
      range
    ){

      if(!range){
        return true;
      }


      if(
        range === "500000000+"
      ){

        return price >= 500000000;

      }


      const [
        min,
        max
      ] =
        range.split("-")
          .map(Number);


      return (
        price >= min &&
        price <= max
      );

    }


    /* =====================================================
       SORT
    ===================================================== */

    function sortListings(
      listings
    ){

      const sort =
        document.getElementById(
          "sortSelect"
        ).value;


      if(sort === "newest"){

        listings.sort(
          (a,b) =>
            new Date(b.created_at) -
            new Date(a.created_at)
        );

      }


      if(sort === "oldest"){

        listings.sort(
          (a,b) =>
            new Date(a.created_at) -
            new Date(b.created_at)
        );

      }


      if(sort === "price-low"){

        listings.sort(
          (a,b) =>
            numericPrice(a) -
            numericPrice(b)
        );

      }


      if(sort === "price-high"){

        listings.sort(
          (a,b) =>
            numericPrice(b) -
            numericPrice(a)
        );

      }

    }


    /* =====================================================
       RENDER
    ===================================================== */

    function renderListings(
      listings
    ){

      const grid =
        document.getElementById(
          "listingGrid"
        );


      document.getElementById(
        "resultCount"
      ).textContent =
        `${listings.length} listing${listings.length === 1 ? "" : "s"}`;


      if(!listings.length){

        grid.innerHTML = `

          <div
            class="state"
            style="grid-column:1/-1;">

            <div class="state-icon">
              ⌕
            </div>

            <strong>
              No listings found
            </strong>

            <span>
              Try another category, location,
              search term or price range.
            </span>

          </div>

        `;

        return;

      }


      grid.innerHTML =
        listings
          .map(
            item =>
              listingCard(
                item
              )
          )
          .join("");

    }


    /* =====================================================
       CARD
    ===================================================== */

    function listingCard(
      item
    ){

      const images =
        getImages(item);


      const cover =
        getCoverImage(item);


      const category =
        categoryLabel(
          item.category
        );


      const title =
        item.title ||
        "Untitled Listing";


      const location =
        formatLocation(
          item
        );


      const featured =
        item.featured === true;


      const photoCount =
        images.length;


      return `

        <a
          class="listing-card"
          href="./listing-detail.html?id=${encodeURIComponent(item.id)}">

          <div class="listing-image">

            ${
              cover

              ?

              `<img
                src="${escapeHTML(cover)}"
                alt="${escapeHTML(title)}"
                loading="lazy"
                onerror="this.style.display='none';">`

              :

              ""

            }


            <div class="category-badge">
              ${escapeHTML(category)}
            </div>


            ${
              featured

              ?

              `<div class="featured-badge">
                ★ FEATURED
              </div>`

              :

              ""

            }


            ${
              photoCount > 1

              ?

              `<div class="photo-count">
                ▣ ${photoCount}
              </div>`

              :

              ""

            }

          </div>


          <div class="listing-content">

            <div class="listing-title">
              ${escapeHTML(title)}
            </div>


            <div class="price">
              ${formatPrice(item)}
            </div>


            <div class="location">

              <span class="location-icon">
                ⌖
              </span>

              <span>
                ${escapeHTML(location)}
              </span>

            </div>


            <div class="listing-meta">

              <span class="listing-type">
                ${escapeHTML(
                  item.listing_type || "SALE"
                )}
              </span>

              <span class="date">
                ${escapeHTML(
                  formatDate(
                    item.created_at
                  )
                )}
              </span>

            </div>

          </div>

        </a>

      `;

    }


    /* =====================================================
       LOADING
    ===================================================== */

    function showLoading(){

      document.getElementById(
        "listingGrid"
      ).innerHTML = `

        <div
          class="state"
          style="grid-column:1/-1;">

          <div class="state-icon">
            ◌
          </div>

          <strong>
            Loading listings
          </strong>

          <span>
            Finding approved cars, properties and gems...
          </span>

        </div>

      `;

    }


    /* =====================================================
       ERROR
    ===================================================== */

    function showError(
      title,
      message
    ){

      document.getElementById(
        "resultCount"
      ).textContent =
        "Error";


      document.getElementById(
        "listingGrid"
      ).innerHTML = `

        <div
          class="state"
          style="grid-column:1/-1;">

          <div class="state-icon">
            !
          </div>

          <strong>
            ${escapeHTML(title)}
          </strong>

          <span>
            ${escapeHTML(message)}
          </span>

          <button
            class="retry-btn"
            onclick="loadListings()">

            Try Again

          </button>

        </div>

      `;

    }


    /* =====================================================
       EVENTS
    ===================================================== */

    document.querySelectorAll(
      ".category-tab"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          function(){

            document.querySelectorAll(
              ".category-tab"
            )
            .forEach(
              item =>
                item.classList.remove(
                  "active"
                )
            );


            this.classList.add(
              "active"
            );


            activeCategory =
              this.dataset.category;


            applyFilters();

          }
        );

      }
    );


    document.getElementById(
      "searchInput"
    )
    .addEventListener(
      "input",
      applyFilters
    );


    document.getElementById(
      "regionFilter"
    )
    .addEventListener(
      "change",
      function(){

        populateTownships();

        document.getElementById(
          "townshipFilter"
        ).value = "";

        applyFilters();

      }
    );


    document.getElementById(
      "townshipFilter"
    )
    .addEventListener(
      "change",
      applyFilters
    );


    document.getElementById(
      "priceFilter"
    )
    .addEventListener(
      "change",
      applyFilters
    );


    document.getElementById(
      "sortSelect"
    )
    .addEventListener(
      "change",
      applyFilters
    );


    document.getElementById(
      "resetButton"
    )
    .addEventListener(
      "click",
      function(){

        activeCategory =
          "all";


        document.querySelectorAll(
          ".category-tab"
        )
        .forEach(
          button => {

            button.classList.toggle(
              "active",
              button.dataset.category === "all"
            );

          }
        );


        document.getElementById(
          "searchInput"
        ).value = "";


        document.getElementById(
          "regionFilter"
        ).value = "";


        populateTownships();


        document.getElementById(
          "townshipFilter"
        ).value = "";


        document.getElementById(
          "priceFilter"
        ).value = "";


        document.getElementById(
          "sortSelect"
        ).value = "newest";


        applyFilters();

      }
    );


    /* =====================================================
       INIT
    ===================================================== */

    async function init(){

      applyTheme(
        localStorage.getItem(
          "mec_theme"
        ) || "light"
      );


      populateRegions();


      const user =
        await checkAuth();


      if(user){

        await loadProfile(
          user
        );

      }


      /*
       * Buy page ကို public browse လုပ်နိုင်အောင်
       * login မရှိလည်း listings ကို load လုပ်မယ်။
       */

      await loadListings();

    }


    init();

  </script>

</body>

<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cars | Myanmar Elite Connect</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --navy:#071b3a;
  --navy2:#102d59;
  --green:#19a974;
  --gold:#d9a441;
  --bg:#f4f7fb;
  --white:#fff;
  --text:#172033;
  --muted:#697386;
  --border:#e2e7ef;
  --danger:#b42318;
  --shadow:0 10px 30px rgba(7,27,58,.08);
}

body{
  font-family:Arial,"Noto Sans Myanmar",sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(7,27,58,.98);
  box-shadow:0 3px 18px rgba(0,0,0,.15);
}

.header{
  max-width:1400px;
  margin:auto;
  padding:13px 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  color:white;
  text-decoration:none;
  font-size:20px;
  font-weight:900;
}

.logo span{
  color:#65d6a7;
}

.nav{
  display:flex;
  gap:6px;
}

.nav a{
  color:white;
  text-decoration:none;
  padding:9px 12px;
  border-radius:8px;
  font-size:13px;
}

.nav a:hover{
  background:rgba(255,255,255,.1);
}

.nav .active{
  background:var(--green);
  font-weight:bold;
}

/* PAGE HERO */

.page-hero{
  background:
  radial-gradient(circle at 85% 15%,#1b4c83,#071b3a 48%,#041126);
  color:white;
  padding:45px 5% 50px;
}

.page-hero-inner{
  max-width:1400px;
  margin:auto;
}

.back{
  display:inline-block;
  color:rgba(255,255,255,.8);
  text-decoration:none;
  margin-bottom:20px;
  font-size:14px;
}

.page-title{
  display:flex;
  align-items:center;
  gap:16px;
}

.car-icon{
  width:65px;
  height:65px;
  border-radius:18px;
  background:rgba(255,255,255,.1);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
}

.page-title h1{
  font-size:clamp(30px,5vw,46px);
}

.page-title p{
  margin-top:6px;
  color:rgba(255,255,255,.75);
  font-size:14px;
}

/* MAIN */

main{
  max-width:1400px;
  margin:auto;
  padding:35px 5% 70px;
}

/* SEARCH */

.search-panel{
  background:white;
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
  box-shadow:var(--shadow);
  margin-bottom:25px;
}

.search-row{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr auto;
  gap:10px;
}

input,
select{
  width:100%;
  padding:13px 14px;
  border:1px solid var(--border);
  border-radius:10px;
  outline:none;
  background:white;
  color:var(--text);
  font-size:14px;
}

input:focus,
select:focus{
  border-color:var(--navy);
  box-shadow:0 0 0 3px rgba(7,27,58,.07);
}

.search-btn{
  border:0;
  background:var(--navy);
  color:white;
  padding:0 20px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

/* BUY SELL */

.mode-row{
  display:flex;
  gap:9px;
  margin-bottom:25px;
  flex-wrap:wrap;
}

.mode{
  border:1px solid var(--border);
  background:white;
  color:var(--text);
  padding:11px 18px;
  border-radius:10px;
  cursor:pointer;
  font-weight:800;
}

.mode.active{
  background:var(--navy);
  color:white;
  border-color:var(--navy);
}

/* HEAD */

.listing-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:20px;
  gap:15px;
}

.listing-head h2{
  color:var(--navy);
  font-size:27px;
}

.count{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}

/* CARD */

.card{
  background:white;
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  box-shadow:var(--shadow);
  transition:.2s;
}

.card:hover{
  transform:translateY(-4px);
  box-shadow:0 18px 40px rgba(7,27,58,.13);
}

.image{
  height:225px;
  background:linear-gradient(135deg,#071b3a,#24548d);
  position:relative;
  overflow:hidden;
}

.image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.no-image{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:65px;
}

.featured{
  position:absolute;
  top:11px;
  left:11px;
  background:var(--gold);
  color:white;
  padding:6px 9px;
  border-radius:7px;
  font-size:11px;
  font-weight:bold;
}

.photo-count{
  position:absolute;
  right:10px;
  bottom:10px;
  background:rgba(0,0,0,.7);
  color:white;
  padding:5px 8px;
  border-radius:7px;
  font-size:11px;
}

.body{
  padding:18px;
}

.tag{
  display:inline-block;
  background:#e8f7ef;
  color:#167344;
  padding:5px 9px;
  border-radius:6px;
  font-size:11px;
  font-weight:bold;
  margin-bottom:9px;
}

.title{
  color:var(--navy);
  font-size:19px;
  font-weight:900;
  line-height:1.4;
  margin-bottom:8px;
}

.price{
  color:var(--navy);
  font-size:20px;
  font-weight:900;
  margin-bottom:9px;
}

.location{
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
  margin-bottom:10px;
}

.description{
  color:#596476;
  font-size:13px;
  line-height:1.65;
  margin-bottom:14px;
}

.contact{
  display:block;
  width:100%;
  text-align:center;
  text-decoration:none;
  background:var(--navy);
  color:white;
  padding:12px;
  border-radius:9px;
  font-size:14px;
  font-weight:bold;
}

.contact:hover{
  background:var(--navy2);
}

/* STATE */

.state{
  grid-column:1/-1;
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  padding:60px 20px;
  text-align:center;
  color:var(--muted);
}

.state-icon{
  font-size:50px;
  margin-bottom:10px;
}

.state h3{
  color:var(--navy);
  margin-bottom:7px;
}

.spinner{
  width:40px;
  height:40px;
  border:4px solid #e6ebf2;
  border-top-color:var(--navy);
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto 15px;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.error{
  grid-column:1/-1;
  background:#fff1f1;
  border:1px solid #ffd1d1;
  color:var(--danger);
  border-radius:14px;
  padding:25px;
  line-height:1.7;
}

.retry{
  margin-top:12px;
  border:0;
  background:var(--navy);
  color:white;
  padding:10px 16px;
  border-radius:8px;
  cursor:pointer;
}

/* MOBILE */

@media(max-width:1050px){
  .search-row{
    grid-template-columns:1fr 1fr;
  }

  .search-btn{
    min-height:45px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:700px){

  .header{
    padding:12px 4%;
  }

  .logo{
    font-size:16px;
  }

  .nav a{
    display:none;
  }

  .nav a:last-child{
    display:block;
  }

  .page-hero{
    padding:35px 5% 40px;
  }

  .search-row{
    grid-template-columns:1fr;
  }

  .search-btn{
    min-height:45px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .listing-head{
    align-items:flex-start;
  }

  .image{
    height:230px;
  }
}
</style>
</head>

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://ikjwisfsdcupibgjiuvp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_xoh1rjwBlJhR9nB3kQD-KA_QcVY6w2s";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================
   STATE
========================================= */

let listings = [];

let currentMode = "all";


/* =========================================
   HELPERS
========================================= */

function escapeHtml(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function getImages(item){

  if(!item.images){
    return [];
  }

  if(Array.isArray(item.images)){
    return item.images.filter(Boolean);
  }

  if(typeof item.images === "string"){

    try{

      const parsed =
      JSON.parse(item.images);

      if(Array.isArray(parsed)){
        return parsed.filter(Boolean);
      }

    }catch(e){

      if(item.images.startsWith("http")){
        return [item.images];
      }

    }

  }

  return [];
}


function formatPrice(price,currency){

  if(
    price === null ||
    price === undefined ||
    price === ""
  ){
    return "ဈေးနှုန်း မဖော်ပြပါ";
  }

  const number =
  Number(price);

  if(!Number.isFinite(number)){
    return escapeHtml(price);
  }

  return (
    number.toLocaleString("en-US") +
    " " +
    (currency || "MMK")
  );
}


function locationText(item){

  const parts = [];

  if(item.city){
    parts.push(item.city);
  }

  if(item.township){
    parts.push(item.township);
  }

  if(item.location){
    parts.push(item.location);
  }

  return parts.length
    ? escapeHtml(
        [...new Set(parts)].join(" • ")
      )
    : "တည်နေရာ မဖော်ပြပါ";
}


/* =========================================
   CARD
========================================= */

function createCard(item){

  const images =
  getImages(item);

  const image =
  images[0] || "";

  let imageHTML;

  if(image){

    imageHTML = `

      <img
        src="${escapeHtml(image)}"
        alt="${escapeHtml(item.title || "Car")}"
        loading="lazy"
        onerror="
          this.style.display='none';
          this.nextElementSibling.style.display='flex';
        "
      >

      <div
        class="no-image"
        style="display:none"
      >
        🚗
      </div>

    `;

  }else{

    imageHTML = `

      <div class="no-image">
        🚗
      </div>

    `;

  }


  const featured =
  item.featured
  ? `
    <div class="featured">
      ⭐ FEATURED
    </div>
  `
  : "";


  const photoCount =
  images.length > 1
  ? `
    <div class="photo-count">
      🖼️ ${images.length}
    </div>
  `
  : "";


  const phone =
  item.phone
  ? `
    <a
      class="contact"
      href="tel:${encodeURIComponent(item.phone)}"
    >
      📞 Contact Seller
    </a>
  `
  : "";


  const type =
  item.listing_type === "sale"
  ? "ရောင်းရန်"
  : item.listing_type === "rent"
  ? "ငှားရန်"
  : "Listing";


  return `

    <article class="card">

      <div class="image">

        ${imageHTML}

        ${featured}

        ${photoCount}

      </div>


      <div class="body">

        <span class="tag">
          ${type}
        </span>


        <div class="title">
          ${escapeHtml(
            item.title || "Untitled Car"
          )}
        </div>


        <div class="price">
          ${formatPrice(
            item.price,
            item.currency
          )}
        </div>


        <div class="location">
          📍 ${locationText(item)}
        </div>


        ${
          item.description
          ? `
            <div class="description">
              ${escapeHtml(
                item.description
              )}
            </div>
          `
          : ""
        }


        ${phone}

      </div>

    </article>

  `;

}


/* =========================================
   LOAD
========================================= */

async function loadCars(){

  const grid =
  document.getElementById("grid");

  const count =
  document.getElementById("count");


  grid.innerHTML = `

    <div class="state">

      <div class="spinner"></div>

      ကား Listing များကို
      ရယူနေပါသည်...

    </div>

  `;


  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .from("listings")
      .select("*")
      .eq("category","car")
      .eq("status","approved")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


    if(error){
      throw error;
    }


    listings =
    Array.isArray(data)
    ? data
    : [];


    createLocationFilters();

    applyFilters();


  }catch(error){

    console.error(error);


    count.textContent =
    "Database Error";


    grid.innerHTML = `

      <div class="error">

        ❌ Car Listings မရယူနိုင်ပါ။

        <br><br>

        ${escapeHtml(
          error.message ||
          "Unknown error"
        )}

        <br>

        <button
          class="retry"
          onclick="loadCars()"
        >
          ↻ ပြန်စမ်းမည်
        </button>

      </div>

    `;

  }

}


/* =========================================
   LOCATION FILTERS
========================================= */

function createLocationFilters(){

  const citySelect =
  document.getElementById(
    "cityFilter"
  );

  const townshipSelect =
  document.getElementById(
    "townshipFilter"
  );


  const cities =
  [
    ...new Set(
      listings
      .map(item => item.city)
      .filter(Boolean)
    )
  ]
  .sort();


  const townships =
  [
    ...new Set(
      listings
      .map(item => item.township)
      .filter(Boolean)
    )
  ]
  .sort();


  citySelect.innerHTML =
  `<option value="">
    မြို့အားလုံး
  </option>`;


  townshipSelect.innerHTML =
  `<option value="">
    မြို့နယ်အားလုံး
  </option>`;


  cities.forEach(city => {

    citySelect.innerHTML += `

      <option value="${escapeHtml(city)}">
        ${escapeHtml(city)}
      </option>

    `;

  });


  townships.forEach(township => {

    townshipSelect.innerHTML += `

      <option value="${escapeHtml(township)}">
        ${escapeHtml(township)}
      </option>

    `;

  });

}


/* =========================================
   MODE
========================================= */

function setMode(mode){

  currentMode =
  mode;


  document
    .getElementById("allMode")
    .classList
    .toggle(
      "active",
      mode === "all"
    );


  document
    .getElementById("buyMode")
    .classList
    .toggle(
      "active",
      mode === "buy"
    );


  document
    .getElementById("sellMode")
    .classList
    .toggle(
      "active",
      mode === "sell"
    );


  applyFilters();

}


/* =========================================
   FILTER
========================================= */

function applyFilters(){

  const keyword =
  document
    .getElementById("searchInput")
    .value
    .trim()
    .toLowerCase();


  const city =
  document
    .getElementById("cityFilter")
    .value;


  const township =
  document
    .getElementById("townshipFilter")
    .value;


  const price =
  document
    .getElementById("priceFilter")
    .value;


  let filtered =
  [...listings];


  /* BUY / SELL */

  if(currentMode === "sell"){

    filtered =
    filtered.filter(
      item =>
      item.listing_type === "sale"
    );

  }


  /*
    Existing database uses
    listing_type = sale/rent.

    Buyer posts can later be
    supported with a separate
    listing_role column.
  */


  /* SEARCH */

  if(keyword){

    filtered =
    filtered.filter(item => {

      const text = [

        item.title,
        item.description,
        item.city,
        item.township,
        item.location,
        item.address

      ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();


      return text.includes(keyword);

    });

  }


  /* CITY */

  if(city){

    filtered =
    filtered.filter(
      item =>
      item.city === city
    );

  }


  /* TOWNSHIP */

  if(township){

    filtered =
    filtered.filter(
      item =>
      item.township === township
    );

  }


  /* PRICE */

  if(price){

    filtered =
    filtered.filter(item => {

      const p =
      Number(item.price);


      if(!Number.isFinite(p)){
        return false;
      }


      if(price === "0-50000000"){
        return p <= 50000000;
      }


      if(price === "50000000-100000000"){
        return (
          p >= 50000000 &&
          p <= 100000000
        );
      }


      if(price === "100000000-200000000"){
        return (
          p >= 100000000 &&
          p <= 200000000
        );
      }


      if(price === "200000000+"){
        return p >= 200000000;
      }


      return true;

    });

  }


  render(
    filtered
  );

}


/* =========================================
   RENDER
========================================= */

function render(items){

  const grid =
  document.getElementById("grid");

  const count =
  document.getElementById("count");


  count.textContent =
  `${items.length} ကား Listing ရှိပါသည်`;


  if(!items.length){

    grid.innerHTML = `

      <div class="state">

        <div class="state-icon">
          🔍
        </div>

        <h3>
          ကား Listing မတွေ့ပါ
        </h3>

        <p>
          Search / Filter ကို
          ပြောင်းပြီး ပြန်ရှာကြည့်ပါ။
        </p>

      </div>

    `;

    return;

  }


  grid.innerHTML =
  items
    .map(createCard)
    .join("");

}


/* =========================================
   LIVE SEARCH
========================================= */

document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    applyFilters
  );

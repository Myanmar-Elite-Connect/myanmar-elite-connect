<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chat • Myanmar Elite Connect</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase.js"></script><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans Myanmar","Myanmar Text",system-ui,sans-serif;padding-bottom:74px} :root{--bg:#f5f7fb;--card:#fff;--soft:#eef2f7;--text:#10233f;--muted:#758198;--line:rgba(16,35,63,.1);--gold:#d8b45c;--shadow:0 14px 45px rgba(16,35,63,.08)}body.dark{--bg:#071321;--card:#0e1e32;--soft:#10243c;--text:#f4f7fb;--muted:#91a0b4;--line:rgba(255,255,255,.1);--shadow:0 18px 55px rgba(0,0,0,.3)}button,input{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;height:62px;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.topin{width:min(760px,calc(100% - 20px));height:100%;margin:auto;display:flex;align-items:center;gap:10px}.back,.theme{width:38px;height:38px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--text)}.person{flex:1;min-width:0}.person b{display:block;font-size:12px}.person span{display:block;margin-top:3px;color:var(--muted);font-size:8px}.page{width:min(760px,calc(100% - 14px));margin:12px auto}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.messages{min-height:calc(100vh - 170px);padding:14px;display:flex;flex-direction:column;gap:8px}.empty{text-align:center;color:var(--muted);font-size:10px;margin:auto}.msg{max-width:78%;padding:9px 11px;border-radius:14px;font-size:11px;line-height:1.55;white-space:pre-wrap;word-break:break-word}.msg.mine{align-self:flex-end;background:linear-gradient(135deg,#f3db91,#d8b45c);color:#071a34;border-bottom-right-radius:4px}.msg.theirs{align-self:flex-start;background:var(--soft);border-bottom-left-radius:4px}.time{display:block;margin-top:3px;font-size:7px;opacity:.65}.composer{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 96%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:9px}.compose{width:min(760px,calc(100% - 14px));margin:auto;display:flex;gap:7px}.compose input{flex:1;min-width:0;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--text);outline:none}.send{width:72px;border:0;border-radius:12px;background:linear-gradient(135deg,#f3db91,#d8b45c);color:#071a34;font-size:10px;font-weight:950}.error{text-align:center;padding:35px;color:var(--muted);font-size:10px}.error b{display:block;color:var(--text);font-size:13px;margin-bottom:7px}.bottom{position:fixed;left:0;right:0;bottom:61px;z-index:25;text-align:center;pointer-events:none}.status{display:inline-block;padding:6px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--muted);font-size:8px}
</style><script src="./mec-theme.js"></script>
</head><body><header class="top"><div class="topin"><button class="back" id="back">‹</button><div class="person"><b id="name">Chat</b><span id="username"></span></div><button class="theme" id="theme">☾</button></div></header><main class="page"><section id="messages" class="card messages"><div class="empty">Loading conversation…</div></section></main><div class="bottom"><span id="status" class="status">Connecting…</span></div><div class="composer"><form id="form" class="compose"><input id="input" autocomplete="off" maxlength="5000" placeholder="Write a message…"><button class="send" type="submit">Send</button></form></div><nav style="position:fixed;left:0;right:0;bottom:0;height:0;overflow:visible"><a href="./chat.html" style="position:absolute;right:12px;bottom:76px;font-size:9px;color:var(--muted);text-decoration:none">All chats</a></nav><script>
const db=supabaseClient;let me=null,target=null,room=null;const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function theme(t){document.body.classList.toggle('dark',t==='dark');$('theme').textContent=t==='dark'?'☀':'☾';localStorage.setItem('mec_theme',t)}theme(localStorage.getItem('mec_theme')||'light');$('theme').onclick=()=>theme(document.body.classList.contains('dark')?'light':'dark');$('back').onclick=()=>history.length>1?history.back():location.href='./post.html';function status(x){$('status').textContent=x}function render(rows){const box=$('messages');if(!rows.length){box.innerHTML='<div class="empty">No messages yet. Say hello 👋</div>';return}box.innerHTML=rows.map(m=>`<div class="msg ${m.sender_id===me.id?'mine':'theirs'}">${esc(m.content)}<span class="time">${new Date(m.created_at).toLocaleString()}</span></div>`).join('');box.scrollTop=box.scrollHeight}async function ensureRoom(){const targetId=new URLSearchParams(location.search).get('user');const roomId=new URLSearchParams(location.search).get('room');if(roomId){const r=await db.from('chat_rooms').select('*').eq('id',roomId).maybeSingle();if(r.error)throw r.error;if(r.data)room=r.data}if(!room&&targetId){if(targetId===me.id)throw new Error('You cannot chat with yourself.');target=targetId;let r=await db.from('chat_rooms').select('*').or(`and(user_one.eq.${me.id},user_two.eq.${targetId}),and(user_one.eq.${targetId},user_two.eq.${me.id})`).limit(1);if(r.error)throw r.error;room=r.data?.[0];if(!room){r=await db.from('chat_rooms').insert({user_one:me.id,user_two:targetId}).select().single();if(r.error)throw r.error;room=r.data}}if(!room)throw new Error('Chat room was not specified.');target=room.user_one===me.id?room.user_two:room.user_one}async function load(){const a=await db.auth.getUser();if(a.error||!a.data?.user){location.href='./auth.html?next='+encodeURIComponent(location.href);return}me=a.data.user;await ensureRoom();const p=await db.from('profiles').select('username,full_name,avatar_url').eq('id',target).maybeSingle();if(p.data){$('name').textContent=p.data.full_name||'Member';$('username').textContent=p.data.username?`@${p.data.username}`:'Member'}const r=await db.from('messages').select('id,sender_id,receiver_id,content,created_at').eq('room_id',room.id).order('created_at',{ascending:true});if(r.error)throw r.error;render(r.data||[]);status('Connected');subscribe()}function subscribe(){db.channel('room-'+room.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`room_id=eq.${room.id}`},payload=>{const m=payload.new;if(m.sender_id!==me.id){const current=[...document.querySelectorAll('.msg')];const box=$('messages');const el=document.createElement('div');el.className='msg theirs';el.textContent=m.content;const t=document.createElement('span');t.className='time';t.textContent=new Date(m.created_at).toLocaleString();el.appendChild(t);if(current.length===0)box.innerHTML='';box.appendChild(el);box.scrollTop=box.scrollHeight}}).subscribe()}$('form').onsubmit=async e=>{e.preventDefault();const content=$('input').value.trim();if(!content||!room)return;$('input').value='';const r=await db.from('messages').insert({room_id:room.id,sender_id:me.id,receiver_id:target,content}).select().single();if(r.error){$('input').value=content;status(r.error.message);return}const old=document.querySelector('.empty');if(old)old.remove();const el=document.createElement('div');el.className='msg mine';el.textContent=r.data.content;const t=document.createElement('span');t.className='time';t.textContent=new Date(r.data.created_at).toLocaleString();el.appendChild(t);$('messages').appendChild(el);$('messages').scrollTop=$('messages').scrollHeight};load().catch(e=>{$('messages').innerHTML=`<div class="error"><b>Chat could not be opened</b>${esc(e.message||'Unknown error')}</div>`;status('Error')});
</script></body></html>

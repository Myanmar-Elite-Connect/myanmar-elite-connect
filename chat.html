<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat - Myanmar Elite Connect</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --navy:#071b3a;
  --navy2:#102d59;
  --green:#19a974;
  --bg:#f4f7fb;
  --white:#fff;
  --text:#172033;
  --muted:#697386;
  --border:#e1e6ef;
  --danger:#c62828;
}

body{
  font-family:Arial,"Noto Sans Myanmar",sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  overflow:hidden;
}

/* ==============================
   HEADER
============================== */

header{
  height:64px;
  background:var(--navy);
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
}

.logo{
  color:white;
  text-decoration:none;
  font-size:20px;
  font-weight:900;
}

.logo span{
  color:#65d6a7;
}

.header-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.header-btn{
  border:0;
  background:rgba(255,255,255,.1);
  color:white;
  padding:9px 12px;
  border-radius:8px;
  cursor:pointer;
}

/* ==============================
   APP
============================== */

.chat-app{
  height:calc(100vh - 64px);
  display:grid;
  grid-template-columns:330px 1fr;
}

/* ==============================
   SIDEBAR
============================== */

.sidebar{
  background:white;
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  min-width:0;
}

.sidebar-top{
  padding:18px;
  border-bottom:1px solid var(--border);
}

.sidebar-title{
  font-size:22px;
  font-weight:900;
  color:var(--navy);
  margin-bottom:13px;
}

.search-users{
  width:100%;
  border:1px solid var(--border);
  border-radius:10px;
  padding:11px 13px;
  outline:none;
  font-size:14px;
}

.search-users:focus{
  border-color:var(--navy);
}

.user-list{
  flex:1;
  overflow-y:auto;
}

.user-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 16px;
  border-bottom:1px solid #f0f2f6;
  cursor:pointer;
  transition:.15s;
}

.user-item:hover{
  background:#f5f8fc;
}

.user-item.active{
  background:#eaf5ff;
}

.avatar{
  width:45px;
  height:45px;
  flex-shrink:0;
  border-radius:50%;
  overflow:hidden;
  background:var(--navy);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.user-info{
  min-width:0;
  flex:1;
}

.user-name{
  font-weight:800;
  color:var(--text);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.user-role{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

.empty-users{
  padding:40px 20px;
  text-align:center;
  color:var(--muted);
  line-height:1.7;
}

/* ==============================
   CHAT AREA
============================== */

.chat-area{
  min-width:0;
  display:flex;
  flex-direction:column;
  background:#eef2f7;
}

.chat-header{
  min-height:70px;
  background:white;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:10px 18px;
  gap:12px;
}

.chat-user-name{
  font-weight:900;
  color:var(--navy);
  font-size:17px;
}

.chat-user-status{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:22px;
  display:flex;
  flex-direction:column;
  gap:9px;
}

.select-chat{
  margin:auto;
  text-align:center;
  color:var(--muted);
}

.select-chat-icon{
  font-size:60px;
  margin-bottom:10px;
}

.message-row{
  display:flex;
  width:100%;
}

.message-row.mine{
  justify-content:flex-end;
}

.message-row.theirs{
  justify-content:flex-start;
}

.message-bubble{
  max-width:min(70%,600px);
  padding:10px 13px;
  border-radius:15px;
  position:relative;
  word-break:break-word;
  line-height:1.55;
}

.mine .message-bubble{
  background:var(--navy);
  color:white;
  border-bottom-right-radius:4px;
}

.theirs .message-bubble{
  background:white;
  color:var(--text);
  border:1px solid var(--border);
  border-bottom-left-radius:4px;
}

.message-text{
  white-space:pre-wrap;
}

.message-time{
  font-size:10px;
  opacity:.65;
  margin-top:4px;
  text-align:right;
}

.delete-message{
  margin-left:7px;
  border:0;
  background:transparent;
  cursor:pointer;
  font-size:12px;
  opacity:.6;
}

.delete-message:hover{
  opacity:1;
}

/* ==============================
   INPUT
============================== */

.message-form{
  background:white;
  border-top:1px solid var(--border);
  padding:12px;
  display:flex;
  gap:8px;
  align-items:flex-end;
}

.emoji-btn{
  width:44px;
  height:44px;
  border:1px solid var(--border);
  background:#f7f9fc;
  border-radius:10px;
  cursor:pointer;
  font-size:21px;
}

.message-input{
  flex:1;
  min-height:44px;
  max-height:130px;
  resize:none;
  border:1px solid var(--border);
  border-radius:11px;
  padding:11px 13px;
  outline:none;
  font-family:inherit;
  font-size:14px;
}

.message-input:focus{
  border-color:var(--navy);
}

.send-btn{
  height:44px;
  border:0;
  background:var(--green);
  color:white;
  padding:0 18px;
  border-radius:10px;
  font-weight:900;
  cursor:pointer;
}

.send-btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

/* ==============================
   EMOJI PANEL
============================== */

.emoji-panel{
  position:absolute;
  bottom:70px;
  left:12px;
  background:white;
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:0 12px 35px rgba(0,0,0,.15);
  padding:10px;
  width:280px;
  display:none;
  z-index:20;
}

.emoji-panel.show{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:5px;
}

.emoji{
  border:0;
  background:transparent;
  font-size:23px;
  padding:5px;
  border-radius:7px;
  cursor:pointer;
}

.emoji:hover{
  background:#f0f3f8;
}

/* ==============================
   STATES
============================== */

.loading{
  margin:auto;
  color:var(--muted);
  text-align:center;
}

.spinner{
  width:35px;
  height:35px;
  border:4px solid #e3e8ef;
  border-top-color:var(--navy);
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto 12px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.error-box{
  margin:20px;
  padding:18px;
  border-radius:12px;
  background:#fff0f0;
  border:1px solid #ffd0d0;
  color:var(--danger);
  line-height:1.7;
}

/* ==============================
   MOBILE
============================== */

.mobile-back{
  display:none;
  border:0;
  background:transparent;
  font-size:22px;
  cursor:pointer;
  color:var(--navy);
}

@media(max-width:750px){

  body{
    overflow:hidden;
  }

  .chat-app{
    display:block;
    height:calc(100vh - 64px);
    position:relative;
  }

  .sidebar{
    position:absolute;
    inset:0;
    z-index:5;
    width:100%;
  }

  .chat-area{
    position:absolute;
    inset:0;
    z-index:6;
    display:none;
  }

  .chat-area.mobile-show{
    display:flex;
  }

  .mobile-back{
    display:block;
  }

  .message-bubble{
    max-width:82%;
  }

  .logo{
    font-size:16px;
  }

  .header-right .header-btn{
    font-size:12px;
  }

  .messages{
    padding:15px;
  }
}
</style>
</head>

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://ikjwisfsdcupibgjiuvp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_xoh1rjwBlJhR9nB3kQD-KA_QcVY6w2s";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================
   GLOBAL
========================================= */

let currentUser = null;
let selectedUser = null;
let currentRoom = null;
let allUsers = [];
let realtimeChannel = null;


/* =========================================
   ELEMENTS
========================================= */

const userList =
document.getElementById("userList");

const userSearch =
document.getElementById("userSearch");

const chatArea =
document.getElementById("chatArea");

const chatUserName =
document.getElementById("chatUserName");

const chatUserStatus =
document.getElementById("chatUserStatus");

const headerAvatar =
document.getElementById("headerAvatar");

const messages =
document.getElementById("messages");

const messageForm =
document.getElementById("messageForm");

const messageInput =
document.getElementById("messageInput");

const sendButton =
document.getElementById("sendButton");

const emojiButton =
document.getElementById("emojiButton");

const emojiPanel =
document.getElementById("emojiPanel");


/* =========================================
   EMOJIS
========================================= */

const emojis = [
"😀","😂","🤣","😊","😍","🥰","😘","😎",
"🤔","😮","😢","😭","😡","👍","👎","👏",
"🙏","❤️","💚","💙","💛","🔥","🎉","✨",
"💯","🚗","🏠","💎","📱","💰","🤝","👑",
"🛡️","✅","❌","⭐","😂","😅","😉","😇"
];

emojiPanel.innerHTML =
emojis.map(
emoji =>
`<button type="button" class="emoji">${emoji}</button>`
).join("");


/* =========================================
   HELPERS
========================================= */

function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function getInitial(name){

  if(!name){
    return "👤";
  }

  return name
    .trim()
    .charAt(0)
    .toUpperCase();
}


function formatTime(date){

  const d =
  new Date(date);

  return d.toLocaleTimeString(
    "en-US",
    {
      hour:"numeric",
      minute:"2-digit"
    }
  );

}


/* =========================================
   GET CURRENT USER
========================================= */

async function getCurrentUser(){

  const {
    data,
    error
  } =
  await supabaseClient.auth.getSession();

  if(error){
    throw error;
  }

  if(
    !data ||
    !data.session
  ){
    return null;
  }

  return data.session.user;
}


/* =========================================
   LOAD USERS
========================================= */

async function loadUsers(){

  try{

    currentUser =
    await getCurrentUser();

    if(!currentUser){

      userList.innerHTML = `
        <div class="empty-users">
          🔐<br><br>
          Chat အသုံးပြုရန်<br>
          Login ဝင်ထားရပါမည်။
          <br><br>
          <button
            onclick="location.href='./auth.html'"
            style="
              border:0;
              background:#071b3a;
              color:white;
              padding:10px 15px;
              border-radius:8px;
              cursor:pointer;
              font-weight:bold;
            "
          >
            Login
          </button>
        </div>
      `;

      return;
    }


    const {
      data,
      error
    } =
    await supabaseClient
      .from("profiles")
      .select(`
        id,
        full_name,
        phone,
        avatar_url,
        city,
        role
      `)
      .neq(
        "id",
        currentUser.id
      )
      .order(
        "full_name",
        {
          ascending:true
        }
      );


    if(error){
      throw error;
    }


    allUsers =
    Array.isArray(data)
    ? data
    : [];


    renderUsers(
      allUsers
    );

  }
  catch(error){

    console.error(
      "User loading error:",
      error
    );

    userList.innerHTML = `
      <div class="error-box">
        ❌ User များကို ရယူမရပါ။
        <br><br>
        ${escapeHtml(error.message)}
      </div>
    `;

  }

}


/* =========================================
   RENDER USERS
========================================= */

function renderUsers(users){

  if(!users.length){

    userList.innerHTML = `
      <div class="empty-users">
        👥<br><br>
        Chat လုပ်နိုင်မယ့်<br>
        အခြား User မရှိသေးပါ။
      </div>
    `;

    return;
  }


  userList.innerHTML =
  users.map(
    user => {

      const name =
      escapeHtml(
        user.full_name ||
        "Unknown User"
      );

      const avatar =
      user.avatar_url
      ? `
        <img
          src="${escapeHtml(user.avatar_url)}"
          alt=""
        >
      `
      : getInitial(
          user.full_name
        );


      return `
        <div
          class="user-item ${
            selectedUser &&
            selectedUser.id === user.id
            ? "active"
            : ""
          }"
          data-user-id="${user.id}"
        >

          <div class="avatar">
            ${avatar}
          </div>

          <div class="user-info">

            <div class="user-name">
              ${name}
            </div>

            <div class="user-role">
              ${escapeHtml(
                user.role || "user"
              )}
            </div>

          </div>

        </div>
      `;

    }
  ).join("");


  document
    .querySelectorAll(".user-item")
    .forEach(
      item => {

        item.addEventListener(
          "click",
          () => {

            const id =
            item.dataset.userId;

            const user =
            allUsers.find(
              u => u.id === id
            );

            if(user){
              openChat(user);
            }

          }
        );

      }
    );

}


/* =========================================
   SEARCH USERS
========================================= */

userSearch.addEventListener(
  "input",
  function(){

    const keyword =
    this.value
      .trim()
      .toLowerCase();

    if(!keyword){

      renderUsers(
        allUsers
      );

      return;
    }


    const filtered =
    allUsers.filter(
      user => {

        const text = [
          user.full_name,
          user.phone,
          user.city,
          user.role
        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

        return text.includes(
          keyword
        );

      }
    );


    renderUsers(
      filtered
    );

  }
);


/* =========================================
   FIND / CREATE ROOM
========================================= */

async function getOrCreateRoom(
  otherUserId
){

  const first =
  currentUser.id <
  otherUserId
  ? currentUser.id
  : otherUserId;

  const second =
  currentUser.id <
  otherUserId
  ? otherUserId
  : currentUser.id;


  let {
    data: room,
    error
  } =
  await supabaseClient
    .from("chat_rooms")
    .select("*")
    .eq("user_one",first)
    .eq("user_two",second)
    .maybeSingle();


  if(error){
    throw error;
  }


  if(room){
    return room;
  }


  const result =
  await supabaseClient
    .from("chat_rooms")
    .insert({
      user_one:first,
      user_two:second
    })
    .select()
    .single();


  if(result.error){

    /*
      Another request may have created
      the room at the same time.
    */

    if(
      result.error.code === "23505"
    ){

      const retry =
      await supabaseClient
        .from("chat_rooms")
        .select("*")
        .eq("user_one",first)
        .eq("user_two",second)
        .single();

      if(retry.error){
        throw retry.error;
      }

      return retry.data;
    }

    throw result.error;
  }


  return result.data;

}


/* =========================================
   OPEN CHAT
========================================= */

async function openChat(user){

  selectedUser =
  user;


  chatArea.classList.add(
    "mobile-show"
  );


  chatUserName.textContent =
  user.full_name ||
  "Unknown User";


  chatUserStatus.textContent =
  user.city
  ? user.city
  : "Myanmar Elite Connect User";


  if(user.avatar_url){

    headerAvatar.innerHTML =
    `
      <img
        src="${escapeHtml(user.avatar_url)}"
        alt=""
      >
    `;

  }else{

    headerAvatar.textContent =
    getInitial(
      user.full_name
    );

  }


  messages.innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      Chat ကို ဖွင့်နေပါသည်...
    </div>
  `;


  messageInput.disabled =
  true;

  sendButton.disabled =
  true;


  try{

    currentRoom =
    await getOrCreateRoom(
      user.id
    );


    await loadMessages();


    subscribeRealtime();


    messageInput.disabled =
    false;

    sendButton.disabled =
    false;

    messageInput.focus();


    renderUsers(
      allUsers
    );

  }
  catch(error){

    console.error(
      "Open chat error:",
      error
    );

    messages.innerHTML = `
      <div class="error-box">
        ❌ Chat ဖွင့်၍မရပါ။
        <br><br>
        ${escapeHtml(error.message)}
      </div>
    `;

  }

}


/* =========================================
   LOAD MESSAGES
========================================= */

async function loadMessages(){

  if(!currentRoom){
    return;
  }


  const {
    data,
    error
  } =
  await supabaseClient
    .from("chat_messages")
    .select("*")
    .eq(
      "room_id",
      currentRoom.id
    )
    .order(
      "created_at",
      {
        ascending:true
      }
    );


  if(error){
    throw error;
  }


  messages.innerHTML = "";


  if(!data || !data.length){

    messages.innerHTML = `
      <div class="select-chat">
        <div class="select-chat-icon">
          👋
        </div>
        <h3>
          စကားစပြောလိုက်ပါ
        </h3>
        <p>
          ပထမဆုံး Message ပို့လိုက်ပါ။
        </p>
      </div>
    `;

    return;
  }


  data.forEach(
    message => {

      renderMessage(
        message
      );

    }
  );


  scrollToBottom();

}


/* =========================================
   RENDER MESSAGE
========================================= */

function renderMessage(message){

  const emptyState =
  messages.querySelector(
    ".select-chat"
  );

  if(emptyState){
    emptyState.remove();
  }


  const mine =
  message.sender_id ===
  currentUser.id;


  const row =
  document.createElement(
    "div"
  );

  row.className =
  "message-row " +
  (
    mine
    ? "mine"
    : "theirs"
  );


  const bubble =
  document.createElement(
    "div"
  );

  bubble.className =
  "message-bubble";


  const text =
  document.createElement(
    "div"
  );

  text.className =
  "message-text";

  text.textContent =
  message.message || "";


  const time =
  document.createElement(
    "div"
  );

  time.className =
  "message-time";

  time.textContent =
  formatTime(
    message.created_at
  );


  bubble.appendChild(
    text
  );

  bubble.appendChild(
    time
  );


  if(mine){

    const deleteButton =
    document.createElement(
      "button"
    );

    deleteButton.type =
    "button";

    deleteButton.className =
    "delete-message";

    deleteButton.textContent =
    "🗑️";

    deleteButton.title =
    "Delete message";

    deleteButton.addEventListener(
      "click",
      () => {

        deleteMessage(
          message.id
        );

      }
    );

    bubble.appendChild(
      deleteButton
    );

  }


  row.appendChild(
    bubble
  );

  messages.appendChild(
    row
  );

}


/* =========================================
   SEND MESSAGE
========================================= */

messageForm.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    if(
      !currentUser ||
      !currentRoom
    ){
      return;
    }


    const text =
    messageInput.value.trim();


    if(!text){
      return;
    }


    sendButton.disabled =
    true;


    try{

      const {
        error
      } =
      await supabaseClient
        .from("chat_messages")
        .insert({

          room_id:
          currentRoom.id,

          sender_id:
          currentUser.id,

          message:
          text,

          message_type:
          "text"

        });


      if(error){
        throw error;
      }


      messageInput.value =
      "";

      messageInput.style.height =
      "44px";

    }
    catch(error){

      console.error(
        "Send message error:",
        error
      );

      alert(
        "Message ပို့မရပါ။\n" +
        error.message
      );

    }
    finally{

      sendButton.disabled =
      false;

      messageInput.focus();

    }

  }
);


/* =========================================
   REALTIME
========================================= */

function subscribeRealtime(){

  if(
    realtimeChannel
  ){

    supabaseClient
      .removeChannel(
        realtimeChannel
      );

  }


  if(!currentRoom){
    return;
  }


  realtimeChannel =
  supabaseClient
    .channel(
      "chat-room-" +
      currentRoom.id
    )
    .on(
      "postgres_changes",
      {
        event:"INSERT",
        schema:"public",
        table:"chat_messages",
        filter:
        "room_id=eq." +
        currentRoom.id
      },
      payload => {

        /*
          Avoid duplicate display because
          the sender may receive realtime too.
        */

        const existing =
        messages.querySelector(
          `[data-message-id="${payload.new.id}"]`
        );

        if(existing){
          return;
        }


        renderMessage(
          payload.new
        );

        scrollToBottom();

      }
    )
    .on(
      "postgres_changes",
      {
        event:"DELETE",
        schema:"public",
        table:"chat_messages",
        filter:
        "room_id=eq." +
        currentRoom.id
      },
      payload => {

        const rows =
        messages.children;

        /*
          Reloading is safer for delete events.
        */

        loadMessages()
        .catch(
          console.error
        );

      }
    )
    .subscribe(
      status => {

        console.log(
          "Realtime status:",
          status
        );

      }
    );

}


/* =========================================
   DELETE MESSAGE
========================================= */

async function deleteMessage(
  messageId
){

  const confirmed =
  confirm(
    "ဒီ Message ကို ဖျက်မှာသေချာပါသလား?"
  );


  if(!confirmed){
    return;
  }


  try{

    const {
      error
    } =
    await supabaseClient
      .from("chat_messages")
      .delete()
      .eq(
        "id",
        messageId
      )
      .eq(
        "sender_id",
        currentUser.id
      );


    if(error){
      throw error;
    }

  }
  catch(error){

    console.error(
      "Delete message error:",
      error
    );

    alert(
      "Message ဖျက်မရပါ။\n" +
      error.message
    );

  }

}

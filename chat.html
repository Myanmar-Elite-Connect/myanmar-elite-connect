<!DOCTYPE html>
<html lang="my">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Myanmar Elite Connect - Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --navy:#071b3a;
    --navy2:#102d59;
    --green:#19a974;
    --green2:#0f8f60;
    --gold:#d9a441;
    --bg:#f3f6fa;
    --white:#ffffff;
    --text:#172033;
    --muted:#697386;
    --border:#e1e6ee;
    --danger:#b42318;
    --shadow:0 8px 25px rgba(7,27,58,.08);
}

body{
    font-family:Arial,"Noto Sans Myanmar",sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}


/* =========================
   HEADER
========================= */

header{
    height:64px;
    background:var(--navy);
    color:white;
    display:flex;
    align-items:center;
    position:sticky;
    top:0;
    z-index:1000;
}

.header-inner{
    width:100%;
    max-width:1400px;
    margin:auto;
    padding:0 25px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    color:white;
    text-decoration:none;
    font-size:20px;
    font-weight:900;
}

.logo span{
    color:#65d6a7;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.header-button{
    border:0;
    background:rgba(255,255,255,.1);
    color:white;
    padding:9px 12px;
    border-radius:9px;
    cursor:pointer;
    font-size:14px;
}


/* =========================
   CHAT APP
========================= */

.chat-wrapper{
    max-width:1400px;
    height:calc(100vh - 64px);
    margin:auto;

    display:grid;
    grid-template-columns:330px 1fr;

    background:white;
}


/* =========================
   CHAT SIDEBAR
========================= */

.chat-sidebar{
    border-right:1px solid var(--border);
    background:#fff;

    display:flex;
    flex-direction:column;
    min-width:0;
}

.sidebar-header{
    padding:20px;
    border-bottom:1px solid var(--border);
}

.sidebar-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;
}

.sidebar-title h2{
    color:var(--navy);
    font-size:22px;
}

.online-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#19a974;
    display:inline-block;
}

.search-users{
    width:100%;
    border:1px solid var(--border);
    border-radius:10px;
    padding:11px 13px;
    outline:none;
    font-family:inherit;
}

.search-users:focus{
    border-color:var(--navy);
}


/* USER LIST */

.user-list{
    flex:1;
    overflow-y:auto;
}

.user-item{
    padding:14px 17px;

    display:flex;
    align-items:center;
    gap:12px;

    cursor:pointer;
    border-bottom:1px solid #f0f2f5;
    transition:.2s;
}

.user-item:hover{
    background:#f5f8fc;
}

.user-item.active{
    background:#edf6f2;
}

.avatar{
    width:48px;
    height:48px;

    border-radius:50%;

    background:linear-gradient(
        135deg,
        var(--navy),
        var(--green)
    );

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:900;
    font-size:18px;

    flex-shrink:0;
}

.user-info{
    min-width:0;
    flex:1;
}

.user-name-row{
    display:flex;
    justify-content:space-between;
    gap:8px;
}

.user-name{
    font-weight:800;
    color:var(--text);

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chat-time{
    color:#9aa3b2;
    font-size:11px;
}

.last-message{
    color:var(--muted);
    font-size:13px;

    margin-top:5px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.unread{
    min-width:20px;
    height:20px;
    padding:0 5px;

    border-radius:20px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:var(--green);
    color:white;

    font-size:10px;
    font-weight:900;
}


/* =========================
   CHAT AREA
========================= */

.chat-main{
    display:flex;
    flex-direction:column;
    min-width:0;
    background:#f7f9fc;
}


/* EMPTY */

.chat-empty{
    flex:1;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;
    padding:30px;
}

.empty-icon{
    font-size:65px;
    margin-bottom:15px;
}

.chat-empty h2{
    color:var(--navy);
    margin-bottom:8px;
}

.chat-empty p{
    color:var(--muted);
    line-height:1.7;
}


/* CHAT HEADER */

.conversation-header{
    height:72px;

    background:white;
    border-bottom:1px solid var(--border);

    display:none;

    align-items:center;
    padding:12px 20px;

    gap:12px;
}

.conversation-header.show{
    display:flex;
}

.conversation-user{
    flex:1;
}

.conversation-user strong{
    display:block;
    color:var(--navy);
}

.conversation-user small{
    color:var(--green);
}


/* MESSAGES */

.messages{
    flex:1;
    overflow-y:auto;
    padding:25px;

    display:none;
    flex-direction:column;
    gap:10px;
}

.messages.show{
    display:flex;
}

.message-row{
    display:flex;
    width:100%;
}

.message-row.me{
    justify-content:flex-end;
}

.message{
    max-width:70%;

    padding:10px 13px;

    border-radius:15px;

    line-height:1.55;
    font-size:14px;
}

.message.them{
    background:white;
    border:1px solid var(--border);
    border-bottom-left-radius:4px;
}

.message.me{
    background:var(--navy);
    color:white;
    border-bottom-right-radius:4px;
}

.message-time{
    display:block;
    margin-top:4px;
    font-size:9px;
    opacity:.6;
    text-align:right;
}


/* =========================
   INPUT AREA
========================= */

.message-input-area{
    display:none;

    background:white;
    border-top:1px solid var(--border);

    padding:12px;
}

.message-input-area.show{
    display:block;
}

.input-row{
    display:flex;
    align-items:center;
    gap:7px;
}

.icon-button{
    width:40px;
    height:40px;

    border:0;
    background:#f1f4f8;

    border-radius:10px;

    cursor:pointer;
    font-size:18px;

    flex-shrink:0;
}

.icon-button:hover{
    background:#e6ebf2;
}

.message-input{
    flex:1;

    min-width:0;

    border:1px solid var(--border);
    border-radius:12px;

    padding:11px 13px;

    outline:none;
    font-family:inherit;
    font-size:14px;
}

.message-input:focus{
    border-color:var(--navy);
}

.send-button{
    width:43px;
    height:43px;

    border:0;
    border-radius:12px;

    background:var(--green);

    color:white;

    cursor:pointer;

    font-size:18px;
}

.send-button:hover{
    background:var(--green2);
}


/* =========================
   EMOJI PANEL
========================= */

.emoji-panel{
    display:none;

    background:white;
    border:1px solid var(--border);
    border-radius:12px;

    padding:10px;

    margin-bottom:8px;

    box-shadow:var(--shadow);

    grid-template-columns:
        repeat(8,1fr);

    gap:5px;
}

.emoji-panel.show{
    display:grid;
}

.emoji{
    border:0;
    background:none;
    cursor:pointer;

    font-size:21px;

    padding:5px;
    border-radius:6px;
}

.emoji:hover{
    background:#f1f4f8;
}


/* =========================
   LOGIN
========================= */

.login-required{
    max-width:450px;
    margin:80px auto;

    background:white;

    border-radius:20px;

    padding:40px 25px;

    text-align:center;

    box-shadow:var(--shadow);
}

.login-required .icon{
    font-size:55px;
    margin-bottom:15px;
}

.login-required h2{
    color:var(--navy);
    margin-bottom:10px;
}

.login-required p{
    color:var(--muted);
    line-height:1.7;
}

.login-button{
    display:inline-block;

    margin-top:20px;

    padding:12px 22px;

    border-radius:10px;

    background:var(--navy);

    color:white;

    text-decoration:none;

    font-weight:800;
}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    display:none;
}


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    header{
        height:58px;
    }

    .header-inner{
        padding:0 15px;
    }

    .logo{
        font-size:16px;
    }

    .header-actions{
        display:none;
    }

    .chat-wrapper{
        height:calc(100vh - 58px);
        display:block;
        position:relative;
    }

    .chat-sidebar{
        width:100%;
        height:100%;
        border:0;
    }

    .chat-sidebar.hidden{
        display:none;
    }

    .chat-main{
        position:absolute;

        inset:0;

        z-index:20;

        display:none;
    }

    .chat-main.mobile-show{
        display:flex;
    }

    .conversation-header{
        height:64px;
    }

    .messages{
        padding:18px 13px 90px;
    }

    .message{
        max-width:82%;
    }

    .message-input-area{
        position:absolute;
        bottom:0;
        left:0;
        right:0;
        z-index:30;
    }

    .back-mobile{
        display:block;
        border:0;
        background:none;
        font-size:20px;
        cursor:pointer;
    }

    .bottom-nav{
        position:fixed;
        bottom:0;
        left:0;
        right:0;

        height:62px;

        background:white;

        border-top:1px solid var(--border);

        display:flex;

        justify-content:space-around;

        z-index:2000;
    }

    .bottom-nav a{
        flex:1;

        text-decoration:none;

        color:var(--muted);

        display:flex;

        flex-direction:column;

        align-items:center;
        justify-content:center;

        gap:3px;

        font-size:11px;
        font-weight:700;
    }

    .bottom-nav a.active{
        color:var(--navy);
    }

    .bottom-nav .nav-icon{
        font-size:20px;
    }

    .sidebar-header{
        padding-bottom:12px;
    }

    .user-list{
        padding-bottom:65px;
    }

}


/* =========================
   DARK MODE
========================= */

body.dark{
    --bg:#101722;
    --white:#172130;
    --text:#edf2f7;
    --muted:#a6b0bf;
    --border:#293546;

    background:var(--bg);
}

body.dark .chat-sidebar,
body.dark .conversation-header,
body.dark .message-input-area,
body.dark .login-required{
    background:#172130;
}

body.dark .user-item:hover{
    background:#202c3c;
}

body.dark .user-item.active{
    background:#1b3a32;
}

body.dark .chat-main{
    background:#111a27;
}

body.dark .message.them{
    background:#1b2635;
}

body.dark .search-users,
body.dark .message-input{
    background:#101722;
    color:white;
    border-color:#344255;
}

body.dark .bottom-nav{
    background:#172130;
}

</style>
</head>

<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://ikjwisfsdcupibgjiuvp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_xoh1rjwBlJhR9nB3kQD-KA_QcVY6w2s";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   GLOBAL
========================================= */

let currentUser = null;

let selectedUser = null;

let messagesData = [];

let demoUsers = [];


/* =========================================
   GET CURRENT USER
========================================= */

async function getCurrentUser(){

    const {
        data,
        error
    } =
    await supabaseClient
    .auth
    .getSession();

    if(error){
        throw error;
    }

    if(
        !data ||
        !data.session ||
        !data.session.user
    ){
        return null;
    }

    return data.session.user;
}


/* =========================================
   INITIALIZE
========================================= */

async function initialize(){

    try{

        currentUser =
        await getCurrentUser();

        if(!currentUser){

            document
            .getElementById(
                "loginRequired"
            )
            .style.display="block";

            return;

        }


        document
        .getElementById(
            "chatWrapper"
        )
        .style.display="grid";


        await loadUsers();

    }
    catch(error){

        console.error(error);

        alert(
            "Chat စတင်ရာတွင် ပြဿနာရှိပါသည်။"
        );

    }

}


/* =========================================
   LOAD USERS
========================================= */

async function loadUsers(){

    const list =
    document.getElementById(
        "userList"
    );

    list.innerHTML=`
        <div style="
            padding:30px;
            text-align:center;
            color:#697386">
            Users များကို ရှာနေပါသည်...
        </div>
    `;


    try{

        const {
            data,
            error
        } =
        await supabaseClient
        .from("profiles")
        .select(
            "id,full_name,avatar_url,role,bio"
        )
        .neq(
            "id",
            currentUser.id
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


        if(error){
            throw error;
        }


        demoUsers =
        Array.isArray(data)
        ? data
        : [];


        renderUsers();

    }
    catch(error){

        console.error(
            "User loading error:",
            error
        );


        list.innerHTML=`

        <div style="
            padding:30px;
            text-align:center;
            color:#b42318;
            line-height:1.7">

            ❌ User များကို
            ရယူ၍မရပါ။

            <br><br>

            ${escapeHtml(
                error.message
            )}

        </div>

        `;

    }

}


/* =========================================
   RENDER USERS
========================================= */

function renderUsers(){

    const list =
    document.getElementById(
        "userList"
    );

    const keyword =
    document
    .getElementById(
        "userSearch"
    )
    .value
    .trim()
    .toLowerCase();


    let users =
    demoUsers;


    if(keyword){

        users =
        users.filter(
            user => {

                const text =
                [
                    user.full_name,
                    user.role,
                    user.bio
                ]
                .filter(Boolean)
                .join(" ")
                .toLowerCase();

                return text.includes(
                    keyword
                );

            }
        );

    }


    if(!users.length){

        list.innerHTML=`

        <div style="
            padding:35px 20px;
            text-align:center;
            color:#697386">

            👤

            <br><br>

            User မတွေ့ပါ။

        </div>

        `;

        return;

    }


    list.innerHTML =
    users
    .map(
        user => {

            const name =
            escapeHtml(
                user.full_name ||
                "Unknown User"
            );


            const initial =
            escapeHtml(
                (
                    user.full_name ||
                    "U"
                )
                .charAt(0)
                .toUpperCase()
            );


            const avatar =
            user.avatar_url
            ?
            `<img
                src="${escapeHtml(
                    user.avatar_url
                )}"
                style="
                    width:100%;
                    height:100%;
                    object-fit:cover;
                    border-radius:50%">
            `
            :
            initial;


            return `

            <div
                class="user-item ${
                    selectedUser &&
                    selectedUser.id === user.id
                    ? "active"
                    : ""
                }"
                onclick="openChat('${user.id}')">

                <div class="avatar">
                    ${avatar}
                </div>

                <div class="user-info">

                    <div class="user-name-row">

                        <span class="user-name">
                            ${name}
                        </span>

                        <span class="chat-time">
                            —
                        </span>

                    </div>

                    <div class="last-message">
                        Start a conversation
                    </div>

                </div>

            </div>

            `;

        }
    )
    .join("");

}


/* =========================================
   OPEN CHAT
========================================= */

async function openChat(userId){

    selectedUser =
    demoUsers.find(
        user => user.id === userId
    );


    if(!selectedUser){
        return;
    }


    document
    .getElementById(
        "chatEmpty"
    )
    .style.display="none";


    const header =
    document.getElementById(
        "conversationHeader"
    );

    header.classList.add(
        "show"
    );


    const messages =
    document.getElementById(
        "messages"
    );

    messages.classList.add(
        "show"
    );


    document
    .getElementById(
        "messageInputArea"
    )
    .classList.add(
        "show"
    );


    document
    .getElementById(
        "conversationName"
    )
    .textContent =
    selectedUser.full_name ||
    "User";


    document
    .getElementById(
        "conversationAvatar"
    )
    .textContent =
    (
        selectedUser.full_name ||
        "U"
    )
    .charAt(0)
    .toUpperCase();


    renderUsers();


    /* MOBILE */

    document
    .getElementById(
        "chatSidebar"
    )
    .classList.add(
        "hidden"
    );


    document
    .getElementById(
        "chatMain"
    )
    .classList.add(
        "mobile-show"
    );


    /*
        Database message loading
        will be connected when
        chat_messages table is created.
    */

    renderMessages();

}


/* =========================================
   RENDER MESSAGES
========================================= */

function renderMessages(){

    const container =
    document.getElementById(
        "messages"
    );


    if(!messagesData.length){

        container.innerHTML=`

        <div style="
            margin:auto;
            text-align:center;
            color:#8a94a6">

            <div style="
                font-size:45px;
                margin-bottom:10px">
                👋
            </div>

            <strong>
                စကားစတင်ပြောလိုက်ပါ
            </strong>

            <br>

            <small>
                ပထမဆုံး Message ကို
                ပို့လိုက်ပါ။
            </small>

        </div>

        `;

        return;

    }


    container.innerHTML =
    messagesData
    .map(
        message => {

            const mine =
            message.sender_id ===
            currentUser.id;


            return `

            <div class="
                message-row
                ${mine ? "me" : ""}
            ">

                <div class="
                    message
                    ${mine ? "me" : "them"}
                ">

                    ${escapeHtml(
                        message.text
                    )}

                    <span
                        class="message-time">

                        ${escapeHtml(
                            message.time ||
                            ""
                        )}

                    </span>

                </div>

            </div>

            `;

        }
    )
    .join("");


    container.scrollTop =
    container.scrollHeight;

}


/* =========================================
   SEND MESSAGE
========================================= */

async function sendMessage(){

    if(!selectedUser){
        return;
    }


    const input =
    document.getElementById(
        "messageInput"
    );


    const text =
    input.value.trim();


    if(!text){
        return;
    }


    /*
        Temporary local message.

        Real Supabase insert will be
        connected after chat_messages
        table is created.
    */

    messagesData.push({

        sender_id:
        currentUser.id,

        receiver_id:
        selectedUser.id,

        text:
        text,

        time:
        new Date()
        .toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        )

    });


    input.value="";


    renderMessages();


    /*
        Future:
        await supabaseClient
        .from("chat_messages")
        .insert(...)
    */

}


/* =========================================
   ENTER SEND
========================================= */

document
.getElementById(
    "messageInput"
)
.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================
   SEARCH USER
========================================= */

document
.getElementById(
    "userSearch"
)
.addEventListener(
    "input",
    renderUsers
);

/* =========================================
   CLEAR CONVERSATION
========================================= */

function clearConversation(){

    if(!selectedUser){
        return;
    }


    const confirmClear =
    confirm(
        "ဒီ Conversation ကို ရှင်းလင်းမလား?"

        return;
    }


    messagesData=[];

    renderMessages();

}

   MOBILE BACK
========================================= */

function backToUsers(){

    .getElementById(
        "chatSidebar"
    )
    .classList.remove(
        "hidden"
    );


    document
    .getElementById(
        "chatMain"
    )
    .classList.remove(
        "mobile-show"
    );


    selectedUser=null;

}


/* =========================================
   DARK MODE
========================================= */

function toggleDarkMode(){

    document
    .body
    .classList
    .toggle("dark");


    localStorage.setItem(
        "mec_dark_mode",
        document.body.classList.contains(
            "dark"
        )
        ? "1"
        : "0"
    );

}


function loadTheme(){

    if(
        localStorage.getItem(
            "mec_dark_mode"
        ) === "1"
    ){

        document
        .body
        .classList
        .add("dark");

    }

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }


    return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================
   START
========================================= */

loadTheme();

initialize();

<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Chat - Myanmar Elite Connect</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --navy:#071b3a;
  --navy2:#102d59;
  --green:#19a974;
  --green2:#0f8f60;
  --bg:#f4f7fb;
  --white:#fff;
  --text:#172033;
  --muted:#697386;
  --border:#e3e8f0;
  --danger:#b42318;
}

body{
  font-family:Arial,"Noto Sans Myanmar",sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  overflow:hidden;
}

/* HEADER */

header{
  height:64px;
  background:var(--navy);
  color:white;
  display:flex;
  align-items:center;
  padding:0 20px;
}

.header-inner{
  width:100%;
  max-width:1250px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  color:white;
  text-decoration:none;
  font-size:19px;
  font-weight:900;
}

.logo span{
  color:#65d6a7;
}

.home{
  color:white;
  text-decoration:none;
  padding:8px 13px;
  border-radius:8px;
  background:rgba(255,255,255,.1);
  font-size:13px;
}

/* CHAT APP */

.chat-app{
  max-width:1250px;
  height:calc(100vh - 64px);
  margin:auto;
  display:grid;
  grid-template-columns:330px 1fr;
  background:white;
}

/* SIDEBAR */

.sidebar{
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  min-width:0;
}

.sidebar-top{
  padding:20px;
  border-bottom:1px solid var(--border);
}

.sidebar-title{
  font-size:23px;
  font-weight:900;
  color:var(--navy);
  margin-bottom:4px;
}

.sidebar-subtitle{
  color:var(--muted);
  font-size:12px;
}

.search-users{
  margin-top:16px;
  width:100%;
  padding:11px 13px;
  border:1px solid var(--border);
  border-radius:10px;
  outline:none;
  font-family:inherit;
}

.search-users:focus{
  border-color:var(--navy);
}

.user-list{
  flex:1;
  overflow-y:auto;
}

.user-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 17px;
  cursor:pointer;
  border-bottom:1px solid #f0f2f6;
  transition:.15s;
}

.user-item:hover{
  background:#f5f8fc;
}

.user-item.active{
  background:#eaf7f1;
}

.avatar{
  width:46px;
  height:46px;
  min-width:46px;
  border-radius:50%;
  background:var(--navy);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.user-info{
  min-width:0;
  flex:1;
}

.user-name{
  font-weight:800;
  color:var(--navy);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.user-city{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.empty-users{
  padding:35px 20px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
  line-height:1.7;
}

/* CHAT PANEL */

.chat-panel{
  display:flex;
  flex-direction:column;
  min-width:0;
  background:#f8fafc;
}

.chat-empty{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
}

.chat-empty-icon{
  font-size:65px;
  margin-bottom:15px;
}

.chat-empty h2{
  color:var(--navy);
  margin-bottom:8px;
}

.chat-empty p{
  color:var(--muted);
  line-height:1.7;
  font-size:14px;
}

/* ACTIVE CHAT */

.active-chat{
  display:none;
  flex-direction:column;
  height:100%;
  min-height:0;
}

.chat-header{
  height:74px;
  min-height:74px;
  background:white;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 18px;
}

.chat-user-info{
  flex:1;
  min-width:0;
}

.chat-user-name{
  color:var(--navy);
  font-size:16px;
  font-weight:900;
}

.chat-user-status{
  color:var(--green2);
  font-size:12px;
  margin-top:4px;
}

/* MESSAGES */

.messages{
  flex:1;
  overflow-y:auto;
  padding:22px;
  display:flex;
  flex-direction:column;
  gap:9px;
}

.message-row{
  display:flex;
  width:100%;
}

.message-row.mine{
  justify-content:flex-end;
}

.message-row.theirs{
  justify-content:flex-start;
}

.message-bubble{
  max-width:min(70%,500px);
  padding:10px 13px;
  border-radius:15px;
  line-height:1.6;
  font-size:14px;
  word-break:break-word;
}

.mine .message-bubble{
  background:var(--navy);
  color:white;
  border-bottom-right-radius:4px;
}

.theirs .message-bubble{
  background:white;
  color:var(--text);
  border:1px solid var(--border);
  border-bottom-left-radius:4px;
}

.message-time{
  display:block;
  margin-top:4px;
  font-size:9px;
  opacity:.65;
  text-align:right;
}

/* COMPOSER */

.composer{
  background:white;
  border-top:1px solid var(--border);
  padding:12px;
  display:flex;
  gap:9px;
}

.message-input{
  flex:1;
  border:1px solid var(--border);
  border-radius:11px;
  padding:12px 14px;
  outline:none;
  font-family:inherit;
  font-size:14px;
  resize:none;
  min-height:45px;
  max-height:120px;
}

.message-input:focus{
  border-color:var(--navy);
}

.send-button{
  width:48px;
  border:0;
  border-radius:11px;
  background:var(--navy);
  color:white;
  font-size:19px;
  cursor:pointer;
}

.send-button:hover{
  background:var(--navy2);
}

.send-button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

/* LOGIN */

.login-screen{
  height:calc(100vh - 64px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
}

.login-card{
  max-width:430px;
  width:100%;
  background:white;
  border:1px solid var(--border);
  border-radius:20px;
  padding:35px;
  text-align:center;
  box-shadow:0 12px 35px rgba(7,27,58,.08);
}

.login-icon{
  font-size:55px;
  margin-bottom:12px;
}

.login-card h2{
  color:var(--navy);
  margin-bottom:8px;
}

.login-card p{
  color:var(--muted);
  line-height:1.7;
  font-size:14px;
}

.login-button{
  display:inline-block;
  margin-top:20px;
  padding:12px 22px;
  border-radius:10px;
  background:var(--navy);
  color:white;
  text-decoration:none;
  font-weight:800;
}

/* MESSAGE */

.notice{
  position:fixed;
  top:78px;
  left:50%;
  transform:translateX(-50%);
  z-index:2000;
  max-width:90%;
  padding:11px 17px;
  border-radius:10px;
  display:none;
  font-size:13px;
  box-shadow:0 8px 25px rgba(0,0,0,.15);
}

.notice.error{
  display:block;
  background:#fff0f0;
  color:var(--danger);
  border:1px solid #ffd0d0;
}

.notice.success{
  display:block;
  background:#e9f8ef;
  color:#176b38;
  border:1px solid #bce8cb;
}

/* MOBILE */

.mobile-back{
  display:none;
  border:0;
  background:none;
  font-size:22px;
  cursor:pointer;
  color:var(--navy);
}

@media(max-width:750px){

  body{
    overflow:hidden;
  }

  header{
    height:58px;
  }

  .logo{
    font-size:16px;
  }

  .chat-app{
    height:calc(100vh - 58px);
    display:block;
    position:relative;
  }

  .sidebar{
    width:100%;
    height:100%;
    border:0;
  }

  .chat-panel{
    position:absolute;
    inset:0;
    display:none;
  }

  .chat-panel.mobile-open{
    display:flex;
  }

  .mobile-back{
    display:block;
  }

  .chat-header{
    padding:10px 12px;
  }

  .messages{
    padding:15px 12px;
  }

  .message-bubble{
    max-width:82%;
  }

  .composer{
    padding:9px;
  }

  .home{
    display:none;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <a href="./index.html" class="logo">
      Myanmar <span>Elite Connect</span>
    </a>

    <a href="./index.html" class="home">
      ← Home
    </a>

  </div>
</header>

<div id="notice" class="notice"></div>

<!-- LOGIN SCREEN -->

<div id="loginScreen" class="login-screen" style="display:none">

  <div class="login-card">

    <div class="login-icon">💬</div>

    <h2>Login လိုအပ်ပါတယ်</h2>

    <p>
      Chat အသုံးပြုရန် Login ဝင်ထားရန်လိုအပ်ပါသည်။
    </p>

    <a href="./auth.html" class="login-button">
      Login / Register
    </a>

  </div>

</div>

<!-- CHAT APP -->

<div id="chatApp" class="chat-app" style="display:none">

  <!-- USERS -->

  <aside class="sidebar">

    <div class="sidebar-top">

      <div class="sidebar-title">
        Messages
      </div>

      <div class="sidebar-subtitle">
        ဆက်သွယ်လိုသော User ကိုရွေးပါ
      </div>

      <input
        id="userSearch"
        class="search-users"
        type="text"
        placeholder="🔎 User ရှာရန်..."
        autocomplete="off"
      >

    </div>

    <div id="userList" class="user-list">

      <div class="empty-users">
        User များကို ရှာဖွေနေပါသည်...
      </div>

    </div>

  </aside>

  <!-- CHAT -->

  <section id="chatPanel" class="chat-panel">

    <div id="chatEmpty" class="chat-empty">

      <div>

        <div class="chat-empty-icon">
          💬
        </div>

        <h2>
          Chat စတင်ပါ
        </h2>

        <p>
          ဘယ်ဘက်မှ User တစ်ယောက်ကိုရွေးပြီး
          စကားပြောနိုင်ပါသည်။
        </p>

      </div>

    </div>

    <div id="activeChat" class="active-chat">

      <div class="chat-header">

        <button
          id="mobileBack"
          class="mobile-back"
          type="button"
        >
          ←
        </button>

        <div id="chatAvatar" class="avatar">
          👤
        </div>

        <div class="chat-user-info">

          <div id="chatUserName" class="chat-user-name">
            User
          </div>

          <div class="chat-user-status">
            ● Chat
          </div>

        </div>

      </div>

      <div
        id="messages"
        class="messages"
      ></div>

      <form
        id="composer"
        class="composer"
      >

        <textarea
          id="messageInput"
          class="message-input"
          rows="1"
          maxlength="5000"
          placeholder="Message ရေးပါ..."
        ></textarea>

        <button
          id="sendButton"
          class="send-button"
          type="submit"
        >
          ➤
        </button>

      </form>

    </div>

  </section>

</div>

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://ikjwisfsdcupibgjiuvp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_xoh1rjwBlJhR9nB3kQD-KA_QcVY6w2s";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================
   STATE
========================================= */

let currentUser = null;
let selectedUser = null;
let profiles = [];
let realtimeChannel = null;


/* =========================================
   ELEMENTS
========================================= */

const loginScreen =
document.getElementById("loginScreen");

const chatApp =
document.getElementById("chatApp");

const userList =
document.getElementById("userList");

const userSearch =
document.getElementById("userSearch");

const chatPanel =
document.getElementById("chatPanel");

const chatEmpty =
document.getElementById("chatEmpty");

const activeChat =
document.getElementById("activeChat");

const messagesBox =
document.getElementById("messages");

const messageInput =
document.getElementById("messageInput");

const sendButton =
document.getElementById("sendButton");

const composer =
document.getElementById("composer");

const notice =
document.getElementById("notice");


/* =========================================
   NOTICE
========================================= */

function showNotice(text,type="success"){

  notice.textContent = text;
  notice.className =
    "notice " + type;

  setTimeout(function(){

    notice.className = "notice";

  },3000);

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================
   AVATAR
========================================= */

function getInitial(name){

  if(!name){
    return "U";
  }

  return name
    .trim()
    .charAt(0)
    .toUpperCase();

}


function avatarHtml(profile){

  if(profile.avatar_url){

    return `
      <img
        src="${escapeHtml(profile.avatar_url)}"
        alt="Avatar"
        onerror="this.style.display='none'"
      >
    `;

  }

  return escapeHtml(
    getInitial(profile.full_name)
  );

}


/* =========================================
   CURRENT USER
========================================= */

async function getCurrentUser(){

  const {
    data,
    error
  } =
  await supabaseClient.auth.getSession();

  if(error){
    throw error;
  }

  if(
    !data ||
    !data.session ||
    !data.session.user
  ){

    return null;

  }

  return data.session.user;

}


/* =========================================
   LOGIN
========================================= */

async function initialize(){

  try{

    currentUser =
      await getCurrentUser();

    if(!currentUser){

      loginScreen.style.display =
        "flex";

      return;

    }

    chatApp.style.display =
      "grid";

    await loadProfiles();

    subscribeRealtime();

  }
  catch(error){

    console.error(error);

    showNotice(
      error.message ||
      "Chat စတင်၍မရပါ။",
      "error"
    );

  }

}


/* =========================================
   LOAD PROFILES
========================================= */

async function loadProfiles(){

  userList.innerHTML = `
    <div class="empty-users">
      User များကို ရယူနေပါသည်...
    </div>
  `;

  const {
    data,
    error
  } =
  await supabaseClient
    .from("profiles")
    .select(
      "id,full_name,phone,avatar_url,city,bio,role"
    )
    .neq(
      "id",
      currentUser.id
    )
    .order(
      "full_name",
      {
        ascending:true,
        nullsFirst:false
      }
    );

  if(error){
    throw error;
  }

  profiles =
    Array.isArray(data)
    ? data
    : [];

  renderUsers();

}


/* =========================================
   RENDER USERS
========================================= */

function renderUsers(){

  const keyword =
    userSearch.value
      .trim()
      .toLowerCase();

  const filtered =
    profiles.filter(function(profile){

      const text = [
        profile.full_name,
        profile.city,
        profile.bio
      ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();

      return text.includes(keyword);

    });

  if(!filtered.length){

    userList.innerHTML = `
      <div class="empty-users">
        User မတွေ့ပါ။
      </div>
    `;

    return;

  }

  userList.innerHTML =
    filtered.map(function(profile){

      const active =
        selectedUser &&
        selectedUser.id === profile.id
        ? "active"
        : "";

      return `
        <div
          class="user-item ${active}"
          data-user-id="${escapeHtml(profile.id)}"
        >

          <div class="avatar">
            ${avatarHtml(profile)}
          </div>

          <div class="user-info">

            <div class="user-name">
              ${escapeHtml(
                profile.full_name ||
                "Myanmar Elite User"
              )}
            </div>

            <div class="user-city">
              ${
                escapeHtml(
                  profile.city ||
                  "Myanmar"
                )
              }
            </div>

          </div>

        </div>
      `;

    }).join("");

  document
    .querySelectorAll(".user-item")
    .forEach(function(item){

      item.addEventListener(
        "click",
        function(){

          const id =
            item.dataset.userId;

          const profile =
            profiles.find(
              p => p.id === id
            );

          if(profile){
            openChat(profile);
          }

        }
      );

    });

}


/* =========================================
   OPEN CHAT
========================================= */

async function openChat(profile){

  selectedUser =
    profile;

  renderUsers();

  chatEmpty.style.display =
    "none";

  activeChat.style.display =
    "flex";

  chatPanel.classList.add(
    "mobile-open"
  );

  document.getElementById(
    "chatUserName"
  ).textContent =
    profile.full_name ||
    "Myanmar Elite User";

  document.getElementById(
    "chatAvatar"
  ).innerHTML =
    avatarHtml(profile);

  await loadMessages();

  messageInput.focus();

}


/* =========================================
   LOAD MESSAGES
========================================= */

async function loadMessages(){

  if(!selectedUser){
    return;
  }

  messagesBox.innerHTML = `
    <div style="
      text-align:center;
      color:#697386;
      padding:30px;
      font-size:13px;
    ">
      Messages ရယူနေပါသည်...
    </div>
  `;

  const {
    data,
    error
  } =
  await supabaseClient
    .from("chat_messages")
    .select(
      "id,sender_id,receiver_id,message,created_at,is_read"
    )
    .or(
      `and(sender_id.eq.${currentUser.id},receiver_id.eq.${selectedUser.id}),and(sender_id.eq.${selectedUser.id},receiver_id.eq.${currentUser.id})`
    )
    .order(
      "created_at",
      {
        ascending:true
      }
    );

  if(error){

    console.error(error);

    messagesBox.innerHTML = `
      <div style="
        text-align:center;
        color:#b42318;
        padding:30px;
        font-size:13px;
      ">
        ❌ Messages ရယူ၍မရပါ။
        <br><br>
        ${escapeHtml(error.message)}
      </div>
    `;

    return;

  }

  renderMessages(
    Array.isArray(data)
    ? data
    : []
  );

  await markMessagesRead();

}


/* =========================================
   RENDER MESSAGES
========================================= */

function renderMessages(list){

  if(!list.length){

    messagesBox.innerHTML = `
      <div style="
        text-align:center;
        color:#697386;
        padding:40px 20px;
        font-size:13px;
      ">
        💬<br><br>
        ဒီ User နဲ့ Message မရှိသေးပါ။<br>
        ပထမဆုံး Message ပို့လိုက်ပါ။
      </div>
    `;

    return;

  }

  messagesBox.innerHTML =
    list.map(function(item){

      const mine =
        item.sender_id === currentUser.id;

      const time =
        formatTime(item.created_at);

      return `
        <div class="
          message-row
          ${mine ? "mine" : "theirs"}
        ">

          <div class="message-bubble">

            ${escapeHtml(item.message)}

            <span class="message-time">
              ${time}
              ${
                mine
                ? (
                  item.is_read
                  ? " · ✓✓"
                  : " · ✓"
                )
                : ""
              }
            </span>

          </div>

        </div>
      `;

    }).join("");

  scrollMessages();

}


/* =========================================
   TIME
========================================= */

function formatTime(value){

  if(!value){
    return "";
  }

  const date =
    new Date(value);

  return date.toLocaleTimeString(
    "en-US",
    {
      hour:"numeric",
      minute:"2-digit"
    }
  );

}


/* =========================================
   SCROLL
========================================= */

function scrollMessages(){

  messagesBox.scrollTop =
    messagesBox.scrollHeight;

}


/* =========================================
   SEND MESSAGE
========================================= */

composer.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();

    if(!currentUser){
      return;
    }

    if(!selectedUser){
      return;
    }

    const text =
      messageInput.value.trim();

    if(!text){
      return;
    }

    sendButton.disabled =
      true;

    try{

      const {
        error
      } =
      await supabaseClient
        .from("chat_messages")
        .insert({
          sender_id:
            currentUser.id,

          receiver_id:
            selectedUser.id,

          message:
            text,

          is_read:
            false
        });

      if(error){
        throw error;
      }

      messageInput.value = "";

      autoResize();

    }
    catch(error){

      console.error(error);

      showNotice(
        "Message ပို့၍မရပါ: " +
        error.message,
        "error"
      );

    }
    finally{

      sendButton.disabled =
        false;

      messageInput.focus();

    }

  }
);


/* =========================================
   REALTIME
========================================= */

function subscribeRealtime(){

  if(realtimeChannel){

    supabaseClient
      .removeChannel(
        realtimeChannel
      );

  }

  realtimeChannel =
    supabaseClient
      .channel(
        "chat-messages-" +
        currentUser.id
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"chat_messages"
        },
        async function(payload){

          const message =
            payload.new;

          if(
            !message ||
            !selectedUser
          ){
            return;
          }

          const belongsToCurrentChat =
            (
              message.sender_id === currentUser.id &&
              message.receiver_id === selectedUser.id
            ) ||
            (
              message.sender_id === selectedUser.id &&
              message.receiver_id === currentUser.id
            );

          if(
            !belongsToCurrentChat
          ){
            return;
          }

          await loadMessages();

        }
      )
      .on(
        "postgres_changes",
        {
          event:"UPDATE",
          schema:"public",
          table:"chat_messages"
        },
        async function(payload){

          if(!selectedUser){
            return;
          }

          const message =
            payload.new;

          const belongs =
            (
              message.sender_id === currentUser.id &&
              message.receiver_id === selectedUser.id
            ) ||
            (
              message.sender_id === selectedUser.id &&
              message.receiver_id === currentUser.id
            );

          if(belongs){
            await loadMessages();
          }

        }
      )
      .subscribe(function(status){

        console.log(
          "Chat realtime:",
          status
        );

      });

}


/* =========================================
   MARK READ
========================================= */

async function markMessagesRead(){

  if(
    !currentUser ||
    !selectedUser
  ){
    return;
  }

  const {
    error
  } =
  await supabaseClient
    .from("chat_messages")
    .update({
      is_read:true
    })
    .eq(
      "sender_id",
      selectedUser.id
    )
    .eq(
      "receiver_id",
      currentUser.id
    )
    .eq(
      "is_read",
      false
    );

  if(error){

    console.warn(
      "Read status update:",
      error.message
    );

  }

}

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  Gem Marketplace | Myanmar Elite Connect
</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="./supabase.js"></script>

<style>

/* =====================================================
   RESET
===================================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

:root{

  --bg:#f7f9fc;

  --surface:#ffffff;

  --soft:#f1f4f8;

  --text:#10233f;

  --muted:#728096;

  --navy:#071a34;

  --navy2:#173b62;

  --gold:#d7b35a;

  --gold-light:#f1d487;

  --green:#19a974;

  --border:rgba(16,35,63,.09);

  --danger:#c94a4a;

  --success:#26845b;

  --shadow:
    0 18px 55px rgba(16,35,63,.09);
}

body.dark{

  --bg:#071321;

  --surface:#0d1d31;

  --soft:#12263d;

  --text:#f4f7fb;

  --muted:#94a3b7;

  --border:rgba(255,255,255,.09);

  --shadow:
    0 18px 55px rgba(0,0,0,.30);
}

body{

  min-height:100vh;

  padding-bottom:78px;

  font-family:
    Inter,
    "Noto Sans Myanmar",
    "Myanmar Text",
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:var(--bg);

  color:var(--text);

  transition:
    background .25s ease,
    color .25s ease;
}

button,
input,
select{

  font:inherit;
}

button{

  cursor:pointer;
}

a{

  color:inherit;

  text-decoration:none;
}


/* =====================================================
   HEADER
===================================================== */

.header{

  position:sticky;

  top:0;

  z-index:1000;

  background:
    color-mix(
      in srgb,
      var(--surface) 92%,
      transparent
    );

  border-bottom:
    1px solid var(--border);

  backdrop-filter:blur(18px);

  -webkit-backdrop-filter:blur(18px);
}

.header-inner{

  width:min(
    1180px,
    calc(100% - 32px)
  );

  min-height:72px;

  margin:auto;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:15px;
}


/* BRAND */

.brand{

  display:flex;

  align-items:center;

  gap:11px;

  min-width:0;
}

.brand-logo{

  width:42px;

  height:42px;

  flex:0 0 42px;

  display:grid;

  place-items:center;

  overflow:hidden;

  border-radius:12px;

  background:var(--surface);

  border:
    1px solid var(--border);
}

.brand-logo img{

  width:82%;

  height:82%;

  object-fit:contain;

  display:block;
}

.brand-name{

  color:var(--text);

  font-size:14px;

  font-weight:900;

  letter-spacing:-.3px;

  white-space:nowrap;
}

.brand-name span{

  color:var(--gold);
}


/* HEADER ACTIONS */

.header-actions{

  display:flex;

  align-items:center;

  gap:7px;
}

.control{

  min-width:40px;

  height:40px;

  padding:0 10px;

  display:grid;

  place-items:center;

  border-radius:11px;

  color:var(--text);

  background:var(--surface);

  border:
    1px solid var(--border);

  transition:.2s ease;
}

.control:hover{

  transform:translateY(-2px);

  border-color:
    rgba(215,179,90,.55);
}

.language{

  width:auto;

  font-size:11px;

  font-weight:850;
}

.language .active{

  color:var(--gold);
}


/* =====================================================
   HERO
===================================================== */

.hero{

  position:relative;

  overflow:hidden;

  color:white;

  background:
    radial-gradient(
      circle at 85% 5%,
      #244e80 0,
      #102f57 28%,
      #071a34 62%,
      #041126 100%
    );
}

.hero::after{

  content:"";

  position:absolute;

  width:420px;

  height:420px;

  right:-180px;

  bottom:-240px;

  border-radius:50%;

  border:
    1px solid rgba(215,179,90,.18);

  box-shadow:
    0 0 0 35px rgba(215,179,90,.035),
    0 0 0 70px rgba(215,179,90,.02);

  pointer-events:none;
}

.hero-inner{

  position:relative;

  z-index:2;

  width:min(
    1180px,
    calc(100% - 32px)
  );

  margin:auto;

  padding:
    40px 0 48px;
}

.back{

  display:inline-flex;

  align-items:center;

  gap:6px;

  margin-bottom:22px;

  color:
    rgba(255,255,255,.75);

  font-size:12px;

  font-weight:700;
}

.back:hover{

  color:white;
}

.hero-content{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:30px;
}

.hero-title{

  display:flex;

  align-items:center;

  gap:17px;
}

.hero-icon{

  width:76px;

  height:76px;

  flex:0 0 76px;

  display:grid;

  place-items:center;

  border-radius:22px;

  background:
    rgba(255,255,255,.09);

  border:
    1px solid rgba(255,255,255,.13);

  font-size:40px;

  box-shadow:
    0 15px 35px rgba(0,0,0,.14);
}

.hero h1{

  margin-bottom:6px;

  font-size:
    clamp(31px,5vw,52px);

  line-height:1;

  letter-spacing:-2px;
}

.hero p{

  color:
    rgba(255,255,255,.72);

  font-size:13px;

  line-height:1.7;
}

.hero-badge{

  padding:9px 13px;

  border-radius:100px;

  color:#fff;

  background:
    rgba(215,179,90,.13);

  border:
    1px solid rgba(215,179,90,.30);

  font-size:11px;

  font-weight:800;
}


/* =====================================================
   MAIN
===================================================== */

main{

  width:min(
    1180px,
    calc(100% - 32px)
  );

  margin:auto;

  padding:
    30px 0 45px;
}


/* =====================================================
   SEARCH PANEL
===================================================== */

.search-panel{

  padding:20px;

  margin-bottom:28px;

  border-radius:20px;

  background:var(--surface);

  border:
    1px solid var(--border);

  box-shadow:var(--shadow);
}

.search-grid{

  display:grid;

  grid-template-columns:
    2fr
    1fr
    1fr;

  gap:10px;
}

.input,
.select{

  width:100%;

  height:46px;

  padding:0 13px;

  outline:none;

  border-radius:11px;

  color:var(--text);

  background:var(--soft);

  border:
    1px solid transparent;

  font-size:12px;

  transition:.2s ease;
}

.input:focus,
.select:focus{

  background:var(--surface);

  border-color:
    rgba(215,179,90,.65);
}


/* FILTER ROW */

.filter-row{

  display:flex;

  flex-wrap:wrap;

  gap:8px;

  margin-top:14px;
}

.filter-button{

  min-height:38px;

  padding:0 13px;

  border-radius:9px;

  color:var(--text);

  background:var(--surface);

  border:
    1px solid var(--border);

  font-size:11px;

  font-weight:800;

  transition:.2s ease;
}

.filter-button:hover{

  border-color:
    rgba(215,179,90,.55);
}

.filter-button.active{

  color:#fff;

  background:var(--navy);

  border-color:var(--navy);
}

body.dark
.filter-button.active{

  color:#071a34;

  background:var(--gold);
}


/* PRICE */

.price-row{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:10px;

  margin-top:12px;
}


/* =====================================================
   LISTING HEADER
===================================================== */

.listing-header{

  display:flex;

  align-items:flex-end;

  justify-content:space-between;

  gap:15px;

  margin-bottom:18px;
}

.listing-header h2{

  color:var(--text);

  font-size:22px;

  letter-spacing:-.7px;
}

.count{

  margin-top:5px;

  color:var(--muted);

  font-size:11px;
}

.refresh{

  height:39px;

  padding:0 13px;

  border-radius:10px;

  color:var(--text);

  background:var(--surface);

  border:
    1px solid var(--border);

  font-size:11px;

  font-weight:800;
}

.refresh:hover{

  border-color:
    rgba(215,179,90,.55);
}


/* =====================================================
   GRID
===================================================== */

.grid{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:20px;
}

.card{

  overflow:hidden;

  border-radius:18px;

  background:var(--surface);

  border:
    1px solid var(--border);

  box-shadow:var(--shadow);

  transition:
    transform .22s ease,
    box-shadow .22s ease;
}

.card:hover{

  transform:translateY(-4px);

  box-shadow:
    0 22px 50px
    rgba(16,35,63,.14);
}


/* IMAGE */

.card-image{

  position:relative;

  height:220px;

  overflow:hidden;

  background:
    linear-gradient(
      135deg,
      #071a34,
      #285b92
    );
}

.card-image img{

  width:100%;

  height:100%;

  display:block;

  object-fit:cover;
}

.no-image{

  width:100%;

  height:100%;

  display:grid;

  place-items:center;

  font-size:64px;
}

.featured{

  position:absolute;

  top:11px;

  left:11px;

  padding:6px 9px;

  border-radius:7px;

  color:#fff;

  background:var(--gold);

  font-size:10px;

  font-weight:900;
}

.image-count{

  position:absolute;

  right:10px;

  bottom:10px;

  padding:5px 8px;

  border-radius:7px;

  color:white;

  background:
    rgba(0,0,0,.65);

  font-size:10px;
}


/* CARD BODY */

.card-body{

  padding:17px;
}

.card-type{

  display:inline-flex;

  align-items:center;

  gap:4px;

  margin-bottom:9px;

  padding:5px 8px;

  border-radius:6px;

  color:#6841a5;

  background:#f2ecff;

  font-size:10px;

  font-weight:900;
}

.card-title{

  color:var(--text);

  font-size:17px;

  font-weight:900;

  line-height:1.4;

  margin-bottom:7px;
}

.card-price{

  color:var(--navy);

  font-size:19px;

  font-weight:900;

  margin-bottom:8px;
}

body.dark .card-price{

  color:var(--gold-light);
}

.card-location{

  color:var(--muted);

  font-size:11px;

  line-height:1.6;

  margin-bottom:9px;
}

.card-description{

  color:var(--muted);

  font-size:11px;

  line-height:1.7;

  margin-bottom:14px;

  display:-webkit-box;

  -webkit-line-clamp:3;

  -webkit-box-orient:vertical;

  overflow:hidden;
}

.contact{

  width:100%;

  min-height:42px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:10px;

  color:#fff;

  background:
    linear-gradient(
      135deg,
      var(--navy),
      var(--navy2)
    );

  font-size:11px;

  font-weight:850;
}

body.dark .contact{

  color:#071a34;

  background:
    linear-gradient(
      135deg,
      var(--gold-light),
      var(--gold)
    );
}


/* =====================================================
   STATES
===================================================== */

.state{

  grid-column:1/-1;

  padding:60px 20px;

  text-align:center;

  border-radius:18px;

  background:var(--surface);

  border:
    1px solid var(--border);

  color:var(--muted);
}

.state-icon{

  margin-bottom:12px;

  font-size:45px;
}

.state h3{

  margin-bottom:7px;

  color:var(--text);

  font-size:17px;
}

.state p{

  font-size:12px;

  line-height:1.7;
}

.spinner{

  width:38px;

  height:38px;

  margin:
    0 auto 15px;

  border:
    4px solid var(--soft);

  border-top-color:
    var(--gold);

  border-radius:50%;

  animation:
    spin .8s linear infinite;
}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* =====================================================
   BOTTOM NAV
===================================================== */

.bottom-nav{

  position:fixed;

  left:0;

  right:0;

  bottom:0;

  z-index:2000;

  min-height:68px;

  display:flex;

  align-items:stretch;

  justify-content:center;

  background:
    color-mix(
      in srgb,
      var(--surface) 96%,
      transparent
    );

  border-top:
    1px solid var(--border);

  box-shadow:
    0 -8px 25px rgba(0,0,0,.07);

  backdrop-filter:blur(15px);

  -webkit-backdrop-filter:blur(15px);
}

.bottom-nav a{

  width:100%;

  max-width:150px;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:2px;

  color:var(--muted);

  font-size:10px;

  font-weight:700;
}

.bottom-nav a strong{

  font-size:20px;

  line-height:1;
}

.bottom-nav a.active{

  color:var(--gold);

  font-weight:900;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:950px){

  .grid{

    grid-template-columns:
      repeat(2,1fr);
  }

}

@media(max-width:700px){

  .header-inner{

    min-height:66px;
  }

  .brand-name{

    display:none;
  }

  .hero-inner{

    padding:
      32px 0 40px;
  }

  .hero-content{

    align-items:flex-start;

    flex-direction:column;
  }

  .hero-icon{

    width:62px;

    height:62px;

    flex-basis:62px;

    font-size:32px;
  }

  .hero h1{

    font-size:32px;

    letter-spacing:-1.4px;
  }

  .hero-badge{

    display:none;
  }

  .search-grid{

    grid-template-columns:1fr;
  }

  .price-row{

    grid-template-columns:1fr;
  }

  .grid{

    grid-template-columns:1fr;
  }

  .card-image{

    height:235px;
  }

  main{

    padding-top:22px;
  }

  .listing-header{

    align-items:flex-start;
  }

}

@media(max-width:420px){

  .header-inner,
  .hero-inner,
  main{

    width:
      calc(100% - 24px);
  }

  .search-panel{

    padding:15px;
  }

  .filter-row{

    display:grid;

    grid-template-columns:
      1fr 1fr;
  }

  .filter-button{

    width:100%;
  }

}


/* =====================================================
   AUTH CHECK SCREEN
===================================================== */

.auth-screen{

  position:fixed;

  inset:0;

  z-index:9999;

  display:none;

  align-items:center;

  justify-content:center;

  padding:20px;

  background:var(--bg);
}

.auth-screen.show{

  display:flex;
}

.auth-box{

  width:min(360px,100%);

  padding:30px;

  text-align:center;

  border-radius:20px;

  background:var(--surface);

  border:
    1px solid var(--border);

  box-shadow:var(--shadow);
}

.auth-logo{

  width:65px;

  height:65px;

  margin:
    0 auto 18px;

  object-fit:contain;
}

.auth-box h2{

  margin-bottom:8px;

  font-size:20px;
}

.auth-box p{

  color:var(--muted);

  font-size:12px;

  line-height:1.7;
}

</style>

<script src="./mec-theme.js"></script>
</head>


<body>


<!-- =====================================================
     AUTH SCREEN
===================================================== -->

<div
  id="authScreen"
  class="auth-screen show"
>

  <div class="auth-box">

    <img
      class="auth-logo"
      src="https://lh3.googleusercontent.com/d/1fR8TnvOjrzVbKuro9Ths1_Jt0PAxSmGd"
      alt="Myanmar Elite Connect"
    >

    <div class="spinner"></div>

    <h2>
      Loading...
    </h2>

    <p>
      Please wait.
    </p>

  </div>

</div>


<div id="app">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

  <div class="header-inner">


    <a
      href="./index.html"
      class="brand"
    >

      <div class="brand-logo">

        <img
          src="https://lh3.googleusercontent.com/d/1fR8TnvOjrzVbKuro9Ths1_Jt0PAxSmGd"
          alt="Myanmar Elite Connect"
        >

      </div>

      <div class="brand-name">

        Myanmar
        <span>Elite</span>
        Connect

      </div>

    </a>


    <div class="header-actions">

      <button
        type="button"
        class="control language"
        id="languageButton"
      >

        <span
          id="langEN"
          class="active"
        >
          EN
        </span>

        <span>/</span>

        <span id="langMM">
          မြန်မာ
        </span>

      </button>


      <button
        type="button"
        class="control"
        id="themeButton"
      >
        ☾
      </button>

    </div>

  </div>

</header>


<!-- =====================================================
     HERO
===================================================== -->

<section class="hero">

  <div class="hero-inner">

    <a
      href="./index.html"
      class="back"
      id="backLink"
    >
      ← General သို့ပြန်သွားမည်
    </a>


    <div class="hero-content">

      <div class="hero-title">

        <div class="hero-icon">
          💎
        </div>

        <div>

          <h1 id="heroTitle">
            Gem Marketplace
          </h1>

          <p id="heroSubtitle">
            ကျောက်မျက် • ရတနာ • အဖိုးတန်ကျောက်များ
          </p>

        </div>

      </div>


      <div class="hero-badge">
        VERIFIED MARKETPLACE
      </div>

    </div>

  </div>

</section>


<!-- =====================================================
     MAIN
===================================================== -->

<main>


<!-- SEARCH PANEL -->

<section class="search-panel">


  <div class="search-grid">

    <input
      id="searchInput"
      class="input"
      type="search"
      placeholder="ကျောက်မျက်၊ Ruby၊ Sapphire..."
    >


    <select
      id="cityFilter"
      class="select"
    >

      <option value="">
        မြို့အားလုံး
      </option>

    </select>


    <select
      id="listingTypeFilter"
      class="select"
    >

      <option value="">
        ရောင်း/ဝယ် အားလုံး
      </option>

      <option value="sale">
        ရောင်းရန်
      </option>

      <option value="rent">
        ငှားရန်
      </option>

    </select>

  </div>


  <!-- BUYER / SELLER -->

  <div class="filter-row">

    <button
      class="filter-button active"
      id="allMode"
      type="button"
      onclick="setMode('all')"
    >
      💎 All
    </button>


    <button
      class="filter-button"
      id="buyerMode"
      type="button"
      onclick="setMode('buyer')"
    >
      🛒 Buyer
    </button>


    <button
      class="filter-button"
      id="sellerMode"
      type="button"
      onclick="setMode('seller')"
    >
      🏪 Seller
    </button>

  </div>


  <!-- GEM TYPES -->

  <div class="filter-row">

    <button
      class="filter-button active"
      id="allGem"
      type="button"
      onclick="setGemType('')"
    >
      💎 All Gems
    </button>


    <button
      class="filter-button"
      type="button"
      onclick="setGemType('ruby')"
    >
      🔴 Ruby
    </button>


    <button
      class="filter-button"
      type="button"
      onclick="setGemType('sapphire')"
    >
      🔵 Sapphire
    </button>


    <button
      class="filter-button"
      type="button"
      onclick="setGemType('jade')"
    >
      🟢 Jade
    </button>


    <button
      class="filter-button"
      type="button"
      onclick="setGemType('diamond')"
    >
      💠 Diamond
    </button>


    <button
      class="filter-button"
      type="button"
      onclick="setGemType('other')"
    >
      ✨ Other
    </button>

  </div>


  <!-- PRICE -->

  <div class="price-row">

    <input
      id="minPrice"
      class="input"
      type="number"
      min="0"
      placeholder="အနည်းဆုံးဈေး"
    >


    <input
      id="maxPrice"
      class="input"
      type="number"
      min="0"
      placeholder="အများဆုံးဈေး"
    >

  </div>

</section>


<!-- LISTINGS -->

<section>

  <div class="listing-header">

    <div>

      <h2 id="listingTitle">
        💎 Gem Listings
      </h2>

      <div
        id="listingCount"
        class="count"
      >
        Listings များကို ရယူနေပါသည်...
      </div>

    </div>


    <button
      type="button"
      class="refresh"
      id="refreshButton"
      onclick="loadListings()"
    >
      ↻ Refresh
    </button>

  </div>


  <div
    id="listingsGrid"
    class="grid"
  >

    <div class="state">

      <div class="spinner"></div>

      <p>
        Gem listings များကို ရယူနေပါသည်...
      </p>

    </div>

  </div>

</section>

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   PRICE
===================================================== */

function formatPrice(
  price,
  currency
){

  if(
    price === null ||
    price === undefined ||
    price === ""
  ){

    return t().price;

  }

  const number =
    Number(price);


  if(
    !Number.isFinite(number)
  ){

    return String(price);

  }


  return (
    number.toLocaleString(
      "en-US"
    )
    +
    " "
    +
    (
      currency ||
      "MMK"
    )
  );

}


/* =====================================================
   IMAGES
===================================================== */

function getImages(item){

  if(!item.images){

    return [];

  }


  if(
    Array.isArray(
      item.images
    )
  ){

    return item.images
      .filter(Boolean);

  }


  if(
    typeof item.images ===
    "string"
  ){

    try{

      const parsed =
        JSON.parse(
          item.images
        );


      if(
        Array.isArray(parsed)
      ){

        return parsed
          .filter(Boolean);

      }

    }
    catch(error){

      if(
        item.images.startsWith(
          "http"
        )
      ){

        return [
          item.images
        ];

      }

    }

  }


  return [];

}


/* =====================================================
   LOCATION
===================================================== */

function getLocation(item){

  const parts = [];


  if(item.city){

    parts.push(
      item.city
    );

  }


  if(item.township){

    parts.push(
      item.township
    );

  }


  if(item.location){

    parts.push(
      item.location
    );

  }


  if(item.address){

    parts.push(
      item.address
    );

  }


  return [
    ...new Set(parts)
  ].join(" • ")
  ||
  t().location;

}


/* =====================================================
   GEM DETECTOR
===================================================== */

function detectGemType(item){

  const text = (

    (item.title || "")
    +
    " "
    +
    (item.description || "")

  ).toLowerCase();


  if(

    text.includes("ruby")
    ||
    text.includes("ရူဘီ")
    ||
    text.includes("ပတ္တမြား")

  ){

    return "ruby";

  }


  if(

    text.includes("sapphire")
    ||
    text.includes("နီလာ")

  ){

    return "sapphire";

  }


  if(

    text.includes("jade")
    ||
    text.includes("ကျောက်စိမ်း")

  ){

    return "jade";

  }


  if(

    text.includes("diamond")
    ||
    text.includes("စိန်")

  ){

    return "diamond";

  }


  return "other";

}


/* =====================================================
   BUYER / SELLER
===================================================== */

function detectMode(item){

  const text = (

    (item.title || "")
    +
    " "
    +
    (item.description || "")

  ).toLowerCase();


  if(

    text.includes("ဝယ်လို")
    ||
    text.includes("ဝယ်မည်")
    ||
    text.includes("looking for")
    ||
    text.includes("wanted")
    ||
    text.includes("buying")

  ){

    return "buyer";

  }


  return "seller";

}


/* =====================================================

===================================================== */

function createCard(item){

  const firstImage =
    images[0] || "";


  const title =
    escapeHtml(
      item.title ||
      "Gem Listing"
    );


  const description =
    escapeHtml(
      item.description ||
      ""
    );


  const location =
    escapeHtml(
      getLocation(item)
    );


  const price =
    escapeHtml(
      formatPrice(
        item.price,
        item.currency
      )
    );


  const mode =
    detectMode(item);


  const modeText =
    mode === "buyer"
      ? t().buyerLabel
      : t().sellerLabel;


  let imageHTML;


  if(firstImage){

    imageHTML = `

      <img
        src="${escapeHtml(firstImage)}"
        alt="${title}"
        loading="lazy"
        onerror="
          this.style.display='none';
          this.nextElementSibling.style.display='grid';
        "
      >

      <div
        class="no-image"
        style="display:none"
      >
        💎
      </div>

    `;

  }
  else{

    imageHTML = `

      <div class="no-image">
        💎
      </div>

    `;

  }


  const featured =
    item.featured
    ?
    `

      <div class="featured">
        ${t().featured}
      </div>

    `
    :
    "";


  const imageCount =
    images.length > 1
    ?
    `

      <div class="image-count">
        🖼️ ${images.length}
      </div>

    `
    :
    "";


  const contact =
    item.phone
    ?

    `

      <a
        class="contact"
        href="tel:${encodeURIComponent(item.phone)}"
      >

        ${t().contact}

      </a>

    `

    :

    "";


  return `

    <article class="card">

      <div class="card-image">

        ${imageHTML}

        ${featured}

        ${imageCount}

      </div>


      <div class="card-body">

        <span class="card-type">

          ${modeText}

          ·

          💎 Gem

        </span>


        <div class="card-title">

          ${title}

        </div>


        <div class="card-price">

          ${price}

        </div>


        <div class="card-location">

          📍 ${location}

        </div>


        ${
          description

          ?

          `

            <div class="card-description">

              ${description}

            </div>

          `

          :

          ""

        }


        ${contact}

      </div>

    </article>

  `;

}


/* =====================================================
   LOAD LISTINGS
===================================================== */

async function loadListings(){

  const grid =
    document.getElementById(
      "listingsGrid"
    );


  const count =
    document.getElementById(
      "listingCount"
    );


  grid.innerHTML = `

    <div class="state">

      <div class="spinner"></div>

      <p>
        ${t().loading}
      </p>

    </div>

  `;


  try{

    const {
      data,
      error
    } =

    await supabaseClient

      .from("listings")

      .select("*")

      .eq(
        "category",
        "gem"
      )

      .eq(
        "status",
        "approved"
      )

      .order(
        "created_at",
        {
          ascending:false
        }
      );


    if(error){

      throw error;

    }


    allListings =
      Array.isArray(data)
      ?
      data
      :
      [];


    createCityOptions();

    renderListings();

  }
  catch(error){

    console.error(
      "Gem listing error:",
      error
    );


    count.textContent =
      t().databaseError;


    grid.innerHTML = `

      <div class="state">

        <div class="state-icon">
          ⚠️
        </div>

        <h3>
          ${t().databaseError}
        </h3>

        <p>
          ${escapeHtml(
            error?.message ||
            "Unknown error"
          )}
        </p>

      </div>

    `;

  }

}


/* =====================================================
   CITY OPTIONS
===================================================== */

function createCityOptions(){

  const select =
    document.getElementById(
      "cityFilter"
    );


  const currentValue =
    select.value;


  const cities =
    allListings

      .map(
        item =>
        item.city
      )

      .filter(Boolean);


  const unique =
    [
      ...new Set(cities)
    ]
    .sort();


  select.innerHTML = `

    <option value="">
      ${t().allCities}
    </option>

  `;


  unique.forEach(
    city => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        city;


      option.textContent =
        city;


      select.appendChild(
        option
      );

    }
  );


  if(
    unique.includes(
      currentValue
    )
  ){

    select.value =
      currentValue;

  }

}


/* =====================================================
   RENDER
===================================================== */

function renderListings(){

  const grid =
    document.getElementById(
      "listingsGrid"
    );


  const count =
    document.getElementById(
      "listingCount"
    );


  const keyword =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  const city =
    document
      .getElementById(
        "cityFilter"
      )
      .value;


  const listingType =
    document
      .getElementById(
        "listingTypeFilter"
      )
      .value;


  const minPrice =
    Number(
      document
        .getElementById(
          "minPrice"
        )
        .value
    );


  const maxPrice =
    Number(
      document
        .getElementById(
          "maxPrice"
        )
        .value
    );


  let filtered =
    [...allListings];


  /* SEARCH */

  if(keyword){

    filtered =
      filtered.filter(
        item => {

          const searchable = [

            item.title,

            item.description,

            item.city,

            item.township,

            item.address,

            item.location

          ]

          .filter(Boolean)

          .join(" ")

          .toLowerCase();


          return searchable
            .includes(
              keyword
            );

        }
      );

  }


  /* CITY */

  if(city){

    filtered =
      filtered.filter(
        item =>
        item.city === city
      );

  }


  /* LISTING TYPE */

  if(listingType){

    filtered =
      filtered.filter(
        item =>
        item.listing_type ===
        listingType
      );

  }


  /* GEM TYPE */

  if(currentGemType){

    filtered =
      filtered.filter(
        item =>
        detectGemType(item)
        ===
        currentGemType
      );

  }


  /* BUYER / SELLER */

  if(
    currentMode !== "all"
  ){

    filtered =
      filtered.filter(
        item =>
        detectMode(item)
        ===
        currentMode
      );

  }


  /* PRICE */

  if(minPrice > 0){

    filtered =
      filtered.filter(
        item =>
          Number(
            item.price || 0
          )
          >=
          minPrice
      );

  }


  if(maxPrice > 0){

    filtered =
      filtered.filter(
        item =>
          Number(
            item.price || 0
          )
          <=
          maxPrice
      );

  }


  count.textContent =
    t().listingCount(
      filtered.length
    );


  if(!filtered.length){

    grid.innerHTML = `

      <div class="state">

        <div class="state-icon">
          🔍
        </div>

        <h3>
          ${t().noListings}
        </h3>

        <p>
          ${t().noListingsText}
        </p>

      </div>

    `;

    return;

  }


  grid.innerHTML =
    filtered
      .map(
        createCard
      )
      .join("");

}


/* =====================================================
   MODE
===================================================== */

function setMode(mode){

  currentMode =
    mode;


  document
    .querySelectorAll(
      ".filter-button"
    )
    .forEach(
      button => {

        if(
          button.id ===
          "allMode"
          ||
          button.id ===
          "buyerMode"
          ||
          button.id ===
          "sellerMode"
        ){

          button.classList.remove(
            "active"
          );

        }

      }
    );


  if(mode === "all"){

    document
      .getElementById(
        "allMode"
      )
      .classList.add(
        "active"
      );

  }


  else if(
    mode === "buyer"
  ){

    document
      .getElementById(
        "buyerMode"
      )
      .classList.add(
        "active"
      );

  }


  else{

    document
      .getElementById(
        "sellerMode"
      )
      .classList.add(
        "active"
      );

  }


  renderListings();

}


/* =====================================================
   GEM TYPE
===================================================== */

function setGemType(type){

  currentGemType =
    type;


  const buttons =
    document
      .querySelectorAll(
        ".filter-row:nth-of-type(2) .filter-button"
      );


  document
    .querySelectorAll(
      ".filter-button"
    )
    .forEach(
      button => {

        const gemButtons = [

          "allGem"

        ];


        if(
          button.id ===
          "allGem"
        ){

          button.classList.remove(
            "active"
          );

        }

      }
    );


  if(type === ""){

    document
      .getElementById(
        "allGem"
      )
      .classList.add(
        "active"
      );

  }


  /*
    Button active state for
    gem type buttons.
  */

  const allGemButtons =
    document.querySelectorAll(
      ".filter-row"
    )[1]
    ?.querySelectorAll(
      ".filter-button"
    );


  if(allGemButtons){

    allGemButtons.forEach(
      button => {

        button.classList.remove(
          "active"
        );

      }
    );


    if(type === ""){

      document
        .getElementById(
          "allGem"
        )
        .classList.add(
          "active"
        );

    }
    else{

      const typeMap = {

        ruby:0,

        sapphire:1,

        jade:2,

        diamond:3,

        other:4

      };


      const index =
        typeMap[type];


      if(
        index !== undefined &&
        allGemButtons[index + 1]
      ){

        allGemButtons[
          index + 1
        ].classList.add(
          "active"
        );

      }

    }

  }


  renderListings();

}

      error
    } =
      await supabaseClient
        .auth
        .getSession();


    if(error){

      throw error;

    }


    if(
      !data?.session
    ){

      window.location.replace(
        "./auth.html?mode=login"
      );

      return;

    }


    /*
      User is authenticated.
    */

    document
      .getElementById(
        "authScreen"
      )
      .classList.remove(
        "show"
      );


    await loadListings();

  }
  catch(error){

    console.error(
      "Session check failed:",
      error
    );


    window.location.replace(
      "./auth.html?mode=login"
    );

  }

}


/* =====================================================
   AUTH STATE LISTENER
===================================================== */

if(
  typeof supabaseClient !==
  "undefined"
){

  supabaseClient
    .auth
    .onAuthStateChange(
      (
        event,
        session
      ) => {

        if(
          event ===
          "SIGNED_OUT"
          ||
          !session
        ){

          window.location.replace(
            "./auth.html?mode=login"
          );

        }

      }
    );

}


/* =====================================================
   START
===================================================== */

applyTheme(
  localStorage.getItem(
    "mec_theme"
  ) || "light"
);

updateLanguage();

checkSession();

</script>

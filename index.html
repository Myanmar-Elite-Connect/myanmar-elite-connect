<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Myanmar Elite Connect</title>

  <meta
    name="description"
    content="Myanmar Elite Connect"
  >

  <style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;

      font-family:
        Inter,
        "Noto Sans Myanmar",
        "Myanmar Text",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f7f9fc;
      color: #10233f;

      transition:
        background .3s ease,
        color .3s ease;
    }

    button,
    a {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }


    /* =====================================================
       THEME VARIABLES
    ===================================================== */

    :root {
      --bg: #f7f9fc;
      --surface: #ffffff;
      --surface-soft: #f1f4f8;

      --text: #10233f;
      --muted: #728096;

      --navy: #071a34;
      --navy-2: #102b4d;

      --gold: #d7b35a;
      --gold-light: #f1d487;

      --border: rgba(16, 35, 63, .09);

      --shadow:
        0 25px 70px rgba(16, 35, 63, .10);
    }

    body.dark {
      --bg: #071321;
      --surface: #0d1d31;
      --surface-soft: #12263d;

      --text: #f4f7fb;
      --muted: #94a3b7;

      --navy: #f4f7fb;
      --navy-2: #dce5ef;

      --border: rgba(255, 255, 255, .09);

      --shadow:
        0 25px 70px rgba(0, 0, 0, .30);
    }


    /* =====================================================
       PAGE
    ===================================================== */

    .page {
      min-height: 100vh;

      display: flex;
      flex-direction: column;

      overflow: hidden;
    }


    /* =====================================================
       HEADER
    ===================================================== */

    .header {
      position: fixed;

      top: 0;
      left: 0;
      right: 0;

      z-index: 100;

      height: 76px;

      background:
        color-mix(
          in srgb,
          var(--surface) 88%,
          transparent
        );

      border-bottom:
        1px solid var(--border);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .header-inner {
      width: min(
        1180px,
        calc(100% - 36px)
      );

      height: 100%;

      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }


    /* =====================================================
       BRAND
    ===================================================== */

    .brand {
      display: flex;
      align-items: center;

      gap: 12px;

      min-width: 0;
    }

    .brand-logo {
      width: 43px;
      height: 43px;

      flex: 0 0 43px;

      display: grid;
      place-items: center;

      overflow: hidden;

      border-radius: 12px;

      background: var(--surface);

      border:
        1px solid var(--border);

      box-shadow:
        0 5px 18px rgba(0,0,0,.06);
    }

    .brand-logo img {
      width: 82%;
      height: 82%;

      object-fit: contain;

      display: block;
    }

    .brand-name {
      color: var(--text);

      font-size: 15px;
      font-weight: 850;

      letter-spacing: -.35px;

      white-space: nowrap;
    }

    .brand-name span {
      color: var(--gold);
    }


    /* =====================================================
       HEADER CONTROLS
    ===================================================== */

    .header-controls {
      display: flex;
      align-items: center;

      gap: 7px;
    }

    .control {
      width: 40px;
      height: 40px;

      display: grid;
      place-items: center;

      border-radius: 11px;

      color: var(--text);

      background: var(--surface);

      border:
        1px solid var(--border);

      transition:
        transform .2s ease,
        border-color .2s ease,
        background .2s ease;
    }

    .control:hover {
      transform: translateY(-2px);

      border-color:
        rgba(215,179,90,.55);
    }

    .language-button {
      width: auto;

      padding: 0 12px;

      gap: 5px;

      font-size: 11px;
      font-weight: 800;
    }

    .language-button .active {
      color: var(--gold);
    }


    /* =====================================================
       HERO
    ===================================================== */

    .hero {
      position: relative;

      min-height: 100vh;

      display: flex;
      align-items: center;

      padding:
        120px 0 60px;
    }

    .hero-background {
      position: absolute;

      inset: 0;

      overflow: hidden;

      pointer-events: none;
    }

    .glow-one {
      position: absolute;

      width: 480px;
      height: 480px;

      top: -220px;
      right: -140px;

      border-radius: 50%;

      background:
        rgba(215,179,90,.10);

      filter: blur(5px);
    }

    .glow-two {
      position: absolute;

      width: 380px;
      height: 380px;

      bottom: -210px;
      left: -130px;

      border-radius: 50%;

      background:
        rgba(16,43,77,.07);

      filter: blur(5px);
    }

    .hero-inner {
      position: relative;
      z-index: 2;

      width: min(
        1180px,
        calc(100% - 36px)
      );

      margin: auto;

      display: grid;

      grid-template-columns:
        minmax(0, 1.05fr)
        minmax(330px, .95fr);

      align-items: center;

      gap: 80px;
    }


    /* =====================================================
       HERO COPY
    ===================================================== */

    .hero-copy {
      max-width: 650px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;

      gap: 8px;

      margin-bottom: 20px;

      color: var(--gold);

      font-size: 11px;
      font-weight: 850;

      letter-spacing: 1.7px;

      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";

      width: 28px;
      height: 1px;

      background: var(--gold);
    }

    .hero-title {
      color: var(--text);

      font-size:
        clamp(40px, 6vw, 72px);

      line-height: 1.02;

      letter-spacing: -3px;

      font-weight: 900;

      margin-bottom: 22px;
    }

    .hero-title span {
      color: var(--gold);
    }

    .hero-description {
      max-width: 560px;

      color: var(--muted);

      font-size: 15px;

      line-height: 1.85;

      margin-bottom: 31px;
    }


    /* =====================================================
       AUTH BUTTONS
    ===================================================== */

    .auth-actions {
      display: flex;
      align-items: center;

      gap: 11px;

      flex-wrap: wrap;
    }

    .auth-button {
      min-height: 50px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding:
        0 24px;

      border-radius: 13px;

      font-size: 13px;
      font-weight: 850;

      transition:
        transform .2s ease,
        box-shadow .2s ease,
        background .2s ease;
    }

    .auth-button:hover {
      transform: translateY(-3px);
    }

    .login-button {
      color: #ffffff;

      background:
        linear-gradient(
          135deg,
          #071a34,
          #173b62
        );

      box-shadow:
        0 12px 28px
        rgba(7,26,52,.20);
    }

    body.dark .login-button {
      color: #071a34;

      background:
        linear-gradient(
          135deg,
          var(--gold-light),
          var(--gold)
        );
    }

    .signup-button {
      color: var(--text);

      background: var(--surface);

      border:
        1px solid var(--border);
    }

    .signup-button:hover {
      border-color:
        rgba(215,179,90,.55);
    }


    /* =====================================================
       HERO LOGO
    ===================================================== */

    .hero-visual {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-frame {
      position: relative;

      width:
        min(390px, 72vw);

      aspect-ratio: 1 / 1;

      display: grid;
      place-items: center;

      border-radius: 42px;

      background:
        linear-gradient(
          145deg,
          var(--surface),
          var(--surface-soft)
        );

      border:
        1px solid var(--border);

      box-shadow: var(--shadow);
    }

    .logo-frame::before {
      content: "";

      position: absolute;

      inset: 17px;

      border-radius: 32px;

      border:
        1px solid
        rgba(215,179,90,.22);
    }

    .logo-frame::after {
      content: "";

      position: absolute;

      width: 68%;
      height: 68%;

      border-radius: 50%;

      border:
        1px solid
        rgba(215,179,90,.11);
    }

    .main-logo {
      position: relative;
      z-index: 2;

      width: 63%;
      height: 63%;

      object-fit: contain;

      display: block;

      filter:
        drop-shadow(
          0 18px 28px
          rgba(7,26,52,.12)
        );
    }


    /* =====================================================
       SMALL FOOTER
    ===================================================== */

    .footer {
      position: relative;
      z-index: 3;

      width: min(
        1180px,
        calc(100% - 36px)
      );

      margin:
        auto auto 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--muted);

      font-size: 10px;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 850px) {

      .header {
        height: 68px;
      }

      .hero {
        padding:
          105px 0 45px;
      }

      .hero-inner {
        grid-template-columns: 1fr;

        gap: 48px;

        text-align: center;
      }

      .hero-copy {
        max-width: 650px;
        margin: auto;
      }

      .eyebrow {
        justify-content: center;
      }

      .hero-description {
        margin-left: auto;
        margin-right: auto;
      }

      .auth-actions {
        justify-content: center;
      }

      .hero-visual {
        order: 2;
      }

      .logo-frame {
        width:
          min(310px, 72vw);

        border-radius: 30px;
      }

      .logo-frame::before {
        border-radius: 23px;
      }
    }


    @media (max-width: 520px) {

      .header-inner,
      .hero-inner,
      .footer {
        width:
          calc(100% - 26px);
      }

      .brand-name {
        display: none;
      }

      .brand-logo {
        width: 41px;
        height: 41px;

        flex-basis: 41px;
      }

      .language-button {
        padding: 0 9px;
      }

      .hero {
        padding-top: 96px;
      }

      .hero-title {
        font-size: 42px;

        letter-spacing: -2px;
      }

      .hero-description {
        font-size: 13px;

        line-height: 1.75;
      }

      .auth-button {
        width: 100%;

        min-height: 49px;
      }

      .auth-actions {
        width: 100%;

        flex-direction: column;
      }

      .logo-frame {
        width: 265px;

        border-radius: 26px;
      }

      .logo-frame::before {
        inset: 13px;

        border-radius: 19px;
      }
    }

  </style>
</head>


<body>

  <div class="page">


    <!-- ===================================================
         HEADER
    ==================================================== -->

    <header class="header">

      <div class="header-inner">


        <!-- LOGO -->

        <a
          href="./index.html"
          class="brand"
          aria-label="Myanmar Elite Connect">

          <div class="brand-logo">

            <img
              src="https://lh3.googleusercontent.com/d/1fR8TnvOjrzVbKuro9Ths1_Jt0PAxSmGd"
              alt="Myanmar Elite Connect Logo">

          </div>

          <div class="brand-name">
            Myanmar <span>Elite</span> Connect
          </div>

        </a>


        <!-- CONTROLS -->

        <div class="header-controls">

          <button
            type="button"
            class="control language-button"
            id="languageButton"
            aria-label="Change language">

            <span id="langEN" class="active">
              EN
            </span>

            <span>
              /
            </span>

            <span id="langMM">
              မြန်မာ
            </span>

          </button>


          <button
            type="button"
            class="control"
            id="themeButton"
            aria-label="Change theme">

            ☾

          </button>

        </div>

      </div>

    </header>


    <!-- ===================================================
         HERO
    ==================================================== -->

    <main class="hero">

      <div class="hero-background">

        <div class="glow-one"></div>

        <div class="glow-two"></div>

      </div>


      <div class="hero-inner">


        <!-- COPY -->

        <section class="hero-copy">

          <div
            class="eyebrow"
            id="eyebrow">
            MYANMAR ELITE CONNECT
          </div>


          <h1
            class="hero-title"
            id="heroTitle">

            A better way
            to <span>connect.</span>

          </h1>


          <p
            class="hero-description"
            id="heroDescription">

            A simple and organized place to
            discover, connect, buy and sell.

          </p>


          <!-- AUTH -->

          <div class="auth-actions">

            <a
              href="./auth.html?mode=login"
              class="auth-button login-button"
              id="loginButton">

              Log In

            </a>


            <a
              href="./auth.html?mode=signup"
              class="auth-button signup-button"
              id="signupButton">

              Sign Up

            </a>

          </div>

        </section>


        <!-- LOGO -->

        <section
          class="hero-visual"
          aria-label="Myanmar Elite Connect">

          <div class="logo-frame">

            <img
              class="main-logo"
              src="https://lh3.googleusercontent.com/d/1fR8TnvOjrzVbKuro9Ths1_Jt0PAxSmGd"
              alt="Myanmar Elite Connect Logo">

          </div>

        </section>

      </div>

    </main>


    <!-- ===================================================
         FOOTER
    ==================================================== -->

    <footer class="footer">

      <span id="footerText">
        Myanmar Elite Connect
      </span>

    </footer>

  </div>


  <script>

    /* =====================================================
       LANGUAGE
    ===================================================== */

    const translations = {

      en: {

        eyebrow:
          "MYANMAR ELITE CONNECT",

        title:
          'A better way to <span>connect.</span>',

        description:
          "A simple and organized place to discover, connect, buy and sell.",

        login:
          "Log In",

        signup:
          "Sign Up",

        footer:
          "Myanmar Elite Connect"

      },


      mm: {

        eyebrow:
          "MYANMAR ELITE CONNECT",

        title:
          'ပိုမိုကောင်းမွန်စွာ <span>ချိတ်ဆက်ပါ။</span>',

        description:
          "ရှာဖွေခြင်း၊ ချိတ်ဆက်ခြင်း၊ ဝယ်ယူခြင်းနှင့် ရောင်းချခြင်းများကို ရိုးရှင်းစွာ အသုံးပြုနိုင်သော နေရာတစ်ခု။",

        login:
          "အကောင့်ဝင်ရန်",

        signup:
          "အကောင့်ဖွင့်ရန်",

        footer:
          "Myanmar Elite Connect"

      }

    };


    let currentLanguage =
      localStorage.getItem(
        "mec_language"
      ) || "en";


    function updateLanguage() {

      const t =
        translations[currentLanguage];


      document.getElementById(
        "eyebrow"
      ).textContent =
        t.eyebrow;


      document.getElementById(
        "heroTitle"
      ).innerHTML =
        t.title;


      document.getElementById(
        "heroDescription"
      ).textContent =
        t.description;


      document.getElementById(
        "loginButton"
      ).textContent =
        t.login;


      document.getElementById(
        "signupButton"
      ).textContent =
        t.signup;


      document.getElementById(
        "footerText"
      ).textContent =
        t.footer;


      document.getElementById(
        "langEN"
      ).classList.toggle(
        "active",
        currentLanguage === "en"
      );


      document.getElementById(
        "langMM"
      ).classList.toggle(
        "active",
        currentLanguage === "mm"
      );


      document.documentElement.lang =
        currentLanguage === "mm"
          ? "my"
          : "en";

    }


    document.getElementById(
      "languageButton"
    ).addEventListener(
      "click",
      function () {

        currentLanguage =
          currentLanguage === "en"
            ? "mm"
            : "en";

        localStorage.setItem(
          "mec_language",
          currentLanguage
        );

        updateLanguage();

      }
    );


    /* =====================================================
       THEME
    ===================================================== */

    function applyTheme(theme) {

      document.body.classList.toggle(
        "dark",
        theme === "dark"
      );


      document.getElementById(
        "themeButton"
      ).textContent =
        theme === "dark"
          ? "☀"
          : "☾";


      localStorage.setItem(
        "mec_theme",
        theme
      );

    }


    document.getElementById(
      "themeButton"
    ).addEventListener(
      "click",
      function () {

        const dark =
          document.body.classList.contains(
            "dark"
          );

        applyTheme(
          dark
            ? "light"
            : "dark"
        );

      }
    );


    /* =====================================================
       INITIAL LOAD
    ===================================================== */

    const savedTheme =
      localStorage.getItem(
        "mec_theme"
      ) || "light";


    applyTheme(
      savedTheme
    );


    updateLanguage();

  </script>

</body>
</html>

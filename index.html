<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Myanmar Elite Connect</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase.js"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    :root{
      --bg:#f7f9fc;
      --surface:rgba(255,255,255,.82);
      --surface-solid:#fff;

      --text:#10233f;
      --muted:#718097;

      --border:rgba(16,35,63,.10);

      --gold:#d8b45c;
      --gold-light:#f4d98a;

      --navy:#071a34;

      --shadow:
        0 30px 80px rgba(13,35,64,.10);

      --button-shadow:
        0 12px 30px rgba(16,35,63,.14);
    }

    body.dark{
      --bg:#071321;
      --surface:rgba(14,30,50,.84);
      --surface-solid:#0e1e32;

      --text:#f3f6fa;
      --muted:#91a0b4;

      --border:rgba(255,255,255,.10);

      --navy:#f4f6f9;

      --shadow:
        0 30px 80px rgba(0,0,0,.35);

      --button-shadow:
        0 12px 30px rgba(0,0,0,.30);
    }

    body{
      min-height:100vh;

      font-family:
        Inter,
        "Noto Sans Myanmar",
        "Myanmar Text",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color:var(--text);
      background:var(--bg);

      overflow:hidden;

      transition:
        background-color .35s ease,
        color .35s ease;
    }

    button,
    a{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    a{
      text-decoration:none;
    }


    /* =====================================================
       PAGE
    ===================================================== */

    .page{
      position:relative;

      width:100%;
      min-height:100vh;

      display:flex;
      align-items:center;
      justify-content:center;

      padding:30px;

      overflow:hidden;
    }


    /* =====================================================
       BACKGROUND
    ===================================================== */

    .background-glow{
      position:absolute;

      width:520px;
      height:520px;

      border-radius:50%;

      background:
        radial-gradient(
          circle,
          rgba(216,180,92,.16) 0%,
          rgba(216,180,92,.05) 42%,
          transparent 72%
        );

      filter:blur(5px);

      pointer-events:none;
    }

    .background-glow.one{
      top:-220px;
      left:-180px;
    }

    .background-glow.two{
      right:-250px;
      bottom:-260px;
    }


    /* =====================================================
       TOP CONTROLS
    ===================================================== */

    .top-controls{
      position:absolute;

      top:28px;
      right:30px;

      display:flex;
      align-items:center;

      gap:8px;

      z-index:20;
    }

    .control{
      height:40px;

      display:flex;
      align-items:center;

      border:1px solid var(--border);
      border-radius:999px;

      color:var(--text);
      background:var(--surface);

      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);

      box-shadow:
        0 8px 24px rgba(0,0,0,.04);

      transition:.25s ease;
    }

    .control:hover{
      transform:translateY(-2px);

      border-color:
        rgba(216,180,92,.45);
    }


    /* LANGUAGE */

    .language-control{
      padding:4px;
    }

    .language-control button{
      height:30px;
      min-width:42px;

      padding:0 9px;

      border:none;
      border-radius:999px;

      color:var(--muted);
      background:transparent;

      font-size:11px;
      font-weight:850;

      transition:.25s ease;
    }

    .language-control button.active{
      color:#071a34;
      background:var(--gold);
    }


    /* THEME */

    .theme-control{
      width:40px;

      justify-content:center;

      border:none;
    }

    .theme-control button{
      width:100%;
      height:100%;

      border:none;
      border-radius:999px;

      color:var(--text);
      background:transparent;

      font-size:17px;

      transition:.25s ease;
    }

    .theme-control button:hover{
      transform:rotate(12deg);
    }


    /* =====================================================
       WELCOME CARD
    ===================================================== */

    .welcome-card{
      position:relative;
      z-index:5;

      width:min(480px,100%);

      display:flex;
      flex-direction:column;
      align-items:center;

      text-align:center;

      padding:48px 42px 42px;

      border:1px solid var(--border);
      border-radius:32px;

      background:var(--surface);

      backdrop-filter:blur(22px);
      -webkit-backdrop-filter:blur(22px);

      box-shadow:var(--shadow);

      animation:
        cardAppear .7s ease both;
    }

    @keyframes cardAppear{

      from{
        opacity:0;
        transform:
          translateY(18px)
          scale(.97);
      }

      to{
        opacity:1;
        transform:
          translateY(0)
          scale(1);
      }

    }


    /* =====================================================
       LOGO
    ===================================================== */

    .logo-wrap{
      width:112px;
      height:112px;

      display:grid;
      place-items:center;

      margin-bottom:24px;

      border-radius:30px;

      background:var(--surface-solid);

      border:1px solid var(--border);

      box-shadow:
        0 18px 45px
        rgba(16,35,63,.10);

      overflow:hidden;

      animation:
        logoAppear .8s ease both;
    }

    .logo-wrap img{
      width:82%;
      height:82%;

      object-fit:contain;

      display:block;
    }

    @keyframes logoAppear{

      from{
        opacity:0;
        transform:
          translateY(12px)
          scale(.94);
      }

      to{
        opacity:1;
        transform:
          translateY(0)
          scale(1);
      }

    }


    /* =====================================================
       BRAND
    ===================================================== */

    .brand-name{
      color:var(--text);

      font-size:
        clamp(25px,5vw,34px);

      font-weight:850;

      letter-spacing:-1.2px;

      line-height:1.1;

      margin-bottom:10px;

      animation:
        textAppear .7s .1s ease both;
    }

    .brand-name span{
      color:var(--gold);
    }

    .tagline{
      max-width:350px;

      color:var(--muted);

      font-size:14px;

      line-height:1.7;

      margin-bottom:30px;

      animation:
        textAppear .7s .18s ease both;
    }

    @keyframes textAppear{

      from{
        opacity:0;
        transform:translateY(8px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }

    }


    /* =====================================================
       AUTH BUTTONS
    ===================================================== */

    .auth-buttons{
      width:100%;

      display:grid;

      grid-template-columns:
        1fr 1fr;

      gap:11px;

      animation:
        textAppear .7s .25s ease both;
    }

    .auth-button{
      height:52px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:15px;

      font-size:14px;
      font-weight:850;

      transition:
        transform .25s ease,
        box-shadow .25s ease,
        background-color .25s ease;
    }

    .auth-button:hover{
      transform:translateY(-3px);
    }


    /* LOGIN */

    .login-button{
      color:var(--text);

      background:transparent;

      border:1px solid var(--border);
    }

    .login-button:hover{
      border-color:
        rgba(216,180,92,.55);

      background:
        rgba(216,180,92,.08);
    }


    /* SIGN UP */

    .signup-button{
      color:#071a34;

      background:
        linear-gradient(
          135deg,
          var(--gold-light),
          var(--gold)
        );

      border:1px solid transparent;

      box-shadow:var(--button-shadow);
    }

    .signup-button:hover{
      box-shadow:
        0 17px 35px
        rgba(16,35,63,.18);
    }


    /* =====================================================
       FOOTER
    ===================================================== */

    .minimal-footer{
      margin-top:26px;

      color:var(--muted);

      font-size:11px;

      letter-spacing:.4px;

      animation:
        textAppear .7s .32s ease both;
    }


    /* =====================================================
       SESSION LOADING
       Invisible to user
    ===================================================== */

    .session-loading{
      position:fixed;
      inset:0;

      z-index:999;

      display:flex;
      align-items:center;
      justify-content:center;

      background:var(--bg);

      opacity:1;

      transition:
        opacity .25s ease,
        visibility .25s ease;
    }

    .session-loading.hide{
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    .session-loader{
      width:25px;
      height:25px;

      border:2px solid var(--border);

      border-top-color:var(--gold);

      border-radius:50%;

      animation:
        spin .7s linear infinite;
    }

    @keyframes spin{

      to{
        transform:rotate(360deg);
      }

    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media(max-width:600px){

      .page{
        padding:20px;
      }

      .top-controls{
        top:18px;
        right:18px;
      }

      .welcome-card{
        padding:42px 24px 28px;

        border-radius:27px;
      }

      .logo-wrap{
        width:94px;
        height:94px;

        border-radius:25px;
      }

      .brand-name{
        font-size:27px;
      }

      .tagline{
        font-size:13px;

        margin-bottom:25px;
      }

      .auth-buttons{
        grid-template-columns:1fr;

        gap:9px;
      }

      .auth-button{
        height:50px;
      }

    }


    @media(max-width:380px){

      .top-controls{
        top:13px;
        right:13px;
      }

      .welcome-card{
        padding-left:19px;
        padding-right:19px;
      }

      .brand-name{
        font-size:24px;
      }

    }

  </style>
</head>


<body>

  <!-- =====================================================
       SESSION CHECK
  ===================================================== -->

  <div
    id="sessionLoading"
    class="session-loading">

    <div class="session-loader"></div>

  </div>


  <main class="page">

    <div class="background-glow one"></div>
    <div class="background-glow two"></div>


    <!-- ===================================================
         LANGUAGE + THEME
    ==================================================== -->

    <div class="top-controls">

      <div class="control language-control">

        <button
          id="langMM"
          type="button"
          onclick="setLanguage('mm')">

          မြန်မာ

        </button>

        <button
          id="langEN"
          type="button"
          onclick="setLanguage('en')">

          EN

        </button>

      </div>


      <div class="control theme-control">

        <button
          id="themeButton"
          type="button"
          onclick="toggleTheme()"
          aria-label="Toggle theme">

          ☾

        </button>

      </div>

    </div>


    <!-- ===================================================
         WELCOME
    ==================================================== -->

    <section class="welcome-card">


      <!-- LOGO -->

      <div class="logo-wrap">

        <img
          src="https://lh3.googleusercontent.com/d/1fR8TnvOjrzVbKuro9Ths1_Jt0PAxSmGd"
          alt="Myanmar Elite Connect Logo"
          onerror="this.style.display='none';">

      </div>


      <!-- BRAND -->

      <h1
        class="brand-name"
        id="brandName">

        Myanmar
        <span>Elite</span>
        Connect

      </h1>


      <!-- TAGLINE -->

      <p
        class="tagline"
        id="tagline">

        One place to connect, discover and trade.

      </p>


      <!-- AUTH -->

      <div class="auth-buttons">


        <a
          class="auth-button login-button"
          id="loginButton"
          href="./auth.html?mode=login">

          Log In

        </a>


        <a
          class="auth-button signup-button"
          id="signupButton"
          href="./auth.html?mode=signup">

          Sign Up

        </a>


      </div>


      <!-- FOOTER -->

      <div
        class="minimal-footer"
        id="footerText">

        Myanmar Elite Connect

      </div>

    </section>

  </main>


  <script>

    /* =====================================================
       LANGUAGE
    ===================================================== */

    const translations = {

      en:{
        brand:'Myanmar <span>Elite</span> Connect',

        tagline:
          'One place to connect, discover and trade.',

        login:'Log In',

        signup:'Sign Up',

        footer:
          'Myanmar Elite Connect'
      },


      mm:{
        brand:
          'မြန်မာ <span>Elite</span> Connect',

        tagline:
          'ချိတ်ဆက်ရန်၊ ရှာဖွေရန်နှင့် ရောင်းဝယ်ရန် တစ်နေရာတည်း။',

        login:
          'ဝင်ရောက်မည်',

        signup:
          'အကောင့်ဖွင့်မည်',

        footer:
          'Myanmar Elite Connect'
      }

    };


    function setLanguage(language){

      const t =
        translations[language];


      localStorage.setItem(
        'mec_language',
        language
      );


      document.getElementById(
        'brandName'
      ).innerHTML =
        t.brand;


      document.getElementById(
        'tagline'
      ).textContent =
        t.tagline;


      document.getElementById(
        'loginButton'
      ).textContent =
        t.login;


      document.getElementById(
        'signupButton'
      ).textContent =
        t.signup;


      document.getElementById(
        'footerText'
      ).textContent =
        t.footer;


      document.getElementById(
        'langMM'
      ).classList.toggle(
        'active',
        language === 'mm'
      );


      document.getElementById(
        'langEN'
      ).classList.toggle(
        'active',
        language === 'en'
      );


      document.documentElement.lang =
        language === 'mm'
          ? 'my'
          : 'en';

    }


    /* =====================================================
       THEME
    ===================================================== */

    function applyTheme(theme){

      document.body.classList.toggle(
        'dark',
        theme === 'dark'
      );


      document.getElementById(
        'themeButton'
      ).textContent =
        theme === 'dark'
          ? '☀'
          : '☾';


      localStorage.setItem(
        'mec_theme',
        theme
      );

    }


    function toggleTheme(){

      const dark =
        document.body.classList.contains(
          'dark'
        );


      applyTheme(
        dark
          ? 'light'
          : 'dark'
      );

    }


    /* =====================================================
       AUTH SESSION
    ===================================================== */

    async function checkSession(){

      try{

        /*
         * supabase.js ထဲမှာ
         * supabaseClient ရှိနေပြီးသားဖြစ်ရမယ်။
         */

        if(
          typeof supabaseClient ===
          'undefined'
        ){

          /*
           * UI မှာ technical error မပြ။
           * Login / Sign Up ကို ပုံမှန်ဆက်သုံးခွင့်ပေး။
           */

          hideSessionLoader();

          return;

        }


        const {
          data,
          error
        } =
          await supabaseClient.auth.getSession();


        /*
         * Session error ဖြစ်ရင်
         * user ကို မနှောင့်ယှက်ဘဲ
         * landing page ဆက်ပြ။
         */

        if(error){

          hideSessionLoader();

          return;

        }


        const session =
          data?.session;


        /*
         * Already logged in
         */

        if(session){

          window.location.replace(
            './general.html'
          );

          return;

        }


        /*
         * Not logged in
         */

        hideSessionLoader();


      }catch(error){

        /*
         * Technical error ကို UI ပေါ်မပြ။
         */

        console.error(
          'Session check failed:',
          error
        );

        hideSessionLoader();

      }

    }


    function hideSessionLoader(){

      document
        .getElementById(
          'sessionLoading'
        )
        .classList.add(
          'hide'
        );

    }


    /* =====================================================
       AUTH STATE LISTENER
    ===================================================== */

    function listenAuthState(){

      if(
        typeof supabaseClient ===
        'undefined'
      ){

        return;

      }


      supabaseClient.auth.onAuthStateChange(

        (event, session) => {

          if(
            event ===
            'SIGNED_IN' &&
            session
          ){

            window.location.replace(
              './general.html'
            );

          }

        }

      );

    }


    /* =====================================================
       INITIAL SETTINGS
    ===================================================== */

    const savedLanguage =
      localStorage.getItem(
        'mec_language'
      ) || 'en';


    const savedTheme =
      localStorage.getItem(
        'mec_theme'
      ) || 'light';


    setLanguage(
      savedLanguage
    );


    applyTheme(
      savedTheme
    );


    /* =====================================================
       START
    ===================================================== */

    checkSession();

    listenAuthState();

  </script>

</body>
</html>

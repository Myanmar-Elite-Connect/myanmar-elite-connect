<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KYC — Myanmar Elite Connect</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase.js"></script><style>:root{--bg:#f5f7fb;--card:#fff;--soft:#eef2f7;--text:#10233f;--muted:#738197;--line:rgba(16,35,63,.1);--gold:#d7b35a;--navy:#071a34}body.dark{--bg:#071321;--card:#0d1d31;--soft:#12263d;--text:#f5f7fb;--muted:#9aa9bb;--line:rgba(255,255,255,.1);--navy:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}.wrap{width:min(650px,calc(100% - 20px));margin:25px auto}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 15px 45px rgba(0,0,0,.07)}h1{font-size:22px;margin:0}.sub{color:var(--muted);font-size:11px;line-height:1.6;margin:7px 0 18px}.field{margin:12px 0}.field label{display:block;font-size:10px;font-weight:850;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--soft);color:var(--text)}.btn{width:100%;height:44px;border:0;border-radius:11px;background:var(--navy);color:var(--bg);font-weight:900}.note{padding:10px;border-radius:11px;background:var(--soft);color:var(--muted);font-size:9px;line-height:1.6}.status{margin-top:12px;padding:10px;border-radius:10px;background:var(--soft);font-size:10px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.back{font-size:10px;color:var(--muted)}</style><script src="./mec-theme.js"></script>
</head><body><main class="wrap"><div class="top"><a class="back" href="./profile.html">← Profile</a><button id="theme" style="border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;width:36px;height:36px">☾</button></div><section class="card"><h1>KYC Verification</h1><p class="sub">Submit one of the accepted identity documents. Your documents are private and are reviewed by an administrator.</p><div class="field"><label>Document Type</label><select id="type"><option value="national_id">National ID</option><option value="license">Driver License</option><option value="passport">Passport</option></select></div><div class="field"><label>Full Name</label><input id="name" placeholder="Name on document"></div><div class="field"><label>Front / Identity Page</label><input id="front" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"></div><div class="field"><label>Back (required for National ID / License)</label><input id="back" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"></div><div class="note">Maximum 8MB per file. Accepted: JPG, PNG, WEBP or PDF.</div><button id="submit" class="btn" style="margin-top:15px">Submit for Review</button><div id="status" class="status hidden"></div></section></main><script>function theme(t){document.body.classList.toggle('dark',t==='dark');document.getElementById('theme').textContent=t==='dark'?'☀':'☾';localStorage.setItem('mec_theme',t)}theme(localStorage.getItem('mec_theme')||'light');document.getElementById('theme').onclick=()=>theme(document.body.classList.contains('dark')?'light':'dark');const statusEl=document.getElementById('status');function status(t){statusEl.textContent=t;statusEl.classList.remove('hidden')}async function user(){const {data}=await supabaseClient.auth.getUser();return data?.user||null}async function latest(uid){const {data}=await supabaseClient.from('kyc_submissions').select('status,rejection_reason,document_type,created_at').eq('user_id',uid).order('created_at',{ascending:false}).limit(1).maybeSingle();if(data)status(`Latest submission: ${data.status}${data.rejection_reason?' — '+data.rejection_reason:''}`)}async function upload(file,uid,kind){if(!file)return null;if(file.size>8*1024*1024)throw new Error('Each file must be 8MB or smaller.');const ext=(file.name.split('.').pop()||'bin').toLowerCase();const path=`${uid}/${crypto.randomUUID()}-${kind}.${ext}`;const {error}=await supabaseClient.storage.from('kyc-documents').upload(path,file,{upsert:false,contentType:file.type});if(error)throw error;return path}document.getElementById('type').onchange=()=>{const t=document.getElementById('type').value;document.querySelector('label[for="back"]');document.getElementById('back').required=t!=='passport'};document.getElementById('submit').onclick=async()=>{const btn=document.getElementById('submit');try{btn.disabled=true;const u=await user();if(!u)throw new Error('Please sign in first.');const type=document.getElementById('type').value,name=document.getElementById('name').value.trim(),front=document.getElementById('front').files[0],back=document.getElementById('back').files[0];if(!name||!front)throw new Error('Full name and front/identity document are required.');if(type!=='passport'&&!back)throw new Error('Back document is required for National ID and Driver License.');const frontPath=await upload(front,u.id,'front');const backPath=back?await upload(back,u.id,'back'):null;const {error}=await supabaseClient.from('kyc_submissions').insert({user_id:u.id,full_name:name,document_type:type,front_image_url:frontPath,back_image_url:backPath,status:'pending'});if(error)throw error;status('Submitted successfully. An admin will review your KYC.');await latest(u.id)}catch(e){status(e.message||'Submission failed.')}finally{btn.disabled=false}};user().then(u=>{if(u)latest(u.id)});</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Listing • Myanmar Elite Connect</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#10233f;font-family:Inter,"Noto Sans Myanmar","Myanmar Text",system-ui,sans-serif;padding-bottom:80px}body.dark{background:#071321;color:#f4f7fb}a{text-decoration:none;color:inherit}button{font:inherit;cursor:pointer}.top{position:sticky;top:0;z-index:20;height:64px;background:rgba(255,255,255,.94);border-bottom:1px solid rgba(16,35,63,.1);backdrop-filter:blur(18px)}body.dark .top{background:rgba(7,19,33,.96);border-color:rgba(255,255,255,.1)}.topin{width:min(1050px,94%);height:100%;margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:950}.brand img{width:38px;height:38px;border-radius:10px;object-fit:contain}.brand b{color:#d8b45c}.theme{width:38px;height:38px;border:1px solid rgba(16,35,63,.1);border-radius:10px;background:transparent;color:inherit}.page{width:min(1050px,94%);margin:18px auto}.layout{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.card{background:#fff;border:1px solid rgba(16,35,63,.1);border-radius:18px;overflow:hidden;box-shadow:0 18px 50px rgba(16,35,63,.08)}body.dark .card{background:#0e1e32;border-color:rgba(255,255,255,.1);box-shadow:0 18px 50px rgba(0,0,0,.28)}.main{position:relative;aspect-ratio:4/3;background:#eef2f7}.main img{width:100%;height:100%;object-fit:cover}.ar{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:50%;background:rgba(0,0,0,.5);color:#fff}.prev{left:10px}.next{right:10px}.count{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.58);color:#fff;border-radius:99px;padding:6px 9px;font-size:9px}.thumbs{display:flex;gap:7px;padding:9px;overflow:auto}.thumb{width:70px;height:55px;flex:0 0 auto;border:2px solid transparent;border-radius:8px;overflow:hidden;padding:0;background:#eef2f7}.thumb.active{border-color:#d8b45c}.thumb img{width:100%;height:100%;object-fit:cover}.details{padding:20px}.eyebrow{color:#d8b45c;font-size:9px;font-weight:950;text-transform:uppercase;letter-spacing:1px}.title{margin-top:6px;font-size:clamp(24px,4vw,35px);font-weight:950}.price{margin-top:10px;font-size:22px;font-weight:950}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}.pill{padding:6px 9px;border-radius:99px;background:#eef2f7;color:#758198;font-size:9px;font-weight:850}body.dark .pill{background:#10243c}.desc{margin-top:18px;padding-top:16px;border-top:1px solid rgba(16,35,63,.1)}body.dark .desc{border-color:rgba(255,255,255,.1)}.desc h3,.seller h3{font-size:13px;margin:0}.desc p{color:#758198;font-size:11px;line-height:1.8;white-space:pre-wrap}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:17px}.btn{min-height:43px;border:1px solid rgba(16,35,63,.1);border-radius:10px;background:#eef2f7;color:inherit;font-size:10px;font-weight:900}.btn.primary{border:0;background:linear-gradient(135deg,#f3db91,#d8b45c);color:#071a34}.seller{margin-top:14px;padding:16px}.seller-head{display:flex;align-items:center;gap:10px}.avatar{width:54px;height:54px;border-radius:50%;object-fit:cover;border:2px solid #d8b45c;background:#eef2f7}.seller-name{font-size:13px;font-weight:950}.username{margin-top:3px;color:#d8b45c;font-size:10px;font-weight:850}.seller-location{margin-top:4px;color:#758198;font-size:9px}.seller-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.seller-actions a,.seller-actions button{min-height:39px;display:grid;place-items:center;border:1px solid rgba(16,35,63,.1);border-radius:9px;background:#eef2f7;color:inherit;font-size:9px;font-weight:900}.seller-actions .primary{background:#d8b45c;color:#071a34;border:0}.contact-grid{display:grid;gap:8px;margin-top:14px}.contact{padding:11px;border-radius:10px;background:#eef2f7}.contact small{display:block;color:#758198;font-size:8px}.contact b{display:block;margin-top:4px;font-size:10px;word-break:break-word}body.dark .contact{background:#10243c}.info{margin-top:14px;padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.item{padding:10px;border-radius:9px;background:#eef2f7}.item small{display:block;color:#758198;font-size:8px}.item b{display:block;margin-top:3px;font-size:10px}body.dark .item{background:#10243c}.bottom{position:fixed;bottom:0;left:0;right:0;height:64px;z-index:50;background:rgba(255,255,255,.94);border-top:1px solid rgba(16,35,63,.1);backdrop-filter:blur(18px);display:grid;grid-template-columns:repeat(5,1fr)}body.dark .bottom{background:rgba(7,19,33,.96);border-color:rgba(255,255,255,.1)}.bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#758198;font-size:8px;font-weight:850}.bottom a.active{color:#d8b45c}.modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.58);align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.box{width:min(430px,100%);max-height:88vh;overflow:auto;padding:19px;border-radius:17px;background:#fff;color:#10233f}body.dark .box{background:#0e1e32;color:#f4f7fb}.mhead{display:flex;justify-content:space-between;align-items:center}.close{width:34px;height:34px;border:1px solid rgba(16,35,63,.1);border-radius:9px;background:#eef2f7}.toast{position:fixed;left:50%;bottom:78px;transform:translate(-50%,15px);opacity:0;z-index:200;padding:10px 13px;border-radius:10px;background:#071a34;color:#fff;font-size:10px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:800px){.layout{grid-template-columns:1fr}.page{width:calc(100% - 12px)}.details{padding:15px}}
</style>
<script src="./mec-theme.js"></script>
</head>
<body>
<header class="top"><div class="topin"><a class="brand" href="./post.html"><img src="https://lh3.googleusercontent.com/d/1fR8TnvOjrzVbKuro9Ths1_Jt0PAxSmGd" alt="MEC"><span>Myanmar Elite <b>Connect</b></span></a><button id="theme" class="theme">☾</button></div></header>
<main class="page"><a href="./post.html" style="display:inline-block;margin-bottom:12px;color:#758198;font-size:10px;font-weight:850">← Back to Posts</a><div id="loading" class="card" style="padding:50px;text-align:center;color:#758198">Loading post...</div><div id="error" class="card" style="display:none;padding:45px;text-align:center"><b>Post could not be loaded.</b><p id="errorText"></p></div><div id="content" style="display:none" class="layout"><div><section class="card"><div class="main"><img id="mainImage" alt="Post photo"><button id="prev" class="ar prev">‹</button><button id="next" class="ar next">›</button><span id="count" class="count"></span></div><div id="thumbs" class="thumbs"></div></section><section class="card info"><h3 style="font-size:13px">Post information</h3><div id="infoGrid" class="grid"></div></section></div><div><section class="card details"><div id="category" class="eyebrow"></div><h1 id="title" class="title"></h1><div id="price" class="price"></div><div id="meta" class="meta"></div><div class="desc"><h3>Description</h3><p id="description"></p></div><div class="actions"><a id="profileBtn" class="btn" href="#">♙ View Profile</a><button id="contactBtn" class="btn">☎ Contact</button><a id="chatBtn" class="btn primary" href="#">✉ Chat with Owner</a><button id="shareBtn" class="btn">↗ Share</button></div></section><section class="card seller"><h3>Post Owner</h3><div class="seller-head" style="margin-top:12px"><img id="avatar" class="avatar"><div><div id="sellerName" class="seller-name"></div><div id="username" class="username"></div><div id="sellerLocation" class="seller-location"></div></div></div><div class="seller-actions"><a id="profileBtn2" class="primary" href="#">View Profile</a><a id="chatBtn2" href="#">Start Chat</a></div></section></div></div></main>
<nav class="bottom"><a href="./general.html"><span>⌂</span>Home</a><a href="./post.html" class="active"><span>◈</span>Posts</a><a href="./add-listing.html"><span>＋</span>Sell</a><a href="./chat.html"><span>◌</span>Chat</a><a href="./profile.html"><span>♙</span>Profile</a></nav>
<div id="contactModal" class="modal"><div class="box"><div class="mhead"><b>Contact Post Owner</b><button id="close" class="close">×</button></div><div id="contacts" class="contact-grid"></div></div></div><div id="toast" class="toast"></div>
<script>
const db=supabaseClient;const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let post=null,owner=null,imgs=[],idx=0;
function applyTheme(t){document.body.classList.toggle('dark',t==='dark');document.getElementById('theme').textContent=t==='dark'?'☀':'☾';localStorage.setItem('mec_theme',t)}document.getElementById('theme').onclick=()=>applyTheme(document.body.classList.contains('dark')?'light':'dark');applyTheme(localStorage.getItem('mec_theme')||'light');
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}function price(){const n=Number(post.price);return Number.isFinite(n)&&n>0?`${esc(post.currency||'MMK')} ${n.toLocaleString()}`:'Price on request'}function loc(){return [post.city,post.township,post.address].filter(Boolean).join(' · ')||'Myanmar'}
function showImage(){if(!imgs.length)return;document.getElementById('mainImage').src=imgs[idx];document.getElementById('count').textContent=`${idx+1} / ${imgs.length}`;document.querySelectorAll('.thumb').forEach((x,i)=>x.classList.toggle('active',i===idx));document.getElementById('prev').disabled=idx===0;document.getElementById('next').disabled=idx===imgs.length-1}
function contactHTML(){const p=owner||{};const items=[];if(p.phone||p.phone_number)items.push(`<div class="contact"><small>Phone</small><b>${esc(p.phone||p.phone_number)}</b></div>`);if(p.email)items.push(`<div class="contact"><small>Email</small><b>${esc(p.email)}</b></div>`);if(p.address)items.push(`<div class="contact"><small>Address</small><b>${esc(p.address)}</b></div>`);return items.length?items.join(''):'<div class="contact"><small>Contact</small><b>The owner has not provided public contact details.</b></div>'}
async function load(){const id=new URLSearchParams(location.search).get('id');if(!id)throw new Error('Missing post id.');let r=await db.from('listings').select('*').eq('id',id).maybeSingle();if(r.error)throw r.error;if(!r.data)throw new Error('Post not found.');post=r.data;const pr=await db.from('profiles').select('*').eq('id',post.user_id).maybeSingle();owner=pr.data||{};const ir=await db.from('listing_images').select('image_url,sort_order').eq('listing_id',id).order('sort_order',{ascending:true});imgs=ir.data?.map(x=>x.image_url).filter(Boolean)||[];if(!imgs.length&&Array.isArray(post.images))imgs=post.images.filter(Boolean);document.getElementById('category').textContent=post.category||'Listing';document.getElementById('title').textContent=post.title||'Untitled listing';document.getElementById('price').innerHTML=price();document.getElementById('description').textContent=post.description||'No description provided.';document.getElementById('meta').innerHTML=`<span class="pill">⌖ ${esc(loc())}</span><span class="pill">${esc(post.listing_type||'Listing')}</span>${post.status?`<span class="pill">${esc(post.status)}</span>`:''}`;document.getElementById('sellerName').textContent=owner.full_name||'Member';document.getElementById('username').textContent=owner.username?`@${owner.username}`:'Member account';document.getElementById('sellerLocation').textContent=owner.region_name||owner.city||loc();document.getElementById('avatar').src=owner.avatar_url||'https://ui-avatars.com/api/?name='+encodeURIComponent(owner.username||owner.full_name||'User');const profile=`./profile.html?id=${encodeURIComponent(post.user_id)}`,chat=`./start-chat.html?user=${encodeURIComponent(post.user_id)}`;['profileBtn','profileBtn2'].forEach(id=>document.getElementById(id).href=profile);['chatBtn','chatBtn2'].forEach(id=>document.getElementById(id).href=chat);document.getElementById('infoGrid').innerHTML=`<div class="item"><small>Owner username</small><b>${esc(owner.username?`@${owner.username}`:'Not set')}</b></div><div class="item"><small>Location</small><b>${esc(loc())}</b></div><div class="item"><small>Category</small><b>${esc(post.category||'Listing')}</b></div><div class="item"><small>Photos</small><b>${imgs.length}</b></div>`;document.getElementById('thumbs').innerHTML=imgs.map((u,i)=>`<button class="thumb ${i===0?'active':''}" data-i="${i}"><img src="${esc(u)}" alt="Detail photo ${i+1}"></button>`).join('');document.querySelectorAll('.thumb').forEach(b=>b.onclick=()=>{idx=Number(b.dataset.i);showImage()});showImage();document.getElementById('loading').style.display='none';document.getElementById('content').style.display='grid'}
document.getElementById('prev').onclick=()=>{if(idx>0){idx--;showImage()}};document.getElementById('next').onclick=()=>{if(idx<imgs.length-1){idx++;showImage()}};document.getElementById('contactBtn').onclick=()=>{document.getElementById('contacts').innerHTML=contactHTML();document.getElementById('contactModal').classList.add('show')};document.getElementById('close').onclick=()=>document.getElementById('contactModal').classList.remove('show');document.getElementById('contactModal').onclick=e=>{if(e.target.id==='contactModal')e.currentTarget.classList.remove('show')};document.getElementById('shareBtn').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);toast('Post link copied.')}catch{toast('Copy the page URL to share.')}};load().catch(e=>{document.getElementById('loading').style.display='none';document.getElementById('error').style.display='block';document.getElementById('errorText').textContent=e.message})
</script></body></html>

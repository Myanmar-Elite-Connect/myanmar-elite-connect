<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listing Details • Myanmar Elite Connect</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase.js"></script>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    :root{
      --bg:#f5f7fb;
      --card:#fff;
      --soft:#f4f6fa;
      --text:#10233f;
      --muted:#748197;
      --border:rgba(16,35,63,.10);
      --gold:#d8b45c;
      --gold2:#f2d98d;
      --green:#2d8a61;
      --red:#c94b4b;
      --shadow:0 18px 55px rgba(16,35,63,.08);
      --radius:18px;
    }

    body.dark{
      --bg:#071321;
      --card:#0e1e32;
      --soft:#10243c;
      --text:#f4f7fb;
      --muted:#92a0b3;
      --border:rgba(255,255,255,.09);
      --shadow:0 18px 55px rgba(0,0,0,.28);
    }

    body{
      min-height:100vh;
      color:var(--text);
      background:var(--bg);
      font-family:
        Inter,
        "Noto Sans Myanmar",
        "Myanmar Text",
        system-ui,
        sans-serif;
    }

    button,
    input,
    textarea,
    select{
      font:inherit;
    }

    button,
    a{
      -webkit-tap-highlight-color:transparent;
    }

    button{
      cursor:pointer;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    img{
      display:block;
      max-width:100%;
    }

    /* HEADER */

    .topbar{
      position:sticky;
      top:0;
      z-index:100;
      height:70px;
      border-bottom:1px solid var(--border);
      background:rgba(255,255,255,.94);
      backdrop-filter:blur(18px);
    }

    body.dark .topbar{
      background:rgba(7,19,33,.95);
    }

    .topbar-inner{
      width:min(1200px,94%);
      height:100%;
      margin:auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .brand img{
      width:40px;
      height:40px;
      border-radius:11px;
      object-fit:contain;
      background:var(--card);
    }

    .brand-name{
      font-size:14px;
      font-weight:950;
      white-space:nowrap;
    }

    .brand-name span{
      color:var(--gold);
    }

    .nav{
      display:flex;
      align-items:center;
      gap:3px;
    }

    .nav a{
      padding:9px 12px;
      border-radius:10px;
      color:var(--muted);
      font-size:12px;
      font-weight:850;
    }

    .nav a:hover{
      background:var(--soft);
      color:var(--gold);
    }

    .header-actions{
      display:flex;
      align-items:center;
      gap:7px;
    }

    .icon-btn{
      width:40px;
      height:40px;
      display:grid;
      place-items:center;
      border:1px solid var(--border);
      border-radius:12px;
      color:var(--text);
      background:var(--card);
      text-decoration:none;
    }

    /* MAIN */

    .container{
      width:min(1100px,94%);
      margin:auto;
      padding:25px 0 100px;
    }

    .back{
      display:inline-flex;
      align-items:center;
      gap:7px;
      margin-bottom:16px;
      color:var(--muted);
      font-size:11px;
      font-weight:850;
    }

    .back:hover{
      color:var(--gold);
    }

    .layout{
      display:grid;
      grid-template-columns:minmax(0,1.1fr) minmax(330px,.9fr);
      gap:20px;
      align-items:start;
    }

    .card{
      border:1px solid var(--border);
      border-radius:var(--radius);
      background:var(--card);
      box-shadow:var(--shadow);
    }

    /* GALLERY */

    .gallery{
      overflow:hidden;
    }

    .main-image-wrap{
      position:relative;
      width:100%;
      aspect-ratio:4/3;
      background:var(--soft);
      overflow:hidden;
    }

    .main-image{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .image-count{
      position:absolute;
      right:12px;
      bottom:12px;
      padding:7px 10px;
      border-radius:999px;
      color:#fff;
      background:rgba(0,0,0,.58);
      font-size:9px;
      font-weight:900;
    }

    .gallery-arrow{
      position:absolute;
      top:50%;
      width:38px;
      height:38px;
      display:grid;
      place-items:center;
      border:0;
      border-radius:50%;
      color:#fff;
      background:rgba(0,0,0,.48);
      transform:translateY(-50%);
      font-size:20px;
      z-index:2;
    }

    .gallery-arrow.prev{
      left:12px;
    }

    .gallery-arrow.next{
      right:12px;
    }

    .gallery-arrow:disabled{
      opacity:.35;
    }

    .thumbs{
      display:flex;
      gap:8px;
      padding:10px;
      overflow-x:auto;
      scrollbar-width:none;
    }

    .thumbs::-webkit-scrollbar{
      display:none;
    }

    .thumb{
      flex:0 0 74px;
      height:58px;
      overflow:hidden;
      border:2px solid transparent;
      border-radius:9px;
      background:var(--soft);
      padding:0;
    }

    .thumb.active{
      border-color:var(--gold);
    }

    .thumb img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    /* DETAILS */

    .details{
      padding:22px;
    }

    .category{
      color:var(--gold);
      font-size:9px;
      font-weight:950;
      letter-spacing:1.2px;
      text-transform:uppercase;
    }

    .title{
      margin-top:7px;
      font-size:clamp(24px,4vw,34px);
      line-height:1.18;
      font-weight:950;
      letter-spacing:-.7px;
    }

    .price{
      margin-top:13px;
      font-size:23px;
      font-weight:950;
    }

    .meta{
      display:flex;
      flex-wrap:wrap;
      gap:7px;
      margin-top:12px;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:5px;
      padding:6px 9px;
      border-radius:999px;
      color:var(--muted);
      background:var(--soft);
      font-size:9px;
      font-weight:800;
    }

    .status{
      color:#fff;
      background:var(--green);
    }

    .description{
      margin-top:20px;
      padding-top:18px;
      border-top:1px solid var(--border);
    }

    .section-title{
      font-size:13px;
      font-weight:950;
    }

    .description-text{
      margin-top:9px;
      color:var(--muted);
      font-size:11px;
      line-height:1.8;
      white-space:pre-wrap;
      word-break:break-word;
    }

    /* ACTIONS */

    .actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:20px;
    }

    .action{
      min-height:44px;
      border:1px solid var(--border);
      border-radius:11px;
      color:var(--text);
      background:var(--soft);
      font-size:10px;
      font-weight:900;
    }

    .action.primary{
      border:0;
      color:#071a34;
      background:linear-gradient(135deg,var(--gold2),var(--gold));
    }

    .action.favorite.active{
      color:var(--red);
      border-color:rgba(201,75,75,.25);
      background:rgba(201,75,75,.08);
    }

    .action.report{
      color:var(--red);
    }

    /* SELLER */

    .seller-card{
      margin-top:15px;
      padding:17px;
    }

    .seller-head{
      display:flex;
      align-items:center;
      gap:11px;
    }

    .seller-avatar{
      width:54px;
      height:54px;
      overflow:hidden;
      flex:none;
      border:2px solid var(--gold);
      border-radius:50%;
      background:var(--soft);
    }

    .seller-avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .seller-name{
      display:flex;
      align-items:center;
      flex-wrap:wrap;
      gap:6px;
      font-size:13px;
      font-weight:950;
    }

    .verified{
      display:inline-flex;
      align-items:center;
      gap:3px;
      padding:4px 7px;
      border-radius:999px;
      color:#fff;
      background:var(--green);
      font-size:7px;
      font-weight:950;
    }

    .seller-location{
      margin-top:4px;
      color:var(--muted);
      font-size:9px;
    }

    .seller-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:7px;
      margin-top:12px;
    }

    .seller-actions a{
      min-height:38px;
      display:grid;
      place-items:center;
      border:1px solid var(--border);
      border-radius:9px;
      background:var(--soft);
      font-size:9px;
      font-weight:900;
    }

    .seller-actions a.primary{
      color:#071a34;
      border:0;
      background:var(--gold);
    }

    /* INFO */

    .info-card{
      margin-top:15px;
      padding:18px;
    }

    .info-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:13px;
    }

    .info-item{
      padding:11px;
      border-radius:10px;
      background:var(--soft);
    }

    .info-label{
      color:var(--muted);
      font-size:8px;
      font-weight:800;
    }

    .info-value{
      margin-top:4px;
      font-size:10px;
      font-weight:900;
      word-break:break-word;
    }

    /* LOADING */

    .loading{
      min-height:400px;
      display:grid;
      place-items:center;
      color:var(--muted);
      font-size:11px;
    }

    .error{
      padding:35px;
      text-align:center;
    }

    .error-icon{
      font-size:35px;
      color:var(--red);
    }

    .error strong{
      display:block;
      margin-top:10px;
      font-size:14px;
    }

    .error p{
      margin-top:6px;
      color:var(--muted);
      font-size:10px;
      line-height:1.6;
    }

    /* MODAL */

    .modal{
      position:fixed;
      inset:0;
      z-index:500;
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
      background:rgba(0,0,0,.58);
    }

    .modal.show{
      display:flex;
    }

    .modal-box{
      width:min(480px,100%);
      max-height:90vh;
      overflow:auto;
      padding:20px;
      border:1px solid var(--border);
      border-radius:18px;
      background:var(--card);
      box-shadow:0 25px 80px rgba(0,0,0,.25);
    }

    .modal-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }

    .modal-title{
      font-size:16px;
      font-weight:950;
    }

    .close{
      width:35px;
      height:35px;
      border:1px solid var(--border);
      border-radius:9px;
      color:var(--text);
      background:var(--soft);
    }

    .form-group{
      margin-top:14px;
    }

    label{
      display:block;
      margin-bottom:6px;
      color:var(--muted);
      font-size:9px;
      font-weight:900;
    }

    select,
    textarea{
      width:100%;
      border:1px solid var(--border);
      border-radius:10px;
      outline:none;
      color:var(--text);
      background:var(--soft);
    }

    select{
      height:42px;
      padding:0 10px;
    }

    textarea{
      min-height:110px;
      padding:10px;
      resize:vertical;
    }

    .submit-report{
      width:100%;
      min-height:43px;
      margin-top:14px;
      border:0;
      border-radius:10px;
      color:#071a34;
      background:linear-gradient(135deg,var(--gold2),var(--gold));
      font-size:10px;
      font-weight:950;
    }

    /* TOAST */

    .toast{
      position:fixed;
      right:16px;
      bottom:16px;
      z-index:900;
      max-width:340px;
      padding:12px 15px;
      border:1px solid var(--border);
      border-radius:11px;
      color:var(--text);
      background:var(--card);
      box-shadow:var(--shadow);
      font-size:10px;
      font-weight:800;
      opacity:0;
      transform:translateY(15px);
      pointer-events:none;
      transition:.2s ease;
    }

    .toast.show{
      opacity:1;
      transform:translateY(0);
    }

    /* MOBILE */

    .mobile-nav{
      display:none;
    }

    @media(max-width:900px){
      .nav{
        display:none;
      }

      .layout{
        grid-template-columns:1fr;
      }

      .mobile-nav{
        position:fixed;
        display:block;
        left:0;
        right:0;
        bottom:0;
        z-index:200;
        height:65px;
        border-top:1px solid var(--border);
        background:rgba(255,255,255,.95);
        backdrop-filter:blur(18px);
      }

      body.dark .mobile-nav{
        background:rgba(7,19,33,.96);
      }

      .mobile-nav-inner{
        height:100%;
        display:grid;
        grid-template-columns:repeat(5,1fr);
      }

      .mobile-nav a{
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:3px;
        color:var(--muted);
        font-size:8px;
        font-weight:850;
      }

      .mobile-nav a.active{
        color:var(--gold);
      }

      .mobile-icon{
        font-size:17px;
      }

      .container{
        padding-bottom:90px;
      }
    }

    @media(max-width:520px){
      .brand-name{
        display:none;
      }

      .container{
        width:calc(100% - 24px);
      }

      .details{
        padding:16px;
      }

      .actions{
        grid-template-columns:1fr;
      }

      .info-grid{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<div id="toast" class="toast"></div>

<script>
  /* =====================================================
     CONFIG
  ===================================================== */

  const params =
    new URLSearchParams(
      window.location.search
    );

  const listingId =
    params.get("id");

  const LISTING_IMAGES_BUCKET =
    "listing-images";

  let currentUser = null;
  let listing = null;
  let seller = null;
  let images = [];
  let currentImage = 0;
  let favorite = false;


  /* =====================================================
     HELPERS
  ===================================================== */

  function escapeHTML(value){
    return String(value ?? "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");
  }

  function normalize(value){
    return String(value || "")
      .trim()
      .toLowerCase();
  }

  function toast(
    message,
    type="success"
  ){
    const el =
      document.getElementById("toast");

    el.textContent =
      message;

    el.className =
      `toast show ${type}`;

    clearTimeout(
      window.__toastTimer
    );

    window.__toastTimer =
      setTimeout(
        () => {
          el.className =
            "toast";
        },
        3000
      );
  }

  function formatPrice(item){

    const price =
      Number(item.price);

    if(
      !Number.isFinite(price) ||
      price <= 0
    ){
      return "Price on request";
    }

    return `${escapeHTML(
      item.currency || "MMK"
    )} ${price.toLocaleString()}`;
  }

  function formatLocation(item){

    const values = [
      item.city,
      item.township,
      item.address
    ]
      .map(
        value =>
          String(value || "").trim()
      )
      .filter(Boolean);

    const unique = [];

    values.forEach(value => {

      if(
        !unique.some(
          x =>
            normalize(x) ===
            normalize(value)
        )
      ){
        unique.push(value);
      }

    });

    return unique.length
      ? unique.join(" · ")
      : "Myanmar";
  }

  function formatDate(value){

    if(!value){
      return "—";
    }

    const date =
      new Date(value);

    if(
      Number.isNaN(
        date.getTime()
      )
    ){
      return "—";
    }

    return date.toLocaleDateString(
      "en-GB",
      {
        day:"2-digit",
        month:"short",
        year:"numeric"
      }
    );
  }

  function getPublicUrl(
    path
  ){

    if(!path){
      return "";
    }

    if(
      /^https?:\/\//i.test(path)
    ){
      return path;
    }

    const {
      data
    } =
      supabaseClient.storage
        .from(
          LISTING_IMAGES_BUCKET
        )
        .getPublicUrl(path);

    return data?.publicUrl || "";
  }


  /* =====================================================
     THEME
  ===================================================== */

  function applyTheme(theme){

    document.body.classList.toggle(
      "dark",
      theme === "dark"
    );

    document.getElementById(
      "themeButton"
    ).textContent =
      theme === "dark"
        ? "☀"
        : "☾";

    localStorage.setItem(
      "mec_theme",
      theme
    );
  }

  document.getElementById(
    "themeButton"
  ).addEventListener(
    "click",
    () => {

      const dark =
        document.body.classList.contains(
          "dark"
        );

      applyTheme(
        dark
          ? "light"
          : "dark"
      );

    }
  );


  /* =====================================================
     AUTH
  ===================================================== */

  async function getUser(){

    const {
      data,
      error
    } =
      await supabaseClient.auth.getUser();

    if(error){
      throw error;
    }

    return data?.user || null;
  }


  /* =====================================================
     LOAD LISTING
  ===================================================== */

  async function loadListing(){

    if(!listingId){

      showError(
        "Listing ID is missing.",
        "Please open the post from a listing page."
      );

      return;
    }

    const {
      data,
      error
    } =
      await supabaseClient
        .from("listings")
        .select(`
          id,
          user_id,
          category,
          listing_type,
          title,
          description,
          price,
          currency,
          city,
          township,
          address,
          status,
          featured,
          created_at,
          updated_at,
          location,
          phone,
          images,
          seller_id,
          post_role
        `)
        .eq(
          "id",
          listingId
        )
        .maybeSingle();

    if(error){
      throw error;
    }

    if(!data){

      showError(
        "Listing not found.",
        "This post may have been deleted or is no longer available."
      );

      return;
    }

    listing =
      data;

    /*
     * Public detail page only shows approved posts.
     * Owner can still open their own post while testing
     * or managing it.
     */
    const status =
      normalize(
        listing.status
      );

    if(
      status !== "approved" &&
      listing.user_id !== currentUser?.id
    ){

      showError(
        "This listing is not available.",
        "The post has not been approved or is no longer public."
      );

      return;
    }

    await Promise.all([
      loadSeller(),
      loadImages(),
      checkFavorite()
    ]);

    renderListing();
  }


  /* =====================================================
     LOAD SELLER
  ===================================================== */

  async function loadSeller(){

    const sellerId =
      listing.seller_id ||
      listing.user_id;

    if(!sellerId){
      return;
    }

    const {
      data,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select(`
          id,
          full_name,
          phone,
          avatar_url,
          city,
          bio,
          role,
          created_at
        `)
        .eq(
          "id",
          sellerId
        )
        .maybeSingle();

    if(error){
      console.warn(
        "Seller profile error:",
        error
      );

      return;
    }

    seller =
      data || null;
  }


  /* =====================================================
     LOAD IMAGES
  ===================================================== */

  async function loadImages(){

    images = [];

    /*
     * First use listing_images table.
     */

    const {
      data:rows,
      error
    } =
      await supabaseClient
        .from("listing_images")
        .select(`
          id,
          listing_id,
          image_url,
          sort_order,
          created_at
        `)
        .eq(
          "listing_id",
          listing.id
        )
        .order(
          "sort_order",
          {
            ascending:true
          }
        );

    if(!error && Array.isArray(rows)){

      images =
        rows
          .map(
            row =>
              getPublicUrl(
                row.image_url
              )
          )
          .filter(Boolean);

    }

    /*
     * Backward compatibility:
     * old listings may still have images[]
     */

    if(!images.length){

      if(
        Array.isArray(
          listing.images
        )
      ){

        images =
          listing.images
            .map(
              value =>
                getPublicUrl(value)
            )
            .filter(Boolean);

      }

    }

    /*
     * If no image exists,
     * use a generated soft placeholder.
     */

    if(!images.length){

      images = [""];
    }
  }


  /* =====================================================
     FAVORITES
  ===================================================== */

  async function checkFavorite(){

    if(
      !currentUser ||
      !listing?.id
    ){
      favorite = false;
      return;
    }

    const {
      data,
      error
    } =
      await supabaseClient
        .from("favorites")
        .select("id")
        .eq(
          "user_id",
          currentUser.id
        )
        .eq(
          "listing_id",
          listing.id
        )
        .maybeSingle();

    if(error){
      console.warn(
        "Favorite check:",
        error
      );

      return;
    }

    favorite =
      !!data;
  }

  async function toggleFavorite(){

    if(!currentUser){

      window.location.href =
        `./auth.html?redirect=${encodeURIComponent(
          window.location.href
        )}`;

      return;
    }

    const button =
      document.getElementById(
        "favoriteButton"
      );

    button.disabled =
      true;

    try{

      if(favorite){

        const {
          error
        } =
          await supabaseClient
            .from("favorites")
            .delete()
            .eq(
              "user_id",
              currentUser.id
            )
            .eq(
              "listing_id",
              listing.id
            );

        if(error){
          throw error;
        }

        favorite =
          false;

        toast(
          "Removed from favorites."
        );

      }
      else{

        const {
          error
        } =
          await supabaseClient
            .from("favorites")
            .insert({
              user_id:
                currentUser.id,
              listing_id:
                listing.id
            });

        if(error){
          throw error;
        }

        favorite =
          true;

        toast(
          "Added to favorites."
        );
      }

      updateFavoriteButton();

    }
    catch(error){

      console.error(error);

      toast(
        error.message ||
        "Could not update favorite.",
        "error"
      );

    }
    finally{

      button.disabled =
        false;

    }
  }

  function updateFavoriteButton(){

    const button =
      document.getElementById(
        "favoriteButton"
      );

    if(!button){
      return;
    }

    button.classList.toggle(
      "active",
      favorite
    );

    button.textContent =
      favorite
        ? "♥ Saved"
        : "♡ Save";
  }


  /* =====================================================
     RENDER
  ===================================================== */

  function renderListing(){

    const page =
      document.getElementById(
        "page"
      );

    const cover =
      images[currentImage] ||
      "";

    const category =
      normalize(
        listing.category
      ).toUpperCase();

    const sellerName =
      seller?.full_name ||
      "Myanmar Elite Connect Member";

    const sellerAvatar =
      seller?.avatar_url ||
      "";

    const isVerified =
      false;

    page.innerHTML = `

      <div class="layout">

        <section>

          <div class="card gallery">

            <div class="main-image-wrap">

              ${
                cover
                  ? `
                    <img
                      id="mainImage"
                      class="main-image"
                      src="${escapeHTML(cover)}"
                      alt="${escapeHTML(
                        listing.title || "Listing"
                      )}">
                  `
                  : `
                    <div
                      style="
                        width:100%;
                        height:100%;
                        display:grid;
                        place-items:center;
                        color:var(--muted);
                        font-size:12px;
                      ">
                      No image available
                    </div>
                  `
              }

              ${
                images.length > 1
                  ? `
                    <button
                      class="gallery-arrow prev"
                      id="prevImage"
                      type="button">
                      ‹
                    </button>

                    <button
                      class="gallery-arrow next"
                      id="nextImage"
                      type="button">
                      ›
                    </button>
                  `
                  : ""
              }

              <div class="image-count">
                ${
                  images[0]
                    ? `${currentImage + 1} / ${images.length}`
                    : "No photo"
                }
              </div>

            </div>

            ${
              images.length > 1
                ? `
                  <div
                    id="thumbs"
                    class="thumbs">

                    ${images.map(
                      (image,index) => `
                        <button
                          class="thumb ${
                            index === currentImage
                              ? "active"
                              : ""
                          }"
                          data-index="${index}"
                          type="button">

                          ${
                            image
                              ? `
                                <img
                                  src="${escapeHTML(image)}"
                                  alt="Photo ${index + 1}">
                              `
                              : ""
                          }

                        </button>
                      `
                    ).join("")}

                  </div>
                `
                : ""
            }

          </div>

          <section class="card info-card">

            <div class="section-title">
              Listing Information
            </div>

            <div class="info-grid">

              <div class="info-item">
                <div class="info-label">
                  Category
                </div>
                <div class="info-value">
                  ${escapeHTML(
                    listing.category || "—"
                  )}
                </div>
              </div>

              <div class="info-item">
                <div class="info-label">
                  Listing Type
                </div>
                <div class="info-value">
                  ${escapeHTML(
                    listing.listing_type || "—"
                  )}
                </div>
              </div>

              <div class="info-item">
                <div class="info-label">
                  Location
                </div>
                <div class="info-value">
                  ${escapeHTML(
                    formatLocation(listing)
                  )}
                </div>
              </div>

              <div class="info-item">
                <div class="info-label">
                  Posted
                </div>
                <div class="info-value">
                  ${escapeHTML(
                    formatDate(
                      listing.created_at
                    )
                  )}
                </div>
              </div>

              ${
                listing.post_role
                  ? `
                    <div class="info-item">
                      <div class="info-label">
                        Post Role
                      </div>
                      <div class="info-value">
                        ${escapeHTML(
                          listing.post_role
                        )}
                      </div>
                    </div>
                  `
                  : ""
              }

              ${
                listing.featured
                  ? `
                    <div class="info-item">
                      <div class="info-label">
                        Status
                      </div>
                      <div class="info-value">
                        Featured Listing
                      </div>
                    </div>
                  `
                  : ""
              }

            </div>

          </section>

        </section>

        <section>

          <div class="card details">

            <div class="category">
              ${escapeHTML(category)}
            </div>

            <h1 class="title">
              ${escapeHTML(
                listing.title ||
                "Untitled Listing"
              )}
            </h1>

            <div class="price">
              ${formatPrice(listing)}
            </div>

            <div class="meta">

              ${
                listing.status
                  ? `
                    <span class="pill status">
                      ✓ ${escapeHTML(
                        listing.status
                      )}
                    </span>
                  `
                  : ""
              }

              <span class="pill">
                ⌖ ${escapeHTML(
                  formatLocation(listing)
                )}
              </span>

              ${
                listing.featured
                  ? `
                    <span class="pill">
                      ◆ Featured
                    </span>
                  `
                  : ""
              }

            </div>

            <div class="description">

              <div class="section-title">
                Description
              </div>

              <div class="description-text">
                ${escapeHTML(
                  listing.description ||
                  "No description provided."
                )}
              </div>

            </div>

            <div class="actions">

              <button
                id="favoriteButton"
                class="action favorite"
                type="button">
                ♡ Save
              </button>

              <button
                id="reportButton"
                class="action report"
                type="button">
                ⚑ Report
              </button>

              ${
                currentUser &&
                currentUser.id ===
                  listing.user_id
                  ? `
                    <a
                      class="action"
                      href="./add-listing.html?id=${encodeURIComponent(
                        listing.id
                      )}"
                      style="
                        display:grid;
                        place-items:center;
                      ">
                      Edit Listing
                    </a>
                  `
                  : ""
              }

            </div>

          </div>

          <div class="card seller-card">

            <div class="seller-head">

              <div class="seller-avatar">

                ${
                  sellerAvatar
                    ? `
                      <img
                        src="${escapeHTML(
                          sellerAvatar
                        )}"
                        alt="${escapeHTML(
                          sellerName
                        )}">
                    `
                    : ""
                }

              </div>

              <div>

                <div class="seller-name">

                  ${escapeHTML(
                    sellerName
                  )}

                  ${
                    isVerified
                      ? `
                        <span class="verified">
                          ✓ Verified
                        </span>
                      `
                      : ""
                  }

                </div>

                <div class="seller-location">
                  ${
                    seller?.city
                      ? `⌖ ${escapeHTML(
                          seller.city
                        )}`
                      : "Myanmar Elite Connect Member"
                  }
                </div>

              </div>

            </div>

            <div class="seller-actions">

              ${
                seller?.id
                  ? `
                    <a
                      class="primary"
                      href="./profile-view.html?id=${encodeURIComponent(
                        seller.id
                      )}">
                      View Profile
                    </a>
                  `
                  : ""
              }

              ${
                listing.phone ||
                seller?.phone
                  ? `
                    <a
                      href="tel:${encodeURIComponent(
                        listing.phone ||
                        seller.phone
                      )}">
                      ☎ Contact
                    </a>
                  `
                  : `
                    <a
                      href="./chat.html?user=${encodeURIComponent(
                        seller?.id ||
                        listing.user_id
                      )}">
                      💬 Chat Seller
                    </a>
                  `
              }

            </div>

            ${
              listing.phone ||
              seller?.phone
                ? `
                  <div
                    style="
                      margin-top:10px;
                      padding:10px;
                      border-radius:10px;
                      background:var(--soft);
                      color:var(--muted);
                      font-size:9px;
                    ">
                    ☎ ${escapeHTML(
                      listing.phone ||
                      seller.phone
                    )}
                  </div>
                `
                : ""
            }

          </div>

        </section>

      </div>
    `;

    updateFavoriteButton();

    bindGallery();

    document.getElementById(
      "favoriteButton"
    ).addEventListener(
      "click",
      toggleFavorite
    );

    document.getElementById(
      "reportButton"
    ).addEventListener(
      "click",
      openReport
    );
  }


  /* =====================================================
     GALLERY
  ===================================================== */

  function bindGallery(){

    const prev =
      document.getElementById(
        "prevImage"
      );

    const next =
      document.getElementById(
        "nextImage"
      );

    if(prev){

      prev.addEventListener(
        "click",
        () => {

          currentImage =
            (
              currentImage -
              1 +
              images.length
            ) %
            images.length;

          updateGallery();

        }
      );

    }

    if(next){

      next.addEventListener(
        "click",
        () => {

          currentImage =
            (
              currentImage +
              1
            ) %
            images.length;

          updateGallery();

        }
      );

    }

    document
      .querySelectorAll(
        ".thumb"
      )
      .forEach(
        thumb => {

          thumb.addEventListener(
            "click",
            () => {

              currentImage =
                Number(
                  thumb.dataset.index
                );

              updateGallery();

            }
          );

        }
      );
  }

  function updateGallery(){

    const main =
      document.getElementById(
        "mainImage"
      );

    if(main){

      main.src =
        images[currentImage] ||
        "";
    }

    document
      .querySelectorAll(
        ".thumb"
      )
      .forEach(
        (thumb,index) => {

          thumb.classList.toggle(
            "active",
            index === currentImage
          );

        }
      );

    const counter =
      document.querySelector(
        ".image-count"
      );

    if(counter){

      counter.textContent =
        images[0]
          ? `${currentImage + 1} / ${images.length}`
          : "No photo";

    }
  }


  /* =====================================================
     REPORT
  ===================================================== */

  function openReport(){

    if(!currentUser){

      window.location.href =
        `./auth.html?redirect=${encodeURIComponent(
          window.location.href
        )}`;

      return;
    }

    document
      .getElementById(
        "reportModal"
      )
      .classList.add("show");
  }

  function closeReport(){

    document
      .getElementById(
        "reportModal"
      )
      .classList.remove("show");
  }

  document.getElementById(
    "closeReport"
  ).addEventListener(
    "click",
    closeReport
  );

  document.getElementById(
    "reportModal"
  ).addEventListener(
    "click",
    event => {

      if(
        event.target.id ===
        "reportModal"
      ){
        closeReport();
      }

    }
  );

  document.getElementById(
    "reportForm"
  ).addEventListener(
    "submit",
    async function(event){

      event.preventDefault();

      if(!currentUser){
        return;
      }

      const reason =
        document.getElementById(
          "reportReason"
        ).value;

      const details =
        document.getElementById(
          "reportDetails"
        ).value.trim();

      if(!reason){

        toast(
          "Please select a reason.",
          "error"
        );

        return;
      }

      const button =
        document.getElementById(
          "submitReport"
        );

      button.disabled =
        true;

      button.textContent =
        "Sending...";

      try{

        const {
          error
        } =
          await supabaseClient
            .from("reports")
            .insert({
              user_id:
                currentUser.id,
              listing_id:
                listing.id,
              reason,
              details
            });

        if(error){
          throw error;
        }

        closeReport();

        document.getElementById(
          "reportForm"
        ).reset();

        toast(
          "Report sent to admin successfully."
        );

      }
      catch(error){

        console.error(error);

        toast(
          error.message ||
          "Could not send report.",
          "error"
        );

      }
      finally{

        button.disabled =
          false;

        button.textContent =
          "Send Report to Admin";

      }

    }
  );


  /* =====================================================
     ERROR
  ===================================================== */

  function showError(
    title,
    message
  ){

    document.getElementById(
      "page"
    ).innerHTML = `

      <div class="card error">

        <div class="error-icon">
          !
        </div>

        <strong>
          ${escapeHTML(title)}
        </strong>

        <p>
          ${escapeHTML(message)}
        </p>

        <a
          href="./buy.html"
          style="
            display:inline-grid;
            place-items:center;
            min-height:40px;
            margin-top:15px;
            padding:0 16px;
            border-radius:10px;
            color:#071a34;
            background:var(--gold);
            font-size:10px;
            font-weight:900;
          ">
          Back to Listings
        </a>

      </div>
    `;
  }


  /* =====================================================
     INIT
  ===================================================== */

  async function init(){

    applyTheme(
      localStorage.getItem(
        "mec_theme"
      ) || "light"
    );

    try{

      currentUser =
        await getUser();

      await loadListing();

    }
    catch(error){

      console.error(error);

      showError(
        "Something went wrong.",
        error.message ||
        "Could not load this listing."
      );

    }

  }

  init();
</script>

</body>
</html>

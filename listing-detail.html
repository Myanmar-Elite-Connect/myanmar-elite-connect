<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>Listing Details • Myanmar Elite Connect</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase.js"></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--soft:#eef2f7;--text:#10233f;--muted:#758198;--line:rgba(16,35,63,.1);--gold:#d8b45c;--gold2:#f3db91;--green:#2d8a61;--red:#c94b4b;--shadow:0 18px 55px rgba(16,35,63,.08)}
body.dark{--bg:#071321;--card:#0e1e32;--soft:#10243c;--text:#f4f7fb;--muted:#92a0b3;--line:rgba(255,255,255,.1);--shadow:0 18px 55px rgba(0,0,0,.28)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;padding-bottom:76px;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans Myanmar","Myanmar Text",system-ui,sans-serif}a{text-decoration:none;color:inherit}button{font:inherit;cursor:pointer}.hidden{display:none!important}
.top{position:sticky;top:0;z-index:40;height:62px;background:color-mix(in srgb,var(--card) 94%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}.topin{width:min(1050px,94%);height:100%;margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:950}.brand img{width:38px;height:38px;border-radius:10px;object-fit:contain;background:var(--card);border:1px solid var(--line)}.brand b{color:var(--gold)}.theme{width:38px;height:38px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--text)}
.page{width:min(1050px,94%);margin:15px auto}.back{display:inline-block;margin-bottom:12px;color:var(--muted);font-size:10px;font-weight:850}.layout{display:grid;grid-template-columns:1.12fr .88fr;gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}.gallery{background:var(--soft)}.main{position:relative;aspect-ratio:4/3}.main img{width:100%;height:100%;object-fit:cover}.arrow{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:22px}.prev{left:10px}.next{right:10px}.count{position:absolute;right:10px;bottom:10px;padding:6px 9px;border-radius:99px;background:rgba(0,0,0,.58);color:#fff;font-size:9px;font-weight:900}.thumbs{display:flex;gap:7px;padding:9px;overflow:auto}.thumb{width:70px;height:55px;flex:0 0 auto;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:var(--soft)}.thumb.active{border-color:var(--gold)}.thumb img{width:100%;height:100%;object-fit:cover}
.details{padding:20px}.eyebrow{color:var(--gold);font-size:9px;font-weight:950;text-transform:uppercase;letter-spacing:1px}.title{margin:6px 0 0;font-size:clamp(24px,4vw,35px);line-height:1.15}.price{margin-top:10px;font-size:22px;font-weight:950}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}.pill{padding:6px 9px;border-radius:99px;background:var(--soft);color:var(--muted);font-size:9px;font-weight:850}.description{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}.description h3,.seller h3,.info h3{margin:0;font-size:13px}.description p{margin:8px 0 0;color:var(--muted);font-size:11px;line-height:1.8;white-space:pre-wrap;word-break:break-word}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:17px}.btn{min-height:43px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--text);font-size:10px;font-weight:900}.btn.primary{border:0;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#071a34}
.seller,.info{margin-top:14px;padding:16px}.seller-head{display:flex;align-items:center;gap:10px;margin-top:12px}.avatar{width:56px;height:56px;border:2px solid var(--gold);border-radius:50%;object-fit:cover;background:var(--soft)}.seller-name{font-size:13px;font-weight:950}.username{margin-top:3px;color:var(--gold);font-size:10px;font-weight:850}.seller-location{margin-top:4px;color:var(--muted);font-size:9px}.seller-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.seller-actions button{min-height:39px;border:1px solid var(--line);border-radius:9px;background:var(--soft);color:var(--text);font-size:9px;font-weight:900}.seller-actions .primary{border:0;background:var(--gold);color:#071a34}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.item{padding:10px;border-radius:10px;background:var(--soft)}.item small{display:block;color:var(--muted);font-size:8px}.item b{display:block;margin-top:3px;font-size:10px;word-break:break-word}
.bottom{position:fixed;left:0;right:0;bottom:0;height:64px;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--card) 94%,transparent);border-top:1px solid var(--line);backdrop-filter:blur(18px)}.bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:8px;font-weight:850}.bottom a.active{color:var(--gold)}.bottom span{font-size:16px;line-height:1}
.modal{position:fixed;inset:0;z-index:500;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.58)}.modal.show{display:flex}.sheet{width:min(440px,100%);max-height:88vh;overflow:auto;padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:0 25px 80px rgba(0,0,0,.25)}.sheet-head{display:flex;align-items:center;justify-content:space-between}.sheet-title{font-size:14px;font-weight:950}.close{width:35px;height:35px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--text);font-size:20px}.contact-list{display:grid;gap:8px;margin-top:14px}.contact{padding:12px;border-radius:11px;background:var(--soft)}.contact-label{color:var(--muted);font-size:8px;font-weight:850}.contact-value{margin-top:4px;font-size:11px;font-weight:900;word-break:break-word}.contact-actions{display:flex;gap:7px;margin-top:9px}.contact-actions a{display:inline-grid;place-items:center;min-height:32px;padding:0 10px;border-radius:8px;background:var(--card);border:1px solid var(--line);font-size:9px;font-weight:900}.contact-actions .call{background:var(--green);color:#fff;border-color:var(--green)}.empty-contact{padding:18px;text-align:center;color:var(--muted);font-size:10px;line-height:1.6}.toast{position:fixed;left:50%;bottom:82px;z-index:800;transform:translate(-50%,15px);opacity:0;padding:10px 13px;border-radius:11px;background:var(--text);color:var(--bg);font-size:10px;font-weight:850;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:800px){.layout{grid-template-columns:1fr}.page{width:calc(100% - 12px)}.details{padding:15px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><a class="brand" href="./post.html"><img src="https://lh3.googleusercontent.com/d/1fR8TnvOjrzVbKuro9Ths1_Jt0PAxSmGd" alt="MEC"><span>Myanmar Elite <b>Connect</b></span></a><button id="themeBtn" class="theme" type="button" aria-label="Theme">☾</button></div></header>
<main class="page">
<a class="back" href="./post.html">← Back to Posts</a>
<div id="loading" class="card" style="padding:50px;text-align:center;color:var(--muted);font-size:11px">Loading post...</div>
<div id="error" class="card hidden" style="padding:45px;text-align:center"><div style="font-size:30px">😕</div><b>Post could not be loaded.</b><p id="errorText" style="color:var(--muted);font-size:10px"></p></div>
<div id="content" class="layout hidden">
<section>
<div class="card gallery"><div class="main"><img id="mainImage" alt="Post photo"><button id="prev" class="arrow prev" type="button">‹</button><button id="next" class="arrow next" type="button">›</button><span id="count" class="count"></span></div><div id="thumbs" class="thumbs"></div></div>
<div class="card info"><h3>Post information</h3><div id="infoGrid" class="grid"></div></div>
</section>
<section>
<div class="card details"><div id="category" class="eyebrow"></div><h1 id="title" class="title"></h1><div id="price" class="price"></div><div id="meta" class="meta"></div><div class="description"><h3>Description</h3><p id="description"></p></div><div class="actions"><button id="profileBtn" class="btn" type="button">♙ View Profile</button><button id="contactBtn" class="btn" type="button">☎ Contact</button><button id="chatBtn" class="btn primary" type="button">✉ Chat with Owner</button><button id="shareBtn" class="btn" type="button">↗ Share</button></div></div>
<div class="card seller"><h3>Post Owner</h3><div class="seller-head"><img id="avatar" class="avatar" alt="Owner photo"><div><div id="sellerName" class="seller-name"></div><div id="username" class="username"></div><div id="sellerLocation" class="seller-location"></div></div></div><div class="seller-actions"><button id="profileBtn2" class="primary" type="button">View Profile</button><button id="chatBtn2" type="button">Start Chat</button></div></div>
</section>
</div>
</main>
<nav class="bottom"><a href="./general.html"><span>⌂</span>Home</a><a href="./post.html" class="active"><span>◈</span>Posts</a><a href="./add-listing.html"><span>＋</span>Sell</a><a href="./chat.html"><span>◌</span>Chat</a><a href="./profile.html"><span>♙</span>Profile</a></nav>
<div id="contactModal" class="modal"><div class="sheet"><div class="sheet-head"><div class="sheet-title">Contact Post Owner</div><button id="closeContact" class="close" type="button">×</button></div><div id="contacts" class="contact-list"></div></div></div>
<div id="toast" class="toast"></div>
<script>
const db=window.supabaseClient;
let post=null,owner=null,images=[],index=0;
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function applyTheme(t){document.body.classList.toggle('dark',t==='dark');$('themeBtn').textContent=t==='dark'?'☀':'☾';localStorage.setItem('mec_theme',t)}
applyTheme(localStorage.getItem('mec_theme')||'light');$('themeBtn').onclick=()=>applyTheme(document.body.classList.contains('dark')?'light':'dark');
function toast(text){$('toast').textContent=text;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function locationText(){return [post?.city,post?.township,post?.address].filter(Boolean).join(' · ')||owner?.region_name||owner?.city||'Myanmar'}
function priceText(){const n=Number(post?.price);return Number.isFinite(n)&&n>0?`${esc(post.currency||'MMK')} ${n.toLocaleString()}`:'Price on request'}
function showImage(){if(!images.length)return;$('mainImage').src=images[index];$('count').textContent=`${index+1} / ${images.length}`;document.querySelectorAll('.thumb').forEach((x,i)=>x.classList.toggle('active',i===index));$('prev').disabled=index===0;$('next').disabled=index===images.length-1}
function profileUrl(){return `./profile.html?id=${encodeURIComponent(post.user_id)}`}
function chatUrl(){return `./start-chat.html?user=${encodeURIComponent(post.user_id)}`}
function openProfile(){if(!post?.user_id){toast('Post owner profile is unavailable.');return}location.href=profileUrl()}
function openChat(){if(!post?.user_id){toast('Post owner is unavailable.');return}location.href=chatUrl()}
function contactHtml(){const p=owner||{};const phone=p.phone||p.phone_number||p.mobile||p.contact_phone;const email=p.email||p.contact_email;const address=p.address||p.full_address;let html='';if(phone){const tel=encodeURIComponent(String(phone).replace(/[^+\d]/g,''));html+=`<div class="contact"><div class="contact-label">Phone</div><div class="contact-value">${esc(phone)}</div><div class="contact-actions"><a class="call" href="tel:${tel}">Call</a><a href="sms:${tel}">SMS</a></div></div>`}if(email)html+=`<div class="contact"><div class="contact-label">Email</div><div class="contact-value">${esc(email)}</div><div class="contact-actions"><a href="mailto:${esc(email)}">Send Email</a></div></div>`;if(address)html+=`<div class="contact"><div class="contact-label">Address</div><div class="contact-value">${esc(address)}</div></div>`;return html||'<div class="empty-contact">The post owner has not provided public contact details.<br><br>You can use <b>Chat with Owner</b> to contact them directly.</div>'}
async function load(){const id=new URLSearchParams(location.search).get('id');if(!id)throw new Error('Missing post id.');const r=await db.from('listings').select('*').eq('id',id).maybeSingle();if(r.error)throw r.error;if(!r.data)throw new Error('Post not found.');post=r.data;const pr=await db.from('profiles').select('*').eq('id',post.user_id).maybeSingle();if(pr.error)console.warn('Profile:',pr.error);owner=pr.data||{};let ir=await db.from('listing_images').select('image_url,sort_order').eq('listing_id',id).order('sort_order',{ascending:true});images=(ir.data||[]).map(x=>x.image_url).filter(Boolean);if(!images.length&&Array.isArray(post.images))images=post.images.filter(Boolean);if(!images.length&&post.show_photo_url)images=[post.show_photo_url];
$('category').textContent=post.category||'Listing';$('title').textContent=post.title||'Untitled listing';$('price').innerHTML=priceText();$('description').textContent=post.description||'No description provided.';$('meta').innerHTML=`<span class="pill">⌖ ${esc(locationText())}</span><span class="pill">${esc(post.listing_type||'Listing')}</span>${post.status?`<span class="pill">${esc(post.status)}</span>`:''}`;$('sellerName').textContent=owner.full_name||'Member';$('username').textContent=owner.username?`@${owner.username}`:'Member account';$('sellerLocation').textContent=owner.region_name||owner.city||locationText();$('avatar').src=owner.avatar_url||'https://ui-avatars.com/api/?name='+encodeURIComponent(owner.username||owner.full_name||'User');$('infoGrid').innerHTML=`<div class="item"><small>Username</small><b>${esc(owner.username?`@${owner.username}`:'Not set')}</b></div><div class="item"><small>Location</small><b>${esc(locationText())}</b></div><div class="item"><small>Category</small><b>${esc(post.category||'Listing')}</b></div><div class="item"><small>Photos</small><b>${images.length}</b></div>`;$('thumbs').innerHTML=images.map((u,i)=>`<button type="button" class="thumb ${i===0?'active':''}" data-index="${i}"><img src="${esc(u)}" alt="Detail photo ${i+1}"></button>`).join('');document.querySelectorAll('.thumb').forEach(b=>b.onclick=()=>{index=Number(b.dataset.index);showImage()});showImage();$('loading').classList.add('hidden');$('content').classList.remove('hidden')}
$('prev').onclick=()=>{if(index>0){index--;showImage()}};$('next').onclick=()=>{if(index<images.length-1){index++;showImage()}};$('profileBtn').onclick=openProfile;$('profileBtn2').onclick=openProfile;$('chatBtn').onclick=openChat;$('chatBtn2').onclick=openChat;$('contactBtn').onclick=()=>{$('contacts').innerHTML=contactHtml();$('contactModal').classList.add('show')};$('closeContact').onclick=()=>$('contactModal').classList.remove('show');$('contactModal').onclick=e=>{if(e.target===$('contactModal'))$('contactModal').classList.remove('show')};$('shareBtn').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);toast('Post link copied.')}catch{toast('Copy the page URL to share.')}};
load().catch(e=>{$('loading').classList.add('hidden');$('error').classList.remove('hidden');$('errorText').textContent=e.message||'Unable to load post.'});
</script>
</body>
</html>

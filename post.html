<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Posts • Myanmar Elite Connect</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--bg:#f5f7fb;--card:#fff;--soft:#eef2f7;--text:#10233f;--muted:#758198;--border:rgba(16,35,63,.1);--gold:#d8b45c;--gold2:#f3db91;--green:#2d8a61;--shadow:0 18px 50px rgba(16,35,63,.08)}body.dark{--bg:#071321;--card:#0e1e32;--soft:#10243c;--text:#f4f7fb;--muted:#91a0b4;--border:rgba(255,255,255,.09);--shadow:0 18px 50px rgba(0,0,0,.3)}body{min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans Myanmar","Myanmar Text",system-ui,sans-serif;padding-bottom:80px}button,input,select{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}.topbar{position:sticky;top:0;z-index:100;height:70px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(18px)}.topbar-inner{width:min(1200px,94%);height:100%;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:40px;height:40px;border-radius:11px;object-fit:contain;background:var(--card)}.brand-name{font-size:14px;font-weight:950}.brand-name span{color:var(--gold)}.nav{display:flex;gap:3px}.nav a{padding:9px 11px;border-radius:10px;color:var(--muted);font-size:11px;font-weight:850}.nav a:hover,.nav a.active{background:var(--soft);color:var(--gold)}.actions{display:flex;gap:7px}.icon-btn{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--border);border-radius:11px;background:var(--card);color:var(--text)}.container{width:min(1200px,94%);margin:auto;padding:28px 0}.heading .eyebrow{color:var(--gold);font-size:9px;font-weight:950;letter-spacing:1.5px}.heading h1{margin-top:5px;font-size:clamp(28px,5vw,42px)}.heading p{margin-top:7px;color:var(--muted);font-size:11px}.search-row{display:grid;grid-template-columns:1fr 170px 140px;gap:9px;margin-top:20px}.search-row input,.search-row select{height:44px;border:1px solid var(--border);border-radius:11px;background:var(--card);color:var(--text);padding:0 13px;outline:none}.categories{display:flex;gap:7px;overflow:auto;margin-top:12px}.category{flex:none;height:37px;padding:0 14px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--muted);font-size:9px;font-weight:900}.category.active{color:#071a34;background:linear-gradient(135deg,var(--gold2),var(--gold))}.result-bar{margin-top:22px;color:var(--muted);font-size:10px}.posts-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:11px}.card{overflow:hidden;border:1px solid var(--border);border-radius:17px;background:var(--card);box-shadow:var(--shadow);transition:.2s}.card:hover{transform:translateY(-2px)}.cover{position:relative;aspect-ratio:4/3;background:var(--soft);overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.placeholder{height:100%;display:grid;place-items:center;color:var(--gold);font-size:35px}.badge{position:absolute;top:10px;left:10px;padding:5px 8px;border-radius:999px;color:#071a34;background:var(--gold);font-size:8px;font-weight:950}.featured{position:absolute;right:10px;top:10px;padding:5px 8px;border-radius:999px;color:#fff;background:#071a34;font-size:8px;font-weight:950}.body{padding:13px}.category-label{color:var(--gold);font-size:8px;font-weight:950;text-transform:uppercase}.title{margin-top:5px;min-height:34px;font-size:13px;line-height:1.4;font-weight:950}.description{margin-top:6px;color:var(--muted);font-size:9px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.price{margin-top:7px;font-size:14px;font-weight:950}.location{margin-top:5px;color:var(--muted);font-size:9px}.seller{display:flex;align-items:center;gap:7px;margin-top:11px;padding-top:10px;border-top:1px solid var(--border)}.seller-avatar{width:29px;height:29px;border-radius:50%;object-fit:cover;background:var(--soft);border:1px solid var(--border)}.seller-name{font-size:9px;font-weight:900}.seller-username{margin-top:2px;color:var(--muted);font-size:8px}.verified{color:var(--green);font-size:8px;font-weight:950}.view{width:100%;height:38px;margin-top:11px;border:0;border-radius:9px;color:#071a34;background:linear-gradient(135deg,var(--gold2),var(--gold));font-size:9px;font-weight:950}.state{grid-column:1/-1;padding:60px 20px;text-align:center;color:var(--muted)}.state strong{display:block;margin-top:8px;color:var(--text);font-size:14px}.state span{display:block;margin-top:5px;font-size:9px}.mobile-nav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:200;height:67px;border-top:1px solid var(--border);background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(18px)}.mobile-nav-inner{height:100%;display:grid;grid-template-columns:repeat(5,1fr)}.mobile-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:8px;font-weight:850}.mobile-nav a.active{color:var(--gold)}.mobile-icon{font-size:17px}.toast{position:fixed;right:16px;bottom:85px;z-index:500;padding:12px 15px;border:1px solid var(--border);border-radius:11px;background:var(--card);color:var(--text);box-shadow:var(--shadow);font-size:10px;opacity:0;transform:translateY(15px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:1000px){.nav{display:none}.mobile-nav{display:block}.posts-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.search-row{grid-template-columns:1fr}.posts-grid{grid-template-columns:1fr 1fr;gap:9px}}@media(max-width:450px){.brand-name{display:none}.posts-grid{grid-template-columns:1fr}}
</style></head><body>
<header class="topbar"><div class="topbar-inner"><a href="./general.html" class="brand"><img src="https://lh3.googleusercontent.com/d/1fR8TnvOjrzVbKuro9Ths1_Jt0PAxSmGd" alt="Myanmar Elite Connect"><div class="brand-name">Myanmar <span>Elite</span> Connect</div></a><nav class="nav"><a href="./general.html">Home</a><a href="./post.html" class="active">Posts</a><a href="./buy.html">Buy</a><a href="./sell.html">Sell</a><a href="./car.html">Cars</a><a href="./property.html">Property</a><a href="./chat.html">Chat</a><a href="./profile.html">Profile</a></nav><div class="actions"><button id="themeButton" class="icon-btn" type="button">☾</button><a href="./profile.html" class="icon-btn">♙</a></div></div></header>
<main class="container"><section class="heading"><div class="eyebrow">MYANMAR ELITE CONNECT</div><h1>Explore Posts</h1><p>Discover approved Cars, Property and Gem listings from members.</p></section><div class="search-row"><input id="searchInput" type="search" placeholder="Search posts, sellers, username, location..."><select id="sortSelect"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="price-low">Price: Low to High</option><option value="price-high">Price: High to Low</option></select><select id="typeSelect"><option value="all">All Types</option><option value="sale">For Sale</option><option value="rent">For Rent</option><option value="wanted">Wanted</option></select></div><div class="categories"><button class="category active" data-category="all">All</button><button class="category" data-category="car">Cars</button><button class="category" data-category="property">Property</button><button class="category" data-category="gem">Gems</button></div><div class="result-bar"><span id="resultCount">Loading...</span></div><section id="postsGrid" class="posts-grid"><div class="state">Loading posts...</div></section></main>
<nav class="mobile-nav"><div class="mobile-nav-inner"><a href="./general.html"><div class="mobile-icon">⌂</div>Home</a><a href="./post.html" class="active"><div class="mobile-icon">◈</div>Posts</a><a href="./add-listing.html"><div class="mobile-icon">＋</div>Sell</a><a href="./chat.html"><div class="mobile-icon">◌</div>Chat</a><a href="./profile.html"><div class="mobile-icon">♙</div>Profile</a></div></nav><div id="toast" class="toast"></div>
<script>
const db=supabaseClient;let allPosts=[],category="all";const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const norm=v=>String(v||'').trim().toLowerCase();function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>e.classList.remove('show'),2400)}function applyTheme(t){document.body.classList.toggle('dark',t==='dark');document.getElementById('themeButton').textContent=t==='dark'?'☀':'☾';localStorage.setItem('mec_theme',t)}document.getElementById('themeButton').onclick=()=>applyTheme(document.body.classList.contains('dark')?'light':'dark');function price(p){const n=Number(p.price);return Number.isFinite(n)&&n>0?`${esc(p.currency||'MMK')} ${n.toLocaleString()}`:'Price on request'}function loc(p){return [p.city,p.township,p.address].filter(Boolean).join(' · ')||'Myanmar'}async function images(id,fallback){const r=await db.from('listing_images').select('image_url,sort_order').eq('listing_id',id).order('sort_order',{ascending:true});return r.data?.length?r.data.map(x=>x.image_url).filter(Boolean):(Array.isArray(fallback)?fallback:[])}async function loadPosts(){const grid=document.getElementById('postsGrid');const {data,error}=await db.from('listings').select('id,user_id,category,listing_type,title,description,price,currency,city,township,address,status,featured,created_at,images,post_role').eq('status','approved').in('category',['car','property','gem']).order('created_at',{ascending:false});if(error){grid.innerHTML=`<div class="state"><strong>Could not load posts</strong><span>${esc(error.message)}</span></div>`;return}allPosts=data||[];const ids=[...new Set(allPosts.map(x=>x.user_id).filter(Boolean))];let profiles=[];if(ids.length){const r=await db.from('profiles').select('*').in('id',ids);profiles=r.data||[]}const map=Object.fromEntries(profiles.map(x=>[x.id,x]));allPosts=allPosts.map(p=>({...p,sellerProfile:map[p.user_id]||null}));renderPosts()}function renderPosts(){const search=norm(document.getElementById('searchInput').value),type=norm(document.getElementById('typeSelect').value),sort=document.getElementById('sortSelect').value;let posts=allPosts.filter(p=>{const cm=category==='all'||norm(p.category)===category;const tm=type==='all'||norm(p.listing_type)===type;const s=p.sellerProfile||{};const hay=[p.title,p.description,p.city,p.township,p.address,s.username,s.full_name].map(norm).join(' ');return cm&&tm&&(!search||hay.includes(search))});posts.sort((a,b)=>sort==='oldest'?new Date(a.created_at)-new Date(b.created_at):sort==='price-low'?Number(a.price||0)-Number(b.price||0):sort==='price-high'?Number(b.price||0)-Number(a.price||0):new Date(b.created_at)-new Date(a.created_at));document.getElementById('resultCount').textContent=`${posts.length} post${posts.length===1?'':'s'} found`;const grid=document.getElementById('postsGrid');if(!posts.length){grid.innerHTML='<div class="state"><strong>No posts found</strong><span>Try another search or category.</span></div>';return}grid.innerHTML=posts.map(p=>{const s=p.sellerProfile||{},name=s.username?`@${s.username}`:(s.full_name||'Member'),avatar=s.avatar_url||'';return `<article class="card" data-id="${esc(p.id)}"><div class="cover"><div class="placeholder">◇</div>${p.featured?'<div class="featured">FEATURED</div>':''}<div class="badge">${esc(p.category||'POST').toUpperCase()}</div></div><div class="body"><div class="category-label">${esc(p.listing_type||'Listing')}</div><div class="title">${esc(p.title||'Untitled listing')}</div><div class="description">${esc(p.description||'')}</div><div class="price">${price(p)}</div><div class="location">⌖ ${esc(loc(p))}</div><div class="seller">${avatar?`<img class="seller-avatar" src="${esc(avatar)}" alt="">`:'<div class="seller-avatar"></div>'}<div><div class="seller-name">${esc(name)} ${p.post_role==='verified'?'<span class="verified">✓ Verified</span>':''}</div><div class="seller-username">${s.full_name&&s.username?esc(s.full_name):'Post owner'}</div></div></div><button class="view" type="button">View Details · Profile · Contact · Chat</button></div></article>`}).join('');posts.forEach(async p=>{const imgs=await images(p.id,p.images);const card=grid.querySelector(`[data-id="${CSS.escape(p.id)}"]`);if(card&&imgs.length){const c=card.querySelector('.cover');c.querySelector('.placeholder')?.remove();const img=document.createElement('img');img.src=imgs[0];img.alt=p.title||'Listing';img.loading='lazy';c.prepend(img)}});grid.querySelectorAll('.card').forEach(card=>card.onclick=()=>location.href=`./listing-detail-v2.html?id=${encodeURIComponent(card.dataset.id)}`)}document.querySelectorAll('.category').forEach(b=>b.onclick=()=>{document.querySelectorAll('.category').forEach(x=>x.classList.remove('active'));b.classList.add('active');category=b.dataset.category;renderPosts()});document.getElementById('searchInput').oninput=renderPosts;document.getElementById('sortSelect').onchange=renderPosts;document.getElementById('typeSelect').onchange=renderPosts;applyTheme(localStorage.getItem('mec_theme')||'light');loadPosts();
</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Posts • Myanmar Elite Connect</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f7fb;
  --card:#fff;
  --soft:#f1f4f8;
  --text:#10233f;
  --muted:#758198;
  --border:rgba(16,35,63,.1);
  --gold:#d8b45c;
  --gold2:#f3db91;
  --green:#2d8a61;
  --red:#c94b4b;
  --shadow:0 18px 50px rgba(16,35,63,.08);
}
body.dark{
  --bg:#071321;
  --card:#0e1e32;
  --soft:#10243c;
  --text:#f4f7fb;
  --muted:#91a0b4;
  --border:rgba(255,255,255,.09);
  --shadow:0 18px 50px rgba(0,0,0,.3);
}
body{
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,"Noto Sans Myanmar","Myanmar Text",system-ui,sans-serif;
}
button,input,select{font:inherit}
button,select{cursor:pointer}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}

/* HEADER */
.topbar{
  position:sticky;
  top:0;
  z-index:100;
  height:70px;
  border-bottom:1px solid var(--border);
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(18px);
}
body.dark .topbar{background:rgba(7,19,33,.95)}
.topbar-inner{
  width:min(1200px,94%);
  height:100%;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  flex:none;
}
.brand img{
  width:40px;height:40px;
  border-radius:11px;
  object-fit:contain;
  background:var(--card);
}
.brand-name{
  font-size:14px;
  font-weight:950;
}
.brand-name span{color:var(--gold)}
.nav{display:flex;gap:3px}
.nav a{
  padding:9px 11px;
  border-radius:10px;
  color:var(--muted);
  font-size:11px;
  font-weight:850;
}
.nav a:hover,.nav a.active{
  background:var(--soft);
  color:var(--gold);
}
.actions{display:flex;gap:7px}
.icon-btn{
  width:40px;height:40px;
  display:grid;
  place-items:center;
  border:1px solid var(--border);
  border-radius:11px;
  background:var(--card);
  color:var(--text);
}

/* MAIN */
.container{
  width:min(1200px,94%);
  margin:auto;
  padding:30px 0 100px;
}
.heading .eyebrow{
  color:var(--gold);
  font-size:9px;
  font-weight:950;
  letter-spacing:1.5px;
}
.heading h1{
  margin-top:5px;
  font-size:clamp(28px,5vw,42px);
  letter-spacing:-1.2px;
}
.heading p{
  margin-top:7px;
  color:var(--muted);
  font-size:11px;
}

/* SEARCH */
.search-row{
  display:grid;
  grid-template-columns:1fr 170px 140px;
  gap:9px;
  margin-top:20px;
}
.search-row input,
.search-row select{
  height:44px;
  border:1px solid var(--border);
  border-radius:11px;
  outline:none;
  color:var(--text);
  background:var(--card);
  padding:0 13px;
}
.search-row input:focus,
.search-row select:focus{
  border-color:rgba(216,180,92,.7);
}

/* CATEGORY */
.categories{
  display:flex;
  gap:7px;
  overflow-x:auto;
  margin-top:12px;
  padding-bottom:2px;
  scrollbar-width:none;
}
.categories::-webkit-scrollbar{display:none}
.category{
  flex:none;
  height:37px;
  padding:0 14px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--card);
  color:var(--muted);
  font-size:9px;
  font-weight:900;
}
.category.active{
  border-color:transparent;
  color:#071a34;
  background:linear-gradient(135deg,var(--gold2),var(--gold));
}

/* GRID */
.result-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:22px;
  color:var(--muted);
  font-size:10px;
}
.posts-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
  margin-top:11px;
}
.card{
  overflow:hidden;
  border:1px solid var(--border);
  border-radius:17px;
  background:var(--card);
  box-shadow:var(--shadow);
  transition:.2s ease;
}
.card:hover{
  transform:translateY(-3px);
}
.cover{
  position:relative;
  aspect-ratio:4/3;
  overflow:hidden;
  background:var(--soft);
}
.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.cover-placeholder{
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
  color:var(--gold);
  font-size:35px;
}
.badge{
  position:absolute;
  top:10px;
  left:10px;
  padding:5px 8px;
  border-radius:999px;
  color:#071a34;
  background:var(--gold);
  font-size:8px;
  font-weight:950;
}
.featured{
  position:absolute;
  right:10px;
  top:10px;
  padding:5px 8px;
  border-radius:999px;
  color:#fff;
  background:#071a34;
  font-size:8px;
  font-weight:950;
}
.card-body{padding:13px}
.category-label{
  color:var(--gold);
  font-size:8px;
  font-weight:950;
  text-transform:uppercase;
}
.title{
  margin-top:5px;
  min-height:34px;
  font-size:13px;
  line-height:1.4;
  font-weight:950;
}
.price{
  margin-top:7px;
  font-size:14px;
  font-weight:950;
}
.location{
  margin-top:5px;
  color:var(--muted);
  font-size:9px;
}
.seller{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:11px;
  padding-top:10px;
  border-top:1px solid var(--border);
}
.seller-avatar{
  width:27px;height:27px;
  border-radius:50%;
  object-fit:cover;
  background:var(--soft);
}
.seller-name{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:9px;
  font-weight:900;
}
.verified{
  color:var(--green);
  font-size:8px;
  font-weight:950;
}
.view{
  width:100%;
  height:36px;
  margin-top:11px;
  border:0;
  border-radius:9px;
  color:#071a34;
  background:linear-gradient(135deg,var(--gold2),var(--gold));
  font-size:9px;
  font-weight:950;
}

/* EMPTY / LOADING */
.state{
  grid-column:1/-1;
  padding:60px 20px;
  text-align:center;
  color:var(--muted);
}
.state strong{
  display:block;
  margin-top:8px;
  color:var(--text);
  font-size:14px;
}
.state span{
  display:block;
  margin-top:5px;
  font-size:9px;
}

/* MOBILE NAV */
.mobile-nav{
  display:none;
  position:fixed;
  left:0;right:0;bottom:0;
  z-index:200;
  height:67px;
  border-top:1px solid var(--border);
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(18px);
}
body.dark .mobile-nav{background:rgba(7,19,33,.97)}
.mobile-nav-inner{
  height:100%;
  display:grid;
  grid-template-columns:repeat(5,1fr);
}
.mobile-nav a{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  color:var(--muted);
  font-size:8px;
  font-weight:850;
}
.mobile-nav a.active{color:var(--gold)}
.mobile-icon{font-size:17px}

.toast{
  position:fixed;
  right:16px;
  bottom:18px;
  z-index:500;
  padding:12px 15px;
  border:1px solid var(--border);
  border-radius:11px;
  background:var(--card);
  color:var(--text);
  box-shadow:var(--shadow);
  font-size:10px;
  opacity:0;
  transform:translateY(15px);
  pointer-events:none;
  transition:.2s;
}
.toast.show{
  opacity:1;
  transform:none;
}

@media(max-width:1000px){
  .nav{display:none}
  .mobile-nav{display:block}
  .container{padding-bottom:90px}
  .posts-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:650px){
  .search-row{grid-template-columns:1fr}
  .posts-grid{grid-template-columns:1fr 1fr;gap:9px}
}
@media(max-width:450px){
  .brand-name{display:none}
  .posts-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">

    <a href="./general.html" class="brand">
      <img
        src="https://lh3.googleusercontent.com/d/1fR8TnvOjrzVbKuro9Ths1_Jt0PAxSmGd"
        alt="Myanmar Elite Connect">
      <div class="brand-name">
        Myanmar <span>Elite</span> Connect
      </div>
    </a>

    <nav class="nav">
      <a href="./general.html">Home</a>
      <a href="./posts.html" class="active">Posts</a>
      <a href="./buy.html">Buy</a>
      <a href="./sell.html">Sell</a>
      <a href="./car.html">Cars</a>
      <a href="./property.html">Property</a>
      <a href="./chat.html">Chat</a>
      <a href="./profile.html">Profile</a>
    </nav>

    <div class="actions">
      <button id="themeButton" class="icon-btn" type="button">☾</button>
      <a href="./profile.html" class="icon-btn">♙</a>
    </div>

  </div>
</header>

<main class="container">

  <section class="heading">
    <div class="eyebrow">MYANMAR ELITE CONNECT</div>
    <h1>Explore Posts</h1>
    <p>
      Discover approved Cars, Property and Gem listings from members.
    </p>
  </section>

  <div class="search-row">
    <input
      id="searchInput"
      type="search"
      placeholder="Search posts, sellers, location...">

    <select id="sortSelect">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
      <option value="price-low">Price: Low to High</option>
      <option value="price-high">Price: High to Low</option>
    </select>

    <select id="typeSelect">
      <option value="all">All Types</option>
      <option value="sale">For Sale</option>
      <option value="rent">For Rent</option>
      <option value="wanted">Wanted</option>
    </select>
  </div>

  <div class="categories">
    <button class="category active" data-category="all">All</button>
    <button class="category" data-category="car">Cars</button>
    <button class="category" data-category="property">Property</button>
    <button class="category" data-category="gem">Gems</button>
  </div>

  <div class="result-bar">
    <span id="resultCount">Loading...</span>
  </div>

  <section id="postsGrid" class="posts-grid">
    <div class="state">
      Loading posts...
    </div>
  </section>

</main>

<nav class="mobile-nav">
  <div class="mobile-nav-inner">
    <a href="./general.html">
      <div class="mobile-icon">⌂</div>
      Home
    </a>
    <a href="./posts.html" class="active">
      <div class="mobile-icon">◈</div>
      Posts
    </a>
    <a href="./add-listing.html">
      <div class="mobile-icon">＋</div>
      Sell
    </a>
    <a href="./chat.html">
      <div class="mobile-icon">◌</div>
      Chat
    </a>
    <a href="./profile.html">
      <div class="mobile-icon">♙</div>
      Profile
    </a>
  </div>
</nav>

<div id="toast" class="toast"></div>

<script>
const supabase = supabaseClient;

let allPosts = [];
let category = "all";

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function normalize(value){
  return String(value || "").trim().toLowerCase();
}

function toast(message){
  const el = document.getElementById("toast");
  el.textContent = message;
  el.className = "toast show";
  clearTimeout(window.__toast);
  window.__toast = setTimeout(()=>{
    el.className = "toast";
  },2500);
}

function applyTheme(theme){
  document.body.classList.toggle("dark",theme === "dark");
  document.getElementById("themeButton").textContent =
    theme === "dark" ? "☀" : "☾";
  localStorage.setItem("mec_theme",theme);
}

document.getElementById("themeButton").onclick = ()=>{
  applyTheme(
    document.body.classList.contains("dark")
      ? "light"
      : "dark"
  );
};

function price(item){
  const n = Number(item.price);
  if(!Number.isFinite(n) || n <= 0){
    return "Price on request";
  }
  return `${escapeHTML(item.currency || "MMK")} ${n.toLocaleString()}`;
}

function location(item){
  return [
    item.city,
    item.township,
    item.address
  ].filter(Boolean).join(" · ") || "Myanmar";
}

async function getImages(listingId, fallback){
  const {data} = await supabase
    .from("listing_images")
    .select("image_url,sort_order")
    .eq("listing_id",listingId)
    .order("sort_order",{ascending:true});

  if(data?.length){
    return data.map(x=>x.image_url).filter(Boolean);
  }

  return Array.isArray(fallback) ? fallback : [];
}

async function loadPosts(){

  const grid = document.getElementById("postsGrid");

  const {data,error} = await supabase
    .from("listings")
    .select(`
      id,
      user_id,
      category,
      listing_type,
      title,
      description,
      price,
      currency,
      city,
      township,
      address,
      status,
      featured,
      created_at,
      updated_at,
      images,
      seller_id,
      post_role
    `)
    .eq("status","approved")
    .in("category",["car","property","gem"])
    .order("created_at",{ascending:false});

  if(error){
    console.error(error);
    grid.innerHTML = `
      <div class="state">
        <strong>Could not load posts</strong>
        <span>${escapeHTML(error.message)}</span>
      </div>`;
    return;
  }

  allPosts = data || [];

  const userIds = [
    ...new Set(
      allPosts.map(x=>x.user_id).filter(Boolean)
    )
  ];

  let profiles = [];

  if(userIds.length){
    const result = await supabase
      .from("profiles")
      .select("id,full_name,avatar_url")
      .in("id",userIds);

    profiles = result.data || [];
  }

  const profileMap = Object.fromEntries(
    profiles.map(x=>[x.id,x])
  );

  allPosts = allPosts.map(post=>({
    ...post,
    sellerProfile:profileMap[post.user_id] || null
  }));

  renderPosts();
}

function renderPosts(){

  const search =
    normalize(document.getElementById("searchInput").value);

  const type =
    normalize(document.getElementById("typeSelect").value);

  const sort =
    document.getElementById("sortSelect").value;

  let posts = allPosts.filter(post=>{

    const categoryMatch =
      category === "all" ||
      normalize(post.category) === category;

    const typeMatch =
      type === "all" ||
      normalize(post.listing_type) === type;

    const haystack = [
      post.title,
      post.description,
      post.city,
      post.township,
      post.address,
      post.sellerProfile?.full_name
    ].map(normalize).join(" ");

    const searchMatch =
      !search || haystack.includes(search);

    return categoryMatch &&
           typeMatch &&
           searchMatch;
  });

  posts.sort((a,b)=>{

    if(sort === "oldest"){
      return new Date(a.created_at) - new Date(b.created_at);
    }

    if(sort === "price-low"){
      return Number(a.price || 0) - Number(b.price || 0);
    }

    if(sort === "price-high"){
      return Number(b.price || 0) - Number(a.price || 0);
    }

    return new Date(b.created_at) - new Date(a.created_at);
  });

  document.getElementById("resultCount").textContent =
    `${posts.length} post${posts.length === 1 ? "" : "s"} found`;

  const grid = document.getElementById("postsGrid");

  if(!posts.length){
    grid.innerHTML = `
      <div class="state">
        <div style="font-size:32px;color:var(--gold)">◇</div>
        <strong>No posts found</strong>
        <span>Try another search or category.</span>
      </div>`;
    return;
  }

  grid.innerHTML = posts.map(post=>{

    const seller = post.sellerProfile;
    const avatar = seller?.avatar_url || "";

    return `
      <article class="card">

        <div class="cover">
          <div class="cover-placeholder">◇</div>

          ${
            post.featured
              ? `<div class="featured">FEATURED</div>`
              : ""
          }

          <div class="badge">
            ${escapeHTML(post.category || "POST").toUpperCase()}
          </div>
        </div>

        <div class="card-body">

          <div class="category-label">
            ${escapeHTML(post.listing_type || "Listing")}
          </div>

          <div class="title">
            ${escapeHTML(post.title || "Untitled listing")}
          </div>

          <div class="price">
            ${price(post)}
          </div>

          <div class="location">
            ⌖ ${escapeHTML(location(post))}
          </div>

          <div class="seller">
            ${
              avatar
                ? `<img class="seller-avatar"
                    src="${escapeHTML(avatar)}"
                    alt="">`
                : `<div class="seller-avatar"></div>`
            }

            <div style="min-width:0">
              <div class="seller-name">
                ${escapeHTML(
                  seller?.full_name || "Member"
                )}
              </div>
              ${
                post.post_role === "verified"
                  ? `<div class="verified">✓ Verified</div>`
                  : ""
              }
            </div>
          </div>

          <button
            class="view"
            type="button"
            onclick="openPost('${escapeHTML(post.id)}')">
            View Details
          </button>

        </div>
      </article>
    `;
  }).join("");

  loadCovers(posts);
}

async function loadCovers(posts){

  await Promise.all(
    posts.map(async post=>{

      const images =
        await getImages(
          post.id,
          post.images
        );

      const card =
        [...document.querySelectorAll(".card")]
          .find(el =>
            el.querySelector(
              `button[onclick*="${post.id}"]`
            )
          );

      if(!card || !images.length){
        return;
      }

      const cover =
        card.querySelector(".cover");

      const placeholder =
        cover.querySelector(".cover-placeholder");

      if(placeholder){
        placeholder.remove();
      }

      const img =
        document.createElement("img");

      img.src = images[0];
      img.alt = post.title || "Listing";
      img.loading = "lazy";

      cover.prepend(img);
    })
  );
}

function openPost(id){
  window.location.href =
    `./listing-detail.html?id=${encodeURIComponent(id)}`;
}

window.openPost = openPost;

document.querySelectorAll(".category").forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll(".category")
      .forEach(x=>x.classList.remove("active"));

    btn.classList.add("active");
    category = btn.dataset.category;
    renderPosts();
  };
});

document.getElementById("searchInput")
  .addEventListener("input",renderPosts);

document.getElementById("sortSelect")
  .addEventListener("change",renderPosts);

document.getElementById("typeSelect")
  .addEventListener("change",renderPosts);

applyTheme(
  localStorage.getItem("mec_theme") || "light"
);

loadPosts();
</script>

</body>
</html>

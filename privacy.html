<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Policy — Myanmar Elite Connect</title>

  <style>
    *{box-sizing:border-box;margin:0;padding:0}

    :root{
      --bg:#f7f9fc;
      --surface:#fff;
      --text:#10233f;
      --muted:#728096;
      --gold:#d7b35a;
      --border:rgba(16,35,63,.09);
      --shadow:0 20px 60px rgba(16,35,63,.10);
    }

    body.dark{
      --bg:#071321;
      --surface:#0d1d31;
      --text:#f4f7fb;
      --muted:#94a3b7;
      --border:rgba(255,255,255,.09);
      --shadow:0 20px 60px rgba(0,0,0,.30);
    }

    body{
      min-height:100vh;
      font-family:Inter,"Noto Sans Myanmar","Myanmar Text",system-ui,sans-serif;
      background:var(--bg);
      color:var(--text);
      line-height:1.8;
    }

    .page{
      width:min(900px,calc(100% - 28px));
      margin:auto;
      padding:30px 0 60px;
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:25px;
    }

    .brand{font-weight:900}
    .brand span{color:var(--gold)}

    button{
      border:1px solid var(--border);
      background:var(--surface);
      color:var(--text);
      border-radius:10px;
      padding:9px 12px;
      cursor:pointer;
      font-size:11px;
      font-weight:800;
    }

    .card{
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:24px;
      padding:34px;
      box-shadow:var(--shadow);
    }

    h1{
      font-size:32px;
      line-height:1.2;
      margin-bottom:8px;
    }

    .updated{
      color:var(--muted);
      font-size:11px;
      margin-bottom:30px;
    }

    h2{
      font-size:18px;
      margin:27px 0 8px;
    }

    p,li{
      color:var(--muted);
      font-size:13px;
    }

    ul{padding-left:22px}

    .back{
      display:inline-block;
      margin-top:30px;
      color:var(--gold);
      font-size:12px;
      font-weight:800;
      text-decoration:none;
    }

    @media(max-width:520px){
      .card{padding:22px 18px}
      h1{font-size:27px}
    }
  </style>
<script src="./mec-theme.js"></script>
</head>

<body>
<main class="page">

  <div class="top">
    <div class="brand">

    </div>

let language = localStorage.getItem("mec_language") || "en";

function render(){
  document.getElementById("content").innerHTML = content[language];
  document.documentElement.lang = language === "mm" ? "my" : "en";
}

document.getElementById("languageButton").onclick = () => {
  language = language === "en" ? "mm" : "en";
  localStorage.setItem("mec_language", language);
  render();
};

function applyTheme(theme){
  document.body.classList.toggle("dark", theme === "dark");
  document.getElementById("themeButton").textContent =
    theme === "dark" ? "☀" : "☾";
  localStorage.setItem("mec_theme", theme);
}

document.getElementById("themeButton").onclick = () => {
  applyTheme(
    document.body.classList.contains("dark")
      ? "light"
      : "dark"
  );
};

applyTheme(localStorage.getItem("mec_theme") || "light");
render();

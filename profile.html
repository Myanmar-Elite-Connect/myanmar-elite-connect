<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Profile — Myanmar Elite Connect</title>

  <meta
    name="description"
    content="Myanmar Elite Connect user profile"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase.js"></script>

  <style>
    :root {
      --bg: #f6f8fb;
      --surface: #ffffff;
      --surface-soft: #f1f4f8;

      --text: #10233f;
      --muted: #77859a;

      --navy: #071a34;
      --navy-2: #173b62;

      --gold: #d7b35a;
      --gold-light: #f1d487;

      --green: #16a36a;
      --red: #dc4d5c;
      --blue: #239be8;

      --border: rgba(16, 35, 63, .09);
      --shadow: 0 18px 55px rgba(16, 35, 63, .08);

      --radius: 22px;
    }

    body.dark {
      --bg: #071321;
      --surface: #0d1d31;
      --surface-soft: #12263d;

      --text: #f4f7fb;
      --muted: #94a3b7;

      --navy: #f4f7fb;
      --navy-2: #dce5ef;

      --border: rgba(255, 255, 255, .09);
      --shadow: 0 18px 55px rgba(0, 0, 0, .3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);

      font-family:
        Inter,
        "Noto Sans Myanmar",
        "Myanmar Text",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      padding-bottom: 40px;
      transition: background .25s ease, color .25s ease;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       HEADER
    ========================== */

    .header {
      position: sticky;
      top: 0;
      z-index: 100;

      height: 68px;

      background: var(--surface);
      border-bottom: 1px solid var(--border);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .header-inner {
      width: min(1120px, calc(100% - 28px));
      height: 100%;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-logo {
      width: 40px;
      height: 40px;

      display: grid;
      place-items: center;

      overflow: hidden;
      border-radius: 11px;

      background: var(--surface);
      border: 1px solid var(--border);
    }

    .brand-logo img {
      width: 82%;
      height: 82%;
      object-fit: contain;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 900;
      white-space: nowrap;
    }

    .brand-name span {
      color: var(--gold);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .header-button {
      width: 40px;
      height: 40px;

      border: 1px solid var(--border);
      border-radius: 11px;

      background: var(--surface);
      color: var(--text);

      display: grid;
      place-items: center;

      font-size: 16px;
    }

    /* =========================
       PAGE
    ========================== */

    .page {
      width: min(920px, calc(100% - 26px));
      margin: 24px auto;
    }

    /* =========================
       LOADING
    ========================== */

    .loading {
      min-height: 420px;

      display: grid;
      place-items: center;

      color: var(--muted);
      font-size: 13px;
    }

    .spinner {
      width: 34px;
      height: 34px;

      border: 3px solid var(--border);
      border-top-color: var(--gold);

      border-radius: 50%;

      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       ERROR
    ========================== */

    .error-card {
      display: none;

      padding: 32px;
      text-align: center;

      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);

      box-shadow: var(--shadow);
    }

    .error-card.show {
      display: block;
    }

    .error-icon {
      font-size: 36px;
      margin-bottom: 12px;
    }

    .error-title {
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .error-text {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .back-button {
      margin-top: 18px;

      min-height: 42px;
      padding: 0 18px;

      border: 0;
      border-radius: 12px;

      background: var(--navy);
      color: var(--bg);

      font-weight: 800;
    }

    /* =========================
       PROFILE CARD
    ========================== */

    .profile-card {
      position: relative;
      overflow: hidden;

      background: var(--surface);

      border: 1px solid var(--border);
      border-radius: 28px;

      box-shadow: var(--shadow);

      padding: 30px;
    }

    .profile-card::before {
      content: "";

      position: absolute;

      width: 330px;
      height: 330px;

      right: -170px;
      top: -170px;

      border-radius: 50%;

      background: rgba(215, 179, 90, .08);

      pointer-events: none;
    }

    .profile-main {
      position: relative;
      z-index: 2;

      display: flex;
      align-items: center;
      gap: 24px;
    }

    .avatar-wrap {
      position: relative;
      flex: 0 0 auto;
    }

    .avatar {
      width: 116px;
      height: 116px;

      display: block;

      object-fit: cover;

      border-radius: 50%;

      background: var(--surface-soft);

      border: 4px solid var(--surface);

      box-shadow: 0 10px 30px rgba(7, 26, 52, .15);
    }

    .verified {
      position: absolute;

      right: 2px;
      bottom: 6px;

      width: 29px;
      height: 29px;

      display: none;
      place-items: center;

      border-radius: 50%;

      background: var(--blue);
      color: white;

      border: 3px solid var(--surface);

      font-size: 12px;
      font-weight: 900;
    }

    .profile-info {
      min-width: 0;
      flex: 1;
    }

    .username {
      font-size: clamp(24px, 4vw, 35px);
      line-height: 1.05;

      font-weight: 950;
      letter-spacing: -.8px;

      word-break: break-word;
    }

    .username-prefix {
      color: var(--gold);
    }

    .real-name {
      margin-top: 7px;

      color: var(--muted);
      font-size: 13px;
    }

    .location {
      margin-top: 7px;

      color: var(--muted);
      font-size: 11px;
    }

    .bio {
      max-width: 680px;
      margin-top: 13px;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.75;
    }

    /* =========================
       ACTIONS
    ========================== */

    .actions {
      position: relative;
      z-index: 5;

      display: flex;
      flex-wrap: wrap;
      gap: 8px;

      margin-top: 24px;
    }

    .action {
      min-height: 43px;
      padding: 0 17px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      gap: 7px;

      border: 1px solid var(--border);
      border-radius: 12px;

      background: var(--surface-soft);
      color: var(--text);

      font-size: 11px;
      font-weight: 850;

      transition: .2s ease;
    }

    .action:hover {
      transform: translateY(-2px);
      border-color: rgba(215, 179, 90, .45);
    }

    .action.primary {
      background: var(--navy);
      color: var(--bg);
      border-color: transparent;
    }

    .action.following {
      color: var(--green);
      background: rgba(22, 163, 106, .08);
      border-color: rgba(22, 163, 106, .25);
    }

    .action.liked {
      color: var(--red);
      background: rgba(220, 77, 92, .08);
      border-color: rgba(220, 77, 92, .25);
    }

    /* =========================
       STATS
    ========================== */

    .stats {
      position: relative;
      z-index: 3;

      display: grid;
      grid-template-columns: repeat(3, 1fr);

      gap: 8px;

      margin-top: 25px;
      padding-top: 23px;

      border-top: 1px solid var(--border);
    }

    .stat {
      text-align: center;
    }

    .stat-number {
      display: block;

      font-size: 20px;
      font-weight: 950;
    }

    .stat-label {
      display: block;

      margin-top: 4px;

      color: var(--muted);

      font-size: 9px;
      font-weight: 800;

      text-transform: uppercase;
      letter-spacing: .5px;
    }

    /* =========================
       CONTENT CARD
    ========================== */

    .content-card {
      margin-top: 18px;

      background: var(--surface);

      border: 1px solid var(--border);
      border-radius: var(--radius);

      box-shadow: var(--shadow);

      overflow: hidden;
    }

    .section-header {
      padding: 17px 20px;

      border-bottom: 1px solid var(--border);

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title {
      font-size: 14px;
      font-weight: 950;
    }

    .section-subtitle {
      color: var(--muted);
      font-size: 9px;
    }

    /* =========================
       COMMENTS
    ========================== */

    .comment-form {
      padding: 15px;

      display: flex;
      gap: 8px;
    }

    .comment-input {
      flex: 1;

      min-height: 44px;

      padding: 10px 13px;

      resize: none;

      background: var(--surface-soft);
      color: var(--text);

      border: 1px solid var(--border);
      border-radius: 12px;

      outline: none;
    }

    .comment-input:focus {
      border-color: rgba(215, 179, 90, .6);
    }

    .comment-submit {
      min-width: 80px;

      border: 0;
      border-radius: 12px;

      background: var(--navy);
      color: var(--bg);

      font-size: 11px;
      font-weight: 850;
    }

    .comments {
      border-top: 1px solid var(--border);
    }

    .comment {
      padding: 15px 17px;

      border-bottom: 1px solid var(--border);
    }

    .comment:last-child {
      border-bottom: 0;
    }

    .comment-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .comment-user {
      font-size: 11px;
      font-weight: 900;
    }

    .comment-date {
      color: var(--muted);
      font-size: 9px;
    }

    .comment-text {
      margin-top: 7px;

      color: var(--muted);

      font-size: 11px;
      line-height: 1.65;

      white-space: pre-wrap;
      word-break: break-word;
    }

    .comment-delete {
      margin-top: 8px;

      border: 0;
      background: transparent;

      color: var(--red);

      font-size: 9px;
      font-weight: 800;
    }

    .empty {
      padding: 25px;

      text-align: center;

      color: var(--muted);
      font-size: 11px;
    }

    /* =========================
       EDIT MODAL
    ========================== */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 500;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background: rgba(0, 0, 0, .55);

      backdrop-filter: blur(8px);
    }

    .modal.show {
      display: flex;
    }

    .modal-card {
      width: min(520px, 100%);

      background: var(--surface);

      border: 1px solid var(--border);
      border-radius: 22px;

      box-shadow: var(--shadow);

      overflow: hidden;
    }

    .modal-header {
      padding: 18px 20px;

      border-bottom: 1px solid var(--border);

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 950;
    }

    .modal-close {
      width: 34px;
      height: 34px;

      border: 1px solid var(--border);
      border-radius: 10px;

      background: var(--surface-soft);
      color: var(--text);
    }

    .modal-body {
      padding: 20px;
    }

    .field {
      margin-bottom: 15px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field label {
      display: block;

      margin-bottom: 6px;

      color: var(--muted);

      font-size: 10px;
      font-weight: 800;
    }

    .field input,
    .field textarea {
      width: 100%;

      padding: 11px 12px;

      background: var(--surface-soft);
      color: var(--text);

      border: 1px solid var(--border);
      border-radius: 11px;

      outline: none;
    }

    .field textarea {
      min-height: 110px;
      resize: vertical;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: rgba(215, 179, 90, .6);
    }

    .modal-footer {
      padding: 15px 20px;

      border-top: 1px solid var(--border);

      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .modal-button {
      min-height: 40px;
      padding: 0 15px;

      border-radius: 11px;

      font-size: 11px;
      font-weight: 850;
    }

    .modal-button.cancel {
      border: 1px solid var(--border);

      background: var(--surface-soft);
      color: var(--text);
    }

    .modal-button.save {
      border: 0;

      background: var(--navy);
      color: var(--bg);
    }

    /* =========================
       TOAST
    ========================== */

    .toast {
      position: fixed;

      left: 50%;
      bottom: 25px;

      z-index: 1000;

      transform: translate(-50%, 100px);

      padding: 11px 16px;

      border-radius: 12px;

      background: var(--navy);
      color: var(--bg);

      font-size: 11px;
      font-weight: 800;

      box-shadow: var(--shadow);

      opacity: 0;

      transition: .25s ease;
    }

    .toast.show {
      transform: translate(-50%, 0);
      opacity: 1;
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 640px) {
      .header {
        height: 62px;
      }

      .brand-name {
        font-size: 12px;
      }

      .header-button {
        width: 37px;
        height: 37px;
      }

      .page {
        width: min(100% - 18px, 920px);
        margin-top: 12px;
      }

      .profile-card {
        padding: 21px 17px;
        border-radius: 21px;
      }

      .profile-main {
        align-items: flex-start;
        gap: 15px;
      }

      .avatar {
        width: 82px;
        height: 82px;
      }

      .verified {
        width: 24px;
        height: 24px;

        right: 0;
        bottom: 2px;

        font-size: 10px;
      }

      .username {
        font-size: 25px;
      }

      .bio {
        font-size: 12px;
      }

      .action {
        flex: 1 1 calc(50% - 4px);
        min-width: 0;
      }

      .stats {
        margin-top: 20px;
        padding-top: 18px;
      }

      .stat-number {
        font-size: 18px;
      }

      .comment-form {
        flex-direction: column;
      }

      .comment-submit {
        min-height: 42px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-inner">

      <a href="index.html" class="brand">
        <div class="brand-logo">
          <img
            src="https://lh3.googleusercontent.com/d/1fR8TnvOjrzVbKuro9Ths1_Jt0PAxSmGd"
            alt="Myanmar Elite Connect"
          >
        </div>

        <div class="brand-name">
          Myanmar <span>Elite</span> Connect
        </div>
      </a>

      <div class="header-actions">

        <button
          class="header-button"
          id="themeButton"
          type="button"
          aria-label="Toggle dark mode"
        >
          🌙
        </button>

        <a
          href="index.html"
          class="header-button"
          aria-label="Home"
        >
          🏠
        </a>

      </div>

    </div>
  </header>


  <!-- PAGE -->
  <main class="page">

    <!-- LOADING -->
    <div id="loading" class="loading">
      <div>
        <div class="spinner"></div>
      </div>
    </div>


    <!-- ERROR -->
    <div id="errorCard" class="error-card">

      <div class="error-icon">⚠️</div>

      <div class="error-title">
        Profile not found
      </div>

      <div id="errorText" class="error-text">
        We couldn't load this profile.
      </div>

      <button
        class="back-button"
        onclick="history.back()"
        type="button"
      >
        Go Back
      </button>

    </div>


    <!-- PROFILE -->
    <section id="profileCard" class="profile-card" hidden>

      <div class="profile-main">

        <div class="avatar-wrap">

          <img
            id="avatar"
            class="avatar"
            src=""
            alt="Profile photo"
          >

          <div
            id="verified"
            class="verified"
            title="Verified"
          >
            ✓
          </div>

        </div>


        <div class="profile-info">

          <div
            id="username"
            class="username"
          >
            <span class="username-prefix">@</span>user
          </div>

          <div
            id="realName"
            class="real-name"
          ></div>

          <div
            id="location"
            class="location"
          ></div>

          <div
            id="bio"
            class="bio"
          ></div>

        </div>

      </div>


      <!-- ACTIONS -->
      <div class="actions">

        <button
          id="editButton"
          class="action primary"
          type="button"
          hidden
        >
          ✏️ Edit Profile
        </button>

        <button
          id="followButton"
          class="action"
          type="button"
        >
          + Follow
        </button>

        <button
          id="likeButton"
          class="action"
          type="button"
        >
          ♡ Like
        </button>

        <button
          id="shareButton"
          class="action"
          type="button"
        >
          ↗ Share
        </button>

        <button
          id="logoutButton"
          class="action"
          type="button"
          hidden
        >
          ⇥ Logout
        </button>

      </div>


      <!-- STATS -->
      <div class="stats">

        <div class="stat">
          <span
            id="followersCount"
            class="stat-number"
          >
            0
          </span>

          <span class="stat-label">
            Followers
          </span>
        </div>

        <div class="stat">
          <span
            id="followingCount"
            class="stat-number"
          >
            0
          </span>

          <span class="stat-label">
            Following
          </span>
        </div>

        <div class="stat">
          <span
            id="likesCount"
            class="stat-number"
          >
            0
          </span>

          <span class="stat-label">
            Likes
          </span>
        </div>

      </div>

    </section>


    <!-- COMMENTS -->
    <section
      id="commentsCard"
      class="content-card"
      hidden
    >

      <div class="section-header">

        <div>
          <div class="section-title">
            Profile Comments
          </div>

          <div class="section-subtitle">
            Comments from members
          </div>
        </div>

      </div>


      <form
        id="commentForm"
        class="comment-form"
      >

        <textarea
          id="commentInput"
          class="comment-input"
          rows="1"
          maxlength="500"
          placeholder="Write a comment..."
        ></textarea>

        <button
          class="comment-submit"
          type="submit"
        >
          Post
        </button>

      </form>


      <div
        id="comments"
        class="comments"
      ></div>

    </section>

  </main>


  <!-- EDIT MODAL -->
  <div
    id="editModal"
    class="modal"
    aria-hidden="true"
  >

    <div class="modal-card">

      <div class="modal-header">

        <div class="modal-title">
          Edit Profile
        </div>

        <button
          id="closeModal"
          class="modal-close"
          type="button"
          aria-label="Close"
        >
          ×
        </button>

      </div>


      <form id="editForm">

        <div class="modal-body">

          <div class="field">

            <label for="editFullName">
              Full Name
            </label>

            <input
              id="editFullName"
              type="text"
              maxlength="100"
            >

          </div>


          <div class="field">

            <label for="editCity">
              City
            </label>

            <input
              id="editCity"
              type="text"
              maxlength="100"
            >

          </div>


          <div class="field">

            <label for="editBio">
              Bio
            </label>

            <textarea
              id="editBio"
              maxlength="500"
            ></textarea>

          </div>

        </div>


        <div class="modal-footer">

          <button
            id="cancelEdit"
            class="modal-button cancel"
            type="button"
          >
            Cancel
          </button>

          <button
            class="modal-button save"
            type="submit"
          >
            Save Changes
          </button>

        </div>

      </form>

    </div>

  </div>


  <!-- TOAST -->
  <div
    id="toast"
    class="toast"
  ></div>


  <script>
    "use strict";

    /*
      IMPORTANT

      supabase.js must expose:

      window.supabaseClient

      The profile page only updates:
      - full_name
      - city
      - bio

      Protected fields such as:
      - role
      - is_verified
      - is_mcp

      are NEVER updated here.
    */


    const supabase = window.supabaseClient;


    if (!supabase) {
      showFatalError(
        "Supabase client is not available. Please check supabase.js."
      );
      throw new Error("Supabase client missing.");
    }


    /* =========================
       STATE
    ========================== */

    let currentUser = null;
    let profile = null;

    let isFollowing = false;
    let isLiked = false;


    /* =========================
       HELPERS
    ========================== */

    function $(id) {
      return document.getElementById(id);
    }


    function escapeHtml(value) {
      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function formatNumber(value) {
      const number = Number(value || 0);

      return new Intl.NumberFormat().format(number);
    }


    function formatDate(value) {
      if (!value) {
        return "";
      }

      try {
        return new Date(value).toLocaleDateString(
          undefined,
          {
            year: "numeric",
            month: "short",
            day: "numeric"
          }
        );
      } catch {
        return "";
      }
    }


    function showToast(message) {
      const toast = $("toast");

      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(window.__toastTimer);

      window.__toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2600);
    }


    function showFatalError(message) {
      $("loading").style.display = "none";

      $("errorText").textContent = message;

      $("errorCard").classList.add("show");
    }


    function getProfileIdFromUrl() {
      const params = new URLSearchParams(
        window.location.search
      );

      return (
        params.get("id") ||
        params.get("user") ||
        params.get("user_id") ||
        params.get("profile")
      );
    }


    /* =========================
       THEME
    ========================== */

    function loadTheme() {
      const saved = localStorage.getItem(
        "mec_theme"
      );

      if (saved === "dark") {
        document.body.classList.add("dark");
        $("themeButton").textContent = "☀️";
      } else {
        document.body.classList.remove("dark");
        $("themeButton").textContent = "🌙";
      }
    }


    $("themeButton").addEventListener(
      "click",
      () => {

        const dark =
          document.body.classList.toggle("dark");

        localStorage.setItem(
          "mec_theme",
          dark ? "dark" : "light"
        );

        $("themeButton").textContent =
          dark ? "☀️" : "🌙";
      }
    );


    loadTheme();


    /* =========================
       AUTH
    ========================== */

    async function getCurrentUser() {

      const {
        data,
        error
      } = await supabase.auth.getUser();

      if (error) {
        console.warn(
          "Auth check failed:",
          error.message
        );

        return null;
      }

      return data?.user || null;
    }


    /* =========================
       LOAD PROFILE
    ========================== */

    async function loadProfile() {

      const profileId =
        getProfileIdFromUrl();

      if (!profileId) {

        if (currentUser) {
          return loadProfileById(
            currentUser.id
          );
        }

        throw new Error(
          "No profile ID was provided."
        );
      }

      return loadProfileById(profileId);
    }


    async function loadProfileById(id) {

      const {
        data,
        error
      } = await supabase
        .from("profiles")
        .select(`
          id,
          username,
          full_name,
          avatar_url,
          city,
          bio,
          is_verified,
          created_at
        `)
        .eq("id", id)
        .maybeSingle();


      if (error) {
        throw error;
      }


      if (!data) {
        throw new Error(
          "This profile does not exist."
        );
      }


      profile = data;

      await renderProfile();

      await loadSocialState();

      await loadStats();

      await loadComments();
    }


    /* =========================
       RENDER PROFILE
    ========================== */

    async function renderProfile() {

      $("loading").style.display = "none";

      $("profileCard").hidden = false;

      $("commentsCard").hidden = false;


      const username =
        profile.username ||
        "user";


      $("username").innerHTML =
        `<span class="username-prefix">@</span>${escapeHtml(username)}`;


      $("realName").textContent =
        profile.full_name || "";


      const location =
        profile.city || "";


      $("location").textContent =
        location
          ? `📍 ${location}`
          : "";


      $("bio").textContent =
        profile.bio || "No bio yet.";


      const avatar =
        profile.avatar_url ||
        `https://ui-avatars.com/api/?name=${encodeURIComponent(
          profile.full_name ||
          profile.username ||
          "User"
        )}&background=d7b35a&color=071a34`;


      $("avatar").src = avatar;


      if (profile.is_verified) {
        $("verified").style.display =
          "grid";
      }


      const isOwner =
        currentUser &&
        currentUser.id === profile.id;


      $("editButton").hidden =
        !isOwner;


      $("logoutButton").hidden =
        !isOwner;


      $("followButton").hidden =
        isOwner;


      $("likeButton").hidden =
        isOwner;
    }


    /* =========================
       SOCIAL STATE
    ========================== */

    async function loadSocialState() {

      if (!currentUser || !profile) {
        return;
      }


      if (currentUser.id === profile.id) {
        return;
      }


      const {
        data: followData,
        error: followError
      } = await supabase
        .from("profile_follows")
        .select("id")
        .eq("follower_id", currentUser.id)
        .eq("following_id", profile.id)
        .maybeSingle();


      if (!followError) {
        isFollowing = !!followData;
      }


      const {
        data: likeData,
        error: likeError
      } = await supabase
        .from("profile_reactions")
        .select("id")
        .eq("user_id", currentUser.id)
        .eq("profile_id", profile.id)
        .eq("reaction", "like")
        .maybeSingle();


      if (!likeError) {
        isLiked = !!likeData;
      }


      updateActionButtons();
    }


    function updateActionButtons() {

      const follow =
        $("followButton");

      const like =
        $("likeButton");


      follow.textContent =
        isFollowing
          ? "✓ Following"
          : "+ Follow";


      follow.classList.toggle(
        "following",
        isFollowing
      );


      like.textContent =
        isLiked
          ? "♥ Liked"
          : "♡ Like";


      like.classList.toggle(
        "liked",
        isLiked
      );
    }


    /* =========================
       FOLLOW
    ========================== */

    $("followButton").addEventListener(
      "click",
      async () => {

        if (!currentUser) {
          showToast(
            "Please log in first."
          );

          return;
        }


        if (!profile) {
          return;
        }


        if (currentUser.id === profile.id) {
          return;
        }


        const button =
          $("followButton");

        button.disabled = true;


        try {

          if (isFollowing) {

            const {
              error
            } = await supabase
              .from("profile_follows")
              .delete()
              .eq(
                "follower_id",
                currentUser.id
              )
              .eq(
                "following_id",
                profile.id
              );


            if (error) {
              throw error;
            }


            isFollowing = false;

            showToast(
              "Unfollowed."
            );

          } else {

            const {
              error
            } = await supabase
              .from("profile_follows")
              .insert({
                follower_id:
                  currentUser.id,

                following_id:
                  profile.id
              });


            if (error) {
              throw error;
            }


            isFollowing = true;

            showToast(
              "Following."
            );
          }


          updateActionButtons();

          await loadStats();

        } catch (error) {

          console.error(error);

          showToast(
            error.message ||
            "Unable to update follow."
          );

        } finally {

          button.disabled = false;
        }
      }
    );


    /* =========================
       LIKE
    ========================== */

    $("likeButton").addEventListener(
      "click",
      async () => {

        if (!currentUser) {
          showToast(
            "Please log in first."
          );

          return;
        }


        const button =
          $("likeButton");

        button.disabled = true;


        try {

          if (isLiked) {

            const {
              error
            } = await supabase
              .from("profile_reactions")
              .delete()
              .eq(
                "user_id",
                currentUser.id
              )
              .eq(
                "profile_id",
                profile.id
              )
              .eq(
                "reaction",
                "like"
              );


            if (error) {
              throw error;
            }


            isLiked = false;

          } else {

            const {
              error
            } = await supabase
              .from("profile_reactions")
              .insert({
                user_id:
                  currentUser.id,

                profile_id:
                  profile.id,

                reaction: "like"
              });


            if (error) {
              throw error;
            }


            isLiked = true;
          }


          updateActionButtons();

          await loadStats();

        } catch (error) {

          console.error(error);

          showToast(
            error.message ||
            "Unable to update like."
          );

        } finally {

          button.disabled = false;
        }
      }
    );


    /* =========================
       STATS
    ========================== */

    async function loadStats() {

      if (!profile) {
        return;
      }


      const [
        followersResult,
        followingResult,
        likesResult
      ] = await Promise.all([

        supabase
          .from("profile_follows")
          .select(
            "id",
            {
              count: "exact",
              head: true
            }
          )
          .eq(
            "following_id",
            profile.id
          ),

        supabase
          .from("profile_follows")
          .select(
            "id",
            {
              count: "exact",
              head: true
            }
          )
          .eq(
            "follower_id",
            profile.id
          ),

        supabase
          .from("profile_reactions")
          .select(
            "id",
            {
              count: "exact",
              head: true
            }
          )
          .eq(
            "profile_id",
            profile.id
          )
          .eq(
            "reaction",
            "like"
          )

      ]);


      $("followersCount").textContent =
        formatNumber(
          followersResult.count || 0
        );


      $("followingCount").textContent =
        formatNumber(
          followingResult.count || 0
        );


      $("likesCount").textContent =
        formatNumber(
          likesResult.count || 0
        );
    }


    /* =========================
       COMMENTS
    ========================== */

    async function loadComments() {

      if (!profile) {
        return;
      }


      const {
        data,
        error
      } = await supabase
        .from("profile_comments")
        .select(`
          id,
          profile_id,
          user_id,
          comment,
          created_at,
          profiles:user_id (
            username,
            full_name
          )
        `)
        .eq(
          "profile_id",
          profile.id
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


      if (error) {

        console.warn(
          "Comments could not be loaded:",
          error.message
        );

        $("comments").innerHTML =
          `<div class="empty">
            Comments are currently unavailable.
          </div>`;

        return;
      }


      renderComments(data || []);
    }


    function renderComments(comments) {

      if (!comments.length) {

        $("comments").innerHTML =
          `<div class="empty">
            No comments yet.
          </div>`;

        return;
      }


      $("comments").innerHTML =
        comments.map(comment => {

          const user =
            comment.profiles;


          const name =
            user?.username ||
            user?.full_name ||
            "Member";


          const canDelete =
            currentUser &&
            currentUser.id ===
            comment.user_id;


          return `
            <article class="comment">

              <div class="comment-top">

                <div class="comment-user">
                  @${escapeHtml(name)}
                </div>

                <div class="comment-date">
                  ${escapeHtml(
                    formatDate(
                      comment.created_at
                    )
                  )}
                </div>

              </div>

              <div class="comment-text">
                ${escapeHtml(
                  comment.comment
                )}
              </div>

              ${
                canDelete
                  ? `
                    <button
                      class="comment-delete"
                      type="button"
                      data-delete-comment="${escapeHtml(
                        comment.id
                      )}"
                    >
                      Delete
                    </button>
                  `
                  : ""
              }

            </article>
          `;

        }).join("");
    }


    /* =========================
       ADD COMMENT
    ========================== */

    $("commentForm").addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        if (!currentUser) {

          showToast(
            "Please log in first."
          );

          return;
        }


        const text =
          $("commentInput")
            .value
            .trim();


        if (!text) {
          return;
        }


        const submit =
          document.querySelector(
            ".comment-submit"
          );


        submit.disabled = true;


        try {

          const {
            error
          } = await supabase
            .from("profile_comments")
            .insert({
              profile_id:
                profile.id,

              user_id:
                currentUser.id,

              comment:
                text
            });


          if (error) {
            throw error;
          }


          $("commentInput").value = "";

          showToast(
            "Comment posted."
          );


          await loadComments();

        } catch (error) {

          console.error(error);

          showToast(
            error.message ||
            "Unable to post comment."
          );

        } finally {

          submit.disabled = false;
        }
      }
    );


    /* =========================
       DELETE COMMENT
    ========================== */

    $("comments").addEventListener(
      "click",
      async event => {

        const button =
          event.target.closest(
            "[data-delete-comment]"
          );


        if (!button) {
          return;
        }


        const commentId =
          button.dataset.deleteComment;


        if (!currentUser) {
          return;
        }


        button.disabled = true;


        try {

          const {
            error
          } = await supabase
            .from("profile_comments")
            .delete()
            .eq(
              "id",
              commentId
            )
            .eq(
              "user_id",
              currentUser.id
            );


          if (error) {
            throw error;
          }


          showToast(
            "Comment deleted."
          );


          await loadComments();

        } catch (error) {

          console.error(error);

          showToast(
            error.message ||
            "Unable to delete comment."
          );

        }
      }
    );


    /* =========================
       EDIT PROFILE
    ========================== */

    $("editButton").addEventListener(
      "click",
      () => {

        $("editFullName").value =
          profile.full_name || "";

        $("editCity").value =
          profile.city || "";

        $("editBio").value =
          profile.bio || "";

        openModal();
      }
    );


    function openModal() {

      $("editModal").classList.add(
        "show"
      );

      $("editModal").setAttribute(
        "aria-hidden",
        "false"
      );
    }


    function closeModal() {

      $("editModal").classList.remove(
        "show"
      );

      $("editModal").setAttribute(
        "aria-hidden",
        "true"
      );
    }


    $("closeModal").addEventListener(
      "click",
      closeModal
    );


    $("cancelEdit").addEventListener(
      "click",
      closeModal
    );


    $("editModal").addEventListener(
      "click",
      event => {

        if (
          event.target ===
          $("editModal")
        ) {
          closeModal();
        }
      }
    );


    $("editForm").addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        if (!currentUser) {
          return;
        }


        if (
          currentUser.id !==
          profile.id
        ) {
          showToast(
            "You can only edit your own profile."
          );

          return;
        }


        const fullName =
          $("editFullName")
            .value
            .trim();


        const city =
          $("editCity")
            .value
            .trim();


        const bio =
          $("editBio")
            .value
            .trim();


        const submit =
          $("editForm")
            .querySelector(
              ".save"
            );


        submit.disabled = true;


        try {

          /*
            SECURITY:
            Only safe profile fields are
            sent to the database.

            NEVER update:
            role
            is_verified
            is_mcp
            id
          */

          const {
            data,
            error
          } = await supabase
            .from("profiles")
            .update({
              full_name:
                fullName || null,

              city:
                city || null,

              bio:
                bio || null
            })
            .eq(
              "id",
              currentUser.id
            )
            .select(`
              id,
              username,
              full_name,
              avatar_url,
              city,
              bio,
              is_verified,
              created_at
            `)
            .single();


          if (error) {
            throw error;
          }


          profile = data;

          closeModal();

          await renderProfile();

          showToast(
            "Profile updated."
          );

        } catch (error) {

          console.error(error);

          showToast(
            error.message ||
            "Unable to update profile."
          );

        } finally {

          submit.disabled = false;
        }
      }
    );


    /* =========================
       SHARE
    ========================== */

    $("shareButton").addEventListener(
      "click",
      async () => {

        const url =
          window.location.href;


        try {

          if (
            navigator.share
          ) {

            await navigator.share({
              title:
                profile?.username
                  ? `@${profile.username}`
                  : "Myanmar Elite Connect",

              text:
                "Check out this profile on Myanmar Elite Connect.",

              url
            });

          } else if (
            navigator.clipboard
          ) {

            await navigator.clipboard.writeText(
              url
            );

            showToast(
              "Profile link copied."
            );

          } else {

            window.prompt(
              "Copy this profile link:",
              url
            );
          }

        } catch (error) {

          if (
            error?.name !==
            "AbortError"
          ) {
            console.warn(error);
          }
        }
      }
    );


    /* =========================
       LOGOUT
    ========================== */

    $("logoutButton").addEventListener(
      "click",
      async () => {

        const {
          error
        } = await supabase.auth.signOut();


        if (error) {

          showToast(
            error.message ||
            "Unable to log out."
          );

          return;
        }


        window.location.href =
          "auth.html";
      }
    );


    /* =========================
       AUTH STATE
    ========================== */

    supabase.auth.onAuthStateChange(
      (_event, session) => {

        currentUser =
          session?.user || null;

      }
    );


    /* =========================
       INIT
    ========================== */

    async function init() {

      try {

        currentUser =
          await getCurrentUser();


        await loadProfile();

      } catch (error) {

        console.error(
          "Profile initialization failed:",
          error
        );


        showFatalError(
          error.message ||
          "Unable to load profile."
        );
      }
    }


    init();

  </script>

</body>
</html>

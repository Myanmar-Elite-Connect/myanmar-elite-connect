<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Profile — Myanmar Elite Connect</title>

  <meta
    name="description"
    content="Myanmar Elite Connect Profile"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;

      font-family:
        Inter,
        "Noto Sans Myanmar",
        "Myanmar Text",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f6f8fb;
      color: #10233f;

      transition:
        background .25s ease,
        color .25s ease;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }


    /* =====================================================
       THEME
    ===================================================== */

    :root {
      --bg: #f6f8fb;
      --surface: #ffffff;
      --surface-soft: #f0f3f7;

      --text: #10233f;
      --muted: #748198;

      --navy: #071a34;
      --navy-2: #15375d;

      --gold: #d7b35a;
      --gold-light: #f2d68b;

      --green: #218a5b;
      --red: #d94b55;

      --border: rgba(16,35,63,.09);

      --shadow:
        0 18px 55px rgba(16,35,63,.09);
    }

    body.dark {
      --bg: #071321;
      --surface: #0d1d31;
      --surface-soft: #12263d;

      --text: #f4f7fb;
      --muted: #91a0b4;

      --navy: #f4f7fb;
      --navy-2: #dbe5ef;

      --border: rgba(255,255,255,.09);

      --shadow:
        0 18px 55px rgba(0,0,0,.30);
    }


    /* =====================================================
       APP
    ===================================================== */

    .app {
      min-height: 100vh;
      padding-bottom: 90px;
    }


    /* =====================================================
       HEADER
    ===================================================== */

    .header {
      position: sticky;
      top: 0;
      z-index: 100;

      height: 70px;

      background:
        color-mix(
          in srgb,
          var(--surface) 90%,
          transparent
        );

      border-bottom:
        1px solid var(--border);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .header-inner {
      width:
        min(1180px, calc(100% - 30px));

      height: 100%;

      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;

      min-width: 0;
    }

    .brand-logo {
      width: 42px;
      height: 42px;

      display: grid;
      place-items: center;

      overflow: hidden;

      border-radius: 12px;

      background: var(--surface);

      border:
        1px solid var(--border);
    }

    .brand-logo img {
      width: 82%;
      height: 82%;

      object-fit: contain;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 850;
      white-space: nowrap;
    }

    .brand-name span {
      color: var(--gold);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .icon-button {
      width: 40px;
      height: 40px;

      display: grid;
      place-items: center;

      border:
        1px solid var(--border);

      border-radius: 11px;

      color: var(--text);
      background: var(--surface);

      transition:
        transform .2s ease,
        border-color .2s ease;
    }

    .icon-button:hover {
      transform: translateY(-2px);
      border-color: rgba(215,179,90,.55);
    }


    /* =====================================================
       MAIN
    ===================================================== */

    .container {
      width:
        min(900px, calc(100% - 30px));

      margin:
        28px auto 0;
    }


    /* =====================================================
       PROFILE CARD
    ===================================================== */

    .profile-card {
      background: var(--surface);

      border:
        1px solid var(--border);

      border-radius: 24px;

      box-shadow: var(--shadow);

      overflow: hidden;
    }

    .profile-cover {
      height: 125px;

      background:
        radial-gradient(
          circle at 80% 20%,
          rgba(215,179,90,.28),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #071a34,
          #163c63
        );

      position: relative;
    }

    body.dark .profile-cover {
      background:
        radial-gradient(
          circle at 80% 20%,
          rgba(215,179,90,.20),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #0d1d31,
          #122b47
        );
    }

    .profile-main {
      padding:
        0 25px 25px;
    }

    .avatar-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;

      margin-top: -52px;
    }

    .avatar {
      width: 104px;
      height: 104px;

      border-radius: 50%;

      border:
        5px solid var(--surface);

      background: var(--surface-soft);

      overflow: hidden;

      display: grid;
      place-items: center;

      position: relative;
    }

    .avatar img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .avatar-placeholder {
      font-size: 38px;
      font-weight: 900;
      color: var(--gold);
    }

    .verified-mark {
      position: absolute;

      right: 2px;
      bottom: 5px;

      width: 25px;
      height: 25px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      background: #2788e6;
      color: white;

      border:
        3px solid var(--surface);

      font-size: 12px;
    }

    .profile-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .button {
      min-height: 42px;

      padding:
        0 17px;

      border-radius: 11px;

      border:
        1px solid var(--border);

      background: var(--surface);

      color: var(--text);

      font-size: 12px;
      font-weight: 850;

      transition:
        transform .2s ease,
        border-color .2s ease,
        background .2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .button.primary {
      color: white;
      background:
        linear-gradient(
          135deg,
          #071a34,
          #173d64
        );

      border-color: transparent;
    }

    body.dark .button.primary {
      color: #071a34;

      background:
        linear-gradient(
          135deg,
          var(--gold-light),
          var(--gold)
        );
    }

    .button.following {
      background: var(--surface-soft);
      border-color: rgba(215,179,90,.45);
    }

    .button.danger {
      color: var(--red);
    }


    /* =====================================================
       PROFILE INFO
    ===================================================== */

    .profile-info {
      margin-top: 17px;
    }

    .display-name {
      font-size: 24px;
      font-weight: 900;

      letter-spacing: -.6px;
    }

    .username {
      margin-top: 3px;

      color: var(--gold);

      font-size: 13px;
      font-weight: 750;
    }

    .bio {
      max-width: 650px;

      margin-top: 13px;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.75;
    }

    .profile-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;

      margin-top: 14px;
    }

    .meta-chip {
      padding:
        7px 10px;

      border-radius: 9px;

      background: var(--surface-soft);

      color: var(--muted);

      font-size: 10px;
      font-weight: 750;
    }


    /* =====================================================
       STATS
    ===================================================== */

    .stats {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      margin-top: 23px;

      border-top:
        1px solid var(--border);

      border-bottom:
        1px solid var(--border);
    }

    .stat {
      min-height: 76px;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      border-right:
        1px solid var(--border);

      background: transparent;

      color: var(--text);

      transition:
        background .2s ease;
    }

    .stat:last-child {
      border-right: 0;
    }

    .stat:hover {
      background: var(--surface-soft);
    }

    .stat-number {
      font-size: 18px;
      font-weight: 900;
    }

    .stat-label {
      margin-top: 3px;

      color: var(--muted);

      font-size: 10px;
      font-weight: 700;
    }


    /* =====================================================
       BADGES
    ===================================================== */

    .badge-section {
      margin-top: 22px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 900;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;

      gap: 8px;

      margin-top: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      padding:
        8px 11px;

      border-radius: 10px;

      background:
        linear-gradient(
          135deg,
          rgba(215,179,90,.13),
          var(--surface-soft)
        );

      border:
        1px solid rgba(215,179,90,.22);

      font-size: 11px;
      font-weight: 800;
    }

    .badge-icon {
      width: 24px;
      height: 24px;

      display: grid;
      place-items: center;

      overflow: hidden;

      border-radius: 7px;

      background: var(--surface);
    }

    .badge-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }


    /* =====================================================
       FUNCTION LIST
    ===================================================== */

    .functions {
      margin-top: 24px;
    }

    .function-list {
      display: flex;
      flex-direction: column;

      gap: 8px;

      margin-top: 11px;
    }

    .function-row {
      width: 100%;

      min-height: 64px;

      display: flex;
      align-items: center;

      padding:
        10px 13px;

      gap: 12px;

      border:
        1px solid var(--border);

      border-radius: 14px;

      background: var(--surface);

      color: var(--text);

      text-align: left;

      transition:
        transform .2s ease,
        background .2s ease,
        border-color .2s ease;
    }

    .function-row:hover {
      transform: translateX(3px);

      background: var(--surface-soft);

      border-color:
        rgba(215,179,90,.35);
    }

    .function-icon {
      width: 40px;
      height: 40px;

      flex: 0 0 40px;

      display: grid;
      place-items: center;

      border-radius: 11px;

      background: var(--surface-soft);

      font-size: 18px;
    }

    .function-content {
      min-width: 0;
      flex: 1;
    }

    .function-title {
      font-size: 12px;
      font-weight: 850;
    }

    .function-description {
      margin-top: 3px;

      color: var(--muted);

      font-size: 10px;
      line-height: 1.4;
    }

    .function-arrow {
      color: var(--muted);
      font-size: 16px;
    }

    .function-row.hidden {
      display: none;
    }


    /* =====================================================
       LOGOUT
    ===================================================== */

    .logout-row {
      margin-top: 10px;

      color: var(--red);

      border-color:
        rgba(217,75,85,.12);
    }

    .logout-row .function-icon {
      color: var(--red);

      background:
        rgba(217,75,85,.08);
    }


    /* =====================================================
       MODAL
    ===================================================== */

    .modal {
      position: fixed;

      inset: 0;

      z-index: 500;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 16px;

      background:
        rgba(4,12,24,.62);

      backdrop-filter: blur(8px);
    }

    .modal.open {
      display: flex;
    }

    .modal-card {
      width:
        min(560px, 100%);

      max-height:
        min(760px, 90vh);

      overflow: auto;

      border-radius: 22px;

      background: var(--surface);

      border:
        1px solid var(--border);

      box-shadow:
        0 30px 90px rgba(0,0,0,.25);
    }

    .modal-header {
      position: sticky;
      top: 0;
      z-index: 2;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 17px;

      background:
        color-mix(
          in srgb,
          var(--surface) 94%,
          transparent
        );

      border-bottom:
        1px solid var(--border);

      backdrop-filter: blur(14px);
    }

    .modal-title {
      font-size: 15px;
      font-weight: 900;
    }

    .modal-close {
      width: 35px;
      height: 35px;

      border: 0;

      border-radius: 9px;

      background: var(--surface-soft);

      color: var(--text);
    }

    .modal-body {
      padding: 17px;
    }


    /* =====================================================
       USER LIST
    ===================================================== */

    .user-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .user-item {
      display: flex;
      align-items: center;
      gap: 11px;

      padding: 10px;

      border:
        1px solid var(--border);

      border-radius: 13px;
    }

    .user-avatar {
      width: 43px;
      height: 43px;

      flex: 0 0 43px;

      border-radius: 50%;

      overflow: hidden;

      display: grid;
      place-items: center;

      background: var(--surface-soft);

      font-size: 15px;
      font-weight: 900;

      color: var(--gold);
    }

    .user-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-info {
      flex: 1;
      min-width: 0;
    }

    .user-name {
      font-size: 12px;
      font-weight: 850;
    }

    .user-username {
      margin-top: 2px;

      color: var(--muted);

      font-size: 10px;
    }

    .user-actions {
      display: flex;
      gap: 5px;
    }

    .small-button {
      min-height: 34px;

      padding:
        0 10px;

      border-radius: 9px;

      border:
        1px solid var(--border);

      background: var(--surface);

      color: var(--text);

      font-size: 9px;
      font-weight: 850;
    }

    .small-button.primary {
      color: white;

      background: var(--navy);

      border-color: transparent;
    }

    body.dark .small-button.primary {
      color: #071a34;
      background: var(--gold);
    }


    /* =====================================================
       FORMS
    ===================================================== */

    .form-grid {
      display: grid;
      gap: 13px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      color: var(--muted);

      font-size: 10px;
      font-weight: 800;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;

      border:
        1px solid var(--border);

      border-radius: 11px;

      padding:
        12px;

      outline: none;

      background: var(--surface-soft);

      color: var(--text);

      font-size: 12px;
    }

    .field textarea {
      min-height: 95px;
      resize: vertical;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color:
        rgba(215,179,90,.65);
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;

      gap: 8px;

      margin-top: 5px;
    }

    .file-preview {
      width: 100%;
      max-height: 180px;

      object-fit: cover;

      border-radius: 13px;

      display: none;
    }


    /* =====================================================
       POSTS
    ===================================================== */

    .post-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .post-card {
      padding: 13px;

      border:
        1px solid var(--border);

      border-radius: 14px;

      background: var(--surface);
    }

    .post-category {
      color: var(--gold);

      font-size: 9px;
      font-weight: 850;

      text-transform: uppercase;
    }

    .post-caption {
      margin-top: 7px;

      color: var(--text);

      font-size: 12px;
      line-height: 1.65;
    }

    .post-date {
      margin-top: 8px;

      color: var(--muted);

      font-size: 9px;
    }


    /* =====================================================
       EMPTY
    ===================================================== */

    .empty {
      padding: 35px 15px;

      text-align: center;

      color: var(--muted);

      font-size: 11px;
    }


    /* =====================================================
       TOAST
    ===================================================== */

    .toast {
      position: fixed;

      left: 50%;
      bottom: 25px;

      z-index: 900;

      transform:
        translate(-50%, 20px);

      opacity: 0;
      pointer-events: none;

      padding:
        11px 16px;

      border-radius: 11px;

      background: #071a34;
      color: white;

      font-size: 11px;
      font-weight: 750;

      transition:
        opacity .25s ease,
        transform .25s ease;
    }

    .toast.show {
      opacity: 1;

      transform:
        translate(-50%, 0);
    }


    /* =====================================================
       MOBILE NAV
    ===================================================== */

    .bottom-nav {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      z-index: 150;

      height: 70px;

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      background:
        color-mix(
          in srgb,
          var(--surface) 95%,
          transparent
        );

      border-top:
        1px solid var(--border);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .nav-item {
      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 4px;

      color: var(--muted);

      font-size: 9px;
      font-weight: 750;
    }

    .nav-icon {
      font-size: 19px;
    }

    .nav-item.active {
      color: var(--gold);
    }


    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media (max-width: 600px) {

      .brand-name {
        display: none;
      }

      .container {
        width:
          calc(100% - 20px);

        margin-top: 15px;
      }

      .profile-main {
        padding:
          0 15px 18px;
      }

      .avatar-row {
        align-items: flex-end;
      }

      .avatar {
        width: 90px;
        height: 90px;
      }

      .profile-actions {
        max-width: 190px;
      }

      .button {
        min-height: 38px;
        padding: 0 12px;
      }

      .stats {
        grid-template-columns:
          repeat(4, 1fr);
      }

      .stat {
        min-height: 66px;
      }

      .stat-number {
        font-size: 15px;
      }

      .stat-label {
        font-size: 8px;
      }

      .user-actions {
        flex-direction: column;
      }

      .small-button {
        width: 68px;
      }
    }

  </style>
</head>

<body>

<div class="app">

  <!-- ===================================================
       HEADER
  ==================================================== -->

  <header class="header">

    <div class="header-inner">

      <a href="./index.html" class="brand">

        <div class="brand-logo">

          <img
            src="https://lh3.googleusercontent.com/d/1fR8TnvOjrzVbKuro9Ths1_Jt0PAxSmGd"
            alt="Myanmar Elite Connect">

        </div>

        <div class="brand-name">
          Myanmar <span>Elite</span> Connect
        </div>

      </a>


      <div class="header-actions">

        <button
          class="icon-button"
          id="themeButton"
          type="button"
          aria-label="Change theme">

          ☾

        </button>

      </div>

    </div>

  </header>


  <!-- ===================================================
       MAIN
  ==================================================== -->

  <main class="container">

    <section class="profile-card">

      <div class="profile-cover"></div>


      <div class="profile-main">

        <!-- AVATAR + ACTIONS -->

        <div class="avatar-row">

          <div class="avatar">

            <img
              id="profileAvatar"
              alt="Profile photo"
              style="display:none;">

            <span
              id="avatarPlaceholder"
              class="avatar-placeholder">
              U
            </span>

            <span
              id="verifiedMark"
              class="verified-mark"
              style="display:none;">
              ✓
            </span>

          </div>


          <div class="profile-actions">

            <button
              class="button primary"
              id="followButton"
              type="button">

              Follow

            </button>


            <button
              class="button"
              id="chatButton"
              type="button">

              💬 Chat

            </button>


            <button
              class="button"
              id="editButton"
              type="button">

              Edit Profile

            </button>

          </div>

        </div>


        <!-- PROFILE INFO -->

        <div class="profile-info">

          <h1
            class="display-name"
            id="displayName">
            Loading...
          </h1>

          <div
            class="username"
            id="username">
            @username
          </div>

          <p
            class="bio"
            id="bio">
            No bio yet.
          </p>


          <div
            class="profile-meta"
            id="profileMeta">
          </div>

        </div>


        <!-- STATS -->

        <div class="stats">

          <button
            class="stat"
            id="followersStat"
            type="button">

            <span
              class="stat-number"
              id="followersCount">
              0
            </span>

            <span class="stat-label">
              Followers
            </span>

          </button>


          <button
            class="stat"
            id="followingStat"
            type="button">

            <span
              class="stat-number"
              id="followingCount">
              0
            </span>

            <span class="stat-label">
              Following
            </span>

          </button>


          <button
            class="stat"
            id="likesStat"
            type="button">

            <span
              class="stat-number"
              id="likesCount">
              0
            </span>

            <span class="stat-label">
              Likes
            </span>

          </button>


          <button
            class="stat"
            id="postsStat"
            type="button">

            <span
              class="stat-number"
              id="postsCount">
              0
            </span>

            <span class="stat-label">
              My Posts
            </span>

          </button>

        </div>


        <!-- BADGES -->

        <section class="badge-section">

          <div class="section-title">
            Badges
          </div>

          <div
            class="badges"
            id="badges">
          </div>

<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
  "https://luapjolsqvmdqfgbxzad.supabase.co";

/*
  Put your Supabase publishable / anon key here.
  NEVER put the service_role key in this file.
*/

const SUPABASE_KEY =
  "YOUR_SUPABASE_PUBLISHABLE_KEY";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   STORAGE
===================================================== */

const AVATAR_BUCKET =
  "avatars";

const KYC_BUCKET =
  "kyc";


/* =====================================================
   STATE
===================================================== */

let currentAuthUser = null;

let currentContact = null;

let viewedContact = null;

let viewedUser = null;

let isOwnProfile = false;


/* =====================================================
   HELPERS
===================================================== */

function escapeHTML(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function initials(name) {

  const text =
    String(name || "U").trim();

  if (!text) return "U";

  return text
    .split(/\s+/)
    .slice(0, 2)
    .map(x => x[0])
    .join("")
    .toUpperCase();

}


function formatDate(date) {

  if (!date) return "";

  return new Date(date)
    .toLocaleDateString(
      undefined,
      {
        year: "numeric",
        month: "short",
        day: "numeric"
      }
    );

}


function showToast(message) {

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.classList.add("show");

  setTimeout(() => {

    toast.classList.remove("show");

  }, 2600);

}


function openModal(id) {

  document
    .getElementById(id)
    .classList.add("open");

}


function closeModal(id) {

  document
    .getElementById(id)
    .classList.remove("open");

}


document
  .querySelectorAll("[data-close]")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        closeModal(
          button.dataset.close
        );

      }
    );

  });


document
  .querySelectorAll(".modal")
  .forEach(modal => {

    modal.addEventListener(
      "click",
      event => {

        if (event.target === modal) {

          modal.classList.remove("open");

        }

      }
    );

  });


/* =====================================================
   AUTH
===================================================== */

async function getCurrentUser() {

  const {
    data,
    error
  } =
    await supabaseClient.auth.getUser();

  if (error) {

    console.error(error);

    return null;

  }

  return data?.user || null;

}


/*
  The current database identifies users with
  email_or_phone, so we first use the authenticated
  user's email or phone.
*/

function getAuthContact(user) {

  if (!user) return null;

  return (
    user.email ||
    user.phone ||
    user.user_metadata?.email_or_phone ||
    null
  );

}


/* =====================================================
   LOAD PROFILE
===================================================== */

async function loadProfile() {

  currentAuthUser =
    await getCurrentUser();

  if (!currentAuthUser) {

    window.location.href =
      "./auth.html?mode=login";

    return;

  }


  currentContact =
    getAuthContact(
      currentAuthUser
    );


  const params =
    new URLSearchParams(
      window.location.search
    );


  const requestedUsername =
    params.get("username");


  if (requestedUsername) {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("users")
        .select("*")
        .eq(
          "username",
          requestedUsername
        )
        .maybeSingle();


    if (error) {

      console.error(error);

      showToast(
        "Unable to load profile."
      );

      return;

    }


    if (!data) {

      showToast(
        "Profile not found."
      );

      return;

    }


    viewedUser = data;

  } else {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("users")
        .select("*")
        .eq(
          "email_or_phone",
          currentContact
        )
        .maybeSingle();


    if (error) {

      console.error(error);

      showToast(
        "Unable to load your profile."
      );

      return;

    }


    viewedUser = data;

  }


  if (!viewedUser) {

    showToast(
      "Profile not found."
    );

    return;

  }


  viewedContact =
    viewedUser.email_or_phone;


  isOwnProfile =
    viewedContact === currentContact;


  renderProfile();

  await loadStats();

  await loadBadges();

  await updateFollowState();

  updatePrivateControls();

}


/* =====================================================
   RENDER PROFILE
===================================================== */

function renderProfile() {

  const name =
    viewedUser.display_name ||
    viewedUser.username ||
    "User";


  document.getElementById(
    "displayName"
  ).textContent = name;


  document.getElementById(
    "username"
  ).textContent =
    viewedUser.username
      ? "@" + viewedUser.username
      : "@username";


  document.getElementById(
    "bio"
  ).textContent =
    viewedUser.bio ||
    "No bio yet.";


  const avatar =
    viewedUser.avatar_url;


  const avatarImage =
    document.getElementById(
      "profileAvatar"
    );

  const placeholder =
    document.getElementById(
      "avatarPlaceholder"
    );


  if (avatar) {

    avatarImage.src = avatar;

    avatarImage.style.display =
      "block";

    placeholder.style.display =
      "none";

  } else {

    avatarImage.style.display =
      "none";

    placeholder.style.display =
      "grid";

    placeholder.textContent =
      initials(name);

  }


  document.getElementById(
    "verifiedMark"
  ).style.display =
    viewedUser.kyc_status === "approved"
      ? "grid"
      : "none";


  const meta =
    document.getElementById(
      "profileMeta"
    );


  meta.innerHTML = "";


  if (viewedUser.city) {

    meta.insertAdjacentHTML(
      "beforeend",
      `<span class="meta-chip">
        📍 ${escapeHTML(viewedUser.city)}
      </span>`
    );

  }


  if (viewedUser.seller_type) {

    meta.insertAdjacentHTML(
      "beforeend",
      `<span class="meta-chip">
        ${escapeHTML(viewedUser.seller_type)}
      </span>`
    );

  }


  if (viewedUser.category) {

    meta.insertAdjacentHTML(
      "beforeend",
      `<span class="meta-chip">
        ${escapeHTML(viewedUser.category)}
      </span>`
    );

  }


  if (viewedUser.kyc_status === "approved") {

    meta.insertAdjacentHTML(
      "beforeend",
      `<span class="meta-chip">
        ✓ KYC Verified
      </span>`
    );

  }


  document.getElementById(
    "followButton"
  ).style.display =
    isOwnProfile
      ? "none"
      : "inline-flex";


  document.getElementById(
    "chatButton"
  ).style.display =
    isOwnProfile
      ? "none"
      : "inline-flex";


  document.getElementById(
    "editButton"
  ).style.display =
    isOwnProfile
      ? "inline-flex"
      : "none";

}


/* =====================================================
   PRIVATE / PUBLIC FUNCTIONS
===================================================== */

function updatePrivateControls() {

  const privateRows = [

    "editProfileRow",
    "kycButton",
    "mcpButton",
    "logoutButton"

  ];


  privateRows.forEach(id => {

    document.getElementById(id)
      .classList.toggle(
        "hidden",
        !isOwnProfile
      );

  });


  /*
    My Posts and Badges remain visible on public
    profiles because people can see public content.
  */

}


/* =====================================================
   PROFILE STATS
===================================================== */

async function loadStats() {

  let stats = null;


  const {
    data
  } =
    await supabaseClient
      .from("profile_stats")
      .select("*")
      .eq(
        "user_contact",
        viewedContact
      )
      .maybeSingle();


  stats = data;


  if (stats) {

    document.getElementById(
      "followersCount"
    ).textContent =
      Number(
        stats.followers_count || 0
      );


    document.getElementById(
      "followingCount"
    ).textContent =
      Number(
        stats.following_count || 0
      );


    document.getElementById(
      "likesCount"
    ).textContent =
      Number(
        stats.likes_count || 0
      );


    document.getElementById(
      "postsCount"
    ).textContent =
      Number(
        stats.posts_count || 0
      );

  } else {

    await calculateStats();

  }

}


/* =====================================================
   CALCULATE STATS
===================================================== */

async function calculateStats() {

  const [
    followersResult,
    followingResult,
    likesResult,
    postsResult
  ] =
    await Promise.all([

      supabaseClient
        .from("follows")
        .select(
          "follower_contact",
          {
            count: "exact",
            head: true
          }
        )
        .eq(
          "following_contact",
          viewedContact
        ),

      supabaseClient
        .from("follows")
        .select(
          "following_contact",
          {
            count: "exact",
            head: true
          }
        )
        .eq(
          "follower_contact",
          viewedContact
        ),

      supabaseClient
        .from("profile_likes")
        .select(
          "liker_contact",
          {
            count: "exact",
            head: true
          }
        )
        .eq(
          "profile_contact",
          viewedContact
        ),

      supabaseClient
        .from("posts")
        .select(
          "username",
          {
            count: "exact",
            head: true
          }
        )
        .eq(

/* =====================================================
   FOLLOW / UNFOLLOW
===================================================== */

async function toggleFollow(
  targetContact
) {

  if (!currentContact) return;

  if (
    currentContact ===
    targetContact
  ) {

    return;

  }


  const {
    data: existing,
    error: checkError
  } =
    await supabaseClient
      .from("follows")
      .select(
        "follower_contact,following_contact"
      )
      .eq(
        "follower_contact",
        currentContact
      )
      .eq(
        "following_contact",
        targetContact
      )
      .maybeSingle();


  if (checkError) {

    console.error(checkError);

    showToast(
      "Unable to check follow status."
    );

    return;

  }


  if (existing) {

    const {
      error
    } =
      await supabaseClient
        .from("follows")
        .delete()
        .eq(
          "follower_contact",
          currentContact
        )
        .eq(
          "following_contact",
          targetContact
        );


    if (error) {

      console.error(error);

      showToast(
        "Unable to unfollow."
      );

      return;

    }


    showToast(
      "Unfollowed."
    );

  } else {

    const {
      error
    } =
      await supabaseClient
        .from("follows")
        .insert({

          follower_contact:
            currentContact,

          following_contact:
            targetContact

        });


    if (error) {

      console.error(error);

      showToast(
        "Unable to follow."
      );

      return;

    }


    showToast(
      "Following."
    );

  }


  await updateFollowState();

  await loadStats();

}

/* =====================================================
   USER LIST RENDERER
===================================================== */

async function renderUserList(
  contacts
) {

  const list =
    document.getElementById(
      "userList"
    );


  const {
    data: users,
    error
  } =
    await supabaseClient
      .from("users")
      .select(
        "email_or_phone,username,display_name,avatar_url,kyc_status"
      )
      .in(
        "email_or_phone",
        contacts
      );


  if (error) {

    console.error(error);

    list.innerHTML =
      `<div class="empty">
        Unable to load users.
      </div>`;

    return;

  }


  const userMap =
    new Map(
      (users || []).map(
        user =>
          [
            user.email_or_phone,
            user
          ]
      )
    );


  list.innerHTML = "";


  contacts.forEach(
    contact => {

      const user =
        userMap.get(
          contact
        );


      if (!user) return;


      const name =
        user.display_name ||
        user.username ||
        "User";


      const username =
        user.username
          ? "@" + user.username
          : "";


      const avatar =
        user.avatar_url
          ? `<img
              src="${escapeHTML(user.avatar_url)}"
              alt="">`
          : escapeHTML(
              initials(name)
            );


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "user-item";


      item.innerHTML = `

        <div class="user-avatar">
          ${avatar}
        </div>

        <div class="user-info">

          <div class="user-name">
            ${escapeHTML(name)}
            ${
              user.kyc_status === "approved"
                ? " ✓"
                : ""
            }
          </div>

          <div class="user-username">
            ${escapeHTML(username)}
          </div>

        </div>

        <div class="user-actions">

          <button
            class="small-button primary"
            type="button"
            data-chat="${escapeHTML(
              user.username || ""
            )}">
            Chat
          </button>

          <button
            class="small-button"
            type="button"
            data-follow="${escapeHTML(
              user.email_or_phone
            )}">
            Follow
          </button>

        </div>
      `;


      list.appendChild(
        item
      );

    }
  );


  list
    .querySelectorAll(
      "[data-chat]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            const username =
              button.dataset.chat;


            if (!username) {

              showToast(
                "This user has no username."
              );

              return;

            }


            window.location.href =
              "./chat.html?username=" +
              encodeURIComponent(
                username
              );

          }
        );

      }
    );


  list
    .querySelectorAll(
      "[data-follow]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          async () => {

            const contact =
              button.dataset.follow;


            await toggleFollow(
              contact
            );


            const {
              data
            } =
              await supabaseClient
                .from("follows")
                .select(
                  "follower_contact"
                )
                .eq(
                  "follower_contact",
                  currentContact
                )
                .eq(
                  "following_contact",
                  contact
                )
                .maybeSingle();


            button.textContent =
              data
                ? "Following"
                : "Follow";

          }
        );

      }
    );

}

/* =====================================================
   UPLOAD AVATAR
===================================================== */

async function uploadAvatar(
  file
) {

  if (!file) {

    return viewedUser.avatar_url || null;

  }


  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  const path =
    `${currentContact}/${Date.now()}.${extension}`;


  const {
    error: uploadError
  } =
    await supabaseClient
      .storage
      .from(AVATAR_BUCKET)
      .upload(
        path,
        file,
        {
          upsert: true,
          contentType: file.type
        }
      );


  if (uploadError) {

    console.error(
      uploadError
    );

    throw new Error(
      "Profile photo upload failed. Make sure the avatars storage bucket exists."
    );

  }


  const {
    data
  } =
    supabaseClient
      .storage
      .from(AVATAR_BUCKET)
      .getPublicUrl(
        path
      );


  return data.publicUrl;

}


/* =====================================================
   SAVE PROFILE
===================================================== */

document
  .getElementById("editForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      const username =
        document.getElementById(
          "editUsername"
        ).value
          .trim()
          .toLowerCase()
          .replace(
            /^@/,
            ""
          );


      const displayName =
        document.getElementById(
          "editDisplayName"
        ).value.trim();


      const bio =
        document.getElementById(
          "editBio"
        ).value.trim();


      const city =
        document.getElementById(
          "editCity"
        ).value;


      const sellerType =
        document.getElementById(
          "editSellerType"
        ).value;


      const category =
        document.getElementById(
          "editCategory"
        ).value;


      if (!username) {

        showToast(
          "Please enter a username."
        );

        return;

      }


      if (
        !/^[a-z0-9._]{3,30}$/
          .test(username)
      ) {

        showToast(
          "Username can use a-z, 0-9, dot and underscore."
        );

        return;

      }


      /*
        Prevent duplicate usernames.
      */

      const {
        data: duplicate
      } =
        await supabaseClient
          .from("users")
          .select(
            "email_or_phone"
          )
          .eq(
            "username",
            username
          )
          .neq(
            "email_or_phone",
            currentContact
          )
          .maybeSingle();


      if (duplicate) {

        showToast(
          "That username is already taken."
        );

        return;

      }


      let avatarUrl =
        viewedUser.avatar_url ||
        null;


      try {

        avatarUrl =
          await uploadAvatar(
            document.getElementById(
              "avatarFile"
            ).files?.[0]
          );

      } catch (error) {

        showToast(
          error.message
        );

        return;

      }


      const {
        data,
        error
      } =
      await supabaseClient
        .from("users")
        .update({

          username,

          display_name:
            displayName,

          bio,

          city,

          seller_type:
            sellerType,

          category,

          avatar_url:
            avatarUrl

        })
        .eq(
          "email_or_phone",
          currentContact
        )
        .select()
        .single();


      if (error) {

        console.error(error);

        showToast(
          "Unable to save profile."
        );

        return;

      }


      viewedUser = data;


      renderProfile();

      await loadStats();

      await loadBadges();


      closeModal(
        "editModal"
      );


      showToast(
        "Profile updated successfully."
      );

    }
  );

) {

  document.body.classList.toggle(
    "dark",
    theme === "dark"
  );


  document.getElementById(
    "themeButton"
  ).textContent =
    theme === "dark"
      ? "☀"
      : "☾";


  localStorage.setItem(
    "mec_theme",
    theme
  );

}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Profile — Myanmar Elite Connect</title>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --surface-soft: #edf2f7;
      --text: #0d1b2a;
      --muted: #64748b;
      --navy: #071a34;
      --navy-2: #12385f;
      --gold: #c59b27;
      --gold-soft: #fdf6e2;
      --green: #10b981;
      --red: #ef4444;
      --border: rgba(13, 27, 42, 0.08);
      --shadow: 0 10px 30px rgba(13, 27, 42, 0.06);
      --radius: 16px;
    }

    body.dark {
      --bg: #060f1c;
      --surface: #0b192c;
      --surface-soft: #12243d;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --navy: #f1f5f9;
      --navy-2: #cbd5e1;
      --border: rgba(255, 255, 255, 0.08);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Noto Sans Myanmar", "Myanmar Text", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .hidden {
      display: none !important;
    }

    .app {
      min-height: 100vh;
      padding-bottom: 90px;
    }

    /* TOPBAR */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      height: 64px;
      background: color-mix(in srgb, var(--surface) 90%, transparent);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .topbar-inner {
      width: min(1100px, calc(100% - 24px));
      height: 100%;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .brand-logo img {
      width: 80%;
      height: 80%;
      object-fit: contain;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 800;
    }

    .brand-name span {
      color: var(--gold);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-button {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      transition: 0.2s;
    }

    .icon-button:hover {
      border-color: var(--gold);
    }

    /* MAIN CONTAINER */
    .main {
      width: min(880px, calc(100% - 24px));
      margin: 16px auto 0;
    }

    /* SEARCH BOX */
    .search-box {
      position: relative;
      margin-bottom: 14px;
    }

    .search-input {
      width: 100%;
      height: 46px;
      padding: 0 44px 0 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      outline: none;
      transition: 0.2s;
    }

    .search-input:focus {
      border-color: var(--gold);
    }

    .search-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
    }

    .search-results {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      z-index: 50;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .search-result {
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }

    .search-result:last-child {
      border-bottom: none;
    }

    .result-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--surface-soft);
    }

    .result-info {
      flex: 1;
      min-width: 0;
    }

    .result-name {
      font-size: 13px;
      font-weight: 700;
    }

    .result-username {
      font-size: 11px;
      color: var(--muted);
    }

    /* PROFILE CARD */
    .profile-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .profile-cover {
      height: 130px;
      background: linear-gradient(135deg, var(--navy), var(--navy-2));
    }

    .profile-body {
      padding: 0 20px 20px;
    }

    .profile-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
      margin-top: -50px;
      position: relative;
    }

    .avatar-wrap {
      position: relative;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--surface-soft);
      border: 4px solid var(--surface);
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
    }

    .verified-dot {
      position: absolute;
      right: 2px;
      bottom: 6px;
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #3b82f6;
      color: white;
      border: 2px solid var(--surface);
      font-size: 11px;
    }

    .profile-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      min-height: 38px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      transition: 0.2s;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--navy);
      color: white;
      border-color: transparent;
    }

    body.dark .btn-primary {
      background: var(--gold);
      color: var(--navy);
    }

    .profile-name-row {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .profile-name {
      font-size: 22px;
      font-weight: 800;
    }

    .mcp-mark {
      padding: 3px 8px;
      border-radius: 20px;
      background: rgba(197, 155, 39, 0.12);
      color: var(--gold);
      border: 1px solid rgba(197, 155, 39, 0.25);
      font-size: 10px;
      font-weight: 800;
    }

    .username {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .bio {
      font-size: 13px;
      line-height: 1.6;
      margin-top: 10px;
    }

    .location {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 20px;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      font-size: 10px;
      font-weight: 700;
    }

    /* STATS */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      margin-top: 16px;
    }

    .stat {
      padding: 12px 6px;
      text-align: center;
      cursor: pointer;
      border-right: 1px solid var(--border);
    }

    .stat:last-child {
      border-right: none;
    }

    .stat-value {
      font-size: 16px;
      font-weight: 800;
    }

    .stat-label {
      font-size: 10px;
      color: var(--muted);
      font-weight: 600;
    }

    /* SETTINGS LIST */
    .settings-section {
      margin-top: 16px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      padding-left: 4px;
    }

    .settings-list {
      display: grid;
      gap: 6px;
    }

    .setting-row {
      width: 100%;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      text-align: left;
      transition: 0.2s;
    }

    .setting-row:hover {
      border-color: var(--gold);
    }

    .setting-icon {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: var(--surface-soft);
      font-size: 15px;
    }

    .setting-content {
      flex: 1;
      min-width: 0;
    }

    .setting-title {
      font-size: 13px;
      font-weight: 700;
    }

    .setting-description {
      font-size: 10px;
      color: var(--muted);
    }

    .setting-arrow {
      color: var(--muted);
      font-size: 16px;
    }

    /* POSTS GRID */
    .posts-section {
      margin-top: 20px;
    }

    .posts-header {
      margin-bottom: 10px;
    }

    .posts-title {
      font-size: 15px;
      font-weight: 800;
    }

    .posts-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .post-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
    }

    .post-image {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: var(--surface-soft);
    }

    .post-info {
      padding: 8px;
    }

    .post-title {
      font-size: 11px;
      font-weight: 700;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .post-price {
      font-size: 11px;
      font-weight: 800;
      color: var(--gold);
      margin-top: 4px;
    }

    .empty {
      padding: 24px;
      text-align: center;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    /* MODAL */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: none;
      align-items: flex-end;
      justify-content: center;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
    }

    .modal.open {
      display: flex;
    }

    .modal-card {
      width: min(580px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      padding: 20px;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.1);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 800;
    }

    .close-button {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 8px;
      background: var(--surface-soft);
      color: var(--text);
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .form-control {
      width: 100%;
      min-height: 42px;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      outline: none;
    }

    .form-control:focus {
      border-color: var(--gold);
    }

    textarea.form-control {
      min-height: 80px;
      resize: vertical;
    }

    .form-help {
      font-size: 10px;
      color: var(--muted);
      margin-top: 3px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .modal-actions .btn {
      flex: 1;
    }

    /* PERSON LIST */
    .person-list {
      display: grid;
      gap: 6px;
    }

    .person {
      padding: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface-soft);
      border-radius: 10px;
    }

    .person-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
    }

    .person-info {
      flex: 1;
      min-width: 0;
    }

    .person-name {
      font-size: 12px;
      font-weight: 700;
    }

    .person-username {
      font-size: 10px;
      color: var(--muted);
    }

    /* BOTTOM NAV */
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1000;
      height: 68px;
      padding-bottom: env(safe-area-inset-bottom);
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .nav-inner {
      width: min(500px, calc(100% - 16px));
      height: 100%;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
    }

    .nav-icon {
      font-size: 17px;
    }

    .nav-item.active {
      color: var(--gold);
    }

    /* TOAST */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 80px;
      z-index: 3000;
      transform: translateX(-50%) translateY(10px);
      opacity: 0;
      pointer-events: none;
      padding: 10px 16px;
      border-radius: 10px;
      background: var(--navy);
      color: var(--surface);
      font-size: 11px;
      font-weight: 700;
      transition: 0.2s;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* RESPONSIVE */
    @media (max-width: 600px) {
      .posts-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>

<div class="app">
  <!-- HEADER -->
  <header class="topbar">
    <div class="topbar-inner">
      <a href="./index.html" class="brand">
        <div class="brand-logo">
          <img src="https://lh3.googleusercontent.com/d/1fR8TnvOjrzVbKuro9Ths1_Jt0PAxSmGd" alt="Logo">
        </div>
        <div class="brand-name">Myanmar <span>Elite</span> Connect</div>
      </a>
      <div class="top-actions">
        <button class="icon-button" id="themeButton" aria-label="Toggle theme">☾</button>
        <button class="icon-button" id="logoutButton" aria-label="Logout">⇥</button>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main">
    <!-- SEARCH -->
    <section class="search-box">
      <input id="usernameSearch" class="search-input" type="search" placeholder="Search username..." autocomplete="off">
      <span class="search-icon">⌕</span>
      <div id="searchResults" class="search-results hidden"></div>
    </section>

    <!-- PROFILE CARD -->
    <section class="profile-card">
      <div class="profile-cover"></div>
      <div class="profile-body">
        <div class="profile-head">
          <div class="avatar-wrap">
            <img id="profileAvatar" class="avatar" src="" alt="Avatar">
            <div id="verifiedDot" class="verified-dot hidden">✓</div>
          </div>
          <div class="profile-actions">
            <button id="followButton" type="button" class="btn btn-primary hidden">Follow</button>
            <button id="chatButton" type="button" class="btn hidden">Chat</button>
            <button id="editProfileButton" type="button" class="btn hidden">Edit Profile</button>
          </div>
        </div>

        <div class="profile-name-row">
          <h1 id="profileName" class="profile-name">Loading...</h1>
          <span id="mcpMark" class="mcp-mark hidden">★ MCP</span>
        </div>

        <div id="profileUsername" class="username">@username</div>
        <div id="profileBio" class="bio"></div>
        <div id="profileLocation" class="location"></div>
        <div id="profileBadges" class="badges"></div>

        <!-- STATS -->
        <div class="stats">
          <div class="stat" id="likesStat">
            <span id="likesCount" class="stat-value">0</span>
            <span class="stat-label">Likes</span>
          </div>
          <div class="stat" id="followersStat">
            <span id="followersCount" class="stat-value">0</span>
            <span class="stat-label">Followers</span>
          </div>
          <div class="stat" id="followingStat">
            <span id="followingCount" class="stat-value">0</span>
            <span class="stat-label">Following</span>
          </div>
          <div class="stat" id="postsStat">
            <span id="postsCount" class="stat-value">0</span>
            <span class="stat-label">Posts</span>
          </div>
        </div>
      </div>
    </section>

    <!-- OWN FUNCTIONS -->
    <section id="ownFunctions" class="settings-section hidden">
      <div class="section-title">Profile Management</div>
      <div class="settings-list">
        <button type="button" class="setting-row" id="myPostsButton">
          <div class="setting-icon">📝</div>
          <div class="setting-content">
            <div class="setting-title">My Posts</div>
            <div class="setting-description">View all your created listings and posts.</div>
          </div>
          <div class="setting-arrow">›</div>
        </button>

        <button type="button" class="setting-row" id="badgeButton">
          <div class="setting-icon">🏅</div>
          <div class="setting-content">
            <div class="setting-title">My Badges</div>
            <div class="setting-description">Manage your verified status and region badges.</div>
          </div>
          <div class="setting-arrow">›</div>
        </button>

        <button type="button" class="setting-row" id="kycButton">
          <div class="setting-icon">🛡️</div>
          <div class="setting-content">
            <div class="setting-title">KYC Verification</div>
            <div id="kycDescription" class="setting-description">Verify your identity status.</div>
          </div>
          <div class="setting-arrow">›</div>
        </button>

        <button type="button" class="setting-row" id="mcpButton">
          <div class="setting-icon">★</div>
          <div class="setting-content">
            <div class="setting-title">MCP Application</div>
            <div class="setting-description">Apply for Myanmar Elite Certified Partner.</div>
          </div>
          <div class="setting-arrow">›</div>
        </button>

        <button type="button" class="setting-row" id="settingsButton">
          <div class="setting-icon">⚙</div>
          <div class="setting-content">
            <div class="setting-title">Account Settings</div>
            <div class="setting-description">Update your bio, name, and profile photo.</div>
          </div>
          <div class="setting-arrow">›</div>
        </button>
      </div>
    </section>

    <!-- POSTS SECTION -->
    <section class="posts-section">
      <div class="posts-header">
        <h2 class="posts-title">Posts</h2>
      </div>
      <div id="postsGrid" class="posts-grid"></div>
    </section>
  </main>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <div class="nav-inner">
      <a class="nav-item" href="./index.html">
        <span class="nav-icon">⌂</span>
        <span>Home</span>
      </a>
      <a class="nav-item" href="./addlisting.html">
        <span class="nav-icon">＋</span>
        <span>Add</span>
      </a>
      <a class="nav-item" href="./chat.html">
        <span class="nav-icon">◌</span>
        <span>Chat</span>
      </a>
      <a class="nav-item active" href="./Profile.html">
        <span class="nav-icon">◎</span>
        <span>Profile</span>
      </a>
    </div>
  </nav>
</div>

<!-- MODALS -->
<div id="peopleModal" class="modal">
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="peopleModalTitle" class="modal-title">Connections</h2>
      <button type="button" class="close-button" onclick="closeModal('peopleModal')">×</button>
    </div>
    <div id="peopleList" class="person-list"></div>
  </div>
</div>

<div id="editModal" class="modal">
  <div class="modal-card">
    <div class="modal-head">
      <h2 class="modal-title">Edit Profile</h2>
      <button type="button" class="close-button" onclick="closeModal('editModal')">×</button>
    </div>
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:14px;">
      <img id="editAvatarPreview" class="avatar" style="width:64px;height:64px;" src="" alt="Preview">
      <div>
        <label for="avatarInput" class="btn" style="display:inline-flex; align-items:center;">Change Photo</label>
        <input id="avatarInput" type="file" accept="image/*" class="hidden">
        <div class="form-help">Supports JPG, PNG or WEBP</div>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label" for="fullNameInput">Full Name</label>
      <input id="fullNameInput" class="form-control" type="text" maxlength="80">
    </div>
    <div class="form-group">
      <label class="form-label" for="usernameInput">Username</label>
      <input id="usernameInput" class="form-control" type="text" maxlength="30">
    </div>
    <div class="form-group">
      <label class="form-label" for="bioInput">Bio</label>
      <textarea id="bioInput" class="form-control" maxlength="500"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label" for="cityInput">City</label>
      <input id="cityInput" class="form-control" type="text" maxlength="80">
    </div>
    <div class="form-group">
      <label class="form-label" for="regionInput">Region / State</label>
      <select id="regionInput" class="form-control">
        <option value="">Select Region</option>
      </select>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn" onclick="closeModal('editModal')">Cancel</button>
      <button type="button" id="saveProfileButton" class="btn btn-primary">Save Changes</button>
    </div>
  </div>
</div>

<div id="kycModal" class="modal">
  <div class="modal-card">
    <div class="modal-head">
      <h2 class="modal-title">KYC Verification</h2>
      <button type="button" class="close-button" onclick="closeModal('kycModal')">×</button>
    </div>
    <div id="kycStatusBox" class="form-help" style="margin-bottom:12px; font-weight:700;"></div>
    <div class="form-group">
      <label class="form-label" for="kycName">Full Name</label>
      <input id="kycName" class="form-control" type="text">
    </div>
    <div class="form-group">
      <label class="form-label" for="kycDocumentType">Document Type</label>
      <select id="kycDocumentType" class="form-control">
        <option value="">Select Document</option>
        <option value="NRC">NRC</option>
        <option value="Passport">Passport</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label" for="kycFront">Front Image</label>
      <input id="kycFront" class="form-control" type="file" accept="image/*">
    </div>
    <div class="form-group">
      <label class="form-label" for="kycBack">Back Image</label>
      <input id="kycBack" class="form-control" type="file" accept="image/*">
    </div>
    <div class="modal-actions">
      <button type="button" class="btn" onclick="closeModal('kycModal')">Close</button>
      <button type="button" id="submitKycButton" class="btn btn-primary">Submit KYC</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="./supabase.js"></script>
<script>
"use strict";

let currentUser = null;
let currentProfile = null;
let viewedUserId = null;
let regionList = [];
let searchTimer = null;

const $ = (id) => document.getElementById(id);

function escapeHtml(str) {
  return String(str || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function showToast(msg) {
  const t = $("toast");
  if (!t) return;
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => t.classList.remove("show"), 2600);
}

function openModal(id) { $(id)?.classList.add("open"); }
function closeModal(id) { $(id)?.classList.remove("open"); }

function fallbackAvatar(name) {
  const initial = String(name || "U").trim().charAt(0).toUpperCase();
  return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`
    <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
      <rect width="200" height="200" fill="#cbd5e1"/>
      <text x="50%" y="55%" text-anchor="middle" font-size="76" font-family="Arial" font-weight="700" fill="#0d1b2a">${initial}</text>
    </svg>`)}`;
}

async function init() {
  const savedTheme = localStorage.getItem("mec_theme") || "light";
  applyTheme(savedTheme);

  const { data: { user } } = await supabase.auth.getUser();
  currentUser = user;

  if (!currentUser) {
    window.location.href = "./auth.html?mode=login";
    return;
  }

  viewedUserId = getRequestedProfileId() || currentUser.id;
  await loadRegions();
  await loadProfile(viewedUserId);
}

function getRequestedProfileId() {
  const params = new URLSearchParams(window.location.search);
  return params.get("id") || params.get("user") || params.get("profile");
}

async function loadProfile(userId) {
  const { data, error } = await supabase
    .from("profiles")
    .select("*")
    .eq("id", userId)
    .maybeSingle();

  if (error || !data) {
    showToast("Unable to load profile.");
    return;
  }

  currentProfile = data;
  renderProfile(data);

  await Promise.all([
    loadProfileBadges(userId),
    loadProfileStats(userId),
    loadUserPosts(userId),
    loadKycStatus(userId)
  ]);

  setupProfileMode();
}

function renderProfile(p) {
  const name = p.full_name || p.username || "MEC User";
  $("profileName").textContent = name;
  $("profileUsername").textContent = p.username ? `@${p.username}` : "@username";
  $("profileBio").textContent = p.bio || "";
  
  const loc = [p.city, p.region_name].filter(Boolean).join(" · ");
  $("profileLocation").textContent = loc ? `📍 ${loc}` : "";

  const avatar = p.avatar_url || fallbackAvatar(name);
  $("profileAvatar").src = avatar;

  $("verifiedDot").classList.toggle("hidden", !p.is_verified);
  $("mcpMark").classList.toggle("hidden", !p.is_mcp);
}

function setupProfileMode() {
  const isOwn = currentUser && currentUser.id === viewedUserId;
  $("ownFunctions").classList.toggle("hidden", !isOwn);
  $("editProfileButton").classList.toggle("hidden", !isOwn);
  $("followButton").classList.toggle("hidden", isOwn);
  $("chatButton").classList.toggle("hidden", isOwn);

  if (!isOwn) loadFollowState();
}

async function loadProfileBadges(userId) {
  const container = $("profileBadges");
  container.innerHTML = "";
  const { data } = await supabase
    .from("mec_profile_badges")
    .select("mec_badges(*)")
    .eq("user_id", userId);

  (data || []).forEach(row => {
    const b = row.mec_badges;
    if (!b || !b.active) return;
    const span = document.createElement("span");
    span.className = `badge ${b.badge_type || ""}`;
    span.innerHTML = `<span>${escapeHtml(b.icon || "🏷️")}</span><span>${escapeHtml(b.label_en || b.name)}</span>`;
    container.appendChild(span);
  });
}

async function loadProfileStats(userId) {
  const [f1, f2, l1, p1] = await Promise.all([
    supabase.from("profile_follows").select("*", { count: "exact", head: true }).eq("following_id", userId),
    supabase.from("profile_follows").select("*", { count: "exact", head: true }).eq("follower_id", userId),
    supabase.from("profile_reactions").select("*", { count: "exact", head: true }).eq("profile_id", userId).eq("reaction", "like"),
    supabase.from("listings").select("*", { count: "exact", head: true }).eq("user_id", userId)
  ]);

  $("followersCount").textContent = f1.count || 0;
  $("followingCount").textContent = f2.count || 0;
  $("likesCount").textContent = l1.count || 0;
  $("postsCount").textContent = p1.count || 0;
}

async function loadUserPosts(userId) {
  const grid = $("postsGrid");
  grid.innerHTML = `<div class="empty">Loading posts...</div>`;

  const { data } = await supabase
    .from("listings")
    .select("*")
    .eq("user_id", userId)
    .order("created_at", { ascending: false })
    .limit(20);

  if (!data?.length) {
    grid.innerHTML = `<div class="empty">No posts yet.</div>`;
    return;
  }

  grid.innerHTML = "";
  data.forEach(post => {
    const card = document.createElement("article");
    card.className = "post-card";
    const img = post.show_photo_url || post.images?.[0] || fallbackAvatar(post.title);
    card.innerHTML = `
      <img class="post-image" src="${escapeHtml(img)}" alt="">
      <div class="post-info">
        <div class="post-title">${escapeHtml(post.title)}</div>
        ${post.price ? `<div class="post-price">${escapeHtml(post.price)}</div>` : ""}
      </div>
    `;
    card.onclick = () => window.location.href = `./listing.html?id=${encodeURIComponent(post.id)}`;
    grid.appendChild(card);
  });
}

async function loadRegions() {
  const { data } = await supabase.from("mec_regions").select("*").order("name_en");
  regionList = data || [];
  const select = $("regionInput");
  select.innerHTML = `<option value="">Select Region / State</option>`;
  regionList.forEach(r => {
    const opt = document.createElement("option");
    opt.value = r.code;
    opt.textContent = `${r.name_mm || r.name_en} — ${r.code}`;
    select.appendChild(opt);
  });
}

async function loadFollowState() {
  const { data } = await supabase
    .from("profile_follows")
    .select("id")
    .eq("follower_id", currentUser.id)
    .eq("following_id", viewedUserId)
    .maybeSingle();

  const btn = $("followButton");
  if (data) {
    btn.textContent = "Following";
    btn.classList.remove("btn-primary");
  } else {
    btn.textContent = "Follow";
    btn.classList.add("btn-primary");
  }
}

async function toggleFollow() {
  if (!currentUser) return;
  const { data } = await supabase
    .from("profile_follows")
    .select("id")
    .eq("follower_id", currentUser.id)
    .eq("following_id", viewedUserId)
    .maybeSingle();

  if (data) {
    await supabase.from("profile_follows").delete().eq("id", data.id);
    showToast("Unfollowed");
  } else {
    await supabase.from("profile_follows").insert({ follower_id: currentUser.id, following_id: viewedUserId });
    showToast("Following");
  }
  loadFollowState();
  loadProfileStats(viewedUserId);
}

function applyTheme(theme) {
  document.body.classList.toggle("dark", theme === "dark");
  $("themeButton").textContent = theme === "dark" ? "☀" : "☾";
  localStorage.setItem("mec_theme", theme);
}

// Event Listeners
$("themeButton").onclick = () => applyTheme(document.body.classList.contains("dark") ? "light" : "dark");
$("logoutButton").onclick = async () => { await supabase.auth.signOut(); window.location.href = "./auth.html?mode=login"; };
$("followButton").onclick = toggleFollow;
$("chatButton").onclick = () => window.location.href = `./chat.html?user=${encodeURIComponent(viewedUserId)}`;
$("editProfileButton").onclick = () => {
  $("fullNameInput").value = currentProfile.full_name || "";
  $("usernameInput").value = currentProfile.username || "";
  $("bioInput").value = currentProfile.bio || "";
  $("cityInput").value = currentProfile.city || "";
  $("regionInput").value = currentProfile.region_code || "";
  $("editAvatarPreview").src = currentProfile.avatar_url || fallbackAvatar();
  openModal("editModal");
};

$("saveProfileButton").onclick = async () => {
  const fullName = $("fullNameInput").value.trim();
  const username = $("usernameInput").value.trim().toLowerCase();
  const bio = $("bioInput").value.trim();
  const city = $("cityInput").value.trim();
  const region_code = $("regionInput").value || null;
  const region_name = regionList.find(r => r.code === region_code)?.name_en || null;

  const { error } = await supabase.from("profiles").update({
    full_name: fullName, username, bio, city, region_code, region_name
  }).eq("id", currentUser.id);

  if (error) {
    showToast(error.message);
  } else {
    showToast("Profile updated!");
    closeModal("editModal");
    loadProfile(currentUser.id);
  }
};

init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Profile — Myanmar Elite Connect</title>

  <meta
    name="description"
    content="Myanmar Elite Connect profile"
  >

  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-2: #f0f3f8;
      --text: #10233f;
      --muted: #748197;
      --navy: #071a34;
      --navy-2: #173b62;
      --gold: #d7b35a;
      --gold-soft: #f4df9d;
      --green: #15966b;
      --red: #d94b4b;
      --border: rgba(16,35,63,.09);
      --shadow: 0 18px 55px rgba(16,35,63,.10);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        "Noto Sans Myanmar",
        "Myanmar Text",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    body.dark {
      --bg: #071321;
      --surface: #0d1d31;
      --surface-2: #12263d;
      --text: #f4f7fb;
      --muted: #94a3b7;
      --navy: #f4f7fb;
      --navy-2: #dce5ef;
      --border: rgba(255,255,255,.09);
      --shadow: 0 18px 55px rgba(0,0,0,.28);
    }

    /* =====================================================
       HEADER
    ===================================================== */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 1000;

      height: 72px;

      background:
        color-mix(
          in srgb,
          var(--surface) 92%,
          transparent
        );

      border-bottom: 1px solid var(--border);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .topbar-inner {
      width: min(1180px, calc(100% - 28px));
      height: 100%;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-logo {
      width: 42px;
      height: 42px;

      display: grid;
      place-items: center;

      overflow: hidden;

      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .brand-logo img {
      width: 82%;
      height: 82%;
      object-fit: contain;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 900;
      white-space: nowrap;
    }

    .brand-name span {
      color: var(--gold);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-link {
      min-height: 42px;

      padding: 0 14px;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;

      border-radius: 12px;

      color: var(--muted);

      font-size: 12px;
      font-weight: 800;

      transition:
        background .2s ease,
        color .2s ease,
        transform .2s ease;
    }

    .nav-link:hover {
      color: var(--text);
      background: var(--surface-2);
      transform: translateY(-1px);
    }

    .nav-link.active {
      color: var(--text);
      background: var(--surface-2);
    }

    .logout-button {
      color: var(--red);
    }

    /* =====================================================
       PAGE
    ===================================================== */

    .page {
      width: min(980px, calc(100% - 28px));
      margin: 0 auto;
      padding: 34px 0 90px;
    }

    .loading {
      min-height: 60vh;

      display: grid;
      place-items: center;

      color: var(--muted);
      font-size: 14px;
    }

    .error-box {
      padding: 22px;

      border-radius: var(--radius);

      background: var(--surface);

      border: 1px solid rgba(217,75,75,.20);

      color: var(--red);

      box-shadow: var(--shadow);
    }

    /* =====================================================
       PROFILE CARD
    ===================================================== */

    .profile-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .profile-cover {
      height: 150px;

      background:
        radial-gradient(
          circle at 85% 20%,
          rgba(215,179,90,.30),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #071a34,
          #173b62
        );
    }

    .profile-body {
      position: relative;
      padding: 0 30px 30px;
    }

    .profile-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
    }

    .avatar-wrap {
      margin-top: -60px;
    }

    .avatar {
      width: 122px;
      height: 122px;

      border-radius: 50%;

      object-fit: cover;

      background: var(--surface-2);

      border: 6px solid var(--surface);

      box-shadow:
        0 12px 35px rgba(0,0,0,.16);
    }

    .profile-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding-bottom: 6px;
    }

    .button {
      min-height: 43px;

      padding: 0 16px;

      border-radius: 12px;

      border: 1px solid var(--border);

      background: var(--surface);

      color: var(--text);

      font-size: 12px;
      font-weight: 850;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;

      transition:
        transform .2s ease,
        background .2s ease,
        border-color .2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .button-primary {
      color: #fff;
      background:
        linear-gradient(
          135deg,
          var(--navy),
          var(--navy-2)
        );

      border-color: transparent;
    }

    body.dark .button-primary {
      color: #071a34;
      background:
        linear-gradient(
          135deg,
          var(--gold-soft),
          var(--gold)
        );
    }

    .button-gold {
      color: #5f470b;
      background: var(--gold-soft);
      border-color: rgba(215,179,90,.35);
    }

    .button-danger {
      color: var(--red);
    }

    .profile-info {
      margin-top: 18px;
    }

    .name-line {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .profile-name {
      font-size: 27px;
      line-height: 1.15;
      font-weight: 950;
      letter-spacing: -.7px;
    }

    .username {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .verified {
      width: 22px;
      height: 22px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      color: white;
      background: #1687d9;

      font-size: 12px;
      font-weight: 900;
    }

    .mcp-badge {
      padding: 5px 9px;

      border-radius: 999px;

      color: #664b00;
      background: var(--gold-soft);

      font-size: 10px;
      font-weight: 900;
    }

    .bio {
      max-width: 720px;

      margin-top: 14px;

      color: var(--muted);

      font-size: 14px;
      line-height: 1.75;
    }

    .profile-meta {
      margin-top: 16px;

      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .meta-pill {
      padding: 7px 10px;

      border-radius: 999px;

      color: var(--muted);
      background: var(--surface-2);

      font-size: 11px;
      font-weight: 800;
    }

    /* =====================================================
       STATS
    ===================================================== */

    .stats {
      margin-top: 25px;

      display: grid;
      grid-template-columns: repeat(4, 1fr);

      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .stat {
      min-height: 78px;

      border: 0;
      background: transparent;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      color: var(--text);

      transition: background .2s ease;
    }

    .stat:hover {
      background: var(--surface-2);
    }

    .stat strong {
      font-size: 20px;
      font-weight: 950;
    }

    .stat span {
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    /* =====================================================
       BADGES
    ===================================================== */

    .section {
      margin-top: 18px;

      background: var(--surface);

      border: 1px solid var(--border);
      border-radius: 20px;

      box-shadow:
        0 10px 35px rgba(16,35,63,.06);

      overflow: hidden;
    }

    .section-head {
      min-height: 60px;

      padding: 0 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid var(--border);
    }

    .section-title {
      font-size: 14px;
      font-weight: 900;
    }

    .section-link {
      color: var(--gold);
      font-size: 11px;
      font-weight: 850;
    }

    .section-content {
      padding: 20px;
    }

    .badge-list {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .badge {
      min-height: 43px;

      padding: 7px 11px;

      display: inline-flex;
      align-items: center;
      gap: 8px;

      border-radius: 12px;

      color: var(--text);
      background: var(--surface-2);

      border: 1px solid var(--border);

      font-size: 11px;
      font-weight: 850;
    }

    .badge-icon {
      width: 28px;
      height: 28px;

      display: grid;
      place-items: center;

      border-radius: 9px;

      background: var(--gold-soft);

      font-size: 15px;
    }

    .empty {
      padding: 25px 10px;

      text-align: center;

      color: var(--muted);

      font-size: 12px;
    }

    /* =====================================================
       FUNCTIONS
    ===================================================== */

    .function-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .function-item {
      width: 100%;

      min-height: 62px;

      padding: 10px 14px;

      display: flex;
      align-items: center;
      gap: 13px;

      background: var(--surface);
      border: 1px solid var(--border);

      border-radius: 14px;

      text-align: left;

      transition:
        background .2s ease,
        transform .2s ease;
    }

    .function-item:hover {
      background: var(--surface-2);
      transform: translateX(2px);
    }

    .function-icon {
      width: 40px;
      height: 40px;

      flex: 0 0 40px;

      display: grid;
      place-items: center;

      border-radius: 11px;

      background: var(--surface-2);

      font-size: 17px;
    }

    .function-text {
      min-width: 0;
      flex: 1;
    }

    .function-title {
      font-size: 12px;
      font-weight: 900;
    }

    .function-subtitle {
      margin-top: 3px;

      color: var(--muted);

      font-size: 10px;
      line-height: 1.4;
    }

    .function-arrow {
      color: var(--muted);
      font-size: 15px;
    }

    /* =====================================================
       POSTS
    ===================================================== */

    .post-list {
      display: grid;
      gap: 12px;
    }

    .post-card {
      padding: 16px;

      border: 1px solid var(--border);
      border-radius: 16px;

      background: var(--surface);
    }

    .post-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .post-title {
      font-size: 14px;
      font-weight: 900;
    }

    .post-price {
      color: var(--gold);
      font-size: 13px;
      font-weight: 900;
    }

    .post-description {
      margin-top: 7px;

      color: var(--muted);

      font-size: 12px;
      line-height: 1.6;
    }

    .post-meta {
      margin-top: 12px;

      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    /* =====================================================
       MODAL
    ===================================================== */

    .modal {
      position: fixed;
      inset: 0;

      z-index: 2000;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 18px;

      background: rgba(3,12,25,.60);

      backdrop-filter: blur(7px);
    }

    .modal.open {
      display: flex;
    }

    .modal-card {
      width: min(560px, 100%);
      max-height: min(760px, calc(100vh - 36px));

      overflow: auto;

      background: var(--surface);

      border: 1px solid var(--border);
      border-radius: 22px;

      box-shadow: 0 25px 80px rgba(0,0,0,.25);
    }

    .modal-head {
      position: sticky;
      top: 0;

      z-index: 2;

      min-height: 62px;

      padding: 0 18px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: var(--surface);

      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      font-size: 15px;
      font-weight: 900;
    }

    .close-button {
      width: 38px;
      height: 38px;

      border: 0;
      border-radius: 10px;

      color: var(--muted);
      background: var(--surface-2);

      font-size: 18px;
    }

    .modal-body {
      padding: 18px;
    }

    /* =====================================================
       FORM
    ===================================================== */

    .form-grid {
      display: grid;
      gap: 14px;
    }

    .form-field {
      display: grid;
      gap: 7px;
    }

    .form-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
    }

    .input,
    .select,
    .textarea {
      width: 100%;

      padding: 12px 13px;

      border-radius: 12px;

      color: var(--text);
      background: var(--surface);

      border: 1px solid var(--border);

      outline: none;

      font-size: 13px;
    }

    .textarea {
      min-height: 110px;
      resize: vertical;
    }

    .input:focus,
    .select:focus,
    .textarea:focus {
      border-color: rgba(215,179,90,.70);
      box-shadow: 0 0 0 3px rgba(215,179,90,.10);
    }

    .form-actions {
      margin-top: 6px;

      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* =====================================================
       USER LIST
    ===================================================== */

    .user-list {
      display: grid;
      gap: 7px;
    }

    .user-row {
      display: flex;
      align-items: center;
      gap: 11px;

      padding: 10px;

      border-radius: 13px;

      background: var(--surface-2);
    }

    .user-avatar {
      width: 42px;
      height: 42px;

      flex: 0 0 42px;

      object-fit: cover;

      border-radius: 50%;

      background: var(--surface);
    }

    .user-info {
      min-width: 0;
      flex: 1;
    }

    .user-name {
      font-size: 12px;
      font-weight: 900;
    }

    .user-username {
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
    }

    .user-actions {
      display: flex;
      gap: 5px;
    }

    .mini-button {
      min-height: 34px;

      padding: 0 10px;

      border-radius: 9px;

      border: 1px solid var(--border);

      background: var(--surface);

      color: var(--text);

      font-size: 10px;
      font-weight: 850;
    }

    /* =====================================================
       TOAST
    ===================================================== */

    .toast {
      position: fixed;

      left: 50%;
      bottom: 22px;

      z-index: 3000;

      max-width: calc(100% - 30px);

      padding: 12px 16px;

      transform:
        translate(-50%, 20px);

      opacity: 0;
      pointer-events: none;

      color: #fff;
      background: #071a34;

      border-radius: 12px;

      font-size: 12px;
      font-weight: 800;

      transition:
        opacity .25s ease,
        transform .25s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 760px) {

      .topbar {
        height: 64px;
      }

      .topbar-inner {
        width: calc(100% - 18px);
      }

      .brand-name {
        display: none;
      }

      .nav {
        flex: 1;
        justify-content: flex-end;
      }

      .nav-link {
        min-width: 42px;
        padding: 0 9px;
        font-size: 0;
      }

      .nav-link span {
        font-size: 18px;
      }

      .page {
        width: calc(100% - 18px);
        padding-top: 18px;
      }

      .profile-cover {
        height: 115px;
      }

      .profile-body {
        padding: 0 16px 20px;
      }

      .profile-head {
        align-items: flex-end;
      }

      .avatar {
        width: 98px;
        height: 98px;
      }

      .avatar-wrap {
        margin-top: -48px;
      }

      .profile-actions {
        padding-bottom: 0;
      }

      .profile-actions .button {
        min-width: 42px;
        padding: 0 11px;
        font-size: 0;
      }

      .profile-actions .button span {
        font-size: 16px;
      }

      .profile-name {
        font-size: 23px;
      }

      .bio {
        font-size: 13px;
      }

      .stats {
        grid-template-columns: repeat(4, 1fr);
      }

      .stat strong {
        font-size: 17px;
      }

      .stat span {
        font-size: 8px;
      }

      .section-content {
        padding: 15px;
      }
    }

    @media (max-width: 420px) {

      .nav-link {
        min-width: 38px;
        padding: 0 7px;
      }

      .profile-cover {
        height: 100px;
      }

      .avatar {
        width: 88px;
        height: 88px;
        border-width: 5px;
      }

      .avatar-wrap {
        margin-top: -42px;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .stat:nth-child(1),
      .stat:nth-child(2) {
        border-bottom: 1px solid var(--border);
      }
    }
  </style>
</head>

<body>

  <!-- ===================================================
       HEADER
  ==================================================== -->

  <header class="topbar">

    <div class="topbar-inner">

      <a href="./index.html" class="brand">

        <div class="brand-logo">
          <img
            src="https://lh3.googleusercontent.com/d/1fR8TnvOjrzVbKuro9Ths1_Jt0PAxSmGd"
            alt="Myanmar Elite Connect">
        </div>

        <div class="brand-name">
          Myanmar <span>Elite</span> Connect
        </div>

      </a>


      <!-- EXACTLY 4 MAIN NAVIGATION ITEMS -->

      <nav class="nav">

        <a
          href="./index.html"
          class="nav-link">
          <span>⌂</span>
          Home
        </a>

        <a
          href="./add-listing.html"
          class="nav-link">
          <span>＋</span>
          Add Listing
        </a>

        <a
          href="./chat.html"
          class="nav-link">
          <span>◉</span>
          Chat
        </a>

        <a
          href="./profile.html"
          class="nav-link active">
          <span>●</span>
          Profile
        </a>

      </nav>


      <!-- LOGOUT IS NOT PART OF MAIN NAV -->

      <button
        type="button"
        class="nav-link logout-button"
        id="logoutButton"
        title="Log out">

        <span>↪</span>
        Logout

      </button>

    </div>

  </header>


  <!-- ===================================================
       MAIN
  ==================================================== -->

  <main class="page">

    <div id="loading" class="loading">
      Loading profile...
    </div>

    <div id="errorBox" class="error-box" hidden></div>


    <div id="profileApp" hidden>


      <!-- =================================================
           PROFILE
      ================================================== -->

      <section class="profile-card">

        <div class="profile-cover"></div>

        <div class="profile-body">

          <div class="profile-head">

            <div class="avatar-wrap">

              <img
                id="profileAvatar"
                class="avatar"
                src=""
                alt="Profile photo">

            </div>


            <div class="profile-actions">

              <!-- OWN PROFILE -->

              <button
                type="button"
                class="button button-primary"
                id="editProfileButton">

                <span>✎</span>
                Edit Profile

              </button>


              <button
                type="button"
                class="button button-gold"
                id="mcpButton">

                <span>◆</span>
                MCP

              </button>


              <!-- OTHER PROFILE -->

              <button
                type="button"
                class="button button-primary"
                id="followButton"
                hidden>

                <span>＋</span>
                Follow

              </button>


              <button
                type="button"
                class="button"
                id="chatButton"
                hidden>

                <span>◉</span>
                Chat

              </button>

            </div>

          </div>


          <div class="profile-info">

            <div class="name-line">

              <h1
                class="profile-name"
                id="profileName">
                —
              </h1>

              <span
                class="verified"
                id="verifiedBadge"
                hidden>
                ✓
              </span>

              <span
                class="mcp-badge"
                id="mcpBadge"
                hidden>
                MCP
              </span>

            </div>


            <div
              class="username"
              id="profileUsername">
              @username
            </div>


            <p
              class="bio"
              id="profileBio">
              —
            </p>


            <div class="profile-meta">

              <span
                class="meta-pill"
                id="regionMeta">
                📍 —
              </span>

              <span
                class="meta-pill"
                id="sellerMeta">
                🏷 —
              </span>

            </div>

          </div>


          <!-- =================================================
               STATS
          ================================================== -->

          <div class="stats">

            <button
              type="button"
              class="stat"
              id="followersButton">

              <strong id="followersCount">
                0
              </strong>

  <!-- =====================================================

  ====================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    /* =====================================================
       SUPABASE CONFIG
       Existing MEC project
    ===================================================== */

    const SUPABASE_URL =
      "https://ikjwisfsdcupibgjiuvp.supabase.co";

    /*
      IMPORTANT:
      Keep the public/anon/publishable key from your existing
      supabase.js here.

      Do NOT put a service_role key in this file.
    */

    const SUPABASE_KEY =
      window.MEC_SUPABASE_KEY ||
      localStorage.getItem("MEC_SUPABASE_KEY") ||
      "";

    let supabaseClient = null;


    /* =====================================================
       GLOBAL STATE
    ===================================================== */

    let currentUser = null;
    let profileUser = null;

    let isOwnProfile = false;
    let isFollowing = false;

    let followers = [];
    let following = [];

    let regions = [];


    /* =====================================================
       HELPERS
    ===================================================== */

    const $ = (id) =>
      document.getElementById(id);


    function escapeHtml(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    function showToast(message) {

      const toast = $("toast");

      toast.textContent = message;

      toast.classList.add("show");

      clearTimeout(
        window.__toastTimer
      );

      window.__toastTimer =
        setTimeout(() => {

          toast.classList.remove("show");

        }, 2600);

    }


    function openModal(id) {

      $(id).classList.add("open");

    }


    function closeModal(id) {

      $(id).classList.remove("open");

    }


    function profileUrl(user) {

      const username =
        user?.username;

      if (username) {

        return (
          "./profile.html?username=" +
          encodeURIComponent(username)
        );

      }

      return (
        "./profile.html?id=" +
        encodeURIComponent(user.id)
      );

    }


    function defaultAvatar(name) {

      const initial =
        String(name || "U")
          .trim()
          .charAt(0)
          .toUpperCase() || "U";

      return (
        "https://ui-avatars.com/api/" +
        "?name=" +
        encodeURIComponent(initial) +
        "&background=102b4d" +
        "&color=ffffff" +
        "&bold=true"
      );

    }


    function formatDate(value) {

      if (!value) {
        return "";
      }

      const date =
        new Date(value);

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return "";
      }

      return date.toLocaleDateString(
        undefined,
        {
          year: "numeric",
          month: "short",
          day: "numeric"
        }
      );

    }


    /* =====================================================
       SUPABASE INITIALIZATION
    ===================================================== */

    function initSupabase() {

      if (!SUPABASE_KEY) {

        throw new Error(
          "Supabase public key is missing. " +
          "Use the same public key from your existing supabase.js."
        );

      }

      supabaseClient =
        window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY,
          {
            auth: {
              persistSession: true,
              autoRefreshToken: true,
              detectSessionInUrl: true
            }
          }
        );

    }


    /* =====================================================
       AUTH
    ===================================================== */

    async function getCurrentUser() {

      const {
        data,
        error
      } =
        await supabaseClient
          .auth
          .getUser();

      if (error) {
        throw error;
      }

      if (!data.user) {

        window.location.href =
          "./auth.html?mode=login";

        return null;
      }

      return data.user;

    }


    /* =====================================================
       DETERMINE TARGET PROFILE
    ===================================================== */

    async function getTargetProfile() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const username =
        params.get("username");

      const id =
        params.get("id");


      let query =
        supabaseClient
          .from("profiles")
          .select(
            [
              "id",
              "username",
              "full_name",
              "avatar_url",
              "bio",
              "city",
              "region_code",
              "region_name",
              "seller_type",
              "role",
              "is_verified",
              "is_mcp",
              "created_at"
            ].join(",")
          );


      if (username) {

        query =
          query.eq(
            "username",
            username
          );

      } else if (id) {

        query =
          query.eq(
            "id",
            id
          );

      } else {

        query =
          query.eq(
            "id",
            currentUser.id
          );

      }


      const {
        data,
        error
      } =
        await query
          .maybeSingle();


      if (error) {
        throw error;
      }


      if (!data) {

        throw new Error(
          "Profile not found."
        );

      }


      return data;

    }


    /* =====================================================
       FOLLOW STATUS
    ===================================================== */

    async function loadFollowStatus() {

      if (isOwnProfile) {
        isFollowing = false;
        return;
      }


      const {
        data,
        error
      } =
        await supabaseClient
          .from("profile_follows")
          .select("id")
          .eq(
            "follower_id",
            currentUser.id
          )
          .eq(
            "following_id",
            profileUser.id
          )
          .maybeSingle();


      if (error) {
        throw error;
      }


      isFollowing =
        Boolean(data);

    }


    /* =====================================================
       FOLLOW COUNTS
    ===================================================== */

    async function loadFollowCounts() {

      const [
        followersResult,
        followingResult
      ] =
        await Promise.all([

          supabaseClient
            .from("profile_follows")
            .select(
              "follower_id",
              {
                count: "exact",
                head: true
              }
            )
            .eq(
              "following_id",
              profileUser.id
            ),

          supabaseClient
            .from("profile_follows")
            .select(
              "following_id",
              {
                count: "exact",
                head: true
              }
            )
            .eq(
              "follower_id",
              profileUser.id
            )

        ]);


      if (followersResult.error) {
        throw followersResult.error;
      }

      if (followingResult.error) {
        throw followingResult.error;
      }


      $("followersCount").textContent =
        followersResult.count || 0;

      $("followingCount").textContent =
        followingResult.count || 0;

    }


    /* =====================================================
       PROFILE LIKES
    ===================================================== */

    async function loadProfileLikes() {

      const {
        count,
        error
      } =
        await supabaseClient
          .from("profile_reactions")
          .select(
            "id",
            {
              count: "exact",
              head: true
            }
          )
          .eq(
            "profile_id",
            profileUser.id
          )
          .eq(
            "reaction",
            "like"
          );


      if (error) {
        throw error;
      }


      $("likesCount").textContent =
        count || 0;

    }


    /* =====================================================
       POSTS
    ===================================================== */

    async function loadPosts() {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("listings")
          .select(
            [
              "id",
              "title",
              "description",
              "price",
              "currency",
              "category",
              "listing_type",
              "region",
              "city",
              "township",
              "status",
              "created_at",
              "images"
            ].join(",")
          )
          .eq(
            "user_id",
            profileUser.id
          )
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (error) {
        throw error;
      }


      const posts =
        data || [];


      $("postsCount").textContent =
        posts.length;


      const list =
        $("postList");


      if (!posts.length) {

        list.innerHTML =
          `
            <div class="empty">
              No posts yet.
            </div>
          `;

        return;
      }


      list.innerHTML =
        posts.map(post => {

          const price =
            post.price !== null &&
            post.price !== undefined
              ? (
                  `${escapeHtml(
                    post.price
                  )} ${escapeHtml(
                    post.currency || ""
                  )}`
                ).trim()
              : "";


          return `
            <article class="post-card">

              <div class="post-top">

                <div class="post-title">
                  ${escapeHtml(
                    post.title || "Untitled"
                  )}
                </div>

                ${
                  price
                    ? `
                      <div class="post-price">
                        ${price}
                      </div>
                    `
                    : ""
                }

              </div>


              ${
                post.description
                  ? `
                    <div class="post-description">
                      ${escapeHtml(
                        post.description
                      )}
                    </div>
                  `
                  : ""
              }


              <div class="post-meta">

                ${
                  post.category
                    ? `
                      <span class="meta-pill">
                        ${escapeHtml(
                          post.category
                        )}
                      </span>
                    `
                    : ""
                }

                ${
                  post.region
                    ? `
                      <span class="meta-pill">
                        📍 ${escapeHtml(
                          post.region
                        )}
                      </span>
                    `
                    : ""
                }

                ${
                  post.city
                    ? `
                      <span class="meta-pill">
                        ${escapeHtml(
                          post.city
                        )}
                      </span>
                    `
                    : ""
                }

                ${
                  post.created_at
                    ? `
                      <span class="meta-pill">
                        ${formatDate(
                          post.created_at
                        )}
                      </span>
                    `
                    : ""
                }

              </div>

            </article>
          `;

        }).join("");

    }


    /* =====================================================
       BADGES
    ===================================================== */

    async function loadBadges() {

      const list =
        $("badgeList");


      /*
        Primary badge system:
        mec_profile_badges
        -> mec_badges
      */

      let result =
        await supabaseClient
          .from("mec_profile_badges")
          .select(
            `
              badge_id,
              mec_badges (
                id,
                code,
                name,
                label_en,
                label_mm,
                icon
              )
            `
          )
          .eq(
            "user_id",
            profileUser.id
          );


      /*
        Fallback for legacy badge system.
      */

      if (
        result.error ||
        !result.data
      ) {

        result =
          await supabaseClient
            .from("user_badges")
            .select(
              `
                badge_id,
                badges (
                  id,
                  name,
                  slug,
                  description,
                  icon
                )
              `
            )
            .eq(
              "user_id",
              profileUser.id
            );

      }


      if (
        result.error ||
        !result.data ||
        !result.data.length
      ) {

        list.innerHTML =
          `
            <div class="empty">
              No badges yet.
            </div>
          `;

        return;
      }


      list.innerHTML =
        result.data.map(row => {

          const badge =
            row.mec_badges ||
            row.badges ||
            {};


          return `
            <div class="badge">

              <div class="badge-icon">
                ${
                  escapeHtml(
                    badge.icon || "🏅"
                  )
                }
              </div>

              <span>
                ${
                  escapeHtml(
                    badge.label_en ||
                    badge.name ||
                    badge.slug ||
                    badge.code ||
                    "Badge"
                  )
                }
              </span>

            </div>
          `;

        }).join("");

    }


    /* =====================================================
       REGIONS
    ===================================================== */

    async function loadRegions() {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("mec_regions")
          .select(
            "code,name_en,name_mm,region_type"
          )
          .order(
            "name_en"
          );


      if (error) {

        console.warn(
          "Region loading failed:",
          error
        );

        return;

      }


      regions =
        data || [];


      const select =
        $("editRegion");


      select.innerHTML =
        `
          <option value="">
            Select Region / State
          </option>
        `;


      regions.forEach(region => {

        const option =
          document.createElement(
            "option"
          );

        option.value =
          region.code;

        option.textContent =
          `${region.name_en} / ${region.name_mm}`;

        select.appendChild(
          option
        );

      });

    }


    /* =====================================================
       RENDER PROFILE
    ===================================================== */

    function renderProfile() {

      const fullName =
        profileUser.full_name ||
        profileUser.username ||
        "Myanmar Elite Connect User";


      const username =
        profileUser.username
          ? "@" + profileUser.username
          : "@username";


      $("profileName").textContent =
        fullName;


      $("profileUsername").textContent =
        username;


      $("profileBio").textContent =
        profileUser.bio ||
        "No bio added yet.";


      $("profileAvatar").src =
        profileUser.avatar_url ||
        defaultAvatar(fullName);


      $("regionMeta").textContent =
        profileUser.region_name
          ? `📍 ${profileUser.region_name}`
          : "📍 Region not set";


      $("sellerMeta").textContent =
        profileUser.seller_type
          ? `🏷 ${formatSellerType(
              profileUser.seller_type
            )}`
          : "🏷 Field not set";


      $("verifiedBadge").hidden =
        !profileUser.is_verified;


      $("mcpBadge").hidden =
        !profileUser.is_mcp;


      $("mcpButton").hidden =
        !isOwnProfile;


      $("editProfileButton").hidden =
        !isOwnProfile;


      $("followButton").hidden =
        isOwnProfile;


      $("chatButton").hidden =
        isOwnProfile;


      updateFollowButton();

    }


    function formatSellerType(value) {

      const map = {

        car:
          "Car",

        property:
          "Property",

        gem:
          "Gem",

        feedback:
          "Feedback",

        all_market:
          "All Market"

      };


      return (
        map[value] ||
        value
      );

    }


    /* =====================================================
       FOLLOW / UNFOLLOW
    ===================================================== */

    function updateFollowButton() {

      const button =
        $("followButton");


      if (isFollowing) {

        button.innerHTML =
          `
            <span>✓</span>
            Following
          `;

        button.classList.remove(
          "button-primary"
        );

      } else {

        button.innerHTML =
          `
            <span>＋</span>
            Follow
          `;

        button.classList.add(
          "button-primary"
        );

      }

    }


    async function toggleFollow() {

      if (
        !currentUser ||
        isOwnProfile
      ) {
        return;
      }


      const button =
        $("followButton");


      button.disabled = true;


      try {

        if (isFollowing) {

          const {
            error
          } =
            await supabaseClient
              .from("profile_follows")
              .delete()
              .eq(
                "follower_id",
                currentUser.id
              )
              .eq(
                "following_id",
                profileUser.id
              );


          if (error) {
            throw error;
          }


          isFollowing = false;

          showToast(
            "Unfollowed"
          );

        } else {

          if (
            currentUser.id ===
            profileUser.id
          ) {
            return;
          }


          const {
            error
          } =
            await supabaseClient
              .from("profile_follows")
              .insert({
                follower_id:
                  currentUser.id,

                following_id:
                  profileUser.id
              });


          if (error) {
            throw error;
          }


          isFollowing = true;

          showToast(
            "Following"
          );

        }


        updateFollowButton();

        await loadFollowCounts();

      } catch (error) {

        console.error(
          error
        );

        showToast(
          error.message ||
          "Unable to update follow."
        );

      } finally {

        button.disabled = false;

      }

    }


    /* =====================================================
       FOLLOWERS / FOLLOWING USERS
    ===================================================== */

    async function loadUsers(type) {

      const list =
        $("userList");


      $("usersModalTitle").textContent =
        type === "followers"
          ? "Followers"
          : "Following";


      list.innerHTML =
        `
          <div class="empty">
            Loading...
          </div>
        `;


      openModal(
        "usersModal"
      );


      try {

        const column =
          type === "followers"
            ? "following_id"
            : "follower_id";


        const relationColumn =
          type === "followers"
            ? "follower_id"
            : "following_id";


        const {
          data,
          error
        } =
          await supabaseClient
            .from("profile_follows")
            .select(
              `
                ${relationColumn},
                created_at
              `
            )
            .eq(
              column,
              profileUser.id
            )
            .order(
              "created_at",
              {
                ascending: false
              }
            );


        if (error) {
          throw error;
        }


        const rows =
          data || [];


        if (!rows.length) {

          list.innerHTML =
            `
              <div class="empty">
                ${
                  type === "followers"
                    ? "No followers yet."
                    : "Not following anyone yet."
                }
              </div>
            `;

          return;

        }


        const ids =
          rows.map(
            row =>
              row[relationColumn]
          );


        const {
          data: users,
          error: usersError
        } =
          await supabaseClient
            .from("profiles")
            .select(
              [
                "id",
                "username",
                "full_name",
                "avatar_url",
                "bio",
                "is_verified",
                "is_mcp"
              ].join(",")
            )
            .in(
              "id",
              ids
            );


        if (usersError) {
          throw usersError;
        }


        const userMap =
          new Map(
            (users || []).map(
              user => [
                user.id,
                user
              ]
            )
          );


        list.innerHTML =
          ids
            .map(id => {

              const user =
                userMap.get(id);


              if (!user) {
                return "";
              }


              return renderUserRow(
                user
              );

            })
            .join("");


      } catch (error) {

        console.error(
          error
        );

        list.innerHTML =
          `
            <div class="empty">
              Unable to load users.
            </div>
          `;

      }

    }


    function renderUserRow(user) {

      const name =
        user.full_name ||
        user.username ||
        "User";


      const avatar =
        user.avatar_url ||
        defaultAvatar(name);


      return `
        <div class="user-row">

          <img
            class="user-avatar"
            src="${escapeHtml(avatar)}"
            alt="${escapeHtml(name)}">

          <div class="user-info">

            <div class="user-name">

              ${escapeHtml(name)}

              ${
                user.is_verified
                  ? " ✓"
                  : ""
              }

              ${
                user.is_mcp
                  ? " ◆"
                  : ""
              }

            </div>

            <div class="user-username">
              ${
                user.username
                  ? "@" +
                    escapeHtml(
                      user.username
                    )
                  : ""
              }
            </div>

          </div>

          <div class="user-actions">

            <button
              type="button"
              class="mini-button"
              onclick="openUserProfile('${escapeHtml(user.id)}')">
              Profile
            </button>

            ${
              currentUser.id !== user.id
                ? `
                  <button
                    type="button"
                    class="mini-button"
                    onclick="startChat('${escapeHtml(user.id)}')">
                    Chat
                  </button>
                `
                : ""
            }

          </div>

        </div>
      `;

    }


    window.openUserProfile =
      function(id) {

        window.location.href =
          "./profile.html?id=" +
          encodeURIComponent(id);

      };


    /* =====================================================
       CHAT
    ===================================================== */

    async function startChat(otherUserId) {

      if (
        !currentUser ||
        !otherUserId ||
        currentUser.id === otherUserId
      ) {
        return;
      }


      try {

        const ids =
          [
            currentUser.id,
            otherUserId
          ].sort();


        const {
          data: existing,
          error: findError
        } =
          await supabaseClient
            .from("chat_rooms")
            .select(
              "id"
            )
            .eq(
              "user_one",
              ids[0]
            )
            .eq(
              "user_two",
              ids[1]
            )
            .maybeSingle();


        if (findError) {
          throw findError;
        }


        let roomId =
          existing?.id;


        if (!roomId) {

          const {
            data: room,
            error
          } =
            await supabaseClient
              .from("chat_rooms")
              .insert({
                user_one:
                  ids[0],

                user_two:
                  ids[1]
              })
              .select(
                "id"
              )
              .single();


          if (error) {
            throw error;
          }


          roomId =
            room.id;

        }


        /*
          Chat.html can use:
          ?room=<roomId>
          and/or
          ?user=<otherUserId>
        */

        window.location.href =
          "./chat.html?room=" +
          encodeURIComponent(roomId) +
          "&user=" +
          encodeURIComponent(
            otherUserId
          );

      } catch (error) {

        console.error(
          error
        );

        showToast(
          error.message ||
          "Unable to start chat."
        );

      }

    }


    window.startChat =
      startChat;


    /* =====================================================
       EDIT PROFILE
    ===================================================== */

    function fillEditForm() {

      $("editUsername").value =
        profileUser.username ||
        "";

      $("editFullName").value =
        profileUser.full_name ||
        "";

      $("editBio").value =
        profileUser.bio ||
        "";

      $("editCity").value =
        profileUser.city ||
        "";

      $("editAvatar").value =
        profileUser.avatar_url ||
        "";

      $("editSellerType").value =
        profileUser.seller_type ||
        "";

      $("editRegion").value =
        profileUser.region_code ||
        "";

    }


    async function saveProfile(event) {

      event.preventDefault();


      const button =
        $("saveProfileButton");


      button.disabled = true;

      button.textContent =
        "Saving...";


      try {

        const username =
          $("editUsername")
            .value
            .trim()
            .toLowerCase()
            .replace(
              /\s+/g,
              "_"
            );


        if (!/^[a-z0-9._-]{3,30}$/.test(username)) {

          throw new Error(
            "Username must be 3–30 characters and use only letters, numbers, dot, underscore or hyphen."
          );

        }


        const regionCode =
          $("editRegion").value ||
          null;


        const selectedRegion =
          regions.find(
            region =>
              region.code ===
              regionCode
          );


        const payload = {

          username,

          full_name:
            $("editFullName")
              .value
              .trim() ||
            null,

          bio:
            $("editBio")
              .value
              .trim() ||
            null,

          city:
            $("editCity")
              .value
              .trim() ||
            null,

          region_code:
            regionCode,

          region_name:
            selectedRegion
              ? selectedRegion.name_en
              : null,

          seller_type:
            $("editSellerType").value ||
            null,

          avatar_url:
            $("editAvatar")
              .value
              .trim() ||
            null

        };


        /*
          Check duplicate username
          before updating.
        */

        const {
          data: duplicate,
          error: duplicateError
        } =
          await supabaseClient
            .from("profiles")
            .select("id")
            .eq(
              "username",
              username
            )
            .neq(
              "id",
              currentUser.id
            )
            .maybeSingle();


        if (duplicateError) {
          throw duplicateError;
        }


        if (duplicate) {

          throw new Error(
            "That username is already in use."
          );

        }


        const {
          data,
          error
        } =
          await supabaseClient
            .from("profiles")
            .update(
              payload
            )
            .eq(
              "id",
              currentUser.id
            )
            .select()
            .single();


        if (error) {
          throw error;
        }


        profileUser =
          data;


        closeModal(
          "editModal"
        );


        renderProfile();


        await Promise.all([
          loadFollowCounts(),
          loadProfileLikes(),
          loadPosts(),
          loadBadges()
        ]);


        /*
          If username changed,
          update URL without reloading.
        */

        const url =
          new URL(
            window.location.href
          );


        url.searchParams.delete(
          "id"
        );

        url.searchParams.set(
          "username",
          profileUser.username
        );


        window.history.replaceState(
          {},
          "",
          url
        );


        showToast(
          "Profile updated successfully."
        );


      } catch (error) {

        console.error(
          error
        );

        showToast(
          error.message ||
          "Unable to save profile."
        );

      } finally {

        button.disabled = false;

        button.textContent =
          "Save Changes";

      }

    }


    /* =====================================================
       KYC STATUS
    ===================================================== */

    async function loadKycStatus() {

      if (!isOwnProfile) {

        $("kycSubtitle").textContent =
          "KYC status is private.";

        return;

      }


      const {
        data,
        error
      } =
        await supabaseClient
          .from("kyc_submissions")
          .select(
            [
              "status",
              "created_at",
              "reviewed_at",
              "rejection_reason"
            ].join(",")
          )
          .eq(
            "user_id",
            currentUser.id
          )
          .order(
            "created_at",
            {
              ascending: false
            }
          )
          .limit(1)
          .maybeSingle();


      if (error) {

        console.warn(
          "KYC status:",
          error
        );

        $("kycSubtitle").textContent =
          "Open KYC verification.";

        return;

      }


      if (!data) {

        $("kycSubtitle").textContent =
          "Not submitted yet.";

        return;

      }


      const status =
        String(
          data.status || ""
        ).toLowerCase();


      const statusText = {

        pending:
          "Pending review",

        approved:
          "Verified",

        rejected:
          "Rejected"

      }[status] ||
        "Submitted";


      $("kycSubtitle").textContent =
        statusText;

    }


    async function openKyc() {

      if (!isOwnProfile) {
        return;
      }


      const content =
        $("kycContent");


      content.innerHTML =
        "Loading KYC status...";


      openModal(
        "kycModal"
      );


      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("kyc_submissions")
            .select(
              [
                "status",
                "document_type",
                "created_at",
                "reviewed_at",
                "rejection_reason"
              ].join(",")
            )
            .eq(
              "user_id",
              currentUser.id
            )
            .order(
              "created_at",
              {
                ascending: false
              }
            )
            .limit(1)
            .maybeSingle();


        if (error) {
          throw error;
        }


        if (!data) {

          content.innerHTML =
            `
              <div class="empty">
                You have not submitted KYC yet.
              </div>
            `;

        } else {

          const status =
            String(
              data.status || "pending"
            ).toLowerCase();


          const statusText =
            status === "approved"
              ? "✓ Approved"
              : status === "rejected"
                ? "✕ Rejected"
                : "◷ Pending";


          content.innerHTML =
            `
              <div class="post-card">

                <div class="post-title">
                  KYC Status
                </div>

                <div class="post-description">

                  Status:
                  <strong>
                    ${escapeHtml(
                      statusText
                    )}
                  </strong>

                  <br>

                  Document:
                  ${escapeHtml(
                    data.document_type ||
                    "—"
                  )}

                  <br>

                  Submitted:
                  ${escapeHtml(
                    formatDate(
                      data.created_at
                    )
                  )}

                  ${
                    data.rejection_reason
                      ? `
                        <br><br>
                        Reason:
                        ${escapeHtml(
                          data.rejection_reason
                        )}
                      `
                      : ""
                  }

                </div>

              </div>
            `;

        }


      } catch (error) {

        console.error(
          error
        );

        content.innerHTML =
          `
            <div class="empty">
              Unable to load KYC status.
            </div>
          `;

      }

    }


    /* =====================================================
       MCP
    ===================================================== */

    function openMcp() {

      window.location.href =
        "./MCP.html";

    }


    /* =====================================================
       EVENT HANDLERS
    ===================================================== */

    function setupEvents() {

      $("editProfileButton")
        .addEventListener(
          "click",
          () => {

            fillEditForm();

            openModal(
              "editModal"
            );

          }
        );


      $("editFunction")
        .addEventListener(
          "click",
          () => {

            fillEditForm();

            openModal(
              "editModal"
            );

          }
        );


      $("editProfileForm")
        .addEventListener(
          "submit",
          saveProfile
        );


      $("followButton")
        .addEventListener(
          "click",
          toggleFollow
        );


      $("chatButton")
        .addEventListener(
          "click",
          () => {

            startChat(
              profileUser.id
            );

          }
        );


      $("chatFunction")
        .addEventListener(
          "click",
          () => {

            if (isOwnProfile) {

              window.location.href =
                "./chat.html";

              return;

            }


            startChat(
              profileUser.id
            );

          }
        );


      $("mcpButton")
        .addEventListener(
          "click",
          openMcp
        );


      $("mcpFunction")
        .addEventListener(
          "click",
          openMcp
        );


      $("kycFunction")
        .addEventListener(
          "click",
          openKyc
        );


      $("kycOpenButton")
        .addEventListener(
          "click",
          () => {

            /*
              Use the existing KYC page
              when available.
            */

            window.location.href =
              "./kyc.html";

          }
        );


      $("followersButton")
        .addEventListener(
          "click",
          () => {

            loadUsers(
              "followers"
            );

          }
        );


      $("followersFunction")
        .addEventListener(
          "click",
          () => {

            loadUsers(
              "followers"
            );

          }
        );


      $("followingButton")
        .addEventListener(
          "click",
          () => {

            loadUsers(
              "following"
            );

          }
        );


      $("followingFunction")
        .addEventListener(
          "click",
          () => {

            loadUsers(
              "following"
            );

          }
        );


      $("postsButton")
        .addEventListener(
          "click",
          () => {

            $("postsSection")
              .scrollIntoView({
                behavior: "smooth"
              });

          }
        );


      $("myPostsFunction")
        .addEventListener(
          "click",
          () => {

            $("postsSection")
              .scrollIntoView({
                behavior: "smooth"
              });

          }
        );


      $("likesButton")
        .addEventListener(
          "click",
          () => {

            showToast(
              "Profile likes: " +
              $("likesCount").textContent
            );

          }
        );


      $("logoutButton")
        .addEventListener(
          "click",
          async () => {

            try {

              const {
                error
              } =
                await supabaseClient
                  .auth
                  .signOut();


              if (error) {
                throw error;
              }


              window.location.href =
                "./auth.html?mode=login";

            } catch (error) {

              console.error(
                error
              );

              showToast(
                "Unable to log out."
              );

            }

          }
        );


      document
        .querySelectorAll(
          "[data-close]"
        )
        .forEach(button => {

          button.addEventListener(
            "click",
            () => {

              closeModal(
                button.dataset.close
              );

            }
          );

        });


      document
        .querySelectorAll(
          ".modal"
        )
        .forEach(modal => {

          modal.addEventListener(
            "click",
            event => {

              if (
                event.target ===
                modal
              ) {

                modal.classList.remove(
                  "open"
                );

              }

            }
          );

        });


      document.addEventListener(
        "keydown",
        event => {

          if (
            event.key === "Escape"
          ) {

            document
              .querySelectorAll(
                ".modal.open"
              )
              .forEach(modal => {

                modal.classList.remove(
                  "open"
                );

              });

          }

        }
      );

    }


    /* =====================================================
       MAIN LOAD
    ===================================================== */

    async function init() {

      try {

        if (
          typeof window.supabase ===
          "undefined"
        ) {

          throw new Error(
            "Supabase library failed to load."
          );

        }


        initSupabase();


        currentUser =
          await getCurrentUser();


        if (!currentUser) {
          return;
        }


        profileUser =
          await getTargetProfile();


        isOwnProfile =
          currentUser.id ===
          profileUser.id;


        setupEvents();


        renderProfile();


        await loadRegions();


        await Promise.all([

          loadFollowStatus(),

          loadFollowCounts(),

          loadProfileLikes(),

          loadPosts(),

          loadBadges(),

          loadKycStatus()

        ]);


        renderProfile();


        $("loading").hidden =
          true;

        $("profileApp").hidden =
          false;


      } catch (error) {

        console.error(
          "PROFILE ERROR:",
          error
        );


        $("loading").hidden =
          true;


        $("errorBox").hidden =
          false;


        $("errorBox").textContent =
          error.message ||
          "Unable to load profile.";

      }

    }


    init();

  </script>

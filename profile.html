<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Myanmar Elite Connect user profile">
<meta name="theme-color" content="#071a34">
<title>Profile — Myanmar Elite Connect</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase.js"></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--soft:#eef2f7;--text:#10233f;--muted:#718097;--navy:#071a34;--gold:#d7b35a;--green:#16a36a;--red:#d94d5b;--blue:#239be8;--line:rgba(16,35,63,.1);--shadow:0 16px 45px rgba(16,35,63,.08);--r:22px}
body.dark{--bg:#071321;--card:#0d1d31;--soft:#12263d;--text:#f4f7fb;--muted:#9aa9bb;--navy:#f4f7fb;--line:rgba(255,255,255,.1);--shadow:0 16px 45px rgba(0,0,0,.28)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans Myanmar","Myanmar Text",system-ui,-apple-system,"Segoe UI",sans-serif;transition:.2s}button,input,textarea{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}.hidden{display:none!important}
.header{position:sticky;top:0;z-index:50;height:66px;background:color-mix(in srgb,var(--card) 92%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}.header-in{width:min(1100px,calc(100% - 24px));height:100%;margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:14px;white-space:nowrap}.brand-logo{width:39px;height:39px;border:1px solid var(--line);border-radius:11px;display:grid;place-items:center;overflow:hidden;background:var(--card)}.brand-logo img{width:84%;height:84%;object-fit:contain}.brand b{color:var(--gold)}.head-actions{display:flex;gap:7px}.icon{width:39px;height:39px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--text);display:grid;place-items:center}
.page{width:min(920px,calc(100% - 24px));margin:22px auto 45px}.loading{min-height:60vh;display:grid;place-items:center}.spinner{width:35px;height:35px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.error{padding:35px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.error-icon{font-size:35px}.error h2{margin:10px 0 6px;font-size:18px}.error p{margin:0;color:var(--muted);font-size:12px;line-height:1.7}.btn{min-height:42px;padding:0 15px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--text);font-size:11px;font-weight:850;transition:.18s}.btn:hover{transform:translateY(-1px)}.btn.primary{background:var(--navy);color:var(--bg);border-color:transparent}.btn.following{background:rgba(22,163,106,.1);border-color:rgba(22,163,106,.25);color:var(--green)}.btn.liked{background:rgba(217,77,91,.1);border-color:rgba(217,77,91,.25);color:var(--red)}.btn.danger{color:var(--red)}
.profile{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:27px;box-shadow:var(--shadow);padding:29px}.profile:after{content:"";position:absolute;width:340px;height:340px;right:-180px;top:-180px;border-radius:50%;background:rgba(215,179,90,.08);pointer-events:none}.main{position:relative;z-index:2;display:flex;gap:22px;align-items:center}.avatar-box{position:relative;flex:0 0 auto}.avatar{width:116px;height:116px;border-radius:50%;object-fit:cover;display:block;background:var(--soft);border:4px solid var(--card);box-shadow:0 10px 30px rgba(0,0,0,.12)}.verified{display:none;position:absolute;right:2px;bottom:5px;width:29px;height:29px;border-radius:50%;background:var(--blue);color:#fff;border:3px solid var(--card);place-items:center;font-size:12px;font-weight:900}.identity{min-width:0;flex:1}.username{margin:0;font-size:clamp(25px,5vw,37px);line-height:1.06;letter-spacing:-.7px;word-break:break-word}.username .at{color:var(--gold)}.real{margin-top:7px;font-size:13px;color:var(--muted)}.location{margin-top:6px;font-size:11px;color:var(--muted)}.role{display:inline-flex;margin-top:9px;padding:5px 9px;border-radius:999px;background:rgba(215,179,90,.12);color:var(--gold);font-size:9px;font-weight:900}.bio{margin:12px 0 0;color:var(--muted);font-size:13px;line-height:1.75;white-space:pre-wrap;word-break:break-word}.actions{position:relative;z-index:3;display:flex;flex-wrap:wrap;gap:8px;margin-top:23px}.stats{position:relative;z-index:3;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:24px;padding-top:22px;border-top:1px solid var(--line)}.stat{text-align:center}.stat strong{display:block;font-size:20px}.stat span{display:block;margin-top:4px;color:var(--muted);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.45px}
.section{margin-top:17px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}.section-head{padding:16px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.section-title{font-size:14px;font-weight:950}.section-sub{font-size:9px;color:var(--muted)}.listings{padding:15px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.listing{min-width:0;border:1px solid var(--line);border-radius:15px;overflow:hidden;background:var(--soft);transition:.18s}.listing:hover{transform:translateY(-2px)}.listing img{display:block;width:100%;height:175px;object-fit:cover;background:var(--card)}.listing-info{padding:11px}.listing-title{font-size:12px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.listing-meta{margin-top:5px;color:var(--muted);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.price{margin-top:7px;color:var(--gold);font-size:12px;font-weight:950}.empty{padding:27px;text-align:center;color:var(--muted);font-size:11px;line-height:1.7}
.comment-form{padding:14px;display:flex;gap:8px}.comment-input{flex:1;min-height:44px;max-height:130px;resize:vertical;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--text);outline:none}.comment-input:focus{border-color:rgba(215,179,90,.55)}.comments{border-top:1px solid var(--line)}.comment{padding:14px 17px;border-bottom:1px solid var(--line)}.comment:last-child{border-bottom:0}.comment-top{display:flex;justify-content:space-between;gap:10px}.comment-user{font-size:11px;font-weight:900}.comment-date{font-size:9px;color:var(--muted)}.comment-text{margin-top:7px;color:var(--muted);font-size:11px;line-height:1.65;white-space:pre-wrap;word-break:break-word}.delete{margin-top:7px;border:0;background:none;color:var(--red);font-size:9px;font-weight:800;padding:0}
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.58);backdrop-filter:blur(8px)}.modal.show{display:flex}.modal-card{width:min(520px,100%);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:21px;box-shadow:var(--shadow)}.modal-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.modal-title{font-weight:950;font-size:15px}.close{border:0;background:none;color:var(--muted);font-size:22px}.form{padding:18px}.field{margin-bottom:13px}.field label{display:block;margin-bottom:6px;color:var(--muted);font-size:10px;font-weight:850}.field input,.field textarea,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--text);outline:none}.field textarea{min-height:105px;resize:vertical}.save{width:100%;height:44px;border:0;border-radius:12px;background:var(--navy);color:var(--bg);font-weight:900}.toast{position:fixed;left:50%;bottom:20px;z-index:200;max-width:calc(100% - 30px);padding:11px 15px;border-radius:12px;background:var(--navy);color:var(--bg);font-size:11px;font-weight:800;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:650px){.page{margin-top:14px}.profile{padding:20px 16px;border-radius:22px}.main{align-items:flex-start;gap:14px}.avatar{width:88px;height:88px}.verified{width:25px;height:25px;bottom:1px}.username{font-size:24px}.actions .btn{flex:1;min-width:112px}.listings{grid-template-columns:1fr}.listing img{height:190px}.comment-form{padding:11px}.comment-form .btn{min-width:72px}.brand-name{font-size:12px}}
</style>
</head>
<body>
<header class="header"><div class="header-in"><a class="brand" href="./index.html"><span class="brand-logo"><img src="https://lh3.googleusercontent.com/d/1fR8TnvOjrzVbKuro9Ths1_Jt0PAxSmGd" alt="Myanmar Elite Connect"></span><span class="brand-name">Myanmar Elite <b>Connect</b></span></a><div class="head-actions"><button class="icon" id="themeBtn" type="button" aria-label="Toggle theme">☾</button><button class="icon" id="homeBtn" type="button" aria-label="Home">⌂</button></div></div></header>
<main class="page">
<div id="loading" class="loading"><div class="spinner" aria-label="Loading"></div></div>
<div id="error" class="error hidden"><div class="error-icon">😕</div><h2 id="errorTitle">Profile not found</h2><p id="errorText">We couldn't load this profile.</p><button class="btn primary" id="backBtn" type="button">Back to home</button></div>
<section id="profile" class="profile hidden"><div class="main"><div class="avatar-box"><img id="avatar" class="avatar" alt="Profile photo"><span id="verified" class="verified">✓</span></div><div class="identity"><h1 id="username" class="username"></h1><div id="real" class="real"></div><div id="location" class="location"></div><div id="role" class="role hidden"></div><p id="bio" class="bio"></p></div></div><div class="actions"><button id="follow" class="btn primary" type="button">＋ Follow</button><button id="like" class="btn" type="button">♡ Like</button><button id="message" class="btn" type="button">✉ Message</button><button id="share" class="btn" type="button">↗ Share</button><button id="edit" class="btn hidden" type="button">✎ Edit</button><button id="report" class="btn danger" type="button">⚑ Report</button></div><div class="stats"><div class="stat"><strong id="followers">0</strong><span>Followers</span></div><div class="stat"><strong id="following">0</strong><span>Following</span></div><div class="stat"><strong id="listingCount">0</strong><span>Listings</span></div></div></section>
<section id="listingSection" class="section hidden"><div class="section-head"><span class="section-title">Recent listings</span><span class="section-sub">Marketplace</span></div><div id="listings" class="listings"></div></section>
<section id="commentSection" class="section hidden"><div class="section-head"><span class="section-title">Profile comments</span><span class="section-sub">Public</span></div><form id="commentForm" class="comment-form"><textarea id="commentInput" class="comment-input" maxlength="500" rows="1" placeholder="Write a comment..."></textarea><button class="btn primary" type="submit">Post</button></form><div id="comments" class="comments"></div></section>
</main>
<div id="editModal" class="modal"><div class="modal-card"><div class="modal-head"><span class="modal-title">Edit profile</span><button class="close" data-close="editModal" type="button">×</button></div><form id="editForm" class="form"><div class="field"><label>Username</label><input id="editUsername" maxlength="40" required></div><div class="field"><label>Full name</label><input id="editName" maxlength="100"></div><div class="field"><label>Avatar URL</label><input id="editAvatar" maxlength="1000" type="url"></div><div class="field"><label>City</label><input id="editCity" maxlength="80"></div><div class="field"><label>Bio</label><textarea id="editBio" maxlength="500"></textarea></div><button class="save" type="submit">Save changes</button></form></div></div>
<div id="reportModal" class="modal"><div class="modal-card"><div class="modal-head"><span class="modal-title">Report profile</span><button class="close" data-close="reportModal" type="button">×</button></div><form id="reportForm" class="form"><div class="field"><label>Reason</label><select id="reportReason"><option>Spam</option><option>Harassment</option><option>Fraud or scam</option><option>Impersonation</option><option>Inappropriate content</option><option>Other</option></select></div><div class="field"><label>Details</label><textarea id="reportDetails" maxlength="1000"></textarea></div><button class="save" type="submit">Submit report</button></form></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const db=window.supabaseClient;
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const requested=(params.get('id')||params.get('user_id')||params.get('username')||'').trim();
let viewer=null,profile=null,isOwner=false,following=false,liked=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fallback=n=>'https://ui-avatars.com/api/?name='+encodeURIComponent(n||'MEC')+'&background=071a34&color=ffffff&bold=true&size=256';
const date=v=>{if(!v)return '';const d=new Date(v);return Number.isNaN(d.getTime())?'':new Intl.DateTimeFormat('en',{year:'numeric',month:'short',day:'numeric'}).format(d)};
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>$('toast').classList.remove('show'),2600)}
function theme(){const x=localStorage.getItem('mec-theme');document.body.classList.toggle('dark',x==='dark'||(!x&&matchMedia('(prefers-color-scheme: dark)').matches));$('themeBtn').textContent=document.body.classList.contains('dark')?'☀':'☾'}
$('themeBtn').onclick=()=>{localStorage.setItem('mec-theme',document.body.classList.contains('dark')?'light':'dark');theme()};$('homeBtn').onclick=()=>location.href='./index.html';$('backBtn').onclick=()=>location.href='./index.html';theme();
async function authUser(){if(!db||!db.auth)throw new Error('Supabase is not available. Check supabase.js.');const {data,error}=await db.auth.getUser();if(error&&error.name!=='AuthSessionMissingError')console.warn('Auth:',error.message);return data?.user||null}
async function getProfile(){if(!db)throw new Error('Supabase client was not created.');if(!requested){if(!viewer)throw new Error('Please sign in or open a profile link.');const r=await db.from('profiles').select('*').eq('id',viewer.id).maybeSingle();if(r.error)throw r.error;return r.data}let q;if(/^[0-9a-f]{8}-[0-9a-f-]{27,}$/i.test(requested))q=db.from('profiles').select('*').eq('id',requested).maybeSingle();else q=db.from('profiles').select('*').ilike('username',requested.replace(/^@/,'' )).maybeSingle();const r=await q;if(r.error)throw r.error;return r.data}
function render(){const name=profile.username||profile.full_name||'user';$('username').innerHTML='<span class="at">@</span>'+esc(name);$('real').textContent=profile.full_name&&profile.full_name!==profile.username?profile.full_name:'';$('location').textContent=[profile.city,profile.region_name,profile.address].filter(Boolean).join(' · ');$('bio').textContent=profile.bio||'';const role=profile.seller_type||profile.role||(profile.is_mcp?'MCP Member':'');$('role').textContent=role;$('role').classList.toggle('hidden',!role);$('verified').style.display=profile.is_verified?'grid':'none';const src=profile.avatar_url||profile.photo_url||profile.profile_photo||fallback(name);$('avatar').src=src;$('avatar').onerror=()=>{$('avatar').onerror=null;$('avatar').src=fallback(name)};document.title='@'+name+' — Myanmar Elite Connect';$('edit').classList.toggle('hidden',!isOwner);$('report').classList.toggle('hidden',isOwner);$('follow').classList.toggle('hidden',isOwner);$('like').classList.toggle('hidden',isOwner);}
async function count(table,field,value){try{const r=await db.from(table).select('*',{count:'exact',head:true}).eq(field,value);if(r.error)return null;return r.count||0}catch{return null}}
async function loadCounts(){const [followers,followingCount,listings]=await Promise.all([count('profile_follows','following_id',profile.id),count('profile_follows','follower_id',profile.id),count('listings','user_id',profile.id)]);if(followers!==null)$('followers').textContent=followers;if(followingCount!==null)$('following').textContent=followingCount;if(listings!==null)$('listingCount').textContent=listings}
async function loadState(){if(!viewer||isOwner)return;try{const f=await db.from('profile_follows').select('id').eq('follower_id',viewer.id).eq('following_id',profile.id).maybeSingle();following=!!f.data}catch{following=false}try{const l=await db.from('profile_reactions').select('id').eq('user_id',viewer.id).eq('profile_id',profile.id).eq('reaction','like').maybeSingle();liked=!!l.data}catch{liked=false}renderState()}
function renderState(){$('follow').textContent=following?'✓ Following':'＋ Follow';$('follow').classList.toggle('following',following);$('like').textContent=liked?'♥ Liked':'♡ Like';$('like').classList.toggle('liked',liked)}
async function loadListings(){let r;try{r=await db.from('listings').select('*').eq('user_id',profile.id).order('created_at',{ascending:false}).limit(8)}catch{return}if(r.error){console.warn('Listings:',r.error.message);return}const rows=r.data||[];$('listingCount').textContent=rows.length||$('listingCount').textContent;if(!rows.length){$('listingSection').classList.add('hidden');return}const active=rows.filter(x=>!x.status||['active','approved','published'].includes(String(x.status).toLowerCase()));$('listingSection').classList.toggle('hidden',!active.length);$('listings').innerHTML=active.map(x=>{const images=Array.isArray(x.images)?x.images:[];const details=Array.isArray(x.detail_images)?x.detail_images:[];const img=x.show_photo_url||x.photo_url||images[0]||details[0]||fallback(x.title);const href=x.id?'./listing-detail.html?id='+encodeURIComponent(x.id):'#';const price=x.price==null?'Contact seller':Number(x.price).toLocaleString()+' '+(x.currency||'MMK');return '<a class="listing" href="'+href+'"><img loading="lazy" src="'+esc(img)+'" alt="" onerror="this.src=\''+fallback('MEC')+'\'"><div class="listing-info"><div class="listing-title">'+esc(x.title||'Untitled listing')+'</div><div class="listing-meta">'+esc([x.city,x.category].filter(Boolean).join(' · ')||'Myanmar')+'</div><div class="price">'+esc(price)+'</div></div></a>'}).join('')}
async function loadComments(){try{const r=await db.from('profile_comments').select('*').eq('profile_id',profile.id).order('created_at',{ascending:false}).limit(50);if(r.error){$('commentSection').classList.add('hidden');return}const rows=r.data||[];if(!rows.length){$('comments').innerHTML='<div class="empty">No comments yet.</div>';$('commentSection').classList.remove('hidden');return}const ids=[...new Set(rows.map(x=>x.user_id).filter(Boolean))];let users={};if(ids.length){try{const u=await db.from('profiles').select('id,username,full_name').in('id',ids);(u.data||[]).forEach(x=>users[x.id]=x)}catch{}}$('comments').innerHTML=rows.map(x=>{const u=users[x.user_id]||{};const own=viewer&&viewer.id===x.user_id;return '<article class="comment"><div class="comment-top"><span class="comment-user">@'+esc(u.username||u.full_name||'user')+'</span><span class="comment-date">'+esc(date(x.created_at))+'</span></div><div class="comment-text">'+esc(x.comment||x.content||'')+'</div>'+(own?'<button class="delete" data-delete="'+esc(x.id)+'" type="button">Delete</button>':'')+'</article>'}).join('');$('commentSection').classList.remove('hidden');document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteComment(b.dataset.delete))}catch{$('commentSection').classList.add('hidden')}}
async function followToggle(){if(!viewer){toast('Please sign in first.');return}try{if(following){const r=await db.from('profile_follows').delete().eq('follower_id',viewer.id).eq('following_id',profile.id);if(r.error)throw r.error;following=false}else{const r=await db.from('profile_follows').insert({follower_id:viewer.id,following_id:profile.id});if(r.error)throw r.error;following=true}renderState();loadCounts()}catch(e){toast('Follow is unavailable right now.');console.warn(e)}}
async function likeToggle(){if(!viewer){toast('Please sign in first.');return}try{if(liked){const r=await db.from('profile_reactions').delete().eq('user_id',viewer.id).eq('profile_id',profile.id).eq('reaction','like');if(r.error)throw r.error;liked=false}else{const r=await db.from('profile_reactions').insert({user_id:viewer.id,profile_id:profile.id,reaction:'like'});if(r.error)throw r.error;liked=true}renderState()}catch(e){toast('Like is unavailable right now.');console.warn(e)}}
async function commentSubmit(e){e.preventDefault();if(!viewer){toast('Please sign in to comment.');return}const text=$('commentInput').value.trim();if(!text)return;const b=e.submitter;b.disabled=true;try{const r=await db.from('profile_comments').insert({profile_id:profile.id,user_id:viewer.id,comment:text});if(r.error)throw r.error;$('commentInput').value='';toast('Comment posted');await loadComments()}catch(e){toast('Comments are unavailable right now.');console.warn(e)}finally{b.disabled=false}}
async function deleteComment(id){if(!viewer)return;try{const r=await db.from('profile_comments').delete().eq('id',id).eq('user_id',viewer.id);if(r.error)throw r.error;toast('Comment deleted');loadComments()}catch{toast('Could not delete comment.')}}
function openModal(id){$(id).classList.add('show');document.body.style.overflow='hidden'}function closeModal(id){$(id).classList.remove('show');document.body.style.overflow=''}
async function saveProfile(e){e.preventDefault();if(!isOwner)return;const username=$('editUsername').value.trim().replace(/^@/,'');if(!/^[A-Za-z0-9_.-]{3,40}$/.test(username)){toast('Username must be 3–40 letters, numbers, dot, dash or underscore.');return}const payload={username,full_name:$('editName').value.trim()||null,avatar_url:$('editAvatar').value.trim()||null,city:$('editCity').value.trim()||null,bio:$('editBio').value.trim()||null};const b=e.submitter;b.disabled=true;try{const r=await db.from('profiles').update(payload).eq('id',viewer.id).select('*').single();if(r.error)throw r.error;profile=r.data;render();closeModal('editModal');toast('Profile updated')}catch(e){toast(e.message||'Could not update profile.')}finally{b.disabled=false}}
async function reportSubmit(e){e.preventDefault();if(!viewer){toast('Please sign in first.');return}try{const r=await db.from('profile_reports').insert({profile_id:profile.id,reporter_id:viewer.id,reason:$('reportReason').value,details:$('reportDetails').value.trim()||null,status:'pending'});if(r.error)throw r.error;closeModal('reportModal');$('reportForm').reset();toast('Report submitted')}catch(e){toast('Reporting is unavailable right now.');console.warn(e)}}
$('follow').onclick=followToggle;$('like').onclick=likeToggle;$('commentForm').onsubmit=commentSubmit;$('editForm').onsubmit=saveProfile;$('reportForm').onsubmit=reportSubmit;
$('share').onclick=async()=>{try{if(navigator.share){await navigator.share({title:document.title,url:location.href});return}await navigator.clipboard.writeText(location.href);toast('Profile link copied')}catch{try{await navigator.clipboard.writeText(location.href);toast('Profile link copied')}catch{prompt('Copy this profile link:',location.href)}}};
$('message').onclick=()=>{if(!viewer){toast('Please sign in first.');return}if(isOwner){toast('This is your profile.');return}location.href='./chat.html?user='+encodeURIComponent(profile.id)};
$('edit').onclick=()=>{$('editUsername').value=profile.username||'';$('editName').value=profile.full_name||'';$('editAvatar').value=profile.avatar_url||profile.photo_url||'';$('editCity').value=profile.city||'';$('editBio').value=profile.bio||'';openModal('editModal')};$('report').onclick=()=>{if(!viewer){toast('Please sign in first.');return}openModal('reportModal')};document.querySelectorAll('[data-close]').forEach(x=>x.onclick=()=>closeModal(x.dataset.close));document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModal(m.id)}));document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.modal.show').forEach(m=>closeModal(m.id))}});
async function init(){try{if(!db)throw new Error('Supabase client is missing. Check supabase.js.');viewer=await authUser();profile=await getProfile();if(!profile)throw new Error('Profile not found.');isOwner=!!viewer&&viewer.id===profile.id;render();$('loading').classList.add('hidden');$('profile').classList.remove('hidden');await Promise.all([loadCounts(),loadState(),loadListings(),loadComments()])}catch(e){console.error(e);$('loading').classList.add('hidden');$('error').classList.remove('hidden');$('errorTitle').textContent=e.message==='Profile not found.'?'Profile not found':'Unable to load profile';$('errorText').textContent=e.message||'Please try again later.'}}
init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Profile — Myanmar Elite Connect</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #f5f7fa;
      --surface: #ffffff;
      --surface-2: #f0f3f7;
      --text: #10233f;
      --muted: #728096;
      --border: rgba(16, 35, 63, .10);
      --navy: #071a34;
      --navy-2: #12385f;
      --gold: #d7b35a;
      --danger: #d94b4b;
      --success: #269b68;
      --shadow: 0 15px 45px rgba(7, 26, 52, .08);
    }

    body.dark {
      --bg: #071321;
      --surface: #0d1d31;
      --surface-2: #12263d;
      --text: #f3f7fb;
      --muted: #91a0b5;
      --border: rgba(255,255,255,.09);
      --navy: #f3f7fb;
      --navy-2: #dce5ef;
      --shadow: 0 18px 50px rgba(0,0,0,.30);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        "Noto Sans Myanmar",
        "Myanmar Text",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* =====================================================
       HEADER
    ===================================================== */

    .header {
      position: sticky;
      top: 0;
      z-index: 1000;
      height: 70px;

      background:
        color-mix(
          in srgb,
          var(--surface) 92%,
          transparent
        );

      border-bottom: 1px solid var(--border);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .header-inner {
      width: min(1180px, calc(100% - 28px));
      height: 100%;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;

      display: grid;
      place-items: center;

      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .brand-logo img {
      width: 82%;
      height: 82%;
      object-fit: contain;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 850;
      white-space: nowrap;
    }

    .brand-name span {
      color: var(--gold);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .header-btn {
      height: 39px;
      min-width: 39px;
      padding: 0 11px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border: 1px solid var(--border);
      border-radius: 11px;

      background: var(--surface);
      color: var(--text);

      font-size: 12px;
      font-weight: 800;
    }

    .header-btn:hover {
      border-color: rgba(215,179,90,.55);
    }

    /* =====================================================
       NAVIGATION
    ===================================================== */

    .bottom-nav {
      position: fixed;
      z-index: 999;

      left: 50%;
      bottom: 13px;
      transform: translateX(-50%);

      width: min(500px, calc(100% - 22px));
      height: 66px;

      display: grid;
      grid-template-columns: repeat(4, 1fr);

      background:
        color-mix(
          in srgb,
          var(--surface) 95%,
          transparent
        );

      border: 1px solid var(--border);
      border-radius: 20px;

      box-shadow: var(--shadow);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 4px;

      color: var(--muted);

      font-size: 10px;
      font-weight: 800;
    }

    .nav-item .icon {
      font-size: 19px;
      line-height: 1;
    }

    .nav-item.active {
      color: var(--gold);
    }

    /* =====================================================
       PAGE
    ===================================================== */

    .page {
      width: min(980px, calc(100% - 24px));
      margin: auto;

      padding:
        28px 0 115px;
    }

    /* =====================================================
       PROFILE HERO
    ===================================================== */

    .profile-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .profile-cover {
      height: 150px;

      background:
        radial-gradient(
          circle at 80% 20%,
          rgba(215,179,90,.30),
          transparent 32%
        ),
        linear-gradient(
          135deg,
          #071a34,
          #173b62
        );
    }

    body.dark .profile-cover {
      background:
        radial-gradient(
          circle at 80% 20%,
          rgba(215,179,90,.20),
          transparent 32%
        ),
        linear-gradient(
          135deg,
          #12263d,
          #071321
        );
    }

    .profile-main {
      padding: 0 25px 25px;
    }

    .profile-top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;

      margin-top: -55px;
    }

    .avatar-wrap {
      position: relative;
    }

    .avatar {
      width: 110px;
      height: 110px;

      border-radius: 50%;

      object-fit: cover;

      background: var(--surface-2);

      border:
        5px solid var(--surface);

      box-shadow:
        0 10px 30px rgba(0,0,0,.15);
    }

    .avatar-edit {
      position: absolute;

      right: 5px;
      bottom: 5px;

      width: 31px;
      height: 31px;

      border: 3px solid var(--surface);
      border-radius: 50%;

      display: grid;
      place-items: center;

      background: var(--gold);
      color: #071a34;

      font-size: 13px;
    }

    .profile-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .primary-btn,
    .secondary-btn,
    .danger-btn {
      min-height: 42px;
      padding: 0 16px;

      border-radius: 11px;

      font-size: 12px;
      font-weight: 850;
    }

    .primary-btn {
      border: 0;
      color: white;
      background: linear-gradient(135deg, #071a34, #173b62);
    }

    body.dark .primary-btn {
      color: #071a34;
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
    }

    .secondary-btn {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
    }

    .danger-btn {
      border: 0;
      color: white;
      background: var(--danger);
    }

    .profile-name-row {
      margin-top: 14px;

      display: flex;
      align-items: center;
      gap: 8px;

      flex-wrap: wrap;
    }

    .profile-name {
      font-size: 25px;
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: -.7px;
    }

    .verified {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 22px;
      height: 22px;

      border-radius: 50%;

      color: white;
      background: var(--success);

      font-size: 12px;
      font-weight: 900;
    }

    .username {
      margin-top: 5px;

      color: var(--muted);

      font-size: 13px;
      font-weight: 650;
    }

    .bio {
      max-width: 700px;

      margin-top: 13px;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.7;
    }

    .profile-location {
      margin-top: 10px;

      display: flex;
      align-items: center;
      gap: 6px;

      color: var(--muted);

      font-size: 12px;
    }

    /* =====================================================
       STATS
    ===================================================== */

    .stats {
      margin-top: 20px;

      display: grid;
      grid-template-columns: repeat(4, 1fr);

      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .stat {
      min-height: 75px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      border-right: 1px solid var(--border);

      cursor: pointer;
    }

    .stat:last-child {
      border-right: 0;
    }

    .stat strong {
      font-size: 18px;
      font-weight: 900;
    }

    .stat span {
      margin-top: 4px;

      color: var(--muted);

      font-size: 10px;
      font-weight: 750;
    }

    /* =====================================================
       BADGES
    ===================================================== */

    .section {
      margin-top: 16px;

      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .section-title {
      padding: 17px 18px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid var(--border);
    }

    .section-title h2 {
      font-size: 14px;
      font-weight: 900;
    }

    .section-title a {
      color: var(--gold);
      font-size: 11px;
      font-weight: 850;
    }

    .badges {
      padding: 16px;

      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .badge {
      min-width: 110px;

      padding: 11px 12px;

      display: flex;
      align-items: center;
      gap: 9px;

      border-radius: 13px;

      background: var(--surface-2);
      border: 1px solid var(--border);
    }

    .badge-icon {
      width: 35px;
      height: 35px;

      display: grid;
      place-items: center;

      border-radius: 10px;

      background: rgba(215,179,90,.15);

      font-size: 18px;
    }

    .badge-name {
      font-size: 11px;
      font-weight: 850;
    }

    .badge-code {
      margin-top: 2px;

      color: var(--muted);

      font-size: 9px;
      font-weight: 750;
    }

    /* =====================================================
       FUNCTION ROWS
    ===================================================== */

    .functions {
      padding: 7px;
    }

    .function-row {
      width: 100%;
      min-height: 60px;

      display: flex;
      align-items: center;

      gap: 13px;

      padding: 9px 12px;

      border: 0;
      border-bottom: 1px solid var(--border);

      background: transparent;
      color: var(--text);

      text-align: left;
    }

    .function-row:last-child {
      border-bottom: 0;
    }

    .function-row:hover {
      background: var(--surface-2);
    }

    .function-icon {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;

      display: grid;
      place-items: center;

      border-radius: 12px;

      background: var(--surface-2);

      font-size: 17px;
    }

    .function-content {
      flex: 1;
      min-width: 0;
    }

    .function-title {
      font-size: 12px;
      font-weight: 850;
    }

    .function-description {
      margin-top: 3px;

      color: var(--muted);

      font-size: 10px;
      line-height: 1.4;
    }

    .function-arrow {
      color: var(--muted);
      font-size: 18px;
    }

    /* =====================================================
       POSTS
    ===================================================== */

    .posts {
      padding: 15px;
    }

    .post {
      padding: 15px 0;

      border-bottom: 1px solid var(--border);
    }

    .post:last-child {
      border-bottom: 0;
    }

    .post-title {
      font-size: 14px;
      font-weight: 850;
    }

    .post-description {
      margin-top: 6px;

      color: var(--muted);

      font-size: 12px;
      line-height: 1.6;
    }

    .post-meta {
      margin-top: 9px;

      color: var(--muted);

      font-size: 10px;
    }

    .empty {
      padding: 30px 15px;

      color: var(--muted);

      text-align: center;

      font-size: 12px;
    }

    /* =====================================================
       MODAL
    ===================================================== */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 3000;

      display: none;
      align-items: flex-end;
      justify-content: center;

      padding: 12px;

      background: rgba(0,0,0,.55);
    }

    .modal.show {
      display: flex;
    }

    .modal-card {
      width: min(560px, 100%);
      max-height: 90vh;

      overflow: auto;

      background: var(--surface);

      border:
        1px solid var(--border);

      border-radius: 22px;

      box-shadow: 0 30px 80px rgba(0,0,0,.30);
    }

    .modal-header {
      padding: 17px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid var(--border);
    }

    .modal-header h3 {
      font-size: 15px;
      font-weight: 900;
    }

    .close-btn {
      width: 35px;
      height: 35px;

      border: 0;
      border-radius: 10px;

      background: var(--surface-2);
      color: var(--text);
    }

    .modal-body {
      padding: 17px;
    }

    .field {
      margin-bottom: 13px;
    }

    .field label {
      display: block;

      margin-bottom: 6px;

      color: var(--muted);

      font-size: 10px;
      font-weight: 850;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;

      padding: 12px 13px;

      border: 1px solid var(--border);
      border-radius: 11px;

      outline: none;

      background: var(--surface-2);
      color: var(--text);

      font-size: 12px;
    }

    .field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .modal-footer {
      padding: 15px 17px;

      display: flex;
      justify-content: flex-end;
      gap: 8px;

      border-top: 1px solid var(--border);
    }

    /* =====================================================
       USER LIST
    ===================================================== */

    .user-list {
      display: flex;
      flex-direction: column;
    }

    .user-item {
      padding: 12px;

      display: flex;
      align-items: center;
      gap: 10px;

      border-bottom: 1px solid var(--border);
    }

    .user-item:last-child {
      border-bottom: 0;
    }

    .user-avatar {
      width: 45px;
      height: 45px;

      flex: 0 0 45px;

      border-radius: 50%;

      object-fit: cover;

      background: var(--surface-2);
    }

    .user-info {
      flex: 1;
      min-width: 0;
    }

    .user-name {
      font-size: 12px;
      font-weight: 850;
    }

    .user-username {
      margin-top: 3px;

      color: var(--muted);

      font-size: 10px;
    }

    .user-actions {
      display: flex;
      gap: 5px;
    }

    .mini-btn {
      min-height: 34px;

      padding: 0 9px;

      border: 1px solid var(--border);
      border-radius: 9px;

      background: var(--surface-2);
      color: var(--text);

      font-size: 10px;
      font-weight: 800;
    }

    /* =====================================================
       TOAST
    ===================================================== */

    .toast {
      position: fixed;
      z-index: 5000;

      left: 50%;
      bottom: 94px;

      transform:
        translate(-50%, 20px);

      opacity: 0;

      padding: 11px 15px;

      border-radius: 11px;

      background: var(--navy);
      color: var(--surface);

      font-size: 11px;
      font-weight: 800;

      pointer-events: none;

      transition:
        opacity .2s ease,
        transform .2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 650px) {

      .brand-name {
        display: none;
      }

      .profile-cover {
        height: 125px;
      }

      .profile-main {
        padding:
          0 15px 18px;
      }

      .profile-top {
        align-items: flex-end;
      }

      .avatar {
        width: 88px;
        height: 88px;
      }

      .profile-actions {
        gap: 5px;
      }

      .primary-btn,
      .secondary-btn,
      .danger-btn {
        min-height: 37px;
        padding: 0 10px;
        font-size: 10px;
      }

      .profile-name {
        font-size: 21px;
      }

      .stats {
        grid-template-columns: repeat(4, 1fr);
      }

      .stat {
        min-height: 65px;
      }

      .stat strong {
        font-size: 15px;
      }

      .stat span {
        font-size: 8px;
      }

      .badge {
        min-width: 0;
        flex: 1 1 calc(50% - 10px);
      }

      .header-btn {
        padding: 0 8px;
      }
    }

    @media (max-width: 420px) {

      .profile-top {
        flex-direction: column;
        align-items: flex-start;
      }

      .profile-actions {
        width: 100%;
        justify-content: flex-start;
      }

      .profile-actions button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <!-- ===================================================
       HEADER
  ==================================================== -->

  <header class="header">

    <div class="header-inner">

      <a href="./index.html" class="brand">

        <div class="brand-logo">
          <img
            src="https://lh3.googleusercontent.com/d/1fR8TnvOjrzVbKuro9Ths1_Jt0PAxSmGd"
            alt="Myanmar Elite Connect"
          >
        </div>

        <div class="brand-name">
          Myanmar <span>Elite</span> Connect
        </div>

      </a>

      <div class="header-actions">

        <button
          class="header-btn"
          id="themeButton"
          type="button"
        >
          ☾
        </button>

        <button
          class="header-btn"
          id="logoutButton"
          type="button"
        >
          Log Out
        </button>

      </div>

    </div>

  </header>


  <!-- ===================================================
       MAIN
  ==================================================== -->

  <main class="page">

    <section class="profile-card">

      <div class="profile-cover"></div>

      <div class="profile-main">

        <div class="profile-top">

          <div class="avatar-wrap">

            <img
              id="avatar"
              class="avatar"
              src=""
              alt="Profile"
            >

            <button
              id="avatarEdit"
              class="avatar-edit"
              type="button"
              title="Change profile photo"
            >
              ✎
            </button>

            <input
              id="avatarInput"
              type="file"
              accept="image/*"
              hidden
            >

          </div>


          <div
            id="profileActions"
            class="profile-actions"
          >
          </div>

        </div>


        <div class="profile-name-row">

          <h1
            id="profileName"
            class="profile-name"
          >
            Loading...
          </h1>

          <span
            id="verifiedBadge"
            class="verified"
            style="display:none;"
          >
            ✓
          </span>

        </div>


        <div
          id="username"
          class="username"
        >
          @username
        </div>


        <p
          id="bio"
          class="bio"
        >
          No bio yet.
        </p>


        <div
          id="location"
          class="profile-location"
        >
          📍 —
        </div>


        <div class="stats">

          <button
            class="stat"
            id="likesStat"
            type="button"
          >
            <strong id="likesCount">0</strong>
            <span>Likes</span>
          </button>


          <button
            class="stat"
            id="followersStat"
            type="button"
          >
            <strong id="followersCount">0</strong>
            <span>Followers</span>
          </button>


          <button
            class="stat"
            id="followingStat"
            type="button"
          >
            <strong id="followingCount">0</strong>
            <span>Following</span>
          </button>


          <button
            class="stat"
            id="postsStat"
            type="button"
          >
            <strong id="postsCount">0</strong>
            <span>My Posts</span>
          </button>

        </div>

      </div>

    </section>


    <!-- =================================================
         BADGES
    ================================================== -->

    <section class="section">

      <div class="section-title">

        <h2>Badges</h2>

        <a href="./badge.html">
          View All
        </a>

      </div>

      <div
        id="badges"
        class="badges"
      >
        <div class="empty">
          No badges yet.
        </div>
      </div>

    </section>


    <!-- =================================================
         FUNCTIONS
    ================================================== -->

    <section class="section">

      <div class="section-title">
        <h2>Profile</h2>
      </div>

      <div class="functions">

        <button
          id="editProfileButton"
          class="function-row"
          type="button"
        >

          <div class="function-icon">
            ✎
          </div>

          <div class="function-content">

            <div class="function-title">
              Edit Profile
            </div>

            <div class="function-description">
              Username, bio, region and seller information
            </div>

          </div>

          <div class="function-arrow">
            ›
          </div>

        </button>


        <button
          id="mcpButton"
          class="function-row"
          type="button"
        >

          <div class="function-icon">
            🏅
          </div>

          <div class="function-content">

            <div class="function-title">
              MCP Application
            </div>

            <div class="function-description">
              Apply for Myanmar Elite Connect Professional
            </div>

          </div>

          <div class="function-arrow">
            ›
          </div>

        </button>


        <button
          id="kycButton"
          class="function-row"
          type="button"
        >

          <div class="function-icon">
            🛡️
          </div>

          <div class="function-content">

            <div class="function-title">
              KYC Verification
            </div>

            <div class="function-description">
              Verify your identity
            </div>

          </div>

          <div class="function-arrow">
            ›
          </div>

        </button>


        <button
          id="followersButton"
          class="function-row"
          type="button"
        >

          <div class="function-icon">
            👥
          </div>

          <div class="function-content">

  <script>

    /* =====================================================
       SUPABASE
    ===================================================== */

    const SUPABASE_URL =
      "https://ikjwisfsdcupibgjiuvp.supabase.co";

    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlrandpc2ZzZGN1cGliZ2ppdXZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMTMzODEsImV4cCI6MjEwMjY4OTM4MX0.25tHsU8M6nVhL5XNPJy2M8P6TkPS_Q5jHwZljLVFCyNI";

    const db =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    /* =====================================================
       GLOBAL STATE
    ===================================================== */

    let currentUser = null;
    let profile = null;
    let viewedUserId = null;
    let isOwnProfile = false;
    let isFollowing = false;


    /* =====================================================
       HELPERS
    ===================================================== */

    function $(id) {
      return document.getElementById(id);
    }


    function escapeHtml(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    function showToast(message) {

      const toast = $("toast");

      toast.textContent = message;

      toast.classList.add("show");

      setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);
    }


    function openModal(id) {
      $(id).classList.add("show");
    }


    function closeModal(id) {
      $(id).classList.remove("show");
    }


    function defaultAvatar(name = "User") {

      const letter =
        encodeURIComponent(
          String(name).trim().charAt(0).toUpperCase() || "U"
        );

      return (
        "https://ui-avatars.com/api/" +
        "?name=" + letter +
        "&background=071a34" +
        "&color=ffffff" +
        "&size=256"
      );

    }


    function getProfileIdFromUrl() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      return (
        params.get("id") ||
        params.get("user") ||
        params.get("user_id")
      );

    }


    /* =====================================================
       AUTH
    ===================================================== */

    async function loadCurrentUser() {

      const {
        data,
        error
      } =
        await db.auth.getUser();

      if (error || !data.user) {

        window.location.href =
          "./auth.html?mode=login";

        return null;
      }

      currentUser =
        data.user;

      return currentUser;
    }


    /* =====================================================
       PROFILE LOAD
    ===================================================== */

    async function loadProfile() {

      const requestedId =
        getProfileIdFromUrl();

      viewedUserId =
        requestedId ||
        currentUser.id;

      isOwnProfile =
        viewedUserId === currentUser.id;


      const {
        data,
        error
      } =
        await db
          .from("profiles")
          .select("*")
          .eq("id", viewedUserId)
          .maybeSingle();


      if (error) {

        console.error(error);

        showToast(
          "Unable to load profile."
        );

        return;
      }


      if (!data) {

        showToast(
          "Profile not found."
        );

        return;
      }


      profile =
        data;


      renderProfile();

      await Promise.all([
        loadCounts(),
        loadBadges(),
        loadPosts()
      ]);


      if (!isOwnProfile) {

        await checkFollowing();

      }

    }


    /* =====================================================
       RENDER PROFILE
    ===================================================== */

    function renderProfile() {

      const name =
        profile.full_name ||
        profile.username ||
        "User";


      $("profileName").textContent =
        name;


      $("username").textContent =
        profile.username
          ? "@" + profile.username
          : "@username";


      $("bio").textContent =
        profile.bio ||
        "No bio yet.";


      const locationParts = [];

      if (profile.region_name) {
        locationParts.push(
          profile.region_name
        );
      }

      if (profile.city) {
        locationParts.push(
          profile.city
        );
      }

      $("location").textContent =
        locationParts.length
          ? "📍 " + locationParts.join(" • ")
          : "📍 Location not set";


      $("avatar").src =
        profile.avatar_url ||
        defaultAvatar(name);


      if (profile.is_verified) {

        $("verifiedBadge").style.display =
          "inline-flex";

      } else {

        $("verifiedBadge").style.display =
          "none";

      }


      renderActions();

    }


    /* =====================================================
       PROFILE ACTIONS
    ===================================================== */

    function renderActions() {

      const container =
        $("profileActions");


      if (isOwnProfile) {

        container.innerHTML = `
          <button
            class="secondary-btn"
            type="button"
            id="topEditButton"
          >
            Edit Profile
          </button>
        `;


        $("topEditButton")
          .addEventListener(
            "click",
            openEditProfile
          );


        $("chatButton")
          .style.display =
          "none";


        return;
      }


      container.innerHTML = `
        <button
          class="primary-btn"
          type="button"
          id="followButton"
        >
          Follow
        </button>

        <button
          class="secondary-btn"
          type="button"
          id="topChatButton"
        >
          Chat
        </button>
      `;


      $("followButton")
        .addEventListener(
          "click",
          toggleFollow
        );


      $("topChatButton")
        .addEventListener(
          "click",
          startChat
        );


      $("chatButton")
        .style.display =
        "flex";


      $("chatButton")
        .onclick =
        startChat;

    }


    /* =====================================================
       FOLLOW
    ===================================================== */

    async function checkFollowing() {

      const {
        data,
        error
      } =
        await db
          .from("profile_follows")
          .select("id")
          .eq(
            "follower_id",
            currentUser.id
          )
          .eq(
            "following_id",
            viewedUserId
          )
          .maybeSingle();


      if (error) {

        console.error(error);

        return;
      }


      isFollowing =
        !!data;


      updateFollowButton();

    }


    function updateFollowButton() {

      const button =
        $("followButton");


      if (!button) {
        return;
      }


      button.textContent =
        isFollowing
          ? "Following"
          : "Follow";


      button.className =
        isFollowing
          ? "secondary-btn"
          : "primary-btn";

    }


    async function toggleFollow() {

      if (
        !currentUser ||
        isOwnProfile
      ) {
        return;
      }


      if (isFollowing) {

        const {
          error
        } =
          await db
            .from("profile_follows")
            .delete()
            .eq(
              "follower_id",
              currentUser.id
            )
            .eq(
              "following_id",
              viewedUserId
            );


        if (error) {

          console.error(error);

          showToast(
            "Unable to unfollow."
          );

          return;
        }


        isFollowing =
          false;


        showToast(
          "Unfollowed."
        );

      } else {

        const {
          error
        } =
          await db
            .from("profile_follows")
            .insert({
              follower_id:
                currentUser.id,

              following_id:
                viewedUserId
            });


        if (error) {

          console.error(error);

          showToast(
            "Unable to follow."
          );

          return;
        }


        isFollowing =
          true;


        showToast(
          "Following."
        );

      }


      updateFollowButton();

      await loadCounts();

    }


    /* =====================================================
       COUNTS
    ===================================================== */

    async function countRows(
      table,
      column,
      value
    ) {

      const {
        count,
        error
      } =
        await db
          .from(table)
          .select(
            "*",
            {
              count: "exact",
              head: true
            }
          )
          .eq(
            column,
            value
          );


      if (error) {

        console.error(error);

        return 0;
      }


      return count || 0;

    }


    async function loadCounts() {

      const [
        likes,
        followers,
        following,
        posts
      ] =
        await Promise.all([

          countRows(
            "profile_reactions",
            "profile_id",
            viewedUserId
          ),

          countRows(
            "profile_follows",
            "following_id",
            viewedUserId
          ),

          countRows(
            "profile_follows",
            "follower_id",
            viewedUserId
          ),

          countRows(
            "listings",
            "user_id",
            viewedUserId
          )

        ]);


      $("likesCount").textContent =
        likes;

      $("followersCount").textContent =
        followers;

      $("followingCount").textContent =
        following;

      $("postsCount").textContent =
        posts;

    }


    /* =====================================================
       PROFILE LIKE
    ===================================================== */

    async function toggleLike() {

      if (!currentUser) {
        return;
      }


      const {
        data
      } =
        await db
          .from("profile_reactions")
          .select("id")
          .eq(
            "profile_id",
            viewedUserId
          )
          .eq(
            "user_id",
            currentUser.id
          )
          .eq(
            "reaction",
            "like"
          )
          .maybeSingle();


      if (data) {

        await db
          .from("profile_reactions")
          .delete()
          .eq(
            "id",
            data.id
          );

        showToast(
          "Like removed."
        );

      } else {

        await db
          .from("profile_reactions")
          .insert({
            profile_id:
              viewedUserId,

            user_id:
              currentUser.id,

            reaction:
              "like"
          });

        showToast(
          "Profile liked."
        );

      }


      await loadCounts();

    }


    /* =====================================================
       BADGES
    ===================================================== */

    async function loadBadges() {

      const container =
        $("badges");


      container.innerHTML =
        `<div class="empty">Loading badges...</div>`;


      const {
        data,
        error
      } =
        await db
          .from("mec_profile_badges")
          .select(`
            id,
            badge_id,
            created_at,
            mec_badges (
              id,
              code,
              name,
              icon,
              label_en,
              label_mm
            )
          `)
          .eq(
            "user_id",
            viewedUserId
          )
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (error) {

        console.error(error);

        container.innerHTML =
          `<div class="empty">
            Unable to load badges.
          </div>`;

        return;
      }


      if (!data || !data.length) {

        container.innerHTML =
          `<div class="empty">
            No badges yet.
          </div>`;

        return;
      }


      container.innerHTML =
        data.map(item => {

          const badge =
            item.mec_badges;


          return `
            <div class="badge">

              <div class="badge-icon">
                ${escapeHtml(
                  badge?.icon || "🏅"
                )}
              </div>

              <div>

                <div class="badge-name">
                  ${escapeHtml(
                    badge?.label_en ||
                    badge?.name ||
                    "Badge"
                  )}
                </div>

                <div class="badge-code">
                  ${escapeHtml(
                    badge?.code || ""
                  )}
                </div>

              </div>

            </div>
          `;

        }).join("");

    }


    /* =====================================================
       REGIONS
    ===================================================== */

    async function loadRegions() {

      const select =
        $("editRegion");


      const {
        data,
        error
      } =
        await db
          .from("mec_regions")
          .select(
            "code,name_en,name_mm,region_type"
          )
          .order(
            "name_en"
          );


      if (error) {

        console.error(error);

        return;
      }


      select.innerHTML =
        `
          <option value="">
            Select region
          </option>
        `;


      (data || []).forEach(region => {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          region.code;


        option.textContent =
          `${region.name_en} — ${region.name_mm} (${region.code})`;


        select.appendChild(
          option
        );

      });


      if (profile?.region_code) {

        select.value =
          profile.region_code;

      }

    }


    /* =====================================================
       EDIT PROFILE
    ===================================================== */

    async function openEditProfile() {

      $("editUsername").value =
        profile.username || "";

      $("editFullName").value =
        profile.full_name || "";

      $("editBio").value =
        profile.bio || "";

      $("editSellerType").value =
        profile.seller_type || "";


      await loadRegions();

      openModal(
        "editModal"
      );

    }


    async function saveProfile() {

      const username =
        $("editUsername")
          .value
          .trim()
          .toLowerCase();

      const fullName =
        $("editFullName")
          .value
          .trim();

      const bio =
        $("editBio")
          .value
          .trim();

      const regionCode =
        $("editRegion")
          .value;

      const sellerType =
        $("editSellerType")
          .value;


      if (
        username &&
        !/^[a-z0-9_.]{3,30}$/.test(
          username
        )
      ) {

        showToast(
          "Username must use letters, numbers, _ or ."
        );

        return;
      }


      let regionName =
        null;


      if (regionCode) {

        const {
          data
        } =
          await db
            .from("mec_regions")
            .select(
              "name_en"
            )
            .eq(
              "code",
              regionCode
            )
            .maybeSingle();


        regionName =
          data?.name_en || null;

      }


      const {
        error
      } =
        await db
          .from("profiles")
          .update({

            username:
              username || null,

            full_name:
              fullName || null,

            bio:
              bio || null,

            region_code:
              regionCode || null,

            region_name:
              regionName,

            seller_type:
              sellerType || null

          })
          .eq(
            "id",
            currentUser.id
          );


      if (error) {

        console.error(error);

        showToast(
          error.message ||
          "Unable to save profile."
        );

        return;
      }


      showToast(
        "Profile updated."
      );


      closeModal(
        "editModal"
      );


      await loadProfile();

    }


    /* =====================================================
       PROFILE PHOTO
    ===================================================== */

    $("avatarEdit")
      .addEventListener(
        "click",
        () => {

          if (!isOwnProfile) {
            return;
          }

          $("avatarInput")
            .click();

        }
      );


    $("avatarInput")
      .addEventListener(
        "change",
        async event => {

          const file =
            event.target.files?.[0];


          if (!file) {
            return;
          }


          if (!file.type.startsWith("image/")) {

            showToast(
              "Please select an image."
            );

            return;
          }


          if (
            file.size >
            5 * 1024 * 1024
          ) {

            showToast(
              "Image must be under 5MB."
            );

            return;
          }


          showToast(
            "Uploading photo..."
          );


          const extension =
            file.name
              .split(".")
              .pop()
              .toLowerCase();


          const path =
            `${currentUser.id}/avatar-${Date.now()}.${extension}`;


          const {
            error: uploadError
          } =
            await db.storage
              .from("avatars")
              .upload(
                path,
                file,
                {
                  upsert: true,
                  contentType:
                    file.type
                }
              );


          if (uploadError) {

            console.error(
              uploadError
            );

            showToast(
              "Photo upload failed. Check your avatars storage bucket."
            );

            return;
          }


          const {
            data:
              publicData
          } =
            db.storage
              .from("avatars")
              .getPublicUrl(
                path
              );


          const avatarUrl =
            publicData.publicUrl;


          const {
            error:
              updateError
          } =
            await db
              .from("profiles")
              .update({
                avatar_url:
                  avatarUrl
              })
              .eq(
                "id",
                currentUser.id
              );


          if (updateError) {

            console.error(
              updateError
            );

            showToast(
              "Unable to save profile photo."
            );

            return;
          }


          $("avatar").src =
            avatarUrl;


          showToast(
            "Profile photo updated."
          );

        }
      );


    /* =====================================================
       FOLLOWERS / FOLLOWING
    ===================================================== */

        data.map(
          item =>
            item[userColumn]
        );


      const {
        data:
          users,
        error:
          usersError
      } =
        await db
          .from("profiles")
          .select(`
            id,
            username,
            full_name,
            avatar_url,
            is_verified
          `)
          .in(
            "id",
            ids
          );


      if (usersError) {

        console.error(
          usersError
        );

        return;
      }


      const map =
        new Map(
          (users || []).map(
            user => [
              user.id,
              user
            ]
          )
        );


      $("userList").innerHTML =
        ids
          .map(id => map.get(id))
          .filter(Boolean)
          .map(user => {

            const name =
              user.full_name ||
              user.username ||
              "User";


            return `
              <div class="user-item">

                <img
                  class="user-avatar"
                  src="${
                    escapeHtml(
                      user.avatar_url ||
                      defaultAvatar(name)
                    )
                  }"
                  alt=""
                >

                <div class="user-info">

                  <div class="user-name">
                    ${escapeHtml(name)}
                    ${
                      user.is_verified
                        ? " ✓"
                        : ""
                    }
                  </div>

                  <div class="user-username">
                    ${
                      user.username
                        ? "@" +
                          escapeHtml(
                            user.username
                          )
                        : ""
                    }
                  </div>

                </div>

                <div class="user-actions">

                  <button
                    class="mini-btn"
                    type="button"
                    onclick="viewUser(
                      '${user.id}'
                    )"
                  >
                    Profile
                  </button>

                  <button
                    class="mini-btn"
                    type="button"
                    onclick="chatWithUser(
                      '${user.id}'
                    )"
                  >
                    Chat
                  </button>

                </div>

              </div>
            `;

          }).join("");

    }


    window.viewUser =
      function(id) {

        window.location.href =
          "./profile.html?id=" +
          encodeURIComponent(id);

      };


    window.chatWithUser =
      async function(id) {

        const roomId =
          await createChatRoom(
            id
          );


        if (!roomId) {
          return;
        }


        window.location.href =
          "./chat.html?room=" +
          encodeURIComponent(
            roomId
          ) +
          "&user=" +
          encodeURIComponent(id);

      };


    /* =====================================================
       CHAT
    ===================================================== */

    async function createChatRoom(
      otherUserId
    ) {

      if (
        !currentUser ||
        !otherUserId ||
        otherUserId === currentUser.id
      ) {
        return null;
      }


      const first =
        currentUser.id <
        otherUserId
          ? currentUser.id
          : otherUserId;


      const second =
        currentUser.id <
        otherUserId
          ? otherUserId
          : currentUser.id;


      const {
        data:
          existing,
        error:
          findError
      } =
        await db
          .from("chat_rooms")
          .select("id")
          .eq(
            "user_one",
            first
          )
          .eq(
            "user_two",
            second
          )
          .maybeSingle();


      if (findError) {

        console.error(
          findError
        );

        showToast(
          "Unable to open chat."
        );

        return null;
      }


      if (existing) {

        return existing.id;

      }


      const {
        data:
          created,
        error:
          createError
      } =
        await db
          .from("chat_rooms")
          .insert({

            user_one:
              first,

            user_two:
              second

          })
          .select("id")
          .single();


      if (createError) {

        console.error(
          createError
        );

        showToast(
          "Unable to create chat."
        );

        return null;
      }


      return created.id;

    }


    async function startChat() {

      if (
        !viewedUserId ||
        isOwnProfile
      ) {
        return;
      }


      const roomId =
        await createChatRoom(
          viewedUserId
        );


      if (!roomId) {
        return;
      }


      window.location.href =
        "./chat.html?room=" +
        encodeURIComponent(
          roomId
        ) +
        "&user=" +
        encodeURIComponent(
          viewedUserId
        );

    }


    /* =====================================================
       POSTS
    ===================================================== */

    async function loadPosts() {

      const {
        data,
        error
      } =
        await db
          .from("listings")
          .select(`
            id,
            title,
            description,
            category,
            price,
            currency,
            city,
            township,
            status,
            created_at
          `)
          .eq(
            "user_id",
            viewedUserId
          )
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (error) {

        console.error(error);

        $("posts").innerHTML =
          `<div class="empty">
            Unable to load posts.
          </div>`;

        return;
      }


      $("postsCount").textContent =
        data?.length || 0;


      if (!data || !data.length) {

        $("posts").innerHTML =
          `<div class="empty">
            No posts yet.
          </div>`;

        return;
      }


      $("posts").innerHTML =
        data.map(post => {

          const location =
            [
              post.city,
              post.township
            ]
              .filter(Boolean)
              .join(" • ");


          return `
            <article class="post">

              <div class="post-title">
                ${escapeHtml(
                  post.title ||
                  "Untitled"
                )}
              </div>

              <div class="post-description">
                ${escapeHtml(
                  post.description ||
                  ""
                )}
              </div>

              <div class="post-meta">
                ${
                  escapeHtml(
                    post.category ||
                    ""
                  )
                }
                ${
                  post.price !== null &&
                  post.price !== undefined
                    ? " • " +
                      escapeHtml(
                        post.price
                      ) +
                      " " +
                      escapeHtml(
                        post.currency ||
                        "MMK"
                      )
                    : ""
                }
                ${
                  location
                    ? " • " +
                      escapeHtml(
                        location
                      )
                    : ""
                }
              </div>

            </article>
          `;

        }).join("");

    }


    /* =====================================================
       MCP
    ===================================================== */

    $("mcpButton")
      .addEventListener(
        "click",
        () => {

          if (!isOwnProfile) {
            return;
          }


          window.location.href =
            "./MCP.html";

        }
      );


    /* =====================================================
       KYC
    ===================================================== */

    $("kycButton")
      .addEventListener(
        "click",
        () => {

          if (!isOwnProfile) {
            return;
          }


          window.location.href =
            "./kyc.html";

        }
      );


    /* =====================================================
       BUTTON EVENTS
    ===================================================== */

    $("editProfileButton")
      .addEventListener(
        "click",
        () => {

          if (!isOwnProfile) {
            return;
          }

          openEditProfile();

        }
      );


    $("followersButton")
      .addEventListener(
        "click",
        () => {

          openUserList(
            "followers"
          );

        }
      );


    $("followingButton")
      .addEventListener(
        "click",
        () => {

          openUserList(
            "following"
          );

        }
      );


    $("followersStat")
      .addEventListener(
        "click",
        () => {

          openUserList(
            "followers"
          );

        }
      );


    $("followingStat")
      .addEventListener(
        "click",
        () => {

          openUserList(
            "following"
          );

        }
      );


    $("postsStat")
      .addEventListener(
        "click",
        () => {

          $("postsSection")
            .scrollIntoView({
              behavior:
                "smooth"
            });

        }
      );


    $("myPostsButton")
      .addEventListener(
        "click",
        () => {

          $("postsSection")
            .scrollIntoView({
              behavior:
                "smooth"
            });

        }
      );


    $("likesStat")
      .addEventListener(
        "click",
        toggleLike
      );


    $("saveProfileButton")
      .addEventListener(
        "click",
        saveProfile
      );


    document
      .querySelectorAll(
        "[data-close]"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            closeModal(
              button.dataset.close
            );

          }
        );

      });


    /* =====================================================
       THEME
    ===================================================== */

    function applyTheme(theme) {

      document.body.classList.toggle(
        "dark",
        theme === "dark"
      );


      $("themeButton").textContent =
        theme === "dark"
          ? "☀"
          : "☾";


      localStorage.setItem(
        "mec_theme",
        theme
      );

    }


    $("themeButton")
      .addEventListener(
        "click",
        () => {

          const dark =
            document.body.classList.contains(
              "dark"
            );


          applyTheme(
            dark
              ? "light"
              : "dark"
          );

        }
      );


    /* =====================================================
       LOGOUT
    ===================================================== */

    $("logoutButton")
      .addEventListener(
        "click",
        async () => {

          const {
            error
          } =
            await db.auth.signOut();


          if (error) {

            showToast(
              "Unable to log out."
            );

            return;
          }


          window.location.href =
            "./auth.html?mode=login";

        }
      );


    /* =====================================================
       INIT
    ===================================================== */

    async function init() {

      applyTheme(
        localStorage.getItem(
          "mec_theme"
        ) || "light"
      );


      const user =
        await loadCurrentUser();


      if (!user) {
        return;
      }


      await loadProfile();

    }


    init();

  </script>

</body>

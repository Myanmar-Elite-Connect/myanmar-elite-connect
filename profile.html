<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Profile — Myanmar Elite Connect</title>

  <meta
    name="description"
    content="Myanmar Elite Connect user profile"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-2: #f0f3f8;
      --text: #10233f;
      --muted: #748096;
      --border: rgba(16,35,63,.09);

      --navy: #071a34;
      --navy-2: #173b62;

      --gold: #d7b35a;
      --gold-light: #f1d487;

      --danger: #d94b5b;
      --success: #2f9e68;

      --shadow:
        0 18px 55px rgba(16,35,63,.09);

      --radius: 18px;
    }

    body.dark {
      --bg: #071321;
      --surface: #0d1d31;
      --surface-2: #12263d;

      --text: #f5f7fb;
      --muted: #98a7ba;
      --border: rgba(255,255,255,.09);

      --navy: #f5f7fb;
      --navy-2: #dce5ef;

      --shadow:
        0 20px 60px rgba(0,0,0,.30);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;

      font-family:
        Inter,
        "Noto Sans Myanmar",
        "Myanmar Text",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: var(--bg);
      color: var(--text);

      transition:
        background .25s ease,
        color .25s ease;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    /* =====================================================
       TOP NAV
    ===================================================== */

    .topbar {
      position: fixed;

      top: 0;
      left: 0;
      right: 0;

      z-index: 1000;

      height: 68px;

      background:
        color-mix(
          in srgb,
          var(--surface) 92%,
          transparent
        );

      border-bottom:
        1px solid var(--border);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .topbar-inner {
      width:
        min(
          1180px,
          calc(100% - 28px)
        );

      height: 100%;

      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;

      gap: 10px;

      min-width: 0;
    }

    .brand-logo {
      width: 40px;
      height: 40px;

      border-radius: 11px;

      background: var(--surface);

      border:
        1px solid var(--border);

      display: grid;
      place-items: center;

      overflow: hidden;

      flex: 0 0 40px;
    }

    .brand-logo img {
      width: 82%;
      height: 82%;

      object-fit: contain;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 850;

      white-space: nowrap;
    }

    .brand-name span {
      color: var(--gold);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .icon-button {
      width: 39px;
      height: 39px;

      border-radius: 11px;

      border:
        1px solid var(--border);

      background: var(--surface);

      color: var(--text);

      display: grid;
      place-items: center;

      transition:
        transform .18s ease,
        border-color .18s ease;
    }

    .icon-button:hover {
      transform: translateY(-2px);
      border-color: rgba(215,179,90,.6);
    }

    /* =====================================================
       PAGE
    ===================================================== */

    .page {
      width:
        min(
          900px,
          calc(100% - 28px)
        );

      margin:
        0 auto;

      padding:
        92px 0 110px;
    }

    /* =====================================================
       PROFILE HEADER
    ===================================================== */

    .profile-card {
      background:
        linear-gradient(
          145deg,
          var(--surface),
          var(--surface-2)
        );

      border:
        1px solid var(--border);

      border-radius:
        24px;

      box-shadow:
        var(--shadow);

      overflow: hidden;
    }

    .profile-cover {
      height: 135px;

      background:
        radial-gradient(
          circle at 85% 15%,
          rgba(215,179,90,.28),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #071a34,
          #173b62
        );

      position: relative;
    }

    body.dark .profile-cover {
      background:
        radial-gradient(
          circle at 85% 15%,
          rgba(215,179,90,.24),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #102b4d,
          #071321
        );
    }

    .profile-main {
      padding:
        0 22px 24px;
    }

    .profile-head {
      margin-top: -53px;

      display: flex;
      align-items: flex-end;

      gap: 18px;
    }

    .avatar-wrap {
      position: relative;

      width: 106px;
      height: 106px;

      flex: 0 0 106px;
    }

    .avatar {
      width: 106px;
      height: 106px;

      border-radius: 50%;

      object-fit: cover;

      background:
        linear-gradient(
          135deg,
          var(--gold-light),
          var(--navy-2)
        );

      border:
        5px solid var(--surface);

      box-shadow:
        0 12px 28px rgba(0,0,0,.16);
    }

    .avatar-edit {
      position: absolute;

      right: 2px;
      bottom: 2px;

      width: 32px;
      height: 32px;

      border-radius: 50%;

      border:
        3px solid var(--surface);

      background: var(--navy);

      color: var(--surface);

      display: grid;
      place-items: center;

      font-size: 13px;
    }

    .profile-title-area {
      flex: 1;

      min-width: 0;

      padding-bottom: 5px;
    }

    .name-line {
      display: flex;
      align-items: center;

      gap: 7px;

      flex-wrap: wrap;
    }

    .profile-name {
      font-size: 23px;
      font-weight: 900;

      letter-spacing: -.6px;
    }

    .verified {
      width: 20px;
      height: 20px;

      border-radius: 50%;

      background: #2f9e68;

      color: white;

      display: grid;
      place-items: center;

      font-size: 12px;
      font-weight: 900;
    }

    .mcp-pill {
      padding:
        4px 8px;

      border-radius: 999px;

      background:
        rgba(215,179,90,.14);

      border:
        1px solid
        rgba(215,179,90,.35);

      color: var(--gold);

      font-size: 10px;
      font-weight: 850;
    }

    .username {
      color: var(--muted);

      font-size: 13px;

      margin-top: 3px;
    }

    .profile-actions {
      display: flex;
      gap: 8px;

      margin-top: 17px;

      flex-wrap: wrap;
    }

    .primary-button,
    .secondary-button,
    .danger-button {
      min-height: 43px;

      border-radius: 12px;

      padding:
        0 16px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      gap: 7px;

      font-size: 12px;
      font-weight: 850;

      border: 1px solid transparent;

      transition:
        transform .18s ease,
        opacity .18s ease,
        border-color .18s ease;
    }

    .primary-button {
      background:
        linear-gradient(
          135deg,
          var(--navy),
          var(--navy-2)
        );

      color:
        var(--surface);
    }

    body.dark .primary-button {
      background:
        linear-gradient(
          135deg,
          var(--gold-light),
          var(--gold)
        );

      color:
        #071a34;
    }

    .secondary-button {
      background: var(--surface);

      color: var(--text);

      border:
        1px solid var(--border);
    }

    .danger-button {
      background:
        rgba(217,75,91,.10);

      color: var(--danger);

      border:
        1px solid
        rgba(217,75,91,.20);
    }

    .primary-button:hover,
    .secondary-button:hover,
    .danger-button:hover {
      transform: translateY(-2px);
    }

    /* =====================================================
       STATS
    ===================================================== */

    .stats {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      margin-top: 22px;

      border-top:
        1px solid var(--border);

      padding-top: 18px;
    }

    .stat {
      text-align: center;

      padding:
        7px 5px;

      border-right:
        1px solid var(--border);

      cursor: pointer;
    }

    .stat:last-child {
      border-right: 0;
    }

    .stat-number {
      font-size: 19px;
      font-weight: 900;
    }

    .stat-label {
      color: var(--muted);

      font-size: 10px;

      margin-top: 3px;
    }

    /* =====================================================
       BIO
    ===================================================== */

    .bio {
      margin-top: 19px;

      color: var(--muted);

      font-size: 13px;

      line-height: 1.75;
    }

    .location {
      margin-top: 9px;

      display: flex;
      align-items: center;

      gap: 6px;

      color: var(--muted);

      font-size: 11px;
    }

    /* =====================================================
       BADGES
    ===================================================== */

    .section {
      margin-top: 18px;

      background: var(--surface);

      border:
        1px solid var(--border);

      border-radius: var(--radius);

      box-shadow:
        0 10px 35px rgba(16,35,63,.05);

      padding: 18px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 13px;
    }

    .section-title h2 {
      font-size: 14px;
      font-weight: 900;
    }

    .section-title span {
      color: var(--muted);

      font-size: 10px;
    }

    .badge-list {
      display: flex;

      gap: 9px;

      flex-wrap: wrap;
    }

    .badge {
      min-height: 41px;

      padding:
        6px 10px;

      border-radius: 12px;

      display: inline-flex;
      align-items: center;

      gap: 7px;

      background:
        var(--surface-2);

      border:
        1px solid var(--border);

      font-size: 11px;
      font-weight: 800;
    }

    .badge-icon {
      width: 27px;
      height: 27px;

      border-radius: 9px;

      display: grid;
      place-items: center;

      background:
        rgba(215,179,90,.14);

      color: var(--gold);

      font-size: 14px;
    }

    .empty {
      color: var(--muted);

      font-size: 12px;

      padding: 12px 0;
    }

    /* =====================================================
       FUNCTION MENU
    ===================================================== */

    .function-list {
      display: flex;
      flex-direction: column;

      gap: 8px;
    }

    .function-item {
      width: 100%;

      min-height: 57px;

      padding:
        8px 13px;

      border-radius: 14px;

      background: var(--surface);

      border:
        1px solid var(--border);

      color: var(--text);

      display: flex;
      align-items: center;

      gap: 12px;

      text-align: left;

      transition:
        transform .18s ease,
        background .18s ease,
        border-color .18s ease;
    }

    .function-item:hover {
      transform: translateX(3px);

      background: var(--surface-2);

      border-color:
        rgba(215,179,90,.35);
    }

    .function-icon {
      width: 39px;
      height: 39px;

      flex: 0 0 39px;

      border-radius: 11px;

      display: grid;
      place-items: center;

      background:
        var(--surface-2);

      font-size: 17px;
    }

    .function-text {
      flex: 1;
    }

    .function-name {
      font-size: 12px;
      font-weight: 850;
    }

    .function-description {
      margin-top: 2px;

      color: var(--muted);

      font-size: 9px;
    }

    .arrow {
      color: var(--muted);
      font-size: 18px;
    }

    /* =====================================================
       POSTS
    ===================================================== */

    .posts {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 9px;
    }

    .post-card {
      background:
        var(--surface-2);

      border:
        1px solid var(--border);

      border-radius: 14px;

      overflow: hidden;
    }

    .post-image {
      width: 100%;
      aspect-ratio: 1 / .72;

      object-fit: cover;

      background:
        linear-gradient(
          135deg,
          var(--surface-2),
          var(--surface)
        );
    }

    .post-info {
      padding: 10px;
    }

    .post-title {
      font-size: 11px;
      font-weight: 850;

      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;

      overflow: hidden;
    }

    .post-price {
      color: var(--gold);

      font-size: 11px;
      font-weight: 900;

      margin-top: 5px;
    }

    .post-status {
      margin-top: 5px;

      color: var(--muted);

      font-size: 9px;
    }

    /* =====================================================
       BOTTOM NAV
    ===================================================== */

    .bottom-nav {
      position: fixed;

      bottom: 0;
      left: 0;
      right: 0;

      z-index: 1000;

      height: 68px;

      background:
        color-mix(
          in srgb,
          var(--surface) 94%,
          transparent
        );

      border-top:
        1px solid var(--border);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .bottom-inner {
      width:
        min(
          560px,
          calc(100% - 20px)
        );

      height: 100%;

      margin: auto;

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      align-items: center;
    }

    .nav-item {
      height: 100%;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 3px;

      color: var(--muted);

      font-size: 9px;
      font-weight: 800;
    }

    .nav-icon {
      font-size: 19px;
    }

    .nav-item.active {
      color: var(--gold);
    }

    /* =====================================================
       MODAL
    ===================================================== */

    .modal-backdrop {
      position: fixed;

      inset: 0;

      z-index: 2000;

      background:
        rgba(3,10,20,.58);

      display: none;

      align-items: flex-end;
      justify-content: center;

      padding: 12px;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      width:
        min(
          520px,
          100%
        );

      max-height:
        min(
          82vh,
          720px
        );

      overflow: auto;

      background: var(--surface);

      border:
        1px solid var(--border);

      border-radius:
        22px 22px 16px 16px;

      box-shadow:
        0 25px 90px rgba(0,0,0,.30);

      animation:
        modalIn .22s ease;
    }

    @keyframes modalIn {
      from {
        transform: translateY(25px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .modal-header {
      position: sticky;

      top: 0;

      z-index: 2;

      padding:
        15px 17px;

      background: var(--surface);

      border-bottom:
        1px solid var(--border);

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-size: 14px;
      font-weight: 900;
    }

    .close-button {
      width: 34px;
      height: 34px;

      border-radius: 10px;

      background: var(--surface-2);

      color: var(--text);

      border:
        1px solid var(--border);
    }

    .modal-body {
      padding: 14px 17px 18px;
    }

    .user-row {
      display: flex;
      align-items: center;

      gap: 11px;

      padding: 10px 0;

      border-bottom:
        1px solid var(--border);
    }

    .user-row:last-child {
      border-bottom: 0;
    }

    .user-avatar {
      width: 43px;
      height: 43px;

      border-radius: 50%;

      object-fit: cover;

      background: var(--surface-2);
    }

    .user-info {
      flex: 1;

      min-width: 0;
    }

    .user-name {
      font-size: 12px;
      font-weight: 850;
    }

    .user-username {
      color: var(--muted);

      font-size: 10px;

      margin-top: 2px;
    }

    .row-actions {
      display: flex;
      gap: 5px;
    }

    .small-button {
      min-height: 34px;

      padding: 0 9px;

      border-radius: 9px;

      border:
        1px solid var(--border);

      background: var(--surface-2);

      color: var(--text);

      font-size: 10px;
      font-weight: 800;
    }

    /* =====================================================
       EDIT PROFILE
    ===================================================== */

    .form-group {
      margin-bottom: 13px;
    }

    .form-label {
      display: block;

      margin-bottom: 6px;

      color: var(--muted);

      font-size: 10px;
      font-weight: 800;
    }

    .form-input,
    .form-select,
    .form-textarea {
      width: 100%;

      border:
        1px solid var(--border);

      border-radius: 11px;

      background: var(--surface-2);

      color: var(--text);

      outline: none;

      padding:
        11px 12px;

      font-size: 12px;
    }

    .form-textarea {
      min-height: 95px;
      resize: vertical;
    }

    .form-input:focus,
    .form-select:focus,
    .form-textarea:focus {
      border-color:
        rgba(215,179,90,.65);
    }

    .save-button {
      width: 100%;

      min-height: 46px;

      border: 0;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          var(--navy),
          var(--navy-2)
        );

      color: white;

      font-size: 12px;
      font-weight: 900;
    }

    body.dark .save-button {
      color: #071a34;

      background:
        linear-gradient(
          135deg,
          var(--gold-light),
          var(--gold)
        );
    }

    /* =====================================================
       TOAST
    ===================================================== */

    .toast {
      position: fixed;

      left: 50%;
      bottom: 84px;

      transform:
        translate(-50%, 15px);

      z-index: 3000;

      min-width: 220px;

      max-width:
        calc(100% - 40px);

      padding:
        11px 14px;

      border-radius: 12px;

      background:
        var(--navy);

      color:
        var(--surface);

      text-align: center;

      font-size: 11px;
      font-weight: 800;

      opacity: 0;
      pointer-events: none;

      transition:
        opacity .2s ease,
        transform .2s ease;
    }

    .toast.show {
      opacity: 1;

      transform:
        translate(-50%, 0);
    }

    /* =====================================================
       LOADING
    ===================================================== */

    .loading {
      min-height: 300px;

      display: grid;
      place-items: center;

      color: var(--muted);

      font-size: 12px;
    }

    .spinner {
      width: 25px;
      height: 25px;

      border:
        3px solid var(--border);

      border-top-color:
        var(--gold);

      border-radius: 50%;

      animation:
        spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media (max-width: 650px) {

      .brand-name {
        display: none;
      }

      .page {
        width:
          calc(100% - 18px);

        padding-top: 82px;
      }

      .profile-cover {
        height: 115px;
      }

      .profile-head {
        gap: 12px;
      }

      .avatar-wrap,
      .avatar {
        width: 91px;
        height: 91px;
      }

      .profile-name {
        font-size: 20px;
      }

      .profile-actions {
        display: grid;

        grid-template-columns:
          repeat(2, 1fr);

        width: 100%;
      }

      .profile-actions button,
      .profile-actions a {
        width: 100%;
      }

      .stats {
        grid-template-columns:
          repeat(4, 1fr);
      }

      .stat-number {
        font-size: 16px;
      }

      .stat-label {
        font-size: 9px;
      }
    }

    @media (max-width: 420px) {

      .profile-main {
        padding:
          0 14px 19px;
      }

      .profile-head {
        align-items: flex-start;
      }

      .profile-title-area {
        padding-top: 54px;
      }

      .avatar-wrap {
        margin-bottom: 5px;
      }

      .profile-actions {
        grid-template-columns:
          1fr 1fr;
      }

      .posts {
        grid-template-columns:
          1fr 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       TOP BAR
  ====================================================== -->

  <header class="topbar">

    <div class="topbar-inner">

      <a
        href="index.html"
        class="brand"
        aria-label="Myanmar Elite Connect">

        <div class="brand-logo">

          <img
            src="https://lh3.googleusercontent.com/d/1fR8TnvOjrzVbKuro9Ths1_Jt0PAxSmGd"
            alt="Myanmar Elite Connect">

        </div>

        <div class="brand-name">
          Myanmar <span>Elite</span> Connect
        </div>

      </a>

      <div class="top-actions">

        <button
          class="icon-button"
          id="languageButton"
          type="button"
          title="Language">

          EN

        </button>

        <button
          class="icon-button"
          id="themeButton"
          type="button"
          title="Theme">

          ☾

        </button>

      </div>

    </div>

  </header>


  <!-- =====================================================
       MAIN
  ====================================================== -->

  <main class="page">

    <div id="loadingState" class="loading">

      <div>
        <div class="spinner"></div>
      </div>

    </div>


    <div id="profileContent" style="display:none;">


      <!-- =================================================
           PROFILE CARD
      ================================================== -->

      <section class="profile-card">

        <div class="profile-cover"></div>

        <div class="profile-main">

          <div class="profile-head">


            <!-- AVATAR -->

            <div class="avatar-wrap">

              <img
                id="avatar"
                class="avatar"
                src=""
                alt="Profile photo">

  <script>

    /* =====================================================

    const SUPABASE_URL =
      "https://ikjwisfsdcupibgjiuvp.supabase.co";

    /*
      Existing public/anon key for the
      Myanmar-Elite-Connect Supabase project.
    */

    const SUPABASE_PUBLIC_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlrandpc2ZzZGN1cGliZ2ppdXZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMTMzODEsImV4cCI6MjEwMjY4OTM4MX0.25tHs8U6nVhL5XNPJy2M8P6TkPS_Q5jHwZljLVFCyNI";

    const client =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLIC_KEY
      );


    /* =====================================================
       STATE
    ===================================================== */

    let currentUser = null;

    let profileUser = null;

    let isOwnProfile = false;

    let isFollowing = false;

    let isLiked = false;

    let followers = [];

    let following = [];

    let posts = [];

    let badges = [];


    /* =====================================================
       HELPERS
    ===================================================== */

    const $ = id =>
      document.getElementById(id);


    function escapeHtml(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function showToast(message) {

      const toast =
        $("toast");

      toast.textContent =
        message;

      toast.classList.add("show");

      clearTimeout(
        showToast.timer
      );

      showToast.timer =
        setTimeout(() => {

          toast.classList.remove("show");

        }, 2600);

    }


    function avatarFallback(name) {

      const text =
        (name || "M")
          .trim()
          .charAt(0)
          .toUpperCase();

      return (
        "https://ui-avatars.com/api/?name=" +
        encodeURIComponent(text) +
        "&background=102b4d&color=ffffff&size=256"
      );

    }


    function formatPrice(price, currency) {

      if (
        price === null ||
        price === undefined ||
        price === ""
      ) {
        return "";
      }

      const number =
        Number(price);

      if (
        Number.isNaN(number)
      ) {
        return String(price);
      }

      return (
        number.toLocaleString() +
        (currency
          ? " " + currency
          : "")
      );

    }


    function getProfileTarget() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      return {
        id:
          params.get("id"),
        username:
          params.get("username")
      };

    }


    /* =====================================================
       THEME
    ===================================================== */

    function applyTheme() {

      const saved =
        localStorage.getItem(
          "mec_theme"
        ) || "light";

      document.body.classList.toggle(
        "dark",
        saved === "dark"
      );

      $("themeButton").textContent =
        saved === "dark"
          ? "☀"
          : "☾";
    }


    $("themeButton")
      .addEventListener(
        "click",
        () => {

          const dark =
            document.body.classList.contains(
              "dark"
            );

          localStorage.setItem(
            "mec_theme",
            dark
              ? "light"
              : "dark"
          );

          applyTheme();

        }
      );


    /* =====================================================
       LANGUAGE
    ===================================================== */

    $("languageButton")
      .addEventListener(
        "click",
        () => {

          const current =
            localStorage.getItem(
              "mec_language"
            ) || "en";

          const next =
            current === "en"
              ? "mm"
              : "en";

          localStorage.setItem(
            "mec_language",
            next
          );

          showToast(
            next === "mm"
              ? "မြန်မာဘာသာ ရွေးထားပါသည်"
              : "English selected"
          );

        }
      );


    /* =====================================================
       AUTH
    ===================================================== */

    async function loadCurrentUser() {

      const {
        data,
        error
      } =
        await client.auth.getUser();

      if (error) {
        console.error(error);
      }

      currentUser =
        data?.user || null;

      return currentUser;
    }


    /* =====================================================
       LOAD PROFILE
    ===================================================== */

    async function loadProfile() {

      const target =
        getProfileTarget();

      let query =
        client
          .from("profiles")
          .select(`
            id,
            full_name,
            username,
            bio,
            avatar_url,
            city,
            region_code,
            region_name,
            role,
            seller_type,
            is_verified,
            is_mcp,
            created_at
          `);

      if (target.id) {

        query =
          query.eq(
            "id",
            target.id
          );

      } else if (target.username) {

        query =
          query.eq(
            "username",
            target.username
          );

      } else if (currentUser) {

        query =
          query.eq(
            "id",
            currentUser.id
          );

      } else {

        throw new Error(
          "No profile selected."
        );

      }

      const {
        data,
        error
      } =
        await query.maybeSingle();

      if (error) {
        throw error;
      }

      if (!data) {

        throw new Error(
          "Profile not found."
        );

      }

      profileUser =
        data;

      isOwnProfile =
        !!currentUser &&
        currentUser.id === data.id;

    }


    /* =====================================================
       RENDER PROFILE
    ===================================================== */

    function renderProfile() {

      const name =
        profileUser.full_name ||
        profileUser.username ||
        "MEC User";

      $("profileName")
        .textContent =
        name;

      $("profileUsername")
        .textContent =
        profileUser.username
          ? "@" + profileUser.username
          : "@username";

      $("profileBio")
        .textContent =
        profileUser.bio ||
        "No bio yet.";

      const locationParts =
        [
          profileUser.region_name,
          profileUser.city
        ]
        .filter(Boolean);

      $("profileLocation")
        .textContent =
        locationParts.length
          ? "📍 " +
            locationParts.join(" • ")
          : "📍 Location not set";

      $("verifiedBadge")
        .style.display =
        profileUser.is_verified
          ? "grid"
          : "none";

      $("mcpBadge")
        .style.display =
        profileUser.is_mcp
          ? "inline-flex"
          : "none";

      const avatar =
        profileUser.avatar_url ||
        avatarFallback(name);

      $("avatar")
        .src =
        avatar;

      if (isOwnProfile) {

        $("editProfileButton")
          .style.display =
          "inline-flex";

        $("followButton")
          .style.display =
          "none";

        $("avatarButton")
          .style.display =
          "grid";

      } else {

        $("editProfileButton")
          .style.display =
          "none";

        $("followButton")
          .style.display =
          "inline-flex";

        $("avatarButton")
          .style.display =
          "none";

      }

      $("followButton")
        .textContent =
        isFollowing
          ? "✓ Following"
          : "＋ Follow";

      $("likeButton")
        .textContent =
        isLiked
          ? "♥ Liked"
          : "♡ Like";

      $("postsCount")
        .textContent =
        posts.length;

      $("followersCount")
        .textContent =
        followers.length;

      $("followingCount")
        .textContent =
        following.length;

      $("likesCount")
        .textContent =
        "—";

      $("postsTitle")
        .textContent =
        isOwnProfile
          ? "My Posts"
          : "Posts";

      $("kycDescription")
        .textContent =
        profileUser.is_verified
          ? "KYC verified ✓"
          : "Verify your identity";

      $("mcpDescription")
        .textContent =
        profileUser.is_mcp
          ? "MCP verified profile"
          : "Apply to become an MEC MCP";

    }


    /* =====================================================
       FOLLOW STATUS
    ===================================================== */

    async function loadFollowStatus() {

      if (
        !currentUser ||
        !profileUser ||
        currentUser.id === profileUser.id
      ) {
        isFollowing = false;
        return;
      }

      const {
        data,
        error
      } =
        await client
          .from("profile_follows")
          .select("id")
          .eq(
            "follower_id",
            currentUser.id
          )
          .eq(
            "following_id",
            profileUser.id
          )
          .maybeSingle();

      if (error) {
        console.error(
          "Follow status:",
          error
        );

        isFollowing = false;

        return;
      }

      isFollowing =
        !!data;

    }


    /* =====================================================
       FOLLOW
    ===================================================== */

    async function toggleFollow() {

      if (!currentUser) {

        showToast(
          "Please log in first."
        );

        return;

      }

      if (
        !profileUser ||
        currentUser.id === profileUser.id
      ) {
        return;
      }

      const button =
        $("followButton");

      button.disabled =
        true;

      try {

        if (isFollowing) {

          const {
            error
          } =
            await client
              .from("profile_follows")
              .delete()
              .eq(
                "follower_id",
                currentUser.id
              )
              .eq(
                "following_id",
                profileUser.id
              );

          if (error) {
            throw error;
          }

          isFollowing = false;

          showToast(
            "Unfollowed"
          );

        } else {

          const {
            error
          } =
            await client
              .from("profile_follows")
              .insert({
                follower_id:
                  currentUser.id,

                following_id:
                  profileUser.id
              });

          if (error) {

            if (
              error.code === "23505"
            ) {

              isFollowing = true;

            } else {

              throw error;

            }

          } else {

            isFollowing = true;

          }

          showToast(
            "Following"
          );

        }

        await loadSocialLists();

        renderProfile();

      } catch (error) {

        console.error(error);

        showToast(
          error.message ||
          "Unable to update follow."
        );

      } finally {

        button.disabled =
          false;

      }

    }


    /* =====================================================
       PROFILE LIKE
       profile_reactions table
    ===================================================== */

    async function loadLikeStatus() {

      if (
        !currentUser ||
        !profileUser
      ) {
        return;
      }

      const {
        data,
        error
      } =
        await client
          .from("profile_reactions")
          .select("id")
          .eq(
            "user_id",
            currentUser.id
          )
          .eq(
            "profile_id",
            profileUser.id
          )
          .eq(
            "reaction",
            "like"
          )
          .maybeSingle();

      if (error) {

        console.error(
          "Like status:",
          error
        );

        isLiked = false;

        return;
      }

      isLiked =
        !!data;

    }


    async function toggleLike() {

      if (!currentUser) {

        showToast(
          "Please log in first."
        );

        return;

      }

      if (
        currentUser.id === profileUser.id
      ) {

        showToast(
          "You cannot like your own profile."
        );

        return;

      }

      try {

        if (isLiked) {

          const {
            error
          } =
            await client
              .from("profile_reactions")
              .delete()
              .eq(
                "user_id",
                currentUser.id
              )
              .eq(
                "profile_id",
                profileUser.id
              )
              .eq(
                "reaction",
                "like"
              );

          if (error) {
            throw error;
          }

          isLiked = false;

          showToast(
            "Like removed."
          );

        } else {

          const {
            error
          } =
            await client
              .from("profile_reactions")
              .insert({
                user_id:
                  currentUser.id,

                profile_id:
                  profileUser.id,

                reaction:
                  "like"
              });

          if (error) {
            throw error;
          }

          isLiked = true;

          showToast(
            "Profile liked."
          );

        }

        renderProfile();

      } catch (error) {

        console.error(error);

        showToast(
          error.message ||
          "Unable to update like."
        );

      }

    }


    /* =====================================================
       SOCIAL LISTS
       No 404 pages.
       Everything opens inside modal.
    ===================================================== */

    async function loadSocialLists() {

      if (!profileUser) {
        return;
      }


      const followerResult =
        await client
          .from("profile_follows")
          .select(`
            follower_id,
            created_at
          `)
          .eq(
            "following_id",
            profileUser.id
          )
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (followerResult.error) {

        console.error(
          followerResult.error
        );

        followers = [];

      } else {

        const ids =
          followerResult.data
            .map(
              row =>
                row.follower_id
            );

        followers =
          await getUsersByIds(ids);

      }


      const followingResult =
        await client
          .from("profile_follows")
          .select(`
            following_id,
            created_at
          `)
          .eq(
            "follower_id",
            profileUser.id
          )
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (followingResult.error) {

        console.error(
          followingResult.error
        );

        following = [];

      } else {

        const ids =
          followingResult.data
            .map(
              row =>
                row.following_id
            );

        following =
          await getUsersByIds(ids);

      }

    }


    async function getUsersByIds(ids) {

      if (!ids.length) {
        return [];
      }

      const {
        data,
        error
      } =
        await client
          .from("profiles")
          .select(`
            id,
            full_name,
            username,
            avatar_url,
            is_verified,
            is_mcp
          `)
          .in(
            "id",
            ids
          );

      if (error) {

        console.error(error);

        return [];

      }

      const map =
        new Map(
          data.map(
            user =>
              [
                user.id,
                user
              ]
          )
        );

      return ids
        .map(
          id =>
            map.get(id)
        )
        .filter(Boolean);

    }

             }
           </div>`;

      } else {

        body.innerHTML =
          list
            .map(
              user =>

                <div
                  class="user-row">

                  <img
                    class="user-avatar"
                    src="${

                        user.avatar_url ||
                        avatarFallback(
                          user.full_name ||
                          user.username
                        )
                      )
                    }"
                    alt="">

                  <div class="user-info">

                    <div class="user-name">

                      ${
                        escapeHtml(

                          user.username ||

                      }

    /* =====================================================
       POSTS
    ===================================================== */

    async function loadPosts() {

      if (!profileUser) {
        return;
      }

      const {
        data,
        error
      } =
        await client
          .from("listings")
          .select(`
            id,
            title,
            price,
            currency,
            description,
            show_photo_url,
            images,
            status,
            category,
            created_at
          `)
          .eq(
            "user_id",
            profileUser.id
          )
          .order(
            "created_at",
            {
              ascending: false
            }
          )
          .limit(40);

      if (error) {

        console.error(
          "Posts:",
          error
        );

        posts = [];

      } else {

        posts =
          data || [];

      }

      renderPosts();

    }


    function getPostImage(post) {

      if (
        post.show_photo_url
      ) {
        return post.show_photo_url;
      }

      if (
        Array.isArray(post.images) &&
        post.images.length
      ) {
        return post.images[0];
      }

      return "";

    }


    function renderPosts() {

      const grid =
        $("postsGrid");

      if (!posts.length) {

        grid.innerHTML =
          `
          <div
            class="empty"
            style="grid-column:1/-1;">
            ${
              isOwnProfile
                ? "You have not created any posts yet."
                : "This profile has no posts yet."
            }
          </div>
          `;

        return;

      }

      grid.innerHTML =
        posts
          .map(
            post => {

              const image =
                getPostImage(post);

              return `
                <article
                  class="post-card">

                  ${
                    image
                      ? `
                        <img
                          class="post-image"
                          src="${escapeHtml(image)}"
                          alt="${escapeHtml(post.title)}">
                      `
                      : `
                        <div
                          class="post-image">
                        </div>
                      `
                  }

                  <div class="post-info">

                    <div
                      class="post-title">

                      ${
                        escapeHtml(
                          post.title
                        )
                      }

                    </div>

                    <div class="post-price">

                      ${
                        formatPrice(
                          post.price,
                          post.currency
                        )
                      }

                    </div>

                    <div
                      class="post-status">

                      ${
                        escapeHtml(
                          post.status ||
                          "Pending"
                        )
                      }

                    </div>

                  </div>

                </article>
              `;

            }
          )
          .join("");

    }

    async function loadRegions() {

      const {

        error
      } =
        await client
          .from("mec_regions")
          .select(`
            code,
            name_en,
            name_mm,
            region_type
          `)
          .order(

            {
              ascending: true
            }
          );

      if (error) {

        console.error(
          "Regions:",
          error
        );

        return;

      }

      const select =
        $("editRegion");

      select.innerHTML =
        `<option value="">
          Select Region / State
        </option>`;

      (data || [])
        .forEach(
          region => {

            const option =
              document.createElement(
                "option"
              );

            option.value =
              region.code;

            option.textContent =
              region.name_en +
              (
                region.name_mm
                  ? " / " +
                    region.name_mm
                  : ""
              );

            option.dataset.name =
              region.name_en;

            select.appendChild(
              option
            );

          }
        );

    }

    async function saveProfile() {

      if (!currentUser) {

        showToast(
          "Please log in first."
        );

        return;

      }

      const name =
        $("editName")
          .value
          .trim();

      const username =
        $("editUsername")
          .value
          .trim()
          .toLowerCase()
          .replace(
            /^@/,
            ""
          );

      const bio =
        $("editBio")
          .value
          .trim();

      const city =
        $("editCity")
          .value
          .trim();

      const regionCode =
        $("editRegion")
          .value;

      const selectedRegion =
        $("editRegion")
          .selectedOptions[0];

      const regionName =
        selectedRegion?.dataset?.name ||
        null;


      if (
        username &&
        !/^[a-z0-9._-]{3,30}$/.test(
          username
        )
      ) {

        showToast(
          "Username must use 3–30 letters, numbers, dot, underscore or hyphen."
        );

        return;

      }


      const button =
        $("saveProfileButton");

      button.disabled =
        true;

      button.textContent =
        "Saving...";


      try {

        if (username) {

          const {
            data: existing,
            error:
              usernameError
          } =
            await client
              .from("profiles")
              .select("id")
              .eq(
                "username",
                username
              )
              .neq(
                "id",
                currentUser.id
              )
              .maybeSingle();

          if (usernameError) {
            throw usernameError;
          }

          if (existing) {

            showToast(
              "That username is already taken."
            );

            return;

          }

        }


        const {
          error
        } =
          await client
            .from("profiles")
            .update({

              full_name:
                name || null,

              username:
                username || null,

              bio:
                bio || null,

              city:
                city || null,

              region_code:
                regionCode || null,

              region_name:
                regionName

            })
            .eq(
              "id",
              currentUser.id
            );


        if (error) {
          throw error;
        }


        profileUser = {
          ...profileUser,

          full_name:
            name || null,

          username:
            username || null,

          bio:
            bio || null,

          city:
            city || null,

          region_code:
            regionCode || null,

          region_name:
            regionName
        };


        renderProfile();

        closeEditProfile();

        showToast(
          "Profile updated successfully."
        );


      } catch (error) {

        console.error(error);

        showToast(
          error.message ||
          "Unable to save profile."
        );

      } finally {

        button.disabled =
          false;

        button.textContent =
          "Save Changes";

      }

    }


    /* =====================================================
       PROFILE PHOTO
       Storage:
       listing-images/profiles/{user_id}/
    ===================================================== */

    $("avatarButton")
      .addEventListener(
        "click",
        () => {

          if (!isOwnProfile) {
            return;
          }

          $("avatarInput")
            .click();

        }
      );


    $("avatarInput")
      .addEventListener(
        "change",
        async event => {

          const file =
            event.target.files?.[0];

          if (!file) {
            return;
          }

          if (
            !file.type.startsWith(
              "image/"
            )
          ) {

            showToast(
              "Please choose an image file."
            );

            return;

          }


          if (
            file.size >
            5 * 1024 * 1024
          ) {

            showToast(
              "Profile photo must be 5MB or smaller."
            );

            return;

          }


          try {

            showToast(
              "Uploading profile photo..."
            );


            const extension =
              (
                file.name
                  .split(".")
                  .pop() ||
                "jpg"
              )
              .toLowerCase();

            const path =
              "profiles/" +
              currentUser.id +
              "/avatar-" +
              Date.now() +
              "." +
              extension;


            const {
              error:
                uploadError
            } =
              await client.storage
                .from("listing-images")
                .upload(
                  path,
                  file,
                  {
                    cacheControl:
                      "3600",

                    upsert:
                      true
                  }
                );


            if (uploadError) {
              throw uploadError;
            }


            const {
              data:
                publicData
            } =
              client.storage
                .from(
                  "listing-images"
                )
                .getPublicUrl(
                  path
                );


            const avatarUrl =
              publicData.publicUrl;


            const {
              error:
                updateError
            } =
              await client
                .from("profiles")
                .update({
                  avatar_url:
                    avatarUrl
                })
                .eq(
                  "id",
                  currentUser.id
                );


            if (updateError) {
              throw updateError;
            }


            profileUser.avatar_url =
              avatarUrl;

            $("avatar").src =
              avatarUrl;

            showToast(
              "Profile photo updated."
            );


          } catch (error) {

            console.error(error);

            showToast(
              error.message ||
              "Unable to upload profile photo."
            );

          } finally {

            event.target.value =
              "";

          }

        }
      );

        window.location.href =
          "index.html";

        showToast(

      applyTheme();

      try {

        await loadCurrentUser();

        await loadProfile();

        await Promise.all([
          loadFollowStatus(),
          loadLikeStatus(),
          loadSocialLists(),
          loadPosts(),
          loadBadges(),
          loadRegions()
        ]);

        renderProfile();

        $("loadingState")
          .style.display =

        $("profileContent")
          .style.display =

      } catch (error) {

          "PROFILE INIT ERROR:",
          error
        );

        $("loadingState")
          .innerHTML =
          `
          <div
            style="
              text-align:center;
              padding:30px;
            ">

            <div
              style="
                font-size:38px;
                margin-bottom:12px;
              ">
              ⚠️
            </div>

            </strong>

                color:var(--muted);
                font-size:11px;

              ">

              Retry

            </button>

          </div>
          `;

      }

    }

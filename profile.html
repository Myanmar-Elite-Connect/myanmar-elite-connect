<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Profile — Myanmar Elite Connect</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f5f7fa;
      --surface: #ffffff;
      --surface-soft: #f0f3f7;

      --text: #0b1d35;
      --muted: #718096;

      --navy: #071a34;
      --navy-2: #173b62;

      --gold: #c9a13a;
      --gold-soft: #f8efd3;

      --green: #10b981;
      --blue: #3b82f6;
      --red: #ef4444;

      --border: rgba(7, 26, 52, .09);

      --shadow:
        0 12px 35px rgba(7, 26, 52, .07);

      --radius: 17px;
    }

    body.dark {
      --bg: #06111f;
      --surface: #0b1c31;
      --surface-soft: #122740;

      --text: #f4f7fb;
      --muted: #9aa9bc;

      --navy: #f4f7fb;
      --navy-2: #d9e3ef;

      --gold: #e0bd5d;
      --gold-soft: rgba(224, 189, 93, .12);

      --border: rgba(255,255,255,.09);

      --shadow:
        0 15px 40px rgba(0,0,0,.3);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;

      background: var(--bg);
      color: var(--text);

      font-family:
        Inter,
        "Noto Sans Myanmar",
        "Myanmar Text",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       APP
    ========================= */

    .app {
      min-height: 100vh;
      padding-bottom: 82px;
    }

    /* =========================
       TOPBAR
    ========================= */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 1000;

      height: 64px;

      background: var(--surface);

      border-bottom:
        1px solid var(--border);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .topbar-inner {
      width:
        min(1080px, calc(100% - 24px));

      height: 100%;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 37px;
      height: 37px;

      display: grid;
      place-items: center;

      overflow: hidden;

      border-radius: 10px;

      background: var(--surface);

      border:
        1px solid var(--border);
    }

    .brand-logo img {
      width: 82%;
      height: 82%;
      object-fit: contain;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 850;
      white-space: nowrap;
    }

    .brand-name span {
      color: var(--gold);
    }

    .top-actions {
      display: flex;
      gap: 7px;
    }

    .icon-button {
      width: 38px;
      height: 38px;

      display: grid;
      place-items: center;

      border-radius: 11px;

      border:
        1px solid var(--border);

      background: var(--surface);
      color: var(--text);

      transition: .2s ease;
    }

    .icon-button:hover {
      border-color: var(--gold);
      transform: translateY(-1px);
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      width:
        min(880px, calc(100% - 24px));

      margin:
        16px auto 0;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-box {
      position: relative;
      margin-bottom: 14px;
    }

    .search-input {
      width: 100%;
      height: 46px;

      padding:
        0 45px 0 16px;

      border-radius: 13px;

      border:
        1px solid var(--border);

      outline: none;

      background: var(--surface);
      color: var(--text);

      transition: .2s ease;
    }

    .search-input:focus {
      border-color: var(--gold);
      box-shadow:
        0 0 0 3px rgba(201,161,58,.08);
    }

    .search-icon {
      position: absolute;

      right: 15px;
      top: 50%;

      transform:
        translateY(-50%);

      color: var(--muted);

      pointer-events: none;
    }

    .search-results {
      position: absolute;

      top: calc(100% + 6px);
      left: 0;
      right: 0;

      z-index: 100;

      overflow: hidden;

      border-radius: 13px;

      background: var(--surface);

      border:
        1px solid var(--border);

      box-shadow: var(--shadow);
    }

    .search-result {
      width: 100%;

      padding: 10px 13px;

      display: flex;
      align-items: center;
      gap: 10px;

      border: none;
      border-bottom:
        1px solid var(--border);

      background: var(--surface);
      color: var(--text);

      text-align: left;
    }

    .search-result:last-child {
      border-bottom: none;
    }

    .search-result:hover {
      background: var(--surface-soft);
    }

    .result-avatar {
      width: 38px;
      height: 38px;

      border-radius: 50%;

      object-fit: cover;

      background: var(--surface-soft);
    }

    .result-info {
      min-width: 0;
      flex: 1;
    }

    .result-name {
      font-size: 13px;
      font-weight: 750;
    }

    .result-username {
      color: var(--muted);
      font-size: 11px;
    }

    /* =========================
       PROFILE CARD
    ========================= */

    .profile-card {
      overflow: hidden;

      background: var(--surface);

      border:
        1px solid var(--border);

      border-radius: var(--radius);

      box-shadow: var(--shadow);
    }

    .cover {
      height: 145px;

      background:
        radial-gradient(
          circle at 85% 20%,
          rgba(201,161,58,.28),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #071a34,
          #173b62
        );
    }

    body.dark .cover {
      background:
        radial-gradient(
          circle at 85% 20%,
          rgba(224,189,93,.16),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #0d223b,
          #071321
        );
    }

    .profile-body {
      padding:
        0 20px 20px;
    }

    .profile-head {
      position: relative;

      margin-top: -48px;

      display: flex;
      align-items: flex-end;
      justify-content: space-between;

      gap: 12px;
    }

    .avatar-wrap {
      position: relative;
    }

    .avatar {
      width: 100px;
      height: 100px;

      object-fit: cover;

      border-radius: 50%;

      background: var(--surface-soft);

      border:
        4px solid var(--surface);

      box-shadow:
        0 5px 20px rgba(0,0,0,.13);
    }

    .verified {
      position: absolute;

      right: 2px;
      bottom: 6px;

      width: 24px;
      height: 24px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      background: var(--blue);
      color: white;

      border:
        2px solid var(--surface);

      font-size: 11px;
      font-weight: 800;
    }

    .profile-actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      min-height: 38px;

      padding:
        0 14px;

      border-radius: 10px;

      border:
        1px solid var(--border);

      background: var(--surface);
      color: var(--text);

      font-size: 12px;
      font-weight: 750;

      transition: .2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: var(--gold);
    }

    .btn-primary {
      color: white;

      border-color: transparent;

      background:
        linear-gradient(
          135deg,
          var(--navy),
          #173b62
        );
    }

    body.dark .btn-primary {
      color: #071a34;

      background:
        linear-gradient(
          135deg,
          #f1d487,
          var(--gold)
        );
    }

    .profile-name-row {
      margin-top: 12px;

      display: flex;
      align-items: center;
      gap: 7px;

      flex-wrap: wrap;
    }

    .profile-name {
      font-size: 23px;
      font-weight: 850;
    }

    .mcp-badge {
      padding:
        4px 8px;

      border-radius: 20px;

      color: var(--gold);

      background:
        var(--gold-soft);

      border:
        1px solid rgba(201,161,58,.28);

      font-size: 10px;
      font-weight: 850;
    }

    .username {
      margin-top: 2px;

      color: var(--muted);

      font-size: 12px;
    }

    .bio {
      margin-top: 10px;

      font-size: 13px;
      line-height: 1.65;
    }

    .location {
      margin-top: 7px;

      color: var(--muted);

      font-size: 12px;
    }

    .field {
      margin-top: 7px;

      color: var(--muted);

      font-size: 12px;
    }

    /* =========================
       BADGES
    ========================= */

    .badges {
      display: flex;
      flex-wrap: wrap;

      gap: 6px;

      margin-top: 12px;
    }

    .badge {
      padding:
        5px 9px;

      border-radius: 20px;

      background: var(--surface-soft);

      border:
        1px solid var(--border);

      font-size: 10px;
      font-weight: 700;
    }

    /* =========================
       STATS
    ========================= */

    .stats {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      margin-top: 17px;

      border-top:
        1px solid var(--border);

      border-bottom:
        1px solid var(--border);
    }

    .stat {
      min-height: 67px;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      border-right:
        1px solid var(--border);

      cursor: pointer;
    }

    .stat:last-child {
      border-right: none;
    }

    .stat-value {
      font-size: 17px;
      font-weight: 850;
    }

    .stat-label {
      margin-top: 2px;

      color: var(--muted);

      font-size: 10px;
      font-weight: 650;
    }

    /* =========================
       MY PROFILE FUNCTIONS
    ========================= */

    .my-functions {
      margin-top: 18px;
    }

    .section-title {
      margin:
        0 4px 8px;

      color: var(--muted);

      font-size: 10px;
      font-weight: 850;

      letter-spacing: .8px;

      text-transform: uppercase;
    }

    .function-list {
      display: grid;
      gap: 7px;
    }

    .function-row {
      width: 100%;

      min-height: 60px;

      padding:
        9px 13px;

      display: flex;
      align-items: center;

      gap: 12px;

      border-radius: 14px;

      border:
        1px solid var(--border);

      background: var(--surface);

      color: var(--text);

      text-align: left;

      transition: .2s ease;
    }

    .function-row:hover {
      transform: translateY(-1px);

      border-color:
        rgba(201,161,58,.55);

      box-shadow:
        0 5px 18px rgba(7,26,52,.05);
    }

    .function-icon {
      width: 38px;
      height: 38px;

      flex: 0 0 38px;

      display: grid;
      place-items: center;

      border-radius: 11px;

      background: var(--surface-soft);

      font-size: 16px;
    }

    .function-content {
      flex: 1;
      min-width: 0;
    }

    .function-title {
      font-size: 13px;
      font-weight: 800;
    }

    .function-description {
      margin-top: 2px;

      color: var(--muted);

      font-size: 10px;

      line-height: 1.4;
    }

    .function-arrow {
      color: var(--muted);
      font-size: 18px;
    }

    .danger-row .function-title {
      color: var(--red);
    }

    /* =========================
       POSTS
    ========================= */

    .posts-section {
      margin-top: 20px;
    }

    .posts-title {
      font-size: 16px;
      font-weight: 850;
    }

    .posts-grid {
      margin-top: 9px;

      display: grid;

      grid-template-columns:
        repeat(3, minmax(0,1fr));

      gap: 8px;
    }

    .post-card {
      overflow: hidden;

      border-radius: 13px;

      background: var(--surface);

      border:
        1px solid var(--border);

      cursor: pointer;

      transition: .2s ease;
    }

    .post-card:hover {
      transform: translateY(-2px);
    }

    .post-image {
      width: 100%;

      aspect-ratio: 1;

      object-fit: cover;

      background: var(--surface-soft);
    }

    .post-info {
      padding: 8px;
    }

    .post-title {
      font-size: 11px;
      font-weight: 750;

      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;

      overflow: hidden;
    }

    .post-price {
      margin-top: 4px;

      color: var(--gold);

      font-size: 11px;
      font-weight: 850;
    }

    .empty {
      grid-column: 1 / -1;

      padding: 28px;

      text-align: center;

      color: var(--muted);

      background: var(--surface);

      border:
        1px dashed var(--border);

      border-radius: 13px;

      font-size: 12px;
    }

    /* =========================
       MODAL
    ========================= */

    .modal {
      position: fixed;
      inset: 0;

      z-index: 3000;

      display: none;

      align-items: flex-end;
      justify-content: center;

      background:
        rgba(0,0,0,.45);

      backdrop-filter:
        blur(5px);
    }

    .modal.open {
      display: flex;
    }

    .modal-card {
      width:
        min(600px, 100%);

      max-height: 90vh;

      overflow-y: auto;

      padding: 20px;

      border-radius:
        20px 20px 0 0;

      background: var(--surface);

      box-shadow:
        0 -15px 50px rgba(0,0,0,.15);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 17px;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 850;
    }

    .close-button {
      width: 33px;
      height: 33px;

      border: none;

      border-radius: 9px;

      background: var(--surface-soft);
      color: var(--text);

      font-size: 19px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-label {
      display: block;

      margin-bottom: 5px;

      font-size: 11px;
      font-weight: 750;
    }

    .form-control {
      width: 100%;

      min-height: 43px;

      padding:
        8px 12px;

      border-radius: 10px;

      border:
        1px solid var(--border);

      outline: none;

      background: var(--surface);
      color: var(--text);
    }

    .form-control:focus {
      border-color: var(--gold);
    }

    textarea.form-control {
      min-height: 85px;
      resize: vertical;
    }

    .form-help {
      margin-top: 4px;

      color: var(--muted);

      font-size: 10px;
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      gap: 8px;

      margin-top: 17px;
    }

    .modal-actions .btn {
      flex: 1;
    }

    /* =========================
       PEOPLE MODAL
    ========================= */

    .person-list {
      display: grid;
      gap: 7px;
    }

    .person {
      display: flex;
      align-items: center;
      gap: 10px;

      padding: 9px;

      border-radius: 11px;

      background: var(--surface-soft);
    }

    .person-avatar {
      width: 40px;
      height: 40px;

      object-fit: cover;

      border-radius: 50%;
    }

    .person-info {
      flex: 1;
      min-width: 0;
    }

    .person-name {
      font-size: 12px;
      font-weight: 750;
    }

    .person-username {
      color: var(--muted);
      font-size: 10px;
    }

    /* =========================
       BOTTOM NAV
    ========================= */

    .bottom-nav {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      z-index: 2000;

      height: 68px;

      padding-bottom:
        env(safe-area-inset-bottom);

      background: var(--surface);

      border-top:
        1px solid var(--border);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);
    }

    .nav-inner {
      width:
        min(500px, calc(100% - 10px));

      height: 100%;

      margin: auto;

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);
    }

    .nav-item {
      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 3px;

      color: var(--muted);

      font-size: 10px;
      font-weight: 750;
    }

    .nav-icon {
      font-size: 18px;
    }

    .nav-item.active {
      color: var(--gold);
    }

    /* =========================
       TOAST
    ========================= */

    .toast {
      position: fixed;

      left: 50%;
      bottom: 82px;

      z-index: 5000;

      padding:
        10px 15px;

      border-radius: 10px;

      background: var(--navy);
      color: var(--surface);

      font-size: 11px;
      font-weight: 750;

      transform:
        translate(-50%, 12px);

      opacity: 0;

      pointer-events: none;

      transition: .25s ease;
    }

    .toast.show {
      transform:
        translate(-50%, 0);

      opacity: 1;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 650px) {

      .brand-name {
        display: none;
      }

      .profile-body {
        padding-left: 15px;
        padding-right: 15px;
      }

      .profile-head {
        align-items: flex-end;
      }

      .avatar {
        width: 90px;
        height: 90px;
      }

      .profile-actions {
        gap: 5px;
      }

      .btn {
        padding: 0 11px;
      }

      .stats {
        grid-template-columns:
          repeat(4, 1fr);
      }

      .stat-value {
        font-size: 15px;
      }

      .posts-grid {
        grid-template-columns:
          repeat(2, minmax(0,1fr));
      }
    }

    @media (max-width: 420px) {

      .profile-name {
        font-size: 20px;
      }

      .profile-head {
        margin-top: -42px;
      }

      .avatar {
        width: 82px;
        height: 82px;
      }

      .profile-actions .btn {
        min-height: 35px;
        padding: 0 9px;
        font-size: 11px;
      }

      .function-row {
        min-height: 57px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- =========================
       HEADER
  ========================== -->

  <header class="topbar">

    <div class="topbar-inner">

      <a href="./index.html" class="brand">

        <div class="brand-logo">
          <img
            src="https://lh3.googleusercontent.com/d/1fR8TnvOjrzVbKuro9Ths1_Jt0PAxSmGd"
            alt="Myanmar Elite Connect">
        </div>

        <div class="brand-name">
          Myanmar <span>Elite</span> Connect
        </div>

      </a>

      <div class="top-actions">

        <button
          id="themeButton"
          class="icon-button"
          type="button"
          aria-label="Change theme">
          ☾
        </button>

        <button
          id="logoutTopButton"
          class="icon-button"
          type="button"
          aria-label="Logout">
          ⇥
        </button>

      </div>

    </div>

  </header>


  <!-- =========================
       MAIN
  ========================== -->

  <main class="main">

    <!-- SEARCH -->

    <section class="search-box">

      <input
        id="usernameSearch"
        class="search-input"
        type="search"
        placeholder="Search username..."
        autocomplete="off">

      <span class="search-icon">⌕</span>

      <div
        id="searchResults"
        class="search-results hidden">
      </div>

    </section>


    <!-- =========================
         PROFILE
    ========================== -->

    <section class="profile-card">

      <div class="cover"></div>

      <div class="profile-body">

        <div class="profile-head">

          <div class="avatar-wrap">

            <img
              id="profileAvatar"
              class="avatar"
              src=""
              alt="Profile">

            <div
              id="verifiedBadge"
              class="verified hidden">
              ✓
            </div>

          </div>

          <div class="profile-actions">

            <button
              id="followButton"
              class="btn btn-primary hidden"
              type="button">
              Follow
            </button>

            <button
              id="chatButton"
              class="btn hidden"
              type="button">
              Chat
            </button>

            <button
              id="editProfileButton"
              class="btn hidden"
              type="button">
              Edit
            </button>

          </div>

        </div>


        <div class="profile-name-row">

          <h1
            id="profileName"
            class="profile-name">
            Loading...
          </h1>

          <span
            id="mcpBadge"
            class="mcp-badge hidden">
            ★ MCP
          </span>

        </div>


        <div
          id="profileUsername"
          class="username">
          @username
        </div>


        <div
          id="profileBio"
          class="bio">
        </div>


        <div
          id="profileLocation"
          class="location">
        </div>


        <div
          id="profileField"
          class="field">
        </div>


        <div
          id="profileBadges"
          class="badges">
        </div>


        <!-- STATS -->

        <div class="stats">

          <div
            id="likesStat"
            class="stat">

            <span
              id="likesCount"
              class="stat-value">
              0
            </span>

            <span class="stat-label">
              Likes
            </span>

          </div>


          <div
            id="followersStat"
            class="stat">

            <span
              id="followersCount"
              class="stat-value">
              0
            </span>

            <span class="stat-label">
              Followers
            </span>

          </div>


          <div
            id="followingStat"
            class="stat">

            <span
              id="followingCount"
              class="stat-value">
              0
            </span>

            <span class="stat-label">
              Following
            </span>

          </div>


          <div
            id="postsStat"

<script src="./supabase.js"></script>

<script>
"use strict";

/* =========================================================
   GLOBAL STATE
========================================================= */

let currentUser = null;
let currentProfile = null;
let viewedUserId = null;

let regionList = [];
let searchTimer = null;


/* =========================================================
   SHORTCUT
========================================================= */

function $(id) {
  return document.getElementById(id);
}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================================================
   TOAST
========================================================= */

function showToast(message) {

  const toast = $("toast");

  if (!toast) return;

  toast.textContent = message;

  toast.classList.add("show");

  clearTimeout(showToast.timer);

  showToast.timer =
    setTimeout(() => {

      toast.classList.remove("show");

    }, 2600);
}


/* =========================================================
   MODAL
========================================================= */

function openModal(id) {

  const modal = $(id);

  if (modal) {
    modal.classList.add("open");
  }
}


function closeModal(id) {

  const modal = $(id);

  if (modal) {
    modal.classList.remove("open");
  }
}


/* =========================================================
   FALLBACK AVATAR
========================================================= */

function fallbackAvatar(name) {

  const initial =
    String(name || "U")
      .trim()
      .charAt(0)
      .toUpperCase() || "U";

  const svg = `
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="200"
      height="200">

      <rect
        width="200"
        height="200"
        fill="#d7dee8"/>

      <text
        x="50%"
        y="55%"
        text-anchor="middle"
        font-family="Arial"
        font-size="78"
        font-weight="700"
        fill="#071a34">
        ${initial}
      </text>

    </svg>
  `;

  return "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(svg);
}


/* =========================================================
   THEME
========================================================= */

function applyTheme(theme) {

  const dark =
    theme === "dark";

  document.body.classList.toggle(
    "dark",
    dark
  );

  const button =
    $("themeButton");

  if (button) {
    button.textContent =
      dark ? "☀" : "☾";
  }

  localStorage.setItem(
    "mec_theme",
    dark ? "dark" : "light"
  );
}


/* =========================================================
   GET REQUESTED PROFILE
========================================================= */

function getRequestedProfileId() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  return (
    params.get("id") ||
    params.get("user") ||
    params.get("profile")
  );
}


/* =========================================================
   INIT
========================================================= */

async function init() {

  try {

    applyTheme(
      localStorage.getItem(
        "mec_theme"
      ) || "light"
    );


    if (
      typeof supabase === "undefined" ||
      !supabase
    ) {

      showToast(
        "Supabase connection not found."
      );

      return;
    }


    const {
      data: {
        user
      },
      error
    } =
      await supabase.auth.getUser();


    if (error) {
      console.error(error);
    }


    currentUser = user;


    if (!currentUser) {

      window.location.href =
        "./auth.html?mode=login";

      return;
    }


    viewedUserId =
      getRequestedProfileId() ||
      currentUser.id;


    await loadRegions();

    await loadProfile(
      viewedUserId
    );


  } catch (error) {

    console.error(
      "Profile init error:",
      error
    );

    showToast(
      "Unable to load profile."
    );

  }

}


/* =========================================================
   LOAD PROFILE
========================================================= */

async function loadProfile(userId) {

  try {

    const {
      data,
      error
    } =
      await supabase
        .from("profiles")
        .select("*")
        .eq("id", userId)
        .maybeSingle();


    if (error) {

      console.error(
        "Profile query:",
        error
      );

      showToast(
        error.message ||
        "Unable to load profile."
      );

      return;
    }


    if (!data) {

      showToast(
        "Profile not found."
      );

      return;
    }


    currentProfile = data;


    renderProfile(data);


    await Promise.allSettled([

      loadProfileBadges(
        userId
      ),

      loadProfileStats(
        userId
      ),

      loadUserPosts(
        userId
      ),

      loadKycStatus(
        userId
      )

    ]);


    setupProfileMode();


  } catch (error) {

    console.error(
      "loadProfile:",
      error
    );

    showToast(
      "Unable to load profile."
    );

  }

}


/* =========================================================
   RENDER PROFILE
========================================================= */

function renderProfile(profile) {

  const name =
    profile.full_name ||
    profile.username ||
    "MEC User";


  $("profileName").textContent =
    name;


  $("profileUsername").textContent =
    profile.username
      ? "@" + profile.username
      : "@username";


  $("profileBio").textContent =
    profile.bio || "";


  const location =
    [
      profile.city,
      profile.region_name
    ]
      .filter(Boolean)
      .join(" · ");


  $("profileLocation").textContent =
    location
      ? "📍 " + location
      : "";


  $("profileField").textContent =
    profile.field
      ? "💼 " + profile.field
      : "";


  $("profileAvatar").src =
    profile.avatar_url ||
    fallbackAvatar(name);


  $("verifiedBadge")
    .classList
    .toggle(
      "hidden",
      !profile.is_verified
    );


  $("mcpBadge")
    .classList
    .toggle(
      "hidden",
      !profile.is_mcp
    );

}


/* =========================================================
   PROFILE MODE
========================================================= */

function setupProfileMode() {

  const isOwn =
    Boolean(
      currentUser &&
      currentUser.id === viewedUserId
    );


  $("myFunctions")
    .classList
    .toggle(
      "hidden",
      !isOwn
    );


  $("editProfileButton")
    .classList
    .toggle(
      "hidden",
      !isOwn
    );


  $("followButton")
    .classList
    .toggle(
      "hidden",
      isOwn
    );


  $("chatButton")
    .classList
    .toggle(
      "hidden",
      isOwn
    );


  if (!isOwn) {

    loadFollowState();

  }

}


/* =========================================================
   BADGES
========================================================= */

async function loadProfileBadges(userId) {

  const container =
    $("profileBadges");

  container.innerHTML = "";


  const {
    data,
    error
  } =
    await supabase
      .from("mec_profile_badges")
      .select("mec_badges(*)")
      .eq("user_id", userId);


  if (error) {

    console.warn(
      "Badge loading:",
      error.message
    );

    return;
  }


  (data || []).forEach(row => {

    const badge =
      row.mec_badges;


    if (!badge || badge.active === false) {
      return;
    }


    const element =
      document.createElement(
        "span"
      );


    element.className =
      "badge";


    element.textContent =
      `${badge.icon || "🏷️"} ${
        badge.label_en ||
        badge.name ||
        "Badge"
      }`;


    container.appendChild(
      element
    );

  });

}


/* =========================================================
   PROFILE STATS
========================================================= */

async function loadProfileStats(userId) {

  const results =
    await Promise.allSettled([

      supabase
        .from("profile_follows")
        .select("*", {
          count: "exact",
          head: true
        })
        .eq(
          "following_id",
          userId
        ),

      supabase
        .from("profile_follows")
        .select("*", {
          count: "exact",
          head: true
        })
        .eq(
          "follower_id",
          userId
        ),

      supabase
        .from("profile_reactions")
        .select("*", {
          count: "exact",
          head: true
        })
        .eq(
          "profile_id",
          userId
        )
        .eq(
          "reaction",
          "like"
        ),

      supabase
        .from("listings")
        .select("*", {
          count: "exact",
          head: true
        })
        .eq(
          "user_id",
          userId
        )

    ]);


  $("followersCount").textContent =
    results[0].status === "fulfilled"
      ? results[0].value.count || 0
      : 0;


  $("followingCount").textContent =
    results[1].status === "fulfilled"
      ? results[1].value.count || 0
      : 0;


  $("likesCount").textContent =
    results[2].status === "fulfilled"
      ? results[2].value.count || 0
      : 0;


  $("postsCount").textContent =
    results[3].status === "fulfilled"
      ? results[3].value.count || 0
      : 0;

}


/* =========================================================
   POSTS
========================================================= */

async function loadUserPosts(userId) {

  const grid =
    $("postsGrid");


  grid.innerHTML =
    `<div class="empty">Loading posts...</div>`;


  const {
    data,
    error
  } =
    await supabase
      .from("listings")
      .select("*")
      .eq("user_id", userId)
      .order(
        "created_at",
        {
          ascending: false
        }
      )
      .limit(30);


  if (error) {

    console.error(
      "Posts:",
      error
    );

    grid.innerHTML =
      `<div class="empty">
        Unable to load posts.
      </div>`;

    return;
  }


  if (!data || !data.length) {

    grid.innerHTML =
      `<div class="empty">
        No posts yet.
      </div>`;

    return;
  }


  grid.innerHTML = "";


  data.forEach(post => {

    const card =
      document.createElement(
        "article"
      );


    card.className =
      "post-card";


    const image =
      post.show_photo_url ||
      (
        Array.isArray(post.images)
          ? post.images[0]
          : null
      ) ||
      fallbackAvatar(
        post.title
      );


    card.innerHTML = `

      <img
        class="post-image"
        src="${escapeHtml(image)}"
        alt="">

      <div class="post-info">

        <div class="post-title">
          ${escapeHtml(
            post.title || "Untitled"
          )}
        </div>

        ${
          post.price
            ? `
              <div class="post-price">
                ${escapeHtml(post.price)}
              </div>
            `
            : ""
        }

      </div>

    `;


    card.addEventListener(
      "click",
      () => {

        if (!post.id) return;

        window.location.href =
          "./listing.html?id=" +
          encodeURIComponent(
            post.id
          );

      }
    );


    grid.appendChild(
      card
    );

  });

}


/* =========================================================
   REGIONS
========================================================= */

async function loadRegions() {

  const {
    data,
    error
  } =
    await supabase
      .from("mec_regions")
      .select("*")
      .order(
        "name_en"
      );


  if (error) {

    console.warn(
      "Regions:",
      error.message
    );

    regionList = [];

    return;
  }


  regionList =
    data || [];


  const select =
    $("regionInput");


  if (!select) return;


  select.innerHTML =
    `<option value="">
      Select Region / State
    </option>`;


  regionList.forEach(
    region => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        region.code;


      option.textContent =
        region.name_mm ||
        region.name_en;


      select.appendChild(
        option
      );

    }
  );

}


/* =========================================================
   FOLLOW STATE
========================================================= */

async function loadFollowState() {

  if (!currentUser) return;


  const {
    data,
    error
  } =
    await supabase
      .from("profile_follows")
      .select("id")
      .eq(
        "follower_id",
        currentUser.id
      )
      .eq(
        "following_id",
        viewedUserId
      )
      .maybeSingle();


  if (error) {

    console.warn(
      "Follow state:",
      error.message
    );

    return;
  }


  const button =
    $("followButton");


  if (!button) return;


  if (data) {

    button.textContent =
      "Following";

    button.classList.remove(
      "btn-primary"
    );

  } else {

    button.textContent =
      "Follow";

    button.classList.add(
      "btn-primary"
    );

  }

}


/* =========================================================
   TOGGLE FOLLOW
========================================================= */

async function toggleFollow() {

  if (!currentUser) return;


  const {
    data,
    error
  } =
    await supabase
      .from("profile_follows")
      .select("id")
      .eq(
        "follower_id",
        currentUser.id
      )
      .eq(
        "following_id",
        viewedUserId
      )
      .maybeSingle();


  if (error) {

    showToast(
      error.message
    );

    return;
  }


  if (data) {

    const {
      error: deleteError
    } =
      await supabase
        .from("profile_follows")
        .delete()
        .eq(
          "id",
          data.id
        );


    if (deleteError) {

      showToast(
        deleteError.message
      );

      return;
    }


    showToast(
      "Unfollowed"
    );


  } else {

    const {
      error: insertError
    } =
      await supabase
        .from("profile_follows")
        .insert({
          follower_id:
            currentUser.id,

          following_id:
            viewedUserId
        });


    if (insertError) {

      showToast(
        insertError.message
      );

      return;
    }


    showToast(
      "Following"
    );

  }


  await loadFollowState();

  await loadProfileStats(
    viewedUserId
  );

}


/* =========================================================
   EDIT INFO
========================================================= */

function openEditProfile() {

  if (!currentProfile) return;


  $("fullNameInput").value =
    currentProfile.full_name || "";


  $("usernameInput").value =
    currentProfile.username || "";


  $("bioInput").value =
    currentProfile.bio || "";


  $("regionInput").value =
    currentProfile.region_code || "";


  $("fieldInput").value =
    currentProfile.field || "";


  $("editAvatarPreview").src =
    currentProfile.avatar_url ||
    fallbackAvatar(
      currentProfile.full_name ||
      currentProfile.username
    );


  openModal(
    "editModal"
  );

}


/* =========================================================
   AVATAR PREVIEW
========================================================= */

$("avatarInput")
  .addEventListener(
    "change",
    event => {

      const file =
        event.target.files?.[0];


      if (!file) return;


      const reader =
        new FileReader();


      reader.onload =
        e => {

          $("editAvatarPreview")
            .src =
            e.target.result;

        };


      reader.readAsDataURL(
        file
      );

    }
  );


/* =========================================================
   SAVE PROFILE
========================================================= */

async function saveProfile() {

  if (!currentUser) return;


  const fullName =
    $("fullNameInput")
      .value
      .trim();


  const username =
    $("usernameInput")
      .value
      .trim()
      .toLowerCase()
      .replace(
        /[^a-z0-9_.]/g,
        ""
      );


  const bio =
    $("bioInput")
      .value
      .trim();


  const regionCode =
    $("regionInput")
      .value ||
    null;


  const field =
    $("fieldInput")
      .value ||
    null;


  const region =
    regionList.find(
      r =>
        r.code ===
        regionCode
    );


  const regionName =
    region
      ? (
          region.name_en ||
          region.name_mm
        )
      : null;


  const updateData = {

    full_name:
      fullName || null,

    username:
      username || null,

    bio:
      bio || null,

    region_code:
      regionCode,

    region_name:
      regionName,

    field:
      field

  };


  const {
    error
  } =
    await supabase
      .from("profiles")
      .update(updateData)
      .eq(
        "id",
        currentUser.id
      );


  if (error) {

    console.error(
      "Profile update:",
      error
    );

    showToast(
      error.message
    );

    return;
  }


  showToast(
    "Profile updated successfully."
  );


  closeModal(
    "editModal"
  );


  await loadProfile(
    currentUser.id
  );

}


/* =========================================================
   KYC STATUS
========================================================= */

async function loadKycStatus(userId) {

  const {
    data,
    error
  } =
    await supabase
      .from("kyc_verifications")
      .select("status")
      .eq(
        "user_id",
        userId
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      )
      .limit(1)
      .maybeSingle();


  if (error) {

    console.warn(
      "KYC status:",
      error.message
    );

    return;
  }


  if (!data) {

    $("kycDescription")
      .textContent =
      "Verify your identity";

    return;
  }


  const status =
    String(
      data.status || ""
    ).toLowerCase();


  if (status === "approved") {

    $("kycDescription")
      .textContent =
      "✓ KYC Verified";

  } else if (
    status === "pending"
  ) {

    $("kycDescription")
      .textContent =
      "KYC application pending";

  } else if (
    status === "rejected"
  ) {

    $("kycDescription")
      .textContent =
      "KYC rejected — submit again";

  }

}


/* =========================================================
   PEOPLE LIST
========================================================= */

async function showPeople(type) {

  if (!currentUser) return;


  const isFollowers =
    type === "followers";


  $("peopleModalTitle")
    .textContent =
    isFollowers
      ? "Followers"
      : "Following";


  $("peopleList").innerHTML =
    `<div class="empty">
      Loading...
    </div>`;


  openModal(
    "peopleModal"
  );


  const column =
    isFollowers
      ? "following_id"
      : "follower_id";


  const {
    data,
    error
  } =
    await supabase
      .from("profile_follows")
      .select("*")
      .eq(
        column,
        viewedUserId
      )
      .limit(100);


  if (error) {

    $("peopleList").innerHTML =
      `<div class="empty">
        ${escapeHtml(
          error.message
        )}
      </div>`;

    return;
  }


  if (!data?.length) {

    $("peopleList").innerHTML =
      `<div class="empty">
        No people found.
      </div>`;

    return;
  }


  const ids =
    data.map(
      row =>
        isFollowers
          ? row.follower_id
          : row.following_id
    );


  const {
    data: profiles
  } =
    await supabase
      .from("profiles")
      .select(
        "id,full_name,username,avatar_url"
      )
      .in(
        "id",
        ids
      );


  $("peopleList").innerHTML =
    "";


  (profiles || []).forEach(
    profile => {

      const person =
        document.createElement(
          "div"
        );


      person.className =
        "person";


      person.innerHTML = `

        <img
          class="person-avatar"
          src="${escapeHtml(
            profile.avatar_url ||
            fallbackAvatar(
              profile.full_name ||
              profile.username
            )
          )}"
          alt="">

        <div class="person-info">

          <div class="person-name">
            ${escapeHtml(
              profile.full_name ||
              profile.username ||
              "MEC User"
            )}
          </div>

          <div class="person-username">
            ${
              profile.username
                ? "@" +
                  escapeHtml(
                    profile.username
                  )
                : ""
            }
          </div>

        </div>

      `;


      person.addEventListener(
        "click",
        () => {

          window.location.href =
            "./Profile.html?id=" +
            encodeURIComponent(
              profile.id
            );

        }
      );


      $("peopleList")
        .appendChild(
          person
        );

    }
  );

}


/* =========================================================
   USERNAME SEARCH
========================================================= */

$("usernameSearch")
  .addEventListener(
    "input",
    () => {

      clearTimeout(
        searchTimer
      );


      const query =
        $("usernameSearch")
          .value
          .trim()
          .replace(
            /^@/,
            ""
          );


      if (query.length < 2) {

        $("searchResults")
          .classList
          .add("hidden");

        return;
      }


      searchTimer =
        setTimeout(
          () => searchUsers(query),
          350
        );

    }
  );


async function searchUsers(query) {

  const container =
    $("searchResults");


  const {
    data,
    error
  } =
    await supabase
      .from("profiles")
      .select(
        "id,full_name,username,avatar_url"
      )
      .ilike(
        "username",
        "%" + query + "%"
      )
      .limit(8);


  if (error) {

    console.warn(
      "Search:",
      error.message
    );

    container.classList.add(
      "hidden"
    );

    return;
  }


  if (!data?.length) {

    container.innerHTML =
      `<div class="empty">
        No users found.
      </div>`;

    container.classList.remove(
      "hidden"
    );

    return;
  }


  container.innerHTML =
    "";


  data.forEach(
    profile => {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "search-result";


      button.innerHTML = `

        <img
          class="result-avatar"
          src="${escapeHtml(
            profile.avatar_url ||
            fallbackAvatar(
              profile.full_name ||
              profile.username
            )
          )}"
          alt="">

        <div class="result-info">

          <div class="result-name">
            ${escapeHtml(
              profile.full_name ||
              profile.username ||
              "MEC User"
            )}
          </div>

          <div class="result-username">
            ${
              profile.username
                ? "@" +
                  escapeHtml(
                    profile.username
                  )
                : ""
            }
          </div>

        </div>

      `;


      button.addEventListener(
        "click",
        () => {

          window.location.href =
            "./Profile.html?id=" +
            encodeURIComponent(
              profile.id
            );

        }
      );


      container.appendChild(
        button
      );

    }
  );


  container.classList.remove(
    "hidden"
  );

}

async function logout() {

      await supabase.auth.signOut();


    if (error) {

      return;
    }


    window.location.href =

  } catch (error) {

    console.error(error);

    showToast(
      "Unable to log out."
    );

  }

}

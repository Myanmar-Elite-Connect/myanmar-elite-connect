<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Myanmar Elite Connect</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --bg: #f7f9fc;
      --surface: #fff;
      --soft: #f1f4f8;
      --text: #10233f;
      --muted: #728096;
      --gold: #d7b35a;
      --navy: #071a34;
      --navy2: #173b62;
      --border: rgba(16,35,63,.09);
      --error: #c94a4a;
      --success: #26845b;
      --shadow: 0 25px 70px rgba(16,35,63,.11);
    }
    body.dark {
      --bg: #071321;
      --surface: #0d1d31;
      --soft: #12263d;
      --text: #f4f7fb;
      --muted: #94a3b7;
      --gold: #d7b35a;
      --navy: #f4f7fb;
      --navy2: #dce5ef;
      --border: rgba(255,255,255,.09);
      --shadow: 0 25px 70px rgba(0,0,0,.32);
    }
    body {
      min-height: 100vh;
      font-family:
        Inter,
        "Noto Sans Myanmar",
        "Myanmar Text",
        system-ui,
        sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    button,
    input {
      font: inherit;
    }
    button {
      cursor: pointer;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(440px, 100%);
      padding: 34px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 25px;
      box-shadow: var(--shadow);
    }
    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      background: var(--soft);
      border: 1px solid var(--border);
    }
    .logo img {
      width: 70%;
      height: 70%;
      object-fit: contain;
    }
    h1 {
      text-align: center;
      font-size: 25px;
      margin-bottom: 8px;
    }
    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
      margin-bottom: 25px;
    }
    .field {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .input-wrap {
      position: relative;
    }
    input {
      width: 100%;
      height: 49px;
      padding: 0 62px 0 14px;
      border: 1px solid transparent;
      outline: none;
      border-radius: 12px;
      color: var(--text);
      background: var(--soft);
    }
    input:focus {
      border-color: rgba(215,179,90,.65);
      background: var(--surface);
    }
    .show {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }
    .submit {
      width: 100%;
      height: 50px;
      border: 0;
      border-radius: 13px;
      color: #fff;
      background: linear-gradient(135deg,#071a34,#173b62);
      font-size: 13px;
      font-weight: 850;
    }
    body.dark .submit {
      color: #071a34;
      background: linear-gradient(135deg,#f1d487,#d7b35a);
    }
    .submit:disabled {
      opacity: .65;
      cursor: not-allowed;
    }
    .message {
      min-height: 18px;
      margin-top: 14px;
      text-align: center;
      font-size: 11px;
      line-height: 1.6;
    }
    .error {
      color: var(--error);
    }
    .success {
      color: var(--success);
    }
    .back {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: var(--gold);
      font-size: 11px;
      font-weight: 850;
    }
  </style>
<script src="./mec-theme.js"></script>
</head>
<body>
<div class="page">
  <main class="card">
    <div class="logo">
      <img
        src="https://lh3.googleusercontent.com/d/1fR8TnvOjrzVbKuro9Ths1_Jt0PAxSmGd"
        alt="Myanmar Elite Connect">
    </div>
    <h1 id="title">
      Reset your password
    </h1>
    <p class="subtitle" id="subtitle">
      Enter a new password for your account.
    </p>
    <form id="resetForm">
      <div class="field">
        <label id="passwordLabel">
          New password
        </label>
        <div class="input-wrap">
          <input
            id="password"
            type="password"
            minlength="6"
            autocomplete="new-password"
            required>
          <button
            type="button"
            class="show"
            id="showPassword">
            Show
          </button>
        </div>
      </div>
      <div class="field">
        <label id="confirmLabel">
          Confirm password
        </label>
        <div class="input-wrap">
          <input
            id="confirmPassword"
            type="password"
            minlength="6"
            autocomplete="new-password"
            required>
          <button
            type="button"
            class="show"
            id="showConfirm">
            Show
          </button>
        </div>
      </div>
      <button
        type="submit"
        class="submit"
        id="submit">
        Update Password
      </button>
      <div
        class="message"
        id="message">
      </div>
    </form>
    <a
      href="./auth.html?mode=login"
      class="back"
      id="back">
      Back to Log In
    </a>
  </main>
</div>
<script>
const lang =
  localStorage.getItem(
    "mec_language"
  ) || "en";
const translations = {
  en: {
    title: "Reset your password",
    subtitle:
      "Enter a new password for your account.",
    password: "New password",
    confirm: "Confirm password",
    submit: "Update Password",
    updating: "Updating...",
    show: "Show",
    hide: "Hide",
    mismatch:
      "Passwords do not match.",
    success:
      "Password updated successfully. Redirecting...",
    back:
      "Back to Log In",
    error:
      "Unable to update your password."
  },
  mm: {
    title:
      "စကားဝှက်အသစ်ပြောင်းပါ",
    subtitle:
      "သင့်အကောင့်အတွက် စကားဝှက်အသစ်ထည့်ပါ။",
    password:
      "စကားဝှက်အသစ်",
    confirm:
      "စကားဝှက်အတည်ပြုပါ",
    submit:
      "စကားဝှက်ပြောင်းရန်",
    updating:
      "ပြောင်းလဲနေပါသည်...",
    show: "ပြရန်",
    hide: "ဖျောက်ရန်",
    mismatch:
      "စကားဝှက်နှစ်ခု မတူပါ။",
    success:
      "စကားဝှက်ပြောင်းပြီးပါပြီ။ ဆက်လက်သွားနေပါသည်...",
    back:
      "အကောင့်ဝင်ရန် ပြန်သွားမည်",
    error:
      "စကားဝှက်ပြောင်း၍ မရပါ။"
  }
};
const t =
  translations[lang];
document.getElementById("title")
  .textContent = t.title;
document.getElementById("subtitle")
  .textContent = t.subtitle;
document.getElementById("passwordLabel")
  .textContent = t.password;
document.getElementById("confirmLabel")
  .textContent = t.confirm;
document.getElementById("submit")
  .textContent = t.submit;
document.getElementById("back")
  .textContent = t.back;
function togglePassword(id, button) {
  const input =
    document.getElementById(id);
  input.type =
    input.type === "password"
      ? "text"
      : "password";
  button.textContent =
    input.type === "text"
      ? t.hide
      : t.show;
}
document.getElementById(
  "showPassword"
).addEventListener(
  "click",
  function() {
    togglePassword(
      "password",
      this
    );
  }
);
document.getElementById(
  "showConfirm"
).addEventListener(
  "click",
  function() {
    togglePassword(
      "confirmPassword",
      this
    );
  }
);
function showMessage(
  message,
  type
) {
  const element =
    document.getElementById(
      "message"
    );
  element.textContent =
    message;
  element.className =
    "message " + type;
}
document.getElementById(
  "resetForm"
).addEventListener(
  "submit",
  async event => {
    event.preventDefault();
    const password =
      document.getElementById(
        "password"
      ).value;
    const confirm =
      document.getElementById(
        "confirmPassword"
      ).value;
    const button =
      document.getElementById(
        "submit"
      );
    if (password !== confirm) {
      showMessage(
        t.mismatch,
        "error"
      );
      return;
    }
    button.disabled = true;
    button.textContent =
      t.updating;
    try {
      const {
        error
      } =
        await supabaseClient.auth
          .updateUser({
            password
          });
      if (error) {
        throw error;
      }
      showMessage(
        t.success,
        "success"
      );
      setTimeout(
        () => {
          window.location.replace(
            "./auth.html?mode=login"
          );
        },
        1200
      );
    } catch (error) {
      console.error(
        "Password update failed:",
        error
      );
      showMessage(
        error?.message || t.error,
        "error"
      );
      button.disabled = false;
      button.textContent =
        t.submit;
    }
  }
);
/*
  Supabase recovery links create
  a recovery session automatically.
  We wait for PASSWORD_RECOVERY
  before allowing password update.
*/
let recoveryReady = false;
supabaseClient.auth.onAuthStateChange(
  (event, session) => {
    if (
      event === "PASSWORD_RECOVERY" &&
      session
    ) {
      recoveryReady = true;
    }
  }
);
async function prepareRecovery() {
  try {
    const {
      data
    } =
      await supabaseClient.auth
        .getSession();
    if (data?.session) {
      recoveryReady = true;
    }
  } catch (error) {
    console.error(
      "Recovery session check failed:",
      error
    );
  }
}
prepareRecovery();
</script>
</body>
</html>

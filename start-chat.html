<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Starting Chat • Myanmar Elite Connect</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase.js"></script><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;color:#10233f;font-family:Inter,"Noto Sans Myanmar",system-ui,sans-serif}.box{width:min(380px,calc(100% - 32px));padding:25px;border-radius:18px;background:#fff;text-align:center;box-shadow:0 18px 50px rgba(16,35,63,.1)}.spin{width:32px;height:32px;margin:auto;border:3px solid #e8edf3;border-top-color:#d8b45c;border-radius:50%;animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}body.dark{background:#071321;color:#f4f7fb}.dark .box{background:#0e1e32}.muted{margin-top:10px;color:#758198;font-size:11px}</style></head><body><div class="box"><div class="spin"></div><h3>Opening chat…</h3><div id="msg" class="muted">Preparing a conversation with the post owner.</div></div><script>
const db=supabaseClient;const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function theme(t){document.body.classList.toggle('dark',t==='dark')}theme(localStorage.getItem('mec_theme')||'light');
async function init(){try{const target=new URLSearchParams(location.search).get('user');if(!target)throw new Error('Missing chat user.');const {data:auth,error:ae}=await db.auth.getUser();if(ae||!auth?.user){location.href='./auth.html?next='+encodeURIComponent(location.href);return}const me=auth.user;if(me.id===target){location.href='./profile.html';return}let {data:rooms,error}=await db.from('chat_rooms').select('id,user_one,user_two,updated_at').or(`and(user_one.eq.${me.id},user_two.eq.${target}),and(user_one.eq.${target},user_two.eq.${me.id})`).limit(1);if(error)throw error;let room=rooms?.[0];if(!room){const r=await db.from('chat_rooms').insert({user_one:me.id,user_two:target,updated_at:new Date().toISOString()}).select().single();if(r.error)throw r.error;room=r.data}location.href='./chat.html?room='+encodeURIComponent(room.id)+'&user='+encodeURIComponent(target)}catch(e){document.getElementById('msg').textContent=e.message||'Unable to start chat.'}}
init();</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Myanmar Elite Connect • Database Test</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL =
      "https://ikjwisfsdcupibgjiuvp.supabase.co";
    const SUPABASE_KEY =
      "sb_publishable_xoh1rjwBlJhR9nB3kQD-KA_QcVY6w2s";
    window.supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );
  </script>
<script src="./mec-theme.js"></script>
</head>
<body>
  <h2>Myanmar Elite Connect</h2>
  <p id="status">Testing listings database...</p>
  <script>
    async function testDatabase() {
      const status =
        document.getElementById("status");
      try {
        const {
          data,
          error
        } =
          await window.supabaseClient
            .from("listings")
            .select("*")
            .limit(1);
        if (error) {
          throw error;
        }
        status.textContent =
          "SUCCESS — Listings database is working.";
        console.log(
          "Listings:",
          data
        );
      } catch (error) {
        status.textContent =
          "ERROR — " + error.message;
        console.error(
          "Listings database error:",
          error
        );
      }
    }
    testDatabase();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Myanmar Elite Connect</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://ikjwisfsdcupibgjiuvp.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_xoh1rjwBlJhR9nB3kQD-KA_QcVY6w2s";

    window.supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );
  </script>
</head>

<body>

  <h2>Myanmar Elite Connect</h2>

  <p id="status">Testing...</p>

  <script>
    async function testSystem() {

      const status =
        document.getElementById("status");

      try {

        if (!window.supabase) {
          throw new Error(
            "Supabase library not loaded."
          );
        }

        if (!window.supabaseClient) {
          throw new Error(
            "Supabase client not created."
          );
        }

        const {
          data,
          error
        } =
          await window.supabaseClient.auth.getSession();

        if (error) {
          throw error;
        }

        status.textContent =
          "SUCCESS — Supabase is connected.";

      } catch (error) {

        status.textContent =
          "ERROR — " + error.message;

        console.error(error);
      }
    }

    testSystem();
  </script>

</body>
</html>

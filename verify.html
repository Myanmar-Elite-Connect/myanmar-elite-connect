<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Myanmar Elite Connect — Verify Email</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase.js"></script><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,"Noto Sans Myanmar",system-ui,sans-serif;background:#f7f9fc;color:#10233f;display:grid;place-items:center}.wrap{width:min(500px,calc(100% - 28px));padding:34px;background:#fff;border:1px solid rgba(16,35,63,.09);border-radius:25px;box-shadow:0 25px 70px rgba(16,35,63,.11);text-align:center}.logo{width:82px;height:82px;margin:0 auto 22px;display:grid;place-items:center;border-radius:22px;background:#f1f4f8}.logo img{width:68%;height:68%;object-fit:contain}.title{font-size:28px;letter-spacing:-1px;margin:0 0 8px}.sub{color:#728096;font-size:13px;line-height:1.7;margin:0 auto 24px}.email{font-weight:800;color:#173b62;word-break:break-all}.otp{display:flex;justify-content:center;gap:9px;margin:24px 0}.otp input{width:52px;height:60px;border:1px solid transparent;border-radius:13px;background:#f1f4f8;text-align:center;font-size:22px;font-weight:850;color:#10233f;outline:none}.otp input:focus{border-color:rgba(215,179,90,.8);background:#fff}.otp input.bad{animation:shake .35s}.verify{width:100%;height:50px;border:0;border-radius:13px;background:linear-gradient(135deg,#071a34,#173b62);color:#fff;font-size:13px;font-weight:850;cursor:pointer}.verify:disabled{opacity:.6}.message{min-height:20px;margin-top:13px;font-size:11px;font-weight:700}.error{color:#c94a4a}.success{color:#26845b}.resend{margin-top:18px;border:0;background:none;color:#d7b35a;font-size:11px;font-weight:850;cursor:pointer}.resend:disabled{color:#9aa5b5;cursor:not-allowed}.back{display:inline-block;margin-top:15px;color:#728096;font-size:11px;text-decoration:none}.success-screen{display:none}.success-screen.show{display:block}.success-icon{width:92px;height:92px;margin:10px auto 22px;border-radius:50%;background:#26845b;display:grid;place-items:center;color:white;font-size:48px;font-weight:400;animation:pop .55s ease}.verify-screen.hide{display:none}.orbit{position:relative;width:170px;height:170px;margin:0 auto 15px}.orbit .piece{position:absolute;width:30px;height:30px;border-radius:8px;background:#d7b35a;left:70px;top:70px;animation:orbit 1.2s ease-in-out forwards}.orbit .p1{animation-delay:0s}.orbit .p2{animation-delay:.05s}.orbit .p3{animation-delay:.1s}.orbit .p4{animation-delay:.15s}.orbit .p5{animation-delay:.2s}.orbit .p6{animation-delay:.25s}@keyframes orbit{0%{transform:translate(0,0) rotate(0) scale(1)}45%{transform:translate(calc(var(--x)*1px),calc(var(--y)*1px)) rotate(180deg) scale(.8)}100%{transform:translate(0,0) rotate(360deg) scale(.15);opacity:0}}@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1)}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@media(max-width:430px){.wrap{padding:25px 17px}.otp{gap:5px}.otp input{width:45px;height:55px}}
</style></head><body><main class="wrap"><div id="verifyScreen" class="verify-screen"><div class="logo"><img src="https://lh3.googleusercontent.com/d/1fR8TnvOjrzVbKuro9Ths1_Jt0PAxSmGd" alt="Myanmar Elite Connect"></div><h1 class="title">Verify your email</h1><p class="sub">We sent a 6-digit verification code to<br><span id="email" class="email"></span></p><div class="otp" id="otp"><input maxlength="1" inputmode="numeric" autocomplete="one-time-code"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"></div><button class="verify" id="verifyBtn">Verify Email</button><div class="message" id="message"></div><button class="resend" id="resendBtn">Resend code</button><br><a class="back" href="./auth.html">← Back to Sign Up</a></div><div id="successScreen" class="success-screen"><div class="orbit"><i class="piece p1" style="--x:-65;--y:-45"></i><i class="piece p2" style="--x:5;--y:-75"></i><i class="piece p3" style="--x:70;--y:-30"></i><i class="piece p4" style="--x:65;--y:50"></i><i class="piece p5" style="--x:-5;--y:75"></i><i class="piece p6" style="--x:-70;--y:35"></i></div><div class="success-icon">✓</div><h1 class="title">Verified!</h1><p class="sub">Your email has been verified successfully.</p></div></main><script>
const client=window.supabaseClient||window.supabase;const email=sessionStorage.getItem('mec_verify_email')||'';const emailEl=document.getElementById('email'),inputs=[...document.querySelectorAll('#otp input')],msg=document.getElementById('message'),verifyBtn=document.getElementById('verifyBtn'),resendBtn=document.getElementById('resendBtn');emailEl.textContent=email;function message(t,c=''){msg.textContent=t;msg.className='message '+c}
inputs.forEach((input,i)=>{input.addEventListener('input',e=>{input.value=input.value.replace(/\D/g,'').slice(-1);if(input.value&&i<inputs.length-1)inputs[i+1].focus()});input.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!input.value&&i>0)inputs[i-1].focus()});input.addEventListener('paste',e=>{e.preventDefault();const code=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);code.split('').forEach((v,j)=>{if(inputs[j])inputs[j].value=v});if(code.length)inputs[Math.min(code.length,6)-1].focus()})});
async function verify(){const token=inputs.map(x=>x.value).join('');if(token.length!==6){message('Please enter all 6 digits.','error');return}verifyBtn.disabled=true;message('');try{if(!client?.auth)throw new Error('Supabase client is not available.');const {error}=await client.auth.verifyOtp({email,token,type:'email'});if(error)throw error;document.getElementById('verifyScreen').classList.add('hide');document.getElementById('successScreen').classList.add('show');sessionStorage.removeItem('mec_verify_email');setTimeout(()=>location.href='./index.html',2400)}catch(e){inputs.forEach(x=>{x.classList.remove('bad');void x.offsetWidth;x.classList.add('bad')});message(e.message||'Invalid or expired code.','error');verifyBtn.disabled=false}}
verifyBtn.onclick=verify;document.addEventListener('keydown',e=>{if(e.key==='Enter')verify()});let timer=0;resendBtn.onclick=async()=>{if(timer||!email)return;try{const {error}=await client.auth.resend({type:'signup',email});if(error)throw error;message('A new verification code has been sent.','success');timer=60;resendBtn.disabled=true;const iv=setInterval(()=>{timer--;resendBtn.textContent=timer?'Resend code ('+timer+'s)':'Resend code';if(!timer){clearInterval(iv);resendBtn.disabled=false}},1000)}catch(e){message(e.message||'Unable to resend code.','error')}};if(email)inputs[0].focus();else message('No verification email was found. Please return to Sign Up.','error');
</script></body></html>
